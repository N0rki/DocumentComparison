. \u2020 indicates interns at IXCLab, Shang-\nhai AI Laboratory\nsignificance, temporal awareness has not been adequately\nevaluated in existing benchmarks.\nTo fill this gap, we\npresent OVO-Bench (Online-VideO-Benchmark), a novel\nvideo benchmark that emphasizes the importance of times-\ntamps for advanced online video understanding capability\nbenchmarking. OVO-Bench evaluates the ability of video\nLLMs to reason and respond to events occurring at spe-\ncific timestamps under three distinct scenarios: (1) Back-\nward tracing: trace back to past events to answer the ques-\ntion.\n(2) Real-time understanding: understand and re-\nspond to events as they unfold at the current timestamp.\n1\narXiv:"}, {"group": "Theoretical Physics", "id": 155, "label": "PARAMETER ESTIMATION FOR FRACTIONAL AUTOREGRESSIVE PROCESS WITH PERIODIC STRUCTURE", "shape": "dot", "size": 10, "title": "Authors: Shang Yiwu\u003cbr\u003eYear: 2014\u003cbr\u003eAbstract: This paper introduces a new kind of periodic fractional autoregressive process (PFAR) driven by\nfractional Gaussian noise (fGn). The new model is a specialized varying coefficient fractional autore-\ngressive model, where the coefficients adhere to a periodic structure. In this working, Generalized\nleast squares estimation and GPH method are employed to construct an initial estimator to estimate\nthe joint estimation of the parameters of these models. Then one-step procedure is used to obtain\na more asymptotically-efficient estimator. The paper proves that both estimators are consistent and\nasymptotically normal, and their performance is demonstrated through a simulation study using finite-\nsize samples via Monte Carlo simulations. Simulation studies suggests that, while both estimation\nmethods can accurately estimate the model, the one-step estimator outperforms the initial estimator.\nKeywords\nPeriodic autoregressive process; fractional Gaussian noise; one-step procedure"}, {"group": "Robotics", "id": 156, "label": "Pesti-Gen: Unleashing a Generative Molecule Approach for Toxicity Aware Pesticide Design", "shape": "dot", "size": 10, "title": "Authors: Taehan Kim*\u2020, Wonduk Seo\u003cbr\u003eYear: 2011\u003cbr\u003eAbstract: Global climate change has reduced crop resilience\nand pesticide efficacy, making reliance on syn-\nthetic pesticides inevitable, even though their\nwidespread use poses significant health and envi-\nronmental risks. While these pesticides remain a\nkey tool in pest management, previous machine-\nlearning applications in pesticide and agriculture\nhave focused on classification or regression, leav-\ning the fundamental challenge of generating new\nmolecular structures or designing novel candi-\ndates unaddressed. In this paper, we propose\nPesti-Gen, a novel generative model based on\nvariational auto-encoders, designed to create pes-\nticide candidates with optimized properties for\nthe first time. Specifically, Pesti-Gen leverages a\ntwo-stage learning process: an initial pre-training\nphase that captures a generalized chemical struc-\nture representation, followed by a fine-tuning\nstage that incorporates toxicity-specific informa-\ntion. The model simultaneously optimizes over\nmultiple toxicity metrics, such as (1) livestock\ntoxicity and (2) aqua toxicity to generate environ-\nmentally friendly pesticide candidates. Notably,\nPesti-Gen achieves approximately 68% structural\nvalidity in generating new molecular structures,\ndemonstrating the model\u2019s effectiveness in pro-\nducing optimized and feasible pesticide candi-\ndates, thereby providing a new way for safer and\nmore sustainable pest management solutions.\n1."}, {"group": "Natural Language Processing", "id": 157, "label": "Poisson-Process Topic Model for Integrating Knowledge from Pre-trained Language Models", "shape": "dot", "size": 10, "title": "Authors: Morgane Austern, Yuanchuan Guo, Zheng Tracy Ke, Tianle Liu\u003cbr\u003eYear: 2016\u003cbr\u003eAbstract: Topic modeling is traditionally applied to word counts without accounting for the context in which\nwords appear. Recent advancements in large language models (LLMs) offer contextualized word em-\nbeddings, which capture deeper meaning and relationships between words. We aim to leverage such\nembeddings to improve topic modeling.\nWe use a pre-trained LLM to convert each document into a sequence of word embeddings. This\nsequence is then modeled as a Poisson point process, with its intensity measure expressed as a convex\ncombination of K base measures, each corresponding to a topic. To estimate these topics, we propose\na flexible algorithm that integrates traditional topic modeling methods, enhanced by net-rounding ap-\nplied before and kernel smoothing applied after. One advantage of this framework is that it treats the\nLLM as a black box, requiring no fine-tuning of its parameters. Another advantage is its ability to\nseamlessly integrate any traditional topic modeling approach as a plug-in module, without the need for\nmodifications\nAssuming each topic is a \u03b2-H\u00a8older smooth intensity measure on the embedded space, we establish\nthe rate of convergence of our method. We also provide a minimax lower bound and show that the rate\nof our method matches with the lower bound when \u03b2 \u22641. Additionally, we apply our method to several\ndatasets, providing evidence that it offers an advantage over traditional topic modeling approaches.\nKey words: kernel density estimation, minimax analysis, Topic-SCORE, transformer, unmixing\n1\narXiv:2503.17809v1  [stat.ML]  22 Mar 2025"}, {"group": "Structural Biology", "id": 158, "label": "POSERS: Steganography-Driven Molecular Tagging Using Randomized", "shape": "dot", "size": 10, "title": "Authors: Ali Tafazoli Yazdi, Peter Nejjar, Lena Hochrein, Lena Hochrein, Peter Nejjar\u003cbr\u003eYear: 2012\u003cbr\u003eAbstract: Counterfeiting poses a significant challenge across multiple industries, leading to financial losses\nand health risks. While DNA-based molecular tagging has emerged as a promising anti-\ncounterfeiting strategy, existing methods rely on predefined DNA sequences, making them\nvulnerable to replication as sequencing and synthesis technologies advance. To address these\nlimitations, we introduce POSERS (Position-Oriented Scattering of Elements among a\nRandomized Sequence), a steganographic tagging system embedded within DNA sequences.\nPOSERS\nensures\ncopy-\nand\nforgery-proof\nauthentication\nby\nadding\nrestrictions\nwithin\nrandomized DNA libraries, enhancing security against counterfeiting attempts. The POSERS\ndesign allows the complexity of the libraries to be adjusted based on the customer\u0027s needs while\nensuring they withstand the ongoing improvements in DNA synthesis and sequencing\ntechnologies. We mathematically validate its security properties and experimentally demonstrate\nits effectiveness using Next-Generation Sequencing and an authentication test, successfully\ndistinguishing genuine POSERS tags from counterfeit ones. Our results highlight the potential of\nPOSERS as a long-term, adaptable solution for secure product authentication."}, {"group": "Game Theory", "id": 159, "label": "Microsoft Word - Practical Portfolio Optimization with Metaheuristics Pre-assignment Constraint and Margin Trading.doc", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2011\u003cbr\u003eAbstract: . Portfolio optimization is a critical area in finance, aiming to maximize \nreturns while minimizing risk. Metaheuristic algorithms were shown to solve \ncomplex optimization problems efficiently, with Genetic Algorithms and Particle \nSwarm Optimization being among the most popular methods. This paper intro-\nduces an innovative approach to portfolio optimization that incorporates pre-as-\nsignment to limit the search space for investor preferences and better results. Ad-\nditionally, taking margin trading strategies in account and using a rare perfor-\nmance ratio to evaluate portfolio efficiency. Through an illustrative example, this \npaper demonstrates that the metaheuristic-based methodology yields superior \nrisk-adjusted returns compared to traditional benchmarks. The results highlight \nthe potential of metaheuristics with help of assets filtering in enhancing portfolio \nperformance in terms of risk adjusted return. \nKeywords: Metaheuristics, Evolutionary algorithms, Swarm intelligence, Port-\nfolio optimization, Investment, Margin trading, MAR ratio."}, {"group": "Theoretical Physics", "id": 160, "label": "Precise Asymptotic Generalization for Multiclass Classification with Overparameterized Linear Models", "shape": "dot", "size": 10, "title": "Authors: David X. Wu, Anant Sahai\u003cbr\u003eYear: 2015\u003cbr\u003eAbstract: We study the asymptotic generalization of an overparameterized linear model for multiclass classification\nunder the Gaussian covariates bi-level model introduced in Subramanian et al. (2022), where the number of\ndata points, features, and classes all grow together. We fully resolve the conjecture posed in Subramanian\net al. (2022), matching the predicted regimes for generalization. Furthermore, our new lower bounds are\nakin to an information-theoretic strong converse: they establish that the misclassification rate goes to 0\nor 1 asymptotically. One surprising consequence of our tight results is that the min-norm interpolating\nclassifier can be asymptotically suboptimal relative to noninterpolating classifiers in the regime where the\nmin-norm interpolating regressor is known to be optimal.\nThe key to our tight analysis is a new variant of the Hanson-Wright inequality which is broadly useful\nfor multiclass problems with sparse labels. As an application, we show that the same type of analysis can\nbe used to analyze the related multilabel classification problem under the same bi-level ensemble."}, {"group": "Theoretical Physics", "id": 161, "label": "Precision and Cholesky Factor Estimation for Gaussian Processes Jiaheng Chen\u2217and Daniel Sanz-Alonso\u2020", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2020\u003cbr\u003eAbstract: . This paper studies the estimation of large precision matrices and Cholesky factors obtained by\nobserving a Gaussian process at many locations. Under general assumptions on the precision and\nthe observations, we show that the sample complexity scales poly-logarithmically with the size of\nthe precision matrix and its Cholesky factor. The key challenge in these estimation tasks is the\npolynomial growth of the condition number of the target matrices with their size. For precision\nestimation, our theory hinges on an intuitive local regression technique on the lattice graph which\nexploits the approximate sparsity implied by the screening e\ufb00ect. For Cholesky factor estimation,\nwe leverage a block-Cholesky decomposition recently used to establish complexity bounds for sparse\nCholesky factorization.\nKey words. Precision estimation, Cholesky factor estimation, Gaussian processes\nMSC codes. 62G05, 62M40, 60G05, 60G15\n1."}, {"group": "Game Theory", "id": 162, "label": "Predicting Liquidity-Aware Bond Yields using Causal GANs and Deep Reinforcement Learning with LLM Evaluation", "shape": "dot", "size": 10, "title": "Authors: Jaskaran Singh Walia, Aarush Sinha, Srinitish Srinivasan, Srihari Unnikrishnan\u003cbr\u003eYear: 2019\u003cbr\u003eAbstract: Financial bond yield forecasting is challenging due to data\nscarcity, nonlinear macroeconomic dependencies, and evolv-\ning market conditions. In this paper, we propose a novel\nframework that leverages Causal Generative Adversarial Net-\nworks (CausalGANs) and Soft Actor-Critic (SAC) reinforce-\nment learning (RL) to generate high-fidelity synthetic bond\nyield data for four major bond categories (AAA, BAA,\nUS10Y, Junk). By incorporating 12 key macroeconomic vari-\nables, we ensure statistical fidelity by preserving essen-\ntial market properties. To transform this market dependent-\nsynthetic data into actionable insights, we employ a fine-\ntuned Large Language Model (LLM) Qwen2.5-7B that gen-\nerates trading signals (BUY/HOLD/SELL), risk assessments,\nand volatility projections. We use automated, human and\nLLM evaluations, all of which demonstrate that our frame-\nwork improves forecasting performance over existing meth-\nods, with statistical validation via predictive accuracy, MAE\nevaluation(0.103%), profit/loss evaluation (60% profit rate),\nLLM evaluation (3.37/5) and expert assessments scoring 4.67\nout of 5. The reinforcement learning-enhanced synthetic data\ngeneration achieves the least Mean Absolute Error of 0.103,\ndemonstrating its effectiveness in replicating real-world bond\nmarket dynamics. We not only enhance data-driven trading\nstrategies but also provides a scalable, high-fidelity synthetic\nfinancial data pipeline for risk \u0026 volatility management and\ninvestment decision-making. This work establishes a bridge\nbetween synthetic data generation, LLM driven financial\nforecasting, and language model evaluation, contributing to\nAI-driven financial decision-making.\nKeywords: Financial Time Series, Predictive Modeling,\nBond Yield Forecasting, Synthetic Data, CausalGAN, Rein-\nforcement Learning, Large Language Models."}, {"group": "Logic", "id": 163, "label": "Probabilistic Functional Neural Networks High-dimensional functional time series (HDFTS) are often characterized by nonlin-", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2011\u003cbr\u003eAbstract: High-dimensional functional time series (HDFTS) are often characterized by nonlin-\near trends and high spatial dimensions. Such data poses unique challenges for modeling\nand forecasting due to the nonlinearity, nonstationarity, and high dimensionality. We\npropose a novel probabilistic functional neural network (ProFnet) to address these chal-\nlenges. ProFnet integrates the strengths of feedforward and deep neural networks with\nprobabilistic modeling. The model generates probabilistic forecasts using Monte Carlo\nsampling and also enables the quantification of uncertainty in predictions. While cap-\nturing both temporal and spatial dependencies across multiple regions, ProFnet offers a\nscalable and unified solution for large datasets. Applications to Japan\u2019s mortality rates\ndemonstrate superior performance. This approach enhances predictive accuracy and\nprovides interpretable uncertainty estimates, making it a valuable tool for forecasting\ncomplex high-dimensional functional data and HDFTS.\nKeywords: High-dimensional functional time series, Probabilistic neural network, Func-\ntional data analysis, Gaussian Processes"}, {"group": "Logic", "id": 164, "label": "PROBABILISTIC NEURAL OPERATORS FOR FUNCTIONAL UNCERTAINTY QUANTIFICATION", "shape": "dot", "size": 10, "title": "Authors: Christopher B\u00fclte, Philipp Scholl, Gitta Kutyniok\u003cbr\u003eYear: 2021\u003cbr\u003eAbstract: Neural operators aim to approximate the solution operator of a system of differential equations\npurely from data. They have shown immense success in modeling complex dynamical systems\nacross various domains. However, the occurrence of uncertainties inherent in both model and data\nhas so far rarely been taken into account\u2014a critical limitation in complex, chaotic systems such as\nweather forecasting. In this paper, we introduce the probabilistic neural operator (PNO), a framework\nfor learning probability distributions over the output function space of neural operators. PNO\nextends neural operators with generative modeling based on strictly proper scoring rules, integrating\nuncertainty information directly into the training process. We provide a theoretical justification for\nthe approach and demonstrate improved performance in quantifying uncertainty across different\ndomains and with respect to different baselines. Furthermore, PNO requires minimal adjustment to\nexisting architectures, shows improved performance for most probabilistic prediction tasks, and leads\nto well-calibrated predictive distributions and adequate uncertainty representations even for long\ndynamical trajectories. Implementing our approach into large-scale models for physical applications\ncan lead to improvements in corresponding uncertainty quantification and extreme event identification,\nultimately leading to a deeper understanding of the prediction of such surrogate models."}, {"group": "Structural Biology", "id": 165, "label": "Progressive Rendering Distillation: Adapting Stable Diffusion for", "shape": "dot", "size": 10, "title": "Authors: Xinyue Liang\u003cbr\u003eYear: 2015\u003cbr\u003eAbstract: It is highly desirable to obtain a model that can gener-\nate high-quality 3D meshes from text prompts in just sec-\nonds. While recent attempts have adapted pre-trained text-\nto-image diffusion models, such as Stable Diffusion (SD),\ninto generators of 3D representations (e.g., Triplane), they\noften suffer from poor quality due to the lack of sufficient\nhigh-quality 3D training data. Aiming at overcoming the\ndata shortage, we propose a novel training scheme, termed\nas Progressive Rendering Distillation (PRD), eliminating\nthe need for 3D ground-truths by distilling multi-view dif-\nfusion models and adapting SD into a native 3D gener-\nator.\nIn each iteration of training, PRD uses the U-Net\nto progressively denoise the latent from random noise for\na few steps, and in each step it decodes the denoised la-\ntent into 3D output. Multi-view diffusion models, includ-\ning MVDream and RichDreamer, are used in joint with SD\n*Corresponding authors.\nto distill text-consistent textures and geometries into the\n3D outputs through score distillation. Since PRD supports\ntraining without 3D ground-truths, we can easily scale up\nthe training data and improve generation quality for chal-\nlenging text prompts with creative concepts. Meanwhile,\nPRD can accelerate the inference speed of the generation\nmodel in just a few steps.\nWith PRD, we train a Tri-\nplane generator, namely TriplaneTurbo, which adds only\n2.5% trainable parameters to adapt SD for Triplane gener-\nation. TriplaneTurbo outperforms previous text-to-3D gen-\nerators in both efficiency and quality. Specifically, it can\nproduce high-quality 3D meshes in"}, {"group": "Structural Biology", "id": 166, "label": "PROTCOMPOSER: COMPOSITIONAL PROTEIN", "shape": "dot", "size": 10, "title": "Authors: Bowen Jing\u2217, Tomas Geffner, Jason Yim, Tommi Jaakkola, Arash Vahdat, Karsten Kreis\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: We develop ProtComposer to generate protein structures conditioned on spatial\nprotein layouts that are specified via a set of 3D ellipsoids capturing substruc-\nture shapes and semantics. At inference time, we condition on ellipsoids that are\nhand-constructed, extracted from existing proteins, or from a statistical model,\nwith each option unlocking new capabilities. Hand-specifying ellipsoids enables\nusers to control the location, size, orientation, secondary structure, and approxi-\nmate shape of protein substructures. Conditioning on ellipsoids of existing pro-\nteins enables redesigning their substructure\u2019s connectivity or editing substructure\nproperties. By conditioning on novel and diverse ellipsoid layouts from a simple\nstatistical model, we improve protein generation with expanded Pareto frontiers\nbetween designability, novelty, and diversity. Further, this enables sampling des-\nignable proteins with a helix-fraction that matches PDB proteins, unlike existing\ngenerative models that commonly oversample conceptually simple helix bundles.\nCode is available at https://github.com/NVlabs/protcomposer."}, {"group": "Structural Biology", "id": 167, "label": "ProtTeX: Structure-In-Context Reasoning and Editing of Proteins with Large Language", "shape": "dot", "size": 10, "title": "Authors: Zicheng Ma, \u2020, Chuanliu Fan, \u2021, Zhicong Wang, \u2021, Zhenyu Chen, \u00b6, Xiaohan Lin, \u00b6, Yanheng Li, \u00b6, Shihao Feng, \u2020, Jun Zhang, \u2217, \u2020, Ziqiang Cao, \u2217, \u2021, Yi Qin Gao\u2217, \u00b6\u003cbr\u003eYear: 2022\u003cbr\u003eAbstract: Large language models have made remarkable progress in the field of molecular\nscience, particularly in understanding and generating functional small molecules. This\nsuccess is largely attributed to the effectiveness of molecular tokenization strategies. In\nprotein science, the amino acid sequence serves as the sole tokenizer for LLMs. However,\nmany fundamental challenges in protein science are inherently structure-dependent.\nThe absence of structure-aware tokens significantly limits the capabilities of LLMs for\ncomprehensive biomolecular comprehension and multimodal generation. To address\nthese challenges, we introduce a novel framework, ProtTeX, which tokenizes the protein\nsequences, structures, and textual information into a unified discrete space. This inno-\nvative approach enables joint training of the LLM exclusively through the Next-Token\n1\narXiv:2503.08179v3  [q-bio.BM]  13 Mar 2025\nPrediction paradigm, facilitating multimodal protein reasoning and generation. ProtTeX\nenables general LLMs to perceive and process protein structures through sequential\ntext input, leverage structural information as intermediate reasoning components, and\ngenerate or manipulate structures via sequential text output. Experiments demonstrate\nthat our model achieves significant improvements in protein function prediction, outper-\nforming the state-of-the-art domain expert model with a twofold increase in accuracy.\nOur framework enables high-quality conformational generation and customizable protein\ndesign. For the first time, we demonstrate that by adopting the standard training and\ninference pipelines from the LLM domain, ProtTeX empowers decoder-only LLMs to\neffectively address diverse spectrum of protein-related tasks.\n1."}, {"group": "Theoretical Physics", "id": 168, "label": "PROVABLE REDUCTION IN COMMUNICATION ROUNDS FOR NON-SMOOTH CONVEX FEDERATED LEARNING", "shape": "dot", "size": 10, "title": "Authors: Karlo Palenzuela, Ali Dadras, Alp Yurtsever\u2217, Tommy L\u00a8ofstedt\u2217\u003cbr\u003eYear: 2019\u003cbr\u003eAbstract: Multiple local steps are key to communication-efficient federated learning. How-\never, theoretical guarantees for such algorithms, without data heterogeneity-\nbounding assumptions, have been lacking in general non-smooth convex prob-\nlems. Leveraging projection-efficient optimization methods, we propose FedMLS,\na federated learning algorithm with provable improvements from multiple local\nsteps. FedMLS attains an \u03f5-suboptimal solution in O(1/\u03f5) communication rounds,\nrequiring a total of O(1/\u03f52) stochastic subgradient oracle calls."}, {"group": "Theoretical Physics", "id": 169, "label": "Purifying Approximate Differential Privacy with Randomized Yingyu Lin\u2217, Erchi Wang\u2217, Yi-An Ma, Yu-Xiang Wang", "shape": "dot", "size": 10, "title": "Authors: Yingyu Lin\u2217, Erchi Wang\u2217, Yi-An Ma\u003cbr\u003eYear: 2010\u003cbr\u003eAbstract: We propose a framework to convert (\u03b5, \u03b4)-approximate Differential Privacy (DP) mechanisms into (\u03b5, 0)-\npure DP mechanisms, a process we call \u201cpurification\u201d. This algorithmic technique leverages randomized\npost-processing with calibrated noise to eliminate the \u03b4 parameter while preserving utility. By combining\nthe tighter utility bounds and computational efficiency of approximate DP mechanisms with the stronger\nguarantees of pure DP, our approach achieves the best of both worlds. We illustrate the applicability of this\nframework in various settings, including Differentially Private Empirical Risk Minimization (DP-ERM),\ndata-dependent DP mechanisms such as Propose-Test-Release (PTR), and query release tasks. To the\nbest of our knowledge, this is the first work to provide a systematic method for transforming approximate\nDP into pure DP while maintaining competitive accuracy and computational efficiency."}, {"group": "Structural Biology", "id": 170, "label": "Pushing the boundaries of Structure-Based Drug Design  through Collaboration with Large Language Models", "shape": "dot", "size": 10, "title": "Authors: Bowen Gao, Yanwen Huang, Yiqiao Liu, Wenxuan Xie, Wei-Ying Ma, Yanyan Lan\u003cbr\u003eYear: 2016\u003cbr\u003eAbstract: Structure-Based Drug Design (SBDD) has rev-\nolutionized drug discovery by enabling the ra-\ntional design of molecules for specific protein\ntargets. Despite significant advancements in im-\nproving docking scores, advanced 3D-SBDD gen-\nerative models still face challenges in producing\ndrug-like candidates that meet medicinal chem-\nistry standards and pharmacokinetic requirements.\nThese limitations arise from their inherent fo-\ncus on molecular interactions, often neglecting\ncritical aspects of drug-likeness.\nTo address\nthese shortcomings, we introduce the Collabo-\nrative Intelligence Drug Design (CIDD) frame-\nwork, which combines the structural precision\nof 3D-SBDD models with the chemical reason-\ning capabilities of large language models (LLMs).\nCIDD begins by generating supporting molecules\nwith 3D-SBDD models and then refines these\nmolecules through LLM-supported modules to\nenhance drug-likeness and structural reasonabil-\nity. When evaluated on the CrossDocked2020\ndataset, CIDD achieved a remarkable success ra-\ntio of 37.94%, significantly outperforming the\nprevious state-of-the-art benchmark of 15.72%.\nAlthough improving molecular interactions and\ndrug-likeness is often seen as a trade-off, CIDD\nuniquely achieves a balanced improvement in\nboth by leveraging the complementary strengths\nof different models, offering a robust and innova-\ntive pathway for designing therapeutically promis-\ning drug candidates.\n*Equal contribution 1Institute for AI Industry Research (AIR),\nTsinghua University. 2Department of Computer Science and Tech-\nnology, Tsinghua University. 3Department of Pharmaceutical Sci-\nence, Peking University.\n4School of Future Technology, South\nChina University of Technology.. Correspondence to: Yanyan Lan\n\u003clanyanyan@air.tsinghua.edu.cn\u003e.\nUnder Review\n1."}, {"group": "Data Science", "id": 171, "label": "PVLens: Enhancing Pharmacovigilance Through Automated Label Extraction", "shape": "dot", "size": 10, "title": "Authors: Jeffery L. Painter, Greg Powell, Andrew Bate\u003cbr\u003eYear: 2015\u003cbr\u003eAbstract: Reliable drug safety reference databases are essential for pharmacovigilance, yet\nexisting resources like SIDER are outdated and static. We introduce PVLens,\nan automated system that extracts labeled safety information from FDA Struc-\ntured Product Labels (SPLs) and maps terms to MedDRA. PVLens integrates\nautomation with expert oversight through a web-based review tool. In valida-\ntion against 97 drug labels, PVLens achieved an F1 score of 0.882, with high\nrecall (0.983) and moderate precision (0.799). By offering a scalable, more accu-\nrate and continuously updated alternative to SIDER, PVLens enhances real-time\npharamcovigilance with improved accuracy and contemporaneous insights.\nKeywords: Pharmacovigilance, Natural Language Processing (NLP), Drug Safety,\nADR"}, {"group": "Robotics", "id": 172, "label": "Quantitative Evaluation of Quantum/Classical Neural Network Using a Game Solver Metric", "shape": "dot", "size": 10, "title": "Authors: SUZUKAZE KAMEI, HIDEAKI KAWAGUCHI, SHIN NISHIO, Tatakahiko Satoh, Suzukaze Kamei\u003cbr\u003eYear: 2015\u003cbr\u003eAbstract: To evaluate the performance of quantum computing systems relative to classical counterparts\nand explore the potential for quantum advantage, we propose a game-solving benchmark based on Elo ratings\nin the game of tic-tac-toe. We compare classical convolutional neural networks (CNNs), quantum convo-\nlutional neural networks (QCNNs), and hybrid classical-quantum models by assessing their performance\nagainst a random-move agent in automated matches. Additionally, we implement a QCNN integrated with\nquantum communication and evaluate its performance to quantify the overhead introduced by noisy quantum\nchannels. Our results show that the classical-quantum hybrid model achieves Elo ratings comparable to those\nof classical CNNs, while the standalone QCNN underperforms under current hardware constraints. The\ncommunication overhead was found to be modest. These findings demonstrate the viability of using game-\nbased benchmarks for evaluating quantum computing systems and suggest that quantum communication\ncan be incorporated with limited impact on performance, providing a foundation for future hybrid quantum\napplications.\nINDEX TERMS Quantum Machine Learning, Quantum Communication, Quantum/Classical Algorithm,\nRating System, Tic-Tac-Toe Solver\nI."}, {"group": "Structural Biology", "id": 173, "label": "Reconstructing Humans with a Biomechanically Accurate Skeleton", "shape": "dot", "size": 10, "title": "Authors: Yan Xia, Xiaowei Zhou, Etienne Vouga, Qixing Huang, Georgios Pavlakos\u003cbr\u003eYear: 2016\u003cbr\u003eAbstract: In this paper, we introduce a method for reconstruct-\ning 3D humans from a single image using a biomechan-\nically accurate skeleton model. To achieve this, we train\na transformer that takes an image as input and estimates\nthe parameters of the model. Due to the lack of training\ndata for this task, we build a pipeline to produce pseudo\nground truth model parameters for single images and im-\nplement a training procedure that iteratively refines these\npseudo labels. Compared to state-of-the-art methods for\n3D human mesh recovery, our model achieves competitive\nperformance on standard benchmarks, while it significantly\noutperforms them in settings with extreme 3D poses and\nviewpoints. Additionally, we show that previous reconstruc-\ntion methods frequently violate joint angle limits, leading\nto unnatural rotations.\nIn contrast, our approach lever-\nages the biomechanically plausible degrees of freedom mak-\ning more realistic joint rotation estimates. We validate our\napproach across multiple human pose estimation bench-\nmarks. We make the code, models and data available at:\nhttps://isshikihugh.github.io/HSMR/\n1."}, {"group": "Theoretical Physics", "id": 174, "label": "Regression-Based Estimation of Causal Effects in the Presence of Selection Bias and Confounding", "shape": "dot", "size": 10, "title": "Authors: Ruhr\u003cbr\u003eYear: 2020\u003cbr\u003eAbstract: We consider the problem of estimating the expected causal effect E[Y |do(X)]\nfor a target variable Y when treatment X is set by intervention, focusing on\ncontinuous random variables. In settings without selection bias or confounding,\nE[Y |do(X)] = E[Y |X], which can be estimated using standard regression meth-\nods. However, regression fails when systematic missingness induced by selection\nbias, or confounding distorts the data. Boeken et al. [2023] show that when training\ndata is subject to selection, proxy variables unaffected by this process can, under\ncertain constraints, be used to correct for selection bias to estimate E[Y |X], and\nhence E[Y |do(X)], reliably. When data is additionally affected by confounding,\nhowever, this equality is no longer valid.\nBuilding on these results, we consider a more general setting and propose a frame-\nwork that incorporates both selection bias and confounding. Specifically, we derive\ntheoretical conditions ensuring identifiability and recoverability of causal effects\nunder access to external data and proxy variables. We further introduce a two-step\nregression estimator (TSR), capable of exploiting proxy variables to adjust for\nselection bias while accounting for confounding. We show that TSR coincides\nwith prior work if confounding is absent, but achieves a lower variance. Extensive\nsimulation studies validate TSR\u2019s correctness for scenarios which may include both\nselection bias and confounding with proxy variables."}, {"group": "Theoretical Physics", "id": 175, "label": "Regularized e-processes: anytime valid inference with knowledge-based efficiency gains", "shape": "dot", "size": 10, "title": "Authors: Ryan Martin\u2217\u003cbr\u003eYear: 2014\u003cbr\u003eAbstract: Classical statistical methods have theoretical justification when the sample size\nis predetermined. In applications, however, it\u2019s often the case that sample sizes are\ndata-dependent rather than predetermined. The aforementioned methods aren\u2019t\nreliable in this latter case, hence the recent interest in e-processes and methods\nthat are anytime valid, i.e., reliable for any dynamic data-collection plan. But if\nthe investigator has relevant-yet-incomplete prior information about the quantity of\ninterest, then there\u2019s an opportunity for efficiency gain. This paper proposes a reg-\nularized e-process framework featuring a knowledge-based, imprecise-probabilistic\nregularization with improved efficiency. A generalized version of Ville\u2019s inequality is\nestablished, ensuring that inference based on the regularized e-process are anytime\nvalid in a novel, knowledge-dependent sense. Regularized e-processes also facilitate\npossibility-theoretic uncertainty quantification with strong frequentist-like calibra-\ntion properties and other Bayesian-like properties: satisfies the likelihood principle,\navoids sure-loss, and offers formal decision-making with reliability guarantees.\nKeywords and phrases: Credal set; decision-making; e-value; imprecise proba-\nbility; inferential model; possibility theory; safety; uncertainty quantification."}, {"group": "Structural Biology", "id": 176, "label": "cAMP-CREB Signaling Pathway", "shape": "dot", "size": 10, "title": "Authors: Liu Min, Wang Jin, Si-Meng Cheng, Xiang-Wen, Wang Ning, Jia, Wang Ning\u003cbr\u003eYear: 2020\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Game Theory", "id": 177, "label": "Reinforcement-Learning Portfolio Allocation with Dynamic Embedding of Market Information", "shape": "dot", "size": 10, "title": "Authors: Zeyu Zheng, Markowitz, Markowitz, Markowitz, Campbell, Kyle, Xiao, Cong, Fama, Park, Sabourian, Salahuddin, Michaud, Ao\u003cbr\u003eYear: 2021\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Natural Language Processing", "id": 178, "label": "ResearchBench: Benchmarking LLMs in Scientific Discovery via Inspiration-Based Task Decomposition", "shape": "dot", "size": 10, "title": "Authors: Yujie Liu\u2217, Zonglin Yang, \u2217, Tong Xie, Jinjie Ni, Ben Gao, Yuqiang Li, Shixiang Tang, Wanli Ouyang, Erik Cambria, Dongzhan Zhou\u2020\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Large language models (LLMs) have demon-\nstrated potential in assisting scientific research,\nyet their ability in discovering high-quality re-\nsearch hypotheses remains unexamined due to\nthe lack of a dedicated benchmark.\nTo ad-\ndress this gap, we introduce the first large-\nscale benchmark for evaluating LLMs with\na near-sufficient set of sub-tasks of scientific\ndiscovery, which are inspiration retrieval, hy-\npothesis composition, and hypothesis ranking.\nWe develop an automated framework that ex-\ntracts critical components\u2014research questions,\nbackground surveys, inspirations, and hypothe-\nses\u2014from scientific papers across 12 disci-\nplines, with expert validation confirming its\naccuracy. To prevent data contamination, we\nfocus exclusively on papers published in 2024,\nensuring minimal overlap with LLM pretrain-\ning data. Our evaluation reveals that LLMs\nperform well in retrieving inspirations, an out-\nof-distribution task, suggesting their ability to\nsurface novel knowledge associations. This po-\nsitions LLMs as \u201cresearch hypothesis mines\u201d,\ncapable of facilitating automated scientific dis-\ncovery by generating innovative hypotheses at\nscale with minimal human intervention."}, {"group": "Deep Learning", "id": 179, "label": "Retinal Fundus Multi-Disease Image Classification using Hybrid", "shape": "dot", "size": 10, "title": "Authors: Saksham Agarwal\u22c6, Subhankar Mishra, $, saksham.agarwal, Subhankar Mishra\u003cbr\u003eYear: 2016\u003cbr\u003eAbstract: . Our research is motivated by the urgent global issue of a large\npopulation affected by retinal diseases, which are evenly distributed but\nunderserved by specialized medical expertise, particularly in non-urban\nareas. Our primary objective is to bridge this healthcare gap by develop-\ning a comprehensive diagnostic system capable of accurately predicting\nretinal diseases solely from fundus images. However, we faced significant\nchallenges due to limited, diverse datasets and imbalanced class distri-\nbutions. To overcome these issues, we have devised innovative strategies.\nOur research introduces novel approaches, utilizing hybrid models com-\nbining deeper Convolutional Neural Networks (CNNs), Transformer en-\ncoders, and ensemble architectures sequentially and in parallel to classify\nretinal fundus images into 20 disease labels. Our overarching goal is to\nassess these advanced models\u2019 potential in practical applications, with\na strong focus on enhancing retinal disease diagnosis accuracy across a\nbroader spectrum of conditions. Importantly, our efforts have surpassed\nbaseline model results, with the C-Tran ensemble model emerging as\nthe leader, achieving a remarkable model score of 0.9166, surpassing the\nbaseline score of 0.9. Additionally, experiments with the IEViT model\nshowcased equally promising outcomes with improved computational ef-\nficiency. We\u2019ve also demonstrated the effectiveness of dynamic patch ex-\ntraction and the integration of domain knowledge in computer vision\ntasks. In summary, our research strives to contribute significantly to reti-\nnal disease diagnosis, addressing the critical need for accessible health-\ncare solutions in underserved regions while aiming for comprehensive and\naccurate disease prediction.\nKeywords: Retinal disease classification, CNN, Classification Transformers,\nIEViT, Ensemble, Hybrid\n\u22c6The first two authors contributed equally to this work and should be regarded as\nJoint First Authors\narXiv:2503.21465v1  [cs.CV]  27 Mar 2025\n2\nDeependra Singh1, Saksham Agarwal2\u22c6, Subhankar Mishra3,$"}, {"group": "Science and Technology", "id": 180, "label": "Retrieving Time-Series Differences Using Natural Kota Dohi, Tomoya Nishida, Harsh Purohit, Takashi Endo, Yohei Kawaguchi", "shape": "dot", "size": 10, "title": "Authors: Kota Dohi, Tomoya Nishida, Harsh Purohit, Takashi Endo\u003cbr\u003eYear: 2011\u003cbr\u003eAbstract: \u2014Effectively searching time-series data is essential\nfor system analysis; however, traditional methods often require\ndomain expertise to define search criteria. Recent advancements\nhave enabled natural language-based search, but these methods\nstruggle to handle differences between time-series data. To\naddress this limitation, we propose a natural language query-\nbased approach for retrieving pairs of time-series data based on\ndifferences specified in the query. Specifically, we define six key\ncharacteristics of differences, construct a corresponding dataset,\nand develop a contrastive learning-based model to align differ-\nences between time-series data with query texts. Experimental\nresults demonstrate that our model achieves an overall mAP\nscore of 0.994 in retrieving time-series pairs.\nIndex Terms\u2014Time series analysis, time-series retrieval, multi\nmodality, contrastive learning\nI."}, {"group": "Theoretical Physics", "id": 181, "label": "REVISITING GENERAL SOURCE CONDITION IN LEARNING OVER NAVEEN GUPTA AND S. SIVANANTHAN", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2021\u003cbr\u003eAbstract: . In Learning Theory, the smoothness assumption on the target function\n(known as source condition) is a key factor in establishing theoretical convergence rates\nfor an estimator.\nThe existing general form of the source condition, as discussed in\nlearning theory literature, has traditionally been restricted to a class of functions that\ncan be expressed as a product of an operator monotone function and a Lipschitz con-\ntinuous function. In this note, we remove these restrictions on the index function and\nestablish optimal convergence rates for least-square regression over a Hilbert space with\ngeneral regularization under a general source condition, thereby signi\ufb01cantly broadening\nthe scope of existing theoretical results.\n1."}, {"group": "Natural Language Processing", "id": 182, "label": "RGB-Th-Bench: A Dense benchmark for Visual-Thermal Understanding of Vision Language Models", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2010\u003cbr\u003eAbstract: We introduce RGB-Th-Bench, the first benchmark designed\nto evaluate the ability of Vision-Language Models (VLMs)\nto comprehend RGB-Thermal image pairs.\nWhile VLMs\nhave demonstrated remarkable progress in visual reasoning\nand multimodal understanding, their evaluation has been\npredominantly limited to RGB-based benchmarks, leav-\ning a critical gap in assessing their capabilities in in-\nfrared vision tasks. Existing visible-infrared datasets are\neither task-specific or lack high-quality annotations nec-\nessary for rigorous model evaluation.\nTo address these\nlimitations, RGB-Th-Bench provides a comprehensive eval-\nuation framework covering 14 distinct skill dimensions,\nwith a total of 1,600+ expert-annotated Yes/No questions.\nThe benchmark employs two accuracy metrics: a standard\nquestion-level accuracy and a stricter skill-level accuracy,\nwhich evaluates model robustness across multiple questions\nwithin each skill dimension. This design ensures a thorough\nassessment of model performance, including resilience to\nadversarial and hallucinated responses.\nWe conduct ex-\ntensive evaluations on 19 state-of-the-art VLMs, reveal-\ning significant performance gaps in RGB-Thermal under-\nstanding. Our results show that even the strongest models\nstruggle with thermal image comprehension, with perfor-\nmance heavily constrained by their RGB-based capabilities.\nAdditionally, the lack of large-scale application-specific\nand expert-annotated thermal-caption-pair datasets in pre-\ntraining is an important reason of the observed perfor-\nmance gap. RGB-Th-Bench highlights the urgent need for\nfurther advancements in multimodal learning to bridge the\ngap between visible and thermal image understanding. The\ndataset is available through this link, and the evaluation\ncode will also be made publicly available.\n1."}, {"group": "Structural Biology", "id": 183, "label": "RNA SEQUENCE AND STRUCTURE CO- GENERATION WITH EQUIVARIANT MULTIFLOW", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Ribonucleic acid (RNA) plays fundamental roles in biological systems, from\ncarrying genetic information to performing enzymatic function. Understanding\nand designing RNA can enable novel therapeutic application and biotechnolog-\nical innovation. To enhance RNA design, in this paper we introduce RiboGen,\nthe first deep learning model to simultaneously generate RNA sequence and all-\natom 3D structure. RiboGen leverages the standard Flow Matching with Discrete\nFlow Matching in a multimodal data representation. RiboGen is based on Eu-\nclidean Equivariant neural networks for efficiently processing and learning three-\ndimensional geometry. Our experiments show that RiboGen can efficiently gen-\nerate chemically plausible and self-consistent RNA samples. Our results suggest\nthat co-generation of sequence and structure is a competitive approach for model-\ning RNA."}, {"group": "Theoretical Physics", "id": 184, "label": "Riemannian Optimization on Relaxed Indicator Matrix Manifold", "shape": "dot", "size": 10, "title": "Authors: Fangyuan Xie, Feiping Nie\u2217, China\u003cbr\u003eYear: 2013\u003cbr\u003eAbstract: The indicator matrix plays an important role in machine learning, but optimizing it\nis an NP-hard problem. We propose a new relaxation of the indicator matrix and\nprove that this relaxation forms a manifold, which we call the Relaxed Indicator\nMatrix Manifold (RIM manifold). Based on Riemannian geometry, we develop\na Riemannian toolbox for optimization on the RIM manifold. Specifically, we\nprovide several methods of Retraction, including a fast Retraction method to\nobtain geodesics. We point out that the RIM manifold is a generalization of the\ndouble stochastic manifold, and it is much faster than existing methods on the\ndouble stochastic manifold, which has a complexity of O(n3), while RIM manifold\noptimization is O(n) and often yields better results. We conducted extensive\nexperiments, including image denoising, with millions of variables to support our\nconclusion, and applied the RIM manifold to Ratio Cut, achieving clustering results\nthat outperform the state-of-the-art methods. Our Code in https://github.com/Yuan-\nJinghui/Riemannian-Optimization-on-Relaxed-Indicator-Matrix-Manifold."}, {"group": "Game Theory", "id": 185, "label": "Robust and Sparse Portfolio Selection: Quantitative Insights and Efficient Algorithms", "shape": "dot", "size": 10, "title": "Authors: Jingnan Chena, Selin Damla Ahipa\u00b8sao\u02d8glub, Ning Zhangc, Yufei Yangd\u003cbr\u003eYear: 2010\u003cbr\u003eAbstract: We extend the classical mean-variance (MV) framework and propose a robust and sparse portfolio selection model\nincorporating an ellipsoidal uncertainty set to reduce the impact of estimation errors and fixed transaction costs\nto penalize over-diversification. In the literature, the MV model under fixed transaction costs is referred to as the\nsparse or cardinality-constrained MV optimization, which is a mixed integer problem and is challenging to solve\nwhen the number of assets is large. We develop an efficient semismooth Newton-based proximal difference-of-convex\nalgorithm to solve the proposed model and prove its convergence to at least a local minimizer with a locally linear\nconvergence rate. We explore properties of the robust and sparse portfolio both analytically and numerically. In\nparticular, we show that the MV optimization is indeed a robust procedure as long as an investor makes the\nproper choice on the risk-aversion coefficient. We contribute to the literature by proving that there is a one-to-one\ncorrespondence between the risk-aversion coefficient and the level of robustness. Moreover, we characterize how\nthe number of traded assets changes with respect to the interaction between the level of uncertainty on model\nparameters and the magnitude of transaction cost.\nKeywords:\nrobust portfolio selection, sparse portfolio selection, cardinality-constrained mean-variance\noptimization, difference-of-convex approximation, proximal algorithm\nEmail addresses: jchen@buaa.edu.cn (Jingnan Chen), ahipasa@gmail.com (Selin Damla Ahipa\u00b8sao\u02d8glu), zhangning@dgut.edu.cn\n(Ning Zhang), eeyufei@gmail.com (Yufei Yang)\nPreprint submitted to Elsevier\nDecember 30, 2024\narXiv:2412.19462v1  [q-fin.PM]  27 Dec 2024\n1."}, {"group": "Structural Biology", "id": 186, "label": "Scalable physics-informed deep generative model for solving forward and inverse stochastic differential", "shape": "dot", "size": 10, "title": "Authors: Shaoqian Zhoua, Wen Youa, Ling Guob, Xuhui Menga\u003cbr\u003eYear: 2012\u003cbr\u003eAbstract: Physics-informed deep learning approaches have been developed to solve\nforward and inverse stochastic differential equation (SDE) problems with\nhigh-dimensional stochastic space. However, the existing deep learning mod-\nels have difficulties solving SDEs with high-dimensional spatial space. In\nthe present study, we propose a scalable physics-informed deep generative\nmodel (sPI-GeM), which is capable of solving SDE problems with both\nhigh-dimensional stochastic and spatial space. The sPI-GeM consists of two\ndeep learning models, i.e., (1) physics-informed basis networks (PI-BasisNet),\nwhich are used to learn the basis functions as well as the coefficients given\ndata on a certain stochastic process or random field, and (2) physics-informed\ndeep generative model (PI-GeM), which learns the distribution over the co-\nefficients obtained from the PI-BasisNet. The new samples for the learned\nstochastic process can then be obtained using the inner product between\nthe output of the generator and the basis functions from the trained PI-\nBasisNet. The sPI-GeM addresses the scalability in the spatial space in a\nsimilar way as in the widely used dimensionality reduction technique, i.e.,\nprincipal component analysis (PCA). A series of numerical experiments, in-\ncluding approximation of Gaussian and non-Gaussian stochastic processes,\nforward and inverse SDE problems, are performed to demonstrate the accu-\nracy of the proposed model. Furthermore, we also show the scalability of\n1Corresponding author: xuhui meng@hust.edu.cn (Xuhui Meng).\nPreprint submitted to XXX\nMarch 25, 2025\narXiv:2503.18012v1  [physics.comp-ph]  23 Mar 2025\nthe sPI-GeM in both the stochastic and spatial space using an example of\na forward SDE problem with 38- and 20-dimension stochastic and spatial\nspace, respectively.\nKeywords:\nbasis function, physics-informed deep generative model,\nscalability, SDEs with high-dimensional stochastic and spatial space\nPACS: 0000, 1111\n2000 MSC: 0000, 1111\n1."}, {"group": "Structural Biology", "id": 187, "label": "ScalingNoise: Scaling Inference-Time Search for Generating Infinite Videos Project Page: https://yanghlll.github.io/ScalingNoise.github.io/", "shape": "dot", "size": 10, "title": "Authors: Haolin Yang, \u2217, Feilong Tang, \u2217, Ming Hu, Yulong Li, Yexin Liu, Zelin Peng, Junjun He, Zongyuan Ge\u2020, Imran Razzak\u2020\u003cbr\u003eYear: 2012\u003cbr\u003eAbstract: Video diffusion models (VDMs) facilitate the generation of\nhigh-quality videos, with current research predominantly\nconcentrated on scaling efforts during training through im-\nprovements in data quality, computational resources, and\nmodel complexity. However, inference-time scaling has re-\nceived less attention, with most approaches restricting mod-\nels to a single generation attempt. Recent studies have un-\ncovered the existence of \u201cgolden noises\u201d that can enhance\nvideo quality during generation. Building on this, we find\nthat guiding the scaling inference-time search of VDMs to\nidentify better noise candidates not only evaluates the qual-\nity of the frames generated in the current step but also pre-\nserves the high-level object features by referencing the an-\nchor frame from previous multi-chunks, thereby delivering\nlong-term value. Our analysis reveals that diffusion mod-\n1Equal Contribution. \u2020 Corresponding Authors.\nels inherently possess flexible adjustments of computation\nby varying denoising steps, and even a one-step denoising\napproach, when guided by a reward signal, yields signifi-\ncant long-term benefits. Based on the observation, we pro-\npose ScalingNoise, a plug-and-play inference-time search\nstrategy that identifies golden initial noises for the diffu-\nsion sampling process to improve global content consis-\ntency and visual diversity. Specifically, we perform one-\nstep denoising to convert initial noises into a clip and sub-\nsequently evaluate its long-term value, leveraging a reward\nmodel anchored by previously generated content. Moreover,\nto preserve diversity, we sample candidates from a tilted\nnoise distribution that up-weights promising noises. In this\nway, ScalingNoise significantly reduces noise-induced er-\nrors, ensuring more coherent and spatiotemporally consis-\ntent video generation. Extensive experiments on benchmark\ndatasets demonstrate that the proposed ScalingNoise effec-\ntively improves both content fidelity and subject consistency\nfor resource-constrained long video generation.\n1\narXiv:2503.16400v2  [cs.LG]  27 Mar 2025\n1."}, {"group": "Natural Language Processing", "id": 188, "label": "SegMAN: Omni-scale Context Modeling with State Space Models and Local Attention for Semantic Segmentation", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2019\u003cbr\u003eAbstract: High-quality semantic segmentation relies on three key ca-\npabilities: global context modeling, local detail encoding,\nand multi-scale feature extraction. However, recent meth-\nods struggle to possess all these capabilities simultane-\nously. Hence, we aim to empower segmentation networks to\nsimultaneously carry out efficient global context modeling,\nhigh-quality local detail encoding, and rich multi-scale fea-\nture representation for varying input resolutions. In this pa-\nper, we introduce SegMAN, a novel linear-time model com-\nprising a hybrid feature encoder dubbed SegMAN Encoder,\nand a decoder based on state space models. Specifically,\nthe SegMAN Encoder synergistically integrates sliding lo-\ncal attention with dynamic state space models, enabling\nhighly efficient global context modeling while preserving\nfine-grained local details. Meanwhile, the MMSCopE mod-\nule in our decoder enhances multi-scale context feature ex-\ntraction and adaptively scales with the input resolution.\nOur SegMAN-B Encoder achieves 85.1% ImageNet-1k ac-\ncuracy (+"}, {"group": "Game Theory", "id": 189, "label": "Sentiment trading with large language models", "shape": "dot", "size": 10, "title": "Authors: Kemal Kirtac a, \u2217\u003cbr\u003eYear: 2016\u003cbr\u003eAbstract: We analyse the performance of the large language models (LLMs) OPT, BERT, and FinBERT,\nalongside the traditional Loughran-McDonald dictionary, in the sentiment analysis of 965,375\nU.S. financial news articles from 2010 to 2023. Our findings reveal that the GPT-3-based OPT\nmodel significantly outperforms the others, predicting stock market returns with an accuracy of\n74.4%. A long-short strategy based on OPT, accounting for 10 basis points (bps) in transaction\ncosts, yields an exceptional Sharpe ratio of 3.05. From August 2021 to July 2023, this strategy\nproduces an impressive 355% gain, outperforming other strategies and traditional market\nportfolios. This underscores the transformative potential of LLMs in financial market prediction\nand portfolio management and the necessity of employing sophisticated language models to\ndevelop effective investment strategies based on news sentiment.\n1."}, {"group": "Theoretical Physics", "id": 190, "label": "Sharp phase transitions in high-dimensional changepoint Daniel Xiang and Chao Gao\u2217", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2021\u003cbr\u003eAbstract: We study a hypothesis testing problem in the context of high-dimensional changepoint\ndetection. Given a matrix X \u2208Rp\u00d7n with independent Gaussian entries, the goal is to\ndetermine whether or not a sparse, non-null fraction of rows in X exhibits a shift in mean\nat a common index between 1 and n. We focus on three aspects of this problem: the\nsparsity of non-null rows, the presence of a single, common changepoint in the non-null\nrows, and the signal strength associated with the changepoint. Within an asymptotic\nregime relating the data dimensions n and p to the signal sparsity and strength, the\ninformation-theoretic limits of this testing problem are characterized by a formula that\ndetermines whether or not there exists a testing procedure whose sum of Type I and II\nerrors tends to zero as n, p \u2192\u221e. The formula, called the detection boundary, partitions\nthe parameter space into a two regions: one where it is possible to detect the presence\nof a single aligned changepoint (detectable region), and another where no test is able\nto consistently distinguish the mean matrix from one with constant rows (undetectable\nregion).\nKeywords. High-dimensional changepoint detection, minimax testing, phase transi-\ntion, sparse mixture."}, {"group": "Structural Biology", "id": 191, "label": "ShEPhERD: DIFFUSING SHAPE, ELECTROSTATICS, AND PHARMACOPHORES FOR BIOISOSTERIC DRUG DESIGN", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2011\u003cbr\u003eAbstract: Engineering molecules to exhibit precise 3D intermolecular interactions with\ntheir environment forms the basis of chemical design. In ligand-based drug de-\nsign, bioisosteric analogues of known bioactive hits are often identified by vir-\ntually screening chemical libraries with shape, electrostatic, and pharmacophore\nsimilarity scoring functions.\nWe instead hypothesize that a generative model\nwhich learns the joint distribution over 3D molecular structures and their inter-\naction profiles may facilitate 3D interaction-aware chemical design. We specif-\nically design ShEPhERD1, an SE(3)-equivariant diffusion model which jointly\ndiffuses/denoises 3D molecular graphs and representations of their shapes, elec-\ntrostatic potential surfaces, and (directional) pharmacophores to/from Gaussian\nnoise. Inspired by traditional ligand discovery, we compose 3D similarity scoring\nfunctions to assess ShEPhERD\u2019s ability to conditionally generate novel molecules\nwith desired interaction profiles. We demonstrate ShEPhERD\u2019s potential for im-\npact via exemplary drug design tasks including natural product ligand hopping,\nprotein-blind bioactive hit diversification, and bioisosteric fragment merging."}, {"group": "Game Theory", "id": 192, "label": "Shifting the yield curve for fixed-income and derivatives portfolios\u2217", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2019\u003cbr\u003eAbstract: We use granular regulatory data on euro interest rate swap trades between January\n2021 and June 2023 to assess whether derivative positions of Italian banks can offset\nlosses on their debt securities holdings should interest rates rise unexpectedly. At\nthe aggregate level of the banking system, we find that a 100-basis-point upward\nshift of the yield curve increases on average the value of swaps by 3.65% of Common\nEquity Tier 1 (CET1), compensating in part for the losses of 2.64% and 5.98% of\nCET1 recorded on debt securities valued at fair value and amortised cost. Variation\nexists across institutions, with some bank swap positions playing an offsetting role\nand some exacerbating bond market exposures to interest rate risk. Nevertheless,\nwe conclude that, on aggregate, Italian banks use swaps as hedging instruments to\nreduce their interest rate exposures, which improves their ability to cope with the\nrecent tightening of monetary policy. Finally, we draw on our swap pricing model\nto conduct an extensive data quality analysis of the transaction-level information\navailable to authorities, and we show that the errors in fitting value changes over\ntime are significantly lower compared to those in fitting the values themselves.\nKeywords: EMIR, interest rate risk, securities holdings, derivatives, banks.\nJEL Codes: C63, G12, G17, G21.\n\u2217The authors thank Antoine Bouveret, Cecilia Caglio, Alessandro Conciarelli, Maciej Grodzicki, Luc\nLaeven, Teodora Paligorova, participants to the \u201c2024 CEBRA Annual Meeting\u201d at Goethe University,\nFrankfurt, the \u201cECONDAT Conference 2024\u201d at King\u2019s College London, and the 2024 workshop \u201cEMIR\ndata analytics for research, financial stability and supervision\u201d at Banca d\u2019Italia, Rome. The views in\nthis paper are the authors\u2019 and do not necessarily reflect those of the Bank of Italy. Errors and omissions\nare the authors own responsibility.\n\u2020Financial Stability Directorate, Bank of Italy, Rome, Italy (micheleleonardo.bianchi@bancaditalia.it)\n\u2021Financial Stability Directorate, Bank of Italy, Rome, Italy (dario.ruzzi@bancaditalia.it)\n\u00a7Financial Stability Directorate, Bank of Italy, Rome, Italy (anatoli.seguravelez@bancaditalia.it)\n1\narXiv:2412.15986v1  [q-fin.PM]  20 Dec 2024"}, {"group": "Theoretical Physics", "id": 193, "label": "Sinkhorn Distributionally Robust Optimization", "shape": "dot", "size": 10, "title": "Authors: Jie Wang, Rui Gao, Yao Xie\u003cbr\u003eYear: 2010\u003cbr\u003eAbstract: . We study distributionally robust optimization with Sinkhorn distance\u2014a variant of Wasserstein distance based\non entropic regularization. We derive a convex programming dual reformulation for general nominal distributions, transport\ncosts, and loss functions. To solve the dual reformulation, we develop a stochastic mirror descent algorithm with biased\nsubgradient estimators and derive its computational complexity guarantees. Finally, we provide numerical examples using\nsynthetic and real data to demonstrate its superior performance.\nKey words: Wasserstein distributionally robust optimization, Sinkhorn distance, Duality theory, Stochastic mirror descent\n1."}, {"group": "Natural Language Processing", "id": 194, "label": "Language Models for Long-Form Video Understanding Mingze Xu\u25e6, Mingfei Gao\u25e6, Shiyu Li\u25e6, Jiasen Lu, Zhe Gan, Zhengfeng Lai,", "shape": "dot", "size": 10, "title": "Authors: Mingze Xu, Mingfei Gao, Shiyu Li, Jiasen Lu, Zhe Gan, Zhengfeng Lai, Meng Cao, Kai Kang, Yinfei Yang\u2020, Afshin Dehghan\u2020, mingze xu, mgao\u003cbr\u003eYear: 2013\u003cbr\u003eAbstract: We introduce SlowFast-LLaVA-"}, {"group": "Structural Biology", "id": 195, "label": "Solving 2-D Helmholtz equation in the rectangular, circular, and elliptical domains using neural networks", "shape": "dot", "size": 10, "title": "Authors: Veerababu, Prasanta K. Ghosh, Bessel, Mathieu, Prasanta K. Ghosh\u2217\u003cbr\u003eYear: 2012\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Theoretical Physics", "id": 196, "label": "Sparse PCA With Multiple Components Department of Analytics, Marketing and Operations, Imperial College Business School, London, UK", "shape": "dot", "size": 10, "title": "Authors: Ryan Cory, Jean Pauphilet, Hotelling, Eckart, Young, Hotelling, Naikal, Tan, Fan, Wang, Udell, Tropp, Rudin, Johnstone, Lu, Jolliffe, d\u2019Aspremont, Amini, Wainwright, Berthet, Rigollet, Berk, Bertsimas, Bertsimas, Berk\u003cbr\u003eYear: 2020\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Theoretical Physics", "id": 197, "label": "STATISTICAL ACCURACY OF THE ENSEMBLE KALMAN FILTER IN THE tous problem in a large number of applications, such as probabilistic weather forecasting and prediction", "shape": "dot", "size": 10, "title": "Authors: A. M. Stuart\u003cbr\u003eYear: 2011\u003cbr\u003eAbstract: . Estimating the state of a dynamical system from partial and noisy observations is a ubiqui-\ntous problem in a large number of applications, such as probabilistic weather forecasting and prediction\nof epidemics. Particle \ufb01lters are a widely adopted approach to the problem and provide provably accu-\nrate approximations of the statistics of the state, but they perform poorly in high dimensions because\nof weight collapse. The ensemble Kalman \ufb01lter does not su\ufb00er from this issue, as it relies on an in-\nteracting particle system with equal weights. Despite its wide adoption in the geophysical sciences,\nmathematical analysis of the accuracy of this \ufb01lter is predominantly con\ufb01ned to the setting of linear\ndynamical models and linear observations operators, and analysis beyond the linear Gaussian setting\nis still in its infancy. In this short note, we provide an accessible overview of recent work in which the\nauthors take \ufb01rst steps to analyze the accuracy of the \ufb01lter beyond the linear Gaussian setting [1,3,4].\nR\u00b4esum\u00b4e. Estimer l\u2019\u00b4etat d\u2019un syst`eme dynamique `a partir d\u2019observations partielles et bruit\u00b4ees est un\nprobl`eme omnipr\u00b4esent dans de nombreuses applications, telles que la pr\u00b4evision m\u00b4et\u00b4eo et la pr\u00b4ediction\ndes \u00b4epid\u00b4emies. Les \ufb01ltres particulaires sont largement utilis\u00b4es pour r\u00b4esoudre ce probl`eme et fournissent\ndes approximations des statistiques de l\u2019\u00b4etat dont la pr\u00b4ecision peut \u02c6etre d\u00b4emontr\u00b4ee rigoureusement.\nCependant, ils fonctionnent mal en grande dimension en raison de la disparit\u00b4e des poids associ\u00b4es aux\nparticules. Le \ufb01ltre de Kalman d\u2019ensemble ne sou\ufb00re pas de ce probl`eme, car il repose sur un syst`eme\nde particules en interaction avec des poids \u00b4egaux. Malgr\u00b4e sa popularit\u00b4e dans les sciences g\u00b4eophysiques,\nl\u2019analyse math\u00b4ematique de la pr\u00b4ecision de ce \ufb01ltre est principalement limit\u00b4ee au cadre des mod`eles\ndynamiques lin\u00b4eaires et des op\u00b4erateurs d\u2019observation lin\u00b4eaires, et l\u2019analyse au-del`a de ce cadre en est\nencore `a ses d\u00b4ebuts. Dans cette courte note, nous pr\u00b4esentons un aper\u00b8cu accessible de travaux r\u00b4ecents\ndans lesquels la pr\u00b4ecision du \ufb01ltre est \u00b4etudi\u00b4ee au-del`a du cadre lin\u00b4eaire gaussien [1,3,4]."}, {"group": "Theoretical Physics", "id": 198, "label": "Statistical Inference for Weighted Sample Average Approximation in Contextual Stochastic Optimization", "shape": "dot", "size": 10, "title": "Authors: Yanyuan Wang, Xiaowei Zhang, Elmachtoub, Hu, Wang, Zhang, Ban, Rudin, Bertsimas, Kallus, Qi, Bertsimas, Koduri, Ho, Nguyen, Kannan, Kallus\u003cbr\u003eYear: 2014\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Structural Biology", "id": 199, "label": "Stochastic Poisson Surface Reconstruction with One Solve using Geometric Gaussian Processes", "shape": "dot", "size": 10, "title": "Authors: Sidhanth Holalkere, David S. Bindel, Silvia Sell\u00e1n, Alexander Terenin\u003cbr\u003eYear: 2012\u003cbr\u003eAbstract: Poisson Surface Reconstruction is a widely-used\nalgorithm for reconstructing a surface from an ori-\nented point cloud. To facilitate applications where\nonly partial surface information is available, or\nscanning is performed sequentially, a recent line\nof work proposes to incorporate uncertainty into\nthe reconstructed surface via Gaussian process\nmodels. The resulting algorithms first perform\nGaussian process interpolation, then solve a set\nof volumetric partial differential equations glob-\nally in space, resulting in a computationally ex-\npensive two-stage procedure. In this work, we\napply recently-developed techniques from geo-\nmetric Gaussian processes to combine interpo-\nlation and surface reconstruction into a single\nstage, requiring only one linear solve per sam-\nple. The resulting reconstructed surface samples\ncan be queried locally in space, without the use of\nproblem-dependent volumetric meshes or grids.\nThese capabilities enable one to (a) perform prob-\nabilistic collision detection locally around the re-\ngion of interest, (b) perform ray casting without\nevaluating points not on the ray\u2019s trajectory, and\n(c) perform next-view planning on a per-slice ba-\nsis. They also improve reconstruction quality, by\nnot requiring one to approximate kernel matrix in-\nverses with diagonal matrices as part of intermedi-\nate computations. Results show that our approach\nprovides a cleaner, more-principled, and more-\nflexible stochastic surface reconstruction pipeline.\n1."}, {"group": "Theoretical Physics", "id": 200, "label": "STOCHASTIC TRANSPORT MAPS IN DIFFUSION MODELS AND ing stochastic transport maps between probability distributions using diffusion processes. We", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2013\u003cbr\u003eAbstract: . In this work, we present a theoretical and computational framework for construct-\ning stochastic transport maps between probability distributions using diffusion processes. We\nbegin by proving that the time-marginal distribution of the sum of two independent diffusion\nprocesses satisfies a Fokker-Planck equation. Building on this result and applying Ambrosio-\nFigalli-Trevisan\u2019s superposition principle, we establish the existence and uniqueness of solutions\nto the associated stochastic differential equation (SDE). Leveraging these theoretical foundations,\nwe develop a method to construct (stochastic) transport maps between arbitrary probability dis-\ntributions using dynamical ordinary differential equations (ODEs) and SDEs. Furthermore, we\nintroduce a unified framework that generalizes and extends a broad class of diffusion-based gener-\native models and sampling techniques. Finally, we analyze the convergence properties of particle\napproximations for the SDEs underlying our framework, providing theoretical guarantees for\ntheir practical implementation. This work bridges theoretical insights with practical applica-\ntions, offering new tools for generative modeling and sampling in high-dimensional spaces.\nContents\n1."}, {"group": "Structural Biology", "id": 201, "label": "Structure-Based Experimental Datasets for Benchmarking Protein", "shape": "dot", "size": 10, "title": "Authors: Chapin E. Cavender, David A. Case, Julian C.-H. Chen, Lillian T. Chong, Daniel, A. Keedy, Kresten Lindorff-Larsen, David L. Mobley, O. H. Samuli Ollila, ChrisOostenbrink, Paul Robustelli, Vincent A. Voelz, Michael E. Wall, David C., Wych, Michael K. Gilson\u003cbr\u003eYear: 2012\u003cbr\u003eAbstract: This review article provides an overview of structurally oriented experimental datasets\nthat can be used to benchmark protein force \ufb01elds, focusing on data generated by nuclear mag-\nnetic resonance (NMR) spectroscopy and room temperature (RT) protein crystallography. We dis-\ncuss what the observables are, what they tell us about structure and dynamics, what makes them\nuseful for assessing force \ufb01eld accuracy, and how they can be connected to molecular dynamics\nsimulations carried out using the force \ufb01eld one wishes to benchmark. We also touch on statistical\nissues that arise when comparing simulations with experiment. We hope this article will be partic-\nularly useful to computational researchers and trainees who develop, benchmark, or use protein\nforce \ufb01elds for molecular simulations.\n*For correspondence:\nchapin.cavender@openforcefield.org (CEC); mgilson@health.ucsd.edu (MKG)\n1 of 46\narXiv:2303.11056v2  [q-bio.BM]  25 Mar 2025\nContents"}, {"group": "Science and Technology", "id": 202, "label": "Temporal-Guided Spiking Neural Networks for Event-Based Human Action Recognition", "shape": "dot", "size": 10, "title": "Authors: Siyuan Yang, Shilin Lu, Shizheng Wang, Meng Hwa Er, Zengwei Zheng, Alex C. Kot, shilin, emher\u003cbr\u003eYear: 2021\u003cbr\u003eAbstract: \u2014This paper explores the promising interplay between\nspiking neural networks (SNNs) and event-based cameras for\nprivacy-preserving human action recognition (HAR). The unique\nfeature of event cameras in capturing only the outlines of motion,\ncombined with SNNs\u2019 proficiency in processing spatiotemporal\ndata through spikes, establishes a highly synergistic compatibility\nfor event-based HAR. Previous studies, however, have been lim-\nited by SNNs\u2019 ability to process long-term temporal information,\nessential for precise HAR. In this paper, we introduce two\nnovel frameworks to address this: temporal segment-based SNN\n(TS-SNN) and 3D convolutional SNN (3D-SNN). The TS-SNN\nextracts long-term temporal information by dividing actions into\nshorter segments, while the 3D-SNN replaces 2D spatial elements\nwith 3D components to facilitate the transmission of temporal\ninformation. To promote further research in event-based HAR,\nwe create a dataset, FallingDetection-CeleX, collected using the\nhigh-resolution CeleX-V event camera (1280 \u00d7 800), comprising\n7 distinct actions. Extensive experimental results show that\nour proposed frameworks surpass state-of-the-art SNN methods\non our newly collected dataset and three other neuromorphic\ndatasets, showcasing their effectiveness in handling long-range\ntemporal information for event-based HAR.\nI."}, {"group": "Game Theory", "id": 203, "label": "Tensor dynamic conditional correlation model: A new way to pursuit \u201cHoly Grail of investing\u201d", "shape": "dot", "size": 10, "title": "Authors: Cheng Yu, Zhoufan Zhu, Ke Zhu\u003cbr\u003eYear: 2012\u003cbr\u003eAbstract: Style investing creates asset classes (or the so-called \u201cstyles\u201d) with low correlations,\naligning well with the principle of \u201cHoly Grail of investing\u201d in terms of portfolio selec-\ntion. The returns of styles naturally form a tensor-valued time series, which requires\nnew tools for studying the dynamics of the conditional correlation matrix to facilitate\nthe aforementioned principle. Towards this goal, we introduce a new tensor dynamic\nconditional correlation (TDCC) model, which is based on two novel treatments: trace-\nnormalization and dimension-normalization. These two normalizations adapt to the\ntensor nature of the data, and they are necessary except when the tensor data reduce\nto vector data. Moreover, we provide an easy-to-implement estimation procedure for\nthe TDCC model, and examine its finite sample performance by simulations. Finally,\nwe assess the usefulness of the TDCC model in international portfolio selection across\nten global markets and in large portfolio selection for 1800 stocks from the Chinese\nstock market.\nKeywords:\nHoly Grail of investing; Multi-way conditional heteroskedasticity; Portfolio\nselection; Style investing; Tensor dynamic conditional correlation model; Tensor-valued time\nseries\n1\narXiv:2502.13461v1  [q-fin.PM]  19 Feb 2025"}, {"group": "Structural Biology", "id": 204, "label": "The diffusive dynamics and electrochemical regulation of weak polyelectrolytes across University College London, Department of Mathematics,", "shape": "dot", "size": 10, "title": "Authors: Giulia L Celora\u2217, Ralf Blossey\u2020, Flory, Voornand Overbeck\u003cbr\u003eYear: 2018\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Structural Biology", "id": 205, "label": "The effective use of BLAS interface for implementation of finite-element ADER-DG and finite-volume ADER-WENO methods", "shape": "dot", "size": 10, "title": "Authors: Popov, Titarev, Toro, Titarev, Toro, Dumbser, Dumbser, Euler, Zhao, Gaburro, Han Veiga, Riemann, Kronecker\u003cbr\u003eYear: 2014\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Theoretical Physics", "id": 206, "label": "The empirical copula process in high dimensions: Stute\u2019s representation and", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2015\u003cbr\u003eAbstract: Te empirical copula process, a fundamental tool for copula inference, is studied in the high\ndimensional regime where the dimension is allowed to grow to in\ufb01nity exponentially in the\nsample size. Under natural, weak smoothness assumptions on the underlying copula, it is\nshown that Stute\u2019s representation is valid in the following sense: all low-dimensional margins\nof \ufb01xed dimension of the empirical copula process can be approximated by a functional of the\nlow-dimensional margins of the standard empirical process, with the almost sure error term\nbeing uniform in the margins. Te result has numerous potential applications, and is exem-\nplary applied to the problem of testing pairwise stochastic independence in high dimensions,\nleading to various extensions of recent results in the literature: for certain test statistics based\non pairwise association measures, type-I error control is obtained for models beyond mutual\nindependence. Moreover, bootstrap-based critical values are shown to yield strong control of\nthe familywise error rate for a large class of data generating processes.\nKeywords. High dimensional statistics; Kendall\u2019s tau; Multiplier bootstrap; Rank-based inference;\nSpearman\u2019s rho; Testing independence.\nMSC subject classi\ufb01cations. Primary 62G20, 62H05; secondary 62G09.\n1."}, {"group": "Theoretical Physics", "id": 207, "label": "arXiv:2503.15894v2  [math.PR]  21 Mar 2025", "shape": "dot", "size": 10, "title": "Authors: Matsui\u003cbr\u003eYear: 2015\u003cbr\u003eAbstract: . We consider a borderline case: the central limit theorem for a strictly stationary time\nseries with in\ufb01nite variance but a Gaussian limit. In the iid case a well-known su\ufb03cient condition\nfor this central limit theorem is regular variation of the marginal distribution with tail index \u03b1 = 2.\nIn the dependent case we assume the stronger condition of sequential regular variation of the time\nseries with tail index \u03b1 = 2. We assume that a sample of size n from this time series can be split into\nkn blocks of size rn \u2192\u221esuch that rn/n \u21920 as n \u2192\u221eand that the block sums are asymptotically\nindependent. Then we apply classical central limit theory for row-wise iid triangular arrays. The\nnecessary and su\ufb03cient conditions for such independent block sums will be veri\ufb01ed by using large\ndeviation results for the time series. We derive the central limit theorem for m-dependent sequences,\nlinear processes, stochastic volatility processes and solutions to a\ufb03ne stochastic recurrence equations\nwhose marginal distributions have in\ufb01nite variance and are regularly varying with tail index \u03b1 = 2.\nMSC2020 subject classi\ufb01cations: Primary 60F05; Secondary 60E10 60G70 62E20\nKeywords and phrases: Regularly varying time series, Gaussian central limit theorem, in\ufb01nite variance, linear\nprocess, stochastic volatility, a\ufb03ne stochastic recurrence equation\n1."}, {"group": "Theoretical Physics", "id": 208, "label": "The Limits of Assumption-free Tests for Algorithm Performance Yuetian Luo\u2217and Rina Foygel Barber\u2020", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2010\u003cbr\u003eAbstract: Algorithm evaluation and comparison are fundamental questions in machine learning and\nstatistics\u2014how well does an algorithm perform at a given modeling task, and which algorithm\nperforms best?\nMany methods have been developed to assess algorithm performance, often\nbased around cross-validation type strategies, retraining the algorithm of interest on di\ufb00erent\nsubsets of the data and assessing its performance on the held-out data points. Despite the broad\nuse of such procedures, the theoretical properties of these methods are not yet fully understood.\nIn this work, we explore some fundamental limits for answering these questions with limited\namounts of data. In particular, we make a distinction between two questions: how good is an\nalgorithm A at the problem of learning from a training set of size n, versus, how good is a\nparticular \ufb01tted model produced by running A on a particular training data set of size n?\nOur main results prove that, for any test that treats the algorithm A as a \u201cblack box\u201d (i.e.,\nwe can only study the behavior of A empirically), there is a fundamental limit on our ability to\ncarry out inference on the performance of A, unless the number of available data points N is\nmany times larger than the evaluation sample size n of interest. (On the other hand, evaluating\nthe performance of a particular \ufb01tted model is easy as long as a holdout data set is available\u2014\nthat is, as long as N \u2212n is not too small.) We also ask whether an assumption of algorithmic\nstability might be su\ufb03cient to circumvent this hardness result. Surprisingly, we \ufb01nd that the\nsame hardness result still holds for the problem of evaluating the performance of A, aside from\na high-stability regime where \ufb01tted models are essentially nonrandom. Finally, we also establish\nsimilar hardness results for the problem of comparing multiple algorithms."}, {"group": "
