out fee provided that copies are not made or distributed\nfor profit or commercial advantage and that copies bear this notice and the full citation\non the first page. Copyrights for components of this work owned by others than the\nauthor(s) must be honored. Abstracting with credit is permitted. To copy otherwise, or\nrepublish, to post on servers or to redistribute to lists, requires prior specific permission\nand/or a fee. Request permissions from permissions@acm.org.\nACM MM, 2024, Melbourne, Australia\n\u00a9 2024 Copyright held by the owner/author(s). Publication rights licensed to ACM.\nACM ISBN 978-x-xxxx-xxxx-x/YY/MM\nhttps://doi.org/10.1145/nnnnnnn.nnnnnnn"}, {"group": "Natural Language Processing", "id": 259, "label": "Sequential Compositional Generalization in Multimodal Models", "shape": "dot", "size": 10, "title": "Authors: Semih Yagcioglu, Osman Batur, Aykut Erdem, Erkut Erdem, Deniz Yuret\u003cbr\u003eYear: 2014\u003cbr\u003eAbstract: The rise of large-scale multimodal models\nhas paved the pathway for groundbreaking ad-\nvances in generative modeling and reasoning,\nunlocking transformative applications in a va-\nriety of complex tasks. However, a pressing\nquestion that remains is their genuine capabil-\nity for stronger forms of generalization, which\nhas been largely underexplored in the multi-\nmodal setting. Our study aims to address this\nby examining sequential compositional gen-\neralization using COMPACT (Compositional\nActivities)1, a carefully constructed, perceptu-\nally grounded dataset set within a rich backdrop\nof egocentric kitchen activity videos. Each\ninstance in our dataset is represented with a\ncombination of raw video footage, naturally\noccurring sound, and crowd-sourced step-by-\nstep descriptions. More importantly, our setup\nensures that the individual concepts are consis-\ntently distributed across training and evaluation\nsets, while their compositions are novel in the\nevaluation set. We conduct a comprehensive as-\nsessment of several unimodal and multimodal\nmodels. Our findings reveal that bi-modal and\ntri-modal models exhibit a clear edge over their\ntext-only counterparts. This highlights the im-\nportance of multimodality while charting a tra-\njectory for future research in this domain."}, {"group": "Natural Language Processing", "id": 260, "label": "Enhance Robustness of Language Models Against Variation Attack through Graph Integration", "shape": "dot", "size": 10, "title": "Authors: Lizhi Qing, Yangyang Kang, Jiawei Liu, Hongsong Li, Changlong Sun, Xiaozhong Liu, Wei Lu, yangyang.kangyy\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: The widespread use of pre-trained language models (PLMs) in natural language processing (NLP) has greatly\nimproved performance outcomes. However, these models\u2019 vulnerability to adversarial attacks (e.g., camouflaged\nhints from drug dealers), particularly in the Chinese language with its rich character diversity/variation and complex\nstructures, hatches vital apprehension.\nIn this study, we propose a novel method, CHinese vAriatioN Graph\nEnhancement (CHANGE), to increase the robustness of PLMs against character variation attacks in Chinese\ncontent. CHANGE presents a novel approach for incorporating a Chinese character variation graph into the PLMs.\nThrough designing different supplementary tasks utilizing the graph structure, CHANGE essentially enhances PLMs\u2019\ninterpretation of adversarially manipulated text. Experiments conducted in a multitude of NLP tasks show that\nCHANGE outperforms current language models in combating against adversarial attacks and serves as a valuable\ncontribution to robust language model research. These findings contribute to the groundwork on robust language\nmodels and highlight the substantial potential of graph-guided pre-training strategies for real-world applications.\nKeywords: PLMs, Chinese adversarial attacks, variation graph\n1."}, {"group": "Media Studies", "id": 261, "label": "Exploring Boundaries and Intensities in Offensive and Hate Speech: Unveiling the Complex Spectrum of Social Media Discourse", "shape": "dot", "size": 10, "title": "Authors: Abinew Ali Ayele, Esubalew Alemneh Jalew, Adem Chanie Ali, Seid Muhie Yimam, Chris Biemann\u003cbr\u003eYear: 2016\u003cbr\u003eAbstract: The prevalence of digital media and evolving sociopolitical dynamics have significantly amplified the dissemination\nof hateful content. Existing studies mainly focus on classifying texts into binary categories, often overlooking the\ncontinuous spectrum of offensiveness and hatefulness inherent in the text. In this research, we present an extensive\nbenchmark dataset for Amharic, comprising 8,258 tweets annotated for three distinct tasks: category classification,\nidentification of hate targets, and rating offensiveness and hatefulness intensities. Our study highlights that a\nconsiderable majority of tweets belong to the less offensive and less hate intensity levels, underscoring the need for\nearly interventions by stakeholders. The prevalence of ethnic and political hatred targets, with significant overlaps in\nour dataset, emphasizes the complex relationships within Ethiopia\u2019s sociopolitical landscape. We build classification\nand regression models and investigate the efficacy of models in handling these tasks. Our results reveal that hate and\noffensive speech can not be addressed by a simplistic binary classification, instead manifesting as variables across a\ncontinuous range of values. The Afro-XLMR-large model exhibits the best performances achieving F1-scores of\n75.30%, 70.59%, and 29.42% for the category, target, and regression tasks, respectively. The 80.22% correlation\ncoefficient of the Afro-XLMR-large model indicates strong alignments.\nKeywords: Intensity, Hatefulness, Offensiveness, Rating scale\n1."}, {"group": "Natural Language Processing", "id": 262, "label": "Constituents Correspond to Word Sequence Patterns among Sentences with Equivalent Predicate-Argument Structures: Unsupervised Constituency", "shape": "dot", "size": 10, "title": "Authors: Junjie Chen, Xiangheng He, Danushka Bollegala, Yusuke Miyao\u003cbr\u003eYear: 2010\u003cbr\u003eAbstract: Unsupervised constituency parsing is about\nidentifying word sequences that form a syn-\ntactic unit (i.e., constituents) in a target sen-\ntence. Linguists identify the constituent by\nevaluating a set of Predicate-Argument Struc-\nture (PAS) equivalent sentences where we find\nthe constituent corresponds to frequent word\nsequences. However, such information is un-\navailable to previous parsing methods which\nidentify the constituent by observing sentences\nwith diverse PAS. In this study, we empirically\nverify that constituents correspond to word\nsequence patterns in the PAS-equivalent sen-\ntence set.\nWe propose a frequency-based\nmethod span-overlap, applying the word se-\nquence pattern to computational unsupervised\nparsing for the first time.\nParsing experi-\nments show that the span-overlap parser out-\nperforms state-of-the-art parsers in eight out\nof ten languages. Further discrimination analy-\nsis confirms that the span-overlap method can\nnon-trivially separate constituents from non-\nconstituents. This result highlights the util-\nity of the word sequence pattern. Addition-\nally, we discover a multilingual phenomenon:\nparticipant-denoting constituents are more\nfrequent than event-denoting constituents.\nThe phenomenon indicates a behavioral differ-\nence between the two constituent types, laying\nthe foundation for future labeled unsupervised\nparsing."}, {"group": "Speech Processing", "id": 263, "label": "TIMIT Speaker Profiling: A Comparison of Multi-task learning and Single-task learning Approaches", "shape": "dot", "size": 10, "title": "Authors: Rong Wang, Kun Sun\u003cbr\u003eYear: 2018\u003cbr\u003eAbstract: This study employs deep learning techniques to ex-\nplore four speaker profiling tasks on the TIMIT\ndataset, namely gender classification, accent clas-\nsification, age estimation, and speaker identification,\nhighlighting the potential and challenges of multi-\ntask learning versus single-task models. The motiva-\ntion for this research is twofold: firstly, to empirically\nassess the advantages and drawbacks of multi-task\nlearning over single-task models in the context of\nspeaker profiling; secondly, to emphasize the undi-\nminished significance of skillful feature engineering\nfor speaker recognition tasks. The findings reveal\nchallenges in accent classification, and multi-task\nlearning is found advantageous for tasks of similar\ncomplexity. Non-sequential features are favored for\nspeaker recognition, but sequential ones can serve as\nstarting points for complex models. The study under-\nscores the necessity of meticulous experimentation\nand parameter tuning for deep learning models."}, {"group": "Speech Processing", "id": 264, "label": "Enhancing Suicide Risk Assessment: A Speech-Based Automated Approach in Emergency Medicine", "shape": "dot", "size": 10, "title": "Authors: Maurice Gerczuk, Justina Lutz, Wolfgang Strube, Irina Papazova, Alkomiet Hasan, Alexander Kathan, Bj\u00a8orn W. Schuller\u003cbr\u003eYear: 2020\u003cbr\u003eAbstract: \u2014 The delayed access to specialized psychiatric\nassessments and care for patients at risk of suicidal tendencies\nin emergency departments creates a notable gap in timely\nintervention, hindering the provision of adequate mental health\nsupport during critical situations. To address this, we present\na non-invasive, speech-based approach for automatic suicide\nrisk assessment. For our study, we have collected a novel\ndataset of speech recordings from 20 patients from which we\nextract three sets of features, including wav2vec, interpretable\nspeech and acoustic features, and deep learning-based spectral\nrepresentations. We proceed by conducting a binary classification\nto assess suicide risk in a leave-one-subject-out fashion. Our\nmost effective speech model achieves a balanced accuracy of\n66.2 %. Moreover, we show that integrating our speech model\nwith a series of patients\u2019 metadata, such as the history of suicide\nattempts or access to firearms, improves the overall result. The\nmetadata integration yields a balanced accuracy of 94.4 %,\nmarking an absolute improvement of 28.2 %, demonstrating the\nefficacy of our proposed approaches for automatic suicide risk\nassessment in emergency medicine.\nI."}, {"group": "Natural Language Processing", "id": 265, "label": "FECTEK: ENHANCING TERM WEIGHT IN LEXICON-BASED RETRIEVAL WITH FEATURE CONTEXT AND TERM-LEVEL", "shape": "dot", "size": 10, "title": "Authors: ShenZhen, ShenZhen, Shen, ShenZhen, ShenZhen\u003cbr\u003eYear: 2010\u003cbr\u003eAbstract: Lexicon-based retrieval has gained siginificant popularity in text retrieval due to its efficient and\nrobust performance. To further enhance performance of lexicon-based retrieval, researchers have\nbeen diligently incorporating state-of-the-art methodologies like Neural retrieval and text-level\ncontrastive learning approaches. Nonetheless, despite the promising outcomes, current lexicon-based\nretrieval methods have received limited attention in exploring the potential benefits of feature context\nrepresentations and term-level knowledge guidance. In this paper, we introduce an innovative method\nby introducing FEature Context and TErm-level Knowledge modules(FecTek). To effectively enrich\nthe feature context representations of term weight, the Feature Context Module (FCM) is introduced,\nwhich leverages the power of BERT\u2019s representation to determine dynamic weights for each element\nin the embedding. Additionally, we develop a term-level knowledge guidance module (TKGM) for\neffectively utilizing term-level knowledge to intelligently guide the modeling process of term weight.\nEvaluation of the proposed method on MS Marco benchmark demonstrates its superiority over the\nprevious state-of-the-art approaches."}, {"group": "Natural Language Processing", "id": 267, "label": "Claim Check-Worthiness Detection: How Well do LLMs Grasp Annotation Guidelines?", "shape": "dot", "size": 10, "title": "Authors: Laura Majer, Jan \u0160najder, laura.majer\u003cbr\u003eYear: 2019\u003cbr\u003eAbstract: The increasing threat of disinformation calls\nfor automating parts of the fact-checking\npipeline.\nIdentifying text segments requir-\ning fact-checking is known as claim detec-\ntion (CD) and claim check-worthiness detection\n(CW), the latter incorporating complex domain-\nspecific criteria of worthiness and often framed\nas a ranking task. Zero- and few-shot LLM\nprompting is an attractive option for both tasks,\nas it bypasses the need for labeled datasets and\nallows verbalized claim and worthiness criteria\nto be directly used for prompting. We evaluate\nthe LLMs\u2019 predictive and calibration accuracy\non five CD/CW datasets from diverse domains,\neach utilizing a different worthiness criterion.\nWe investigate two key aspects: (1) how best\nto distill factuality and worthiness criteria into\na prompt and (2) what amount of context to\nprovide for each claim. To this end, we experi-\nment with varying the level of prompt verbosity\nand the amount of contextual information pro-\nvided to the model. Our results show that op-\ntimal prompt verbosity is domain-dependent,\nadding context does not improve performance,\nand confidence scores can be directly used to\nproduce reliable check-worthiness rankings."}, {"group": "Natural Language Processing", "id": 268, "label": "EuSQuAD: Automatically Translated Autom\u00e1ticamente para Euskera", "shape": "dot", "size": 10, "title": "Authors: EuskeraAitor Garc\u00eda-Pablos, \u2217Naiara, Jaione Bengoetxea\u003cbr\u003eYear: 2018\u003cbr\u003eAbstract: : The widespread availability of Question Answering (QA) datasets in\nEnglish has greatly facilitated the advancement of the Natural Language Processing\n(NLP) field. However, the scarcity of such resources for minority languages, such\nas Basque, poses a substantial challenge for these communities. In this context, the\ntranslation and alignment of existing QA datasets plays a crucial role in narrowing\nthis technological gap. This work presents EuSQuAD, the first initiative dedicated\nto automatically translating and aligning SQuAD2.0 into Basque, resulting in more\nthan 142k QA examples.\nWe demonstrate EuSQuAD\u2019s value through extensive\nqualitative analysis and QA experiments supported with EuSQuAD as training data.\nThese experiments are evaluated with a new human-annotated dataset.\nKeywords: question answering, reading comprehension, Basque, SQuAD\nResumen: La amplia disponibilidad de conjuntos de datos de preguntas y respues-\ntas en ingl\u00e9s ha facilitado en gran medida el avance del campo de Procesamiento\nde Lenguaje Natural (PLN). Sin embargo, la escasez de tales recursos para idiomas\nminoritarios, como el euskera, plantea un desaf\u00edo sustancial para estas comunida-\ndes. En este contexto, la traducci\u00f3n y alineaci\u00f3n de conjuntos de datos desempe\u00f1a\nun papel crucial en la reducci\u00f3n de esta brecha tecnol\u00f3gica. Este trabajo presen-\nta EuSQuAD, la primera iniciativa dedicada a traducir y alinear autom\u00e1ticamente\nSQuAD2.0 al euskera. Demostramos el valor de EuSQuAD a trav\u00e9s de un extenso\nan\u00e1lisis cualitativo y experimentos de QA, para los cuales se ha creado adem\u00e1s un\nnuevo dataset anotado por humanos.\nPalabras clave: pregunta-respuesta, comprensi\u00f3n lectora, euskera, SQuAD"}, {"group": "Natural Language Processing", "id": 269, "label": "Length Generalization of Causal Transformers without Position Encoding", "shape": "dot", "size": 10, "title": "Authors: Jie Wang, Tao Ji, Yuanbin Wu, Hang Yan, Tao Gui, Qi Zhang, Xuanjing Huang, Xiaoling Wang\u003cbr\u003eYear: 2013\u003cbr\u003eAbstract: Generalizing to longer sentences is important\nfor recent Transformer-based language mod-\nels. Besides algorithms manipulating explicit\nposition features, the success of Transform-\ners without position encodings (NoPE) pro-\nvides a new way to overcome the challenge.\nIn this paper, we study the length generaliza-\ntion property of NoPE. We find that although\nNoPE can extend to longer sequences than\nthe commonly used explicit position encod-\nings, it still has a limited context length. We\nidentify a connection between the failure of\nNoPE\u2019s generalization and the distraction of at-\ntention distributions. We propose a parameter-\nefficient tuning for searching attention heads\u2019\nbest temperature hyper-parameters, which sub-\nstantially expands NoPE\u2019s context size. Experi-\nments on long sequence language modeling, the\nsynthetic passkey retrieval task and real-world\nlong context tasks show that NoPE can achieve\ncompetitive performances with state-of-the-art\nlength generalization algorithms. The source\ncode is publicly accessible1."}, {"group": "Natural Language Processing", "id": 270, "label": "Advancing the Robustness of Large Language Models through Self-Denoised Smoothing", "shape": "dot", "size": 10, "title": "Authors: Bairu Hou\u2217, Zhen Zhang\u2217, Guanhua Zhang\u2217, Wenqi Fan, Qing Li, Yang Zhang, Gaowen Liu, Sijia Liu, Shiyu Chang, Santa Barbara\u003cbr\u003eYear: 2019\u003cbr\u003eAbstract: Although large language models (LLMs) have\nachieved significant success, their vulnerabil-\nity to adversarial perturbations, including re-\ncent jailbreak attacks, has raised considerable\nconcerns.\nHowever, the increasing size of\nthese models and their limited access make\nimproving their robustness a challenging task.\nAmong various defense strategies, random-\nized smoothing has shown great potential for\nLLMs, as it does not require full access to the\nmodel\u2019s parameters or fine-tuning via adver-\nsarial training. However, randomized smooth-\ning involves adding noise to the input before\nmodel prediction, and the final model\u2019s ro-\nbustness largely depends on the model\u2019s per-\nformance on these noise corrupted data. Its\neffectiveness is often limited by the model\u2019s\nsub-optimal performance on noisy data. To\naddress this issue, we propose to leverage the\nmultitasking nature of LLMs to first denoise\nthe noisy inputs and then to make predictions\nbased on these denoised versions.\nWe call\nthis procedure self-denoised smoothing. Un-\nlike previous denoised smoothing techniques\nin computer vision, which require training a\nseparate model to enhance the robustness of\nLLMs, our method offers significantly better\nefficiency and flexibility. Our experimental\nresults indicate that our method surpasses ex-\nisting methods in both empirical and certified\nrobustness in defending against adversarial at-\ntacks for both downstream tasks and human\nalignments (i.e., jailbreak attacks). Our code\nis publicly available at https://github.\ncom/UCSB-NLP-Chang/SelfDenoise."}, {"group": "Natural Language Processing", "id": 271, "label": "Resilience through Scene Context in Visual Referring Expression Simeon Junker and Sina Zarrie\u00df", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2021\u003cbr\u003eAbstract: Scene context is well known to facilitate hu-\nmans\u2019 perception of visible objects. In this pa-\nper, we investigate the role of context in Refer-\nring Expression Generation (REG) for objects\nin images, where existing research has often fo-\ncused on distractor contexts that exert pressure\non the generator. We take a new perspective\non scene context in REG and hypothesize that\ncontextual information can be conceived of as a\nresource that makes REG models more resilient\nand facilitates the generation of object descrip-\ntions, and object types in particular. We train\nand test Transformer-based REG models with\ntarget representations that have been artificially\nobscured with noise to varying degrees. We\nevaluate how properties of the models\u2019 visual\ncontext affect their processing and performance.\nOur results show that even simple scene con-\ntexts make models surprisingly resilient to per-\nturbations, to the extent that they can identify\nreferent types even when visual information\nabout the target is completely missing."}, {"group": "Natural Language Processing", "id": 272, "label": "Augmenting emotion features in irony detection with Large language modeling", "shape": "dot", "size": 10, "title": "Authors: Yucheng Lin, Yuhan Xia\u003cbr\u003eYear: 2020\u003cbr\u003eAbstract: . This study introduces a novel method for irony detection, applying \nLarge Language Models (LLMs) with prompt-based learning to facilitate \nemotion-centric text augmentation. Traditional irony detection techniques \ntypically fall short due to their reliance on static linguistic features and predefined \nknowledge bases, often overlooking the nuanced emotional dimensions integral \nto irony. In contrast, our methodology augments the detection process by \nintegrating subtle emotional cues, augmented through LLMs, into three \nbenchmark pre-trained NLP models\u2014BERT, T5, and GPT-2\u2014which are widely \nrecognized as foundational in irony detection. We assessed our method using the \nSemEval-2018 Task 3 dataset and observed substantial enhancements in irony \ndetection capabilities. \nKeywords: Irony Detection, Text Augmentation, Large Language Modeling"}, {"group": "Speech Processing", "id": 273, "label": "Simultaneous Interpretation Corpus Construction by Large Language Models in Distant Language Pair", "shape": "dot", "size": 10, "title": "Authors: Mana Makinae\u2217, Hidetaka Kamigaito\u003cbr\u003eYear: 2017\u003cbr\u003eAbstract: In Simultaneous Machine Translation (SiMT)\nsystems, training with a simultaneous interpre-\ntation (SI) corpus is an effective method for\nachieving high-quality yet low-latency systems.\nHowever, it is very challenging to curate such\na corpus due to limitations in the abilities of\nannotators, and hence, existing SI corpora are\nlimited. Therefore, we propose a method to\nconvert existing speech translation corpora into\ninterpretation-style data, maintaining the origi-\nnal word order and preserving the entire source\ncontent using Large Language Models (LLM-\nSI-Corpus). We demonstrate that fine-tuning\nSiMT models in text-to-text and speech-to-text\nsettings with the LLM-SI-Corpus reduces laten-\ncies while maintaining the same level of qual-\nity as the models trained with offline datasets.\nThe LLM-SI-Corpus is available at https://\ngithub.com/yusuke1997/LLM-SI-Corpus."}, {"group": "Natural Language Processing", "id": 274, "label": "Reward Model Transfer for Zero-Shot Cross-Lingual Alignment Zhaofeng Wu\u00e3 Ananth Balashankar\u00e5 Yoon Kim\u00e3 Jacob Eisenstein", "shape": "dot", "size": 10, "title": "Authors: Ahmad Beirami\u00e5\u003cbr\u003eYear: 2014\u003cbr\u003eAbstract: Aligning language models (LMs) based on\nhuman-annotated preference data is a crucial\nstep in obtaining practical and performant LM-\nbased systems. However, multilingual human\npreference data are difficult to obtain at scale,\nmaking it challenging to extend this frame-\nwork to diverse languages. In this work, we\nevaluate a simple approach for zero-shot cross-\nlingual alignment, where a reward model is\ntrained on preference data in one source lan-\nguage and directly applied to other target lan-\nguages. On summarization and open-ended\ndialog generation, we show that this method is\nconsistently successful under comprehensive\nevaluation settings, including human evalua-\ntion: cross-lingually aligned models are pre-\nferred by humans over unaligned models on up\nto \u003e70% of evaluation instances. We moreover\nfind that a different-language reward model\nsometimes yields better aligned models than\na same-language reward model. We also iden-\ntify best practices when there is no language-\nspecific data for even supervised finetuning,\nanother component in alignment."}, {"group": "Natural Language Processing", "id": 275, "label": "Language-Based Augmentation to Address Shortcut Learning in Object-Goal Navigation", "shape": "dot", "size": 10, "title": "Authors: Dennis Hoftijzer, Gertjan Burghouts, Luuk Spreeuwers\u003cbr\u003eYear: 2015\u003cbr\u003eAbstract: \u2014Deep Reinforcement Learning (DRL) has shown\ngreat potential in enabling robots to find certain objects (e.g.,\n\u2018find a fridge\u2019) in environments like homes or schools. This task\nis known as Object-Goal Navigation (ObjectNav). DRL methods\nare predominantly trained and evaluated using environment\nsimulators. Although DRL has shown impressive results, the\nsimulators may be biased or limited. This creates a risk of\nshortcut learning, i.e., learning a policy tailored to specific\nvisual details of training environments. We aim to deepen our\nunderstanding of shortcut learning in ObjectNav, its implications\nand propose a solution. We design an experiment for inserting\na shortcut bias in the appearance of training environments.\nAs a proof-of-concept, we associate room types to specific wall\ncolors (e.g., bedrooms with green walls), and observe poor\ngeneralization of a state-of-the-art (SOTA) ObjectNav method\nto environments where this is not the case (e.g., bedrooms with\nblue walls). We find that shortcut learning is the root cause: the\nagent learns to navigate to target objects, by simply searching\nfor the associated wall color of the target object\u2019s room. To\nsolve this, we propose Language-Based (L-B) augmentation. Our\nkey insight is that we can leverage the multimodal feature\nspace of a Vision-Language Model (VLM) to augment visual\nrepresentations directly at the feature-level, requiring no changes\nto the simulator, and only an addition of one layer to the model.\nWhere the SOTA ObjectNav method\u2019s success rate drops 69%,\nour proposal has only a drop of 23%. Code is available at\nhttps://github.com/Dennishoftijzer/L-B Augmentation\nIndex Terms\u2014Vision-based Navigation, Deep Reinforcement\nLearning, Vision-Language\nI."}, {"group": "Structural Biology", "id": 276, "label": "MetroGNN: Metro Network Expansion with Reinforcement Learning", "shape": "dot", "size": 10, "title": "Authors: Yu Zheng, Jingtao Ding, Depeng Jin, Yong Li\u2217\u003cbr\u003eYear: 2016\u003cbr\u003eAbstract: Selecting urban regions for metro network expansion to meet maxi-\nmal transportation demands is crucial for urban development, while\ncomputationally challenging to solve. The expansion process re-\nlies not only on complicated features like urban demographics\nand origin-destination (OD) flow but is also constrained by the\nexisting metro network and urban geography. In this paper, we\nintroduce a reinforcement learning framework to address a Markov\ndecision process within an urban heterogeneous multi-graph. Our\napproach employs an attentive policy network that intelligently\nselects nodes based on information captured by a graph neural net-\nwork. Experiments on real-world urban data demonstrate that our\nproposed methodology substantially improve the satisfied trans-\nportation demands by over 30% when compared with state-of-the-\nart methods. Codes are published at https://github.com/tsinghua-\nfib-lab/MetroGNN.\nCCS CONCEPTS\n\u2022 Computing methodologies \u2192Planning and scheduling;\nReinforcement learning.\nKEYWORDS\nmetro network, reinforcement learning, graph neural networks\nACM Reference Format:\nHongyuan Su, Yu Zheng, Jingtao Ding, Depeng Jin, and Yong Li. 2024.\nMetroGNN: Metro Network Expansion with Reinforcement Learning. In\nCompanion Proceedings of the ACM Web Conference 2024 (WWW \u201924 Com-\npanion), May 13\u201317, 2024, Singapore, Singapore. ACM, New York, NY, USA,\n4 pages. https://doi.org/10.1145/3589335.3651536\n\u2217Corresponding author (liyong07@tsinghua.edu.cn).\nPermission to make digital or hard copies of part or all of this work for personal or\nclassroom use is granted without fee provided that copies are not made or distributed\nfor profit or commercial advantage and that copies bear this notice and the full citation\non the first page. Copyrights for third-party components of this work must be honored.\nFor all other uses, contact the owner/author(s).\nWWW \u201924 Companion, May 13\u201317, 2024, Singapore, Singapore\n\u00a9 2024 Copyright held by the owner/author(s).\nACM ISBN 979-8-4007-0172-6/24/05.\nhttps://doi.org/10.1145/3589335.3651536"}, {"group": "Structural Biology", "id": 277, "label": "An Extensive Comparison of Static Application Security Testing Tools", "shape": "dot", "size": 10, "title": "Authors: Matteo Esposito, Valentina Falaschi, Davide Falessi\u003cbr\u003eYear: 2022\u003cbr\u003eAbstract: Context: Static Application Security Testing Tools (SASTTs) iden-\ntify software vulnerabilities to support the security and reliability of\nsoftware applications. Interestingly, several studies have suggested\nthat alternative solutions may be more effective than SASTTs due\nto their tendency to generate false alarms, commonly referred to as\nlow Precision. Aim: We aim to comprehensively evaluate SASTTs,\nsetting a reliable benchmark for assessing and finding gaps in vul-\nnerability identification mechanisms based on SASTTs or alterna-\ntives. Method: Our SASTTs evaluation is based on a controlled,\nthough synthetic, Java codebase. It involves an assessment of"}, {"group": "Media Studies", "id": 278, "label": "Gun Culture in Fringe Social Media The increasing frequency of mass shootings in the United", "shape": "dot", "size": 10, "title": "Authors: Fatemeh Tahmasbi, Aakarsha Chug, Barry Bradlyn, Jeremy Blackburn\u003cbr\u003eYear: 2014\u003cbr\u003eAbstract: The increasing frequency of mass shootings in the United\nStates has, unfortunately, become a norm. While the issue of\ngun control in the US involves complex legal concerns, there\nare also societal issues at play. One such social issue is so-\ncalled \u201cgun culture,\u201d i.e., a general set of beliefs and actions\nrelated to gun ownership. However relatively little is known\nabout gun culture, and even less is known when it comes to\nfringe online communities. This is especially worrying con-\nsidering the aforementioned rise in mass shootings and nu-\nmerous instances of shooters being radicalized online.\nTo address this gap, we explore gun culture on /k/, 4chan\u2019s\nweapons board. More specifically, using a variety of quanti-\ntative techniques, we examine over 4M posts on /k/ and posi-\ntion their discussion within the larger body of theoretical un-\nderstanding of gun culture. Among other things, our findings\nsuggest that gun culture on /k/ covers a relatively diverse set\nof topics (with a particular focus on legal discussion), some\nof which are signals of fetishism."}, {"group": "Data Science", "id": 279, "label": "FeatAug: Automatic Feature Augmentation From One-to-Many Relationship Tables", "shape": "dot", "size": 10, "title": "Authors: Danrui Qi, Weiling Zheng, Jiannan Wang, Simon Fraser\u003cbr\u003eYear: 2016\u003cbr\u003eAbstract: \u2014Feature augmentation from one-to-many relation-\nship tables is a critical but challenging problem in ML model\ndevelopment. To augment good features, data scientists need to\ncome up with SQL queries manually, which is time-consuming.\nFeaturetools [1] is a widely used tool by the data science commu-\nnity to automatically augment the training data by extracting\nnew features from relevant tables. It represents each feature\nas a group-by aggregation SQL query on relevant tables and\ncan automatically generate these SQL queries. However, it does\nnot include predicates in these queries, which significantly limits\nits application in many real-world scenarios. To overcome this\nlimitation, we propose FEATAUG, a new feature augmentation\nframework that automatically extracts predicate-aware SQL\nqueries from one-to-many relationship tables. This extension\nis not trivial because considering predicates will exponentially\nincrease the number of candidate queries. As a result, the original\nFeaturetools framework, which materializes all candidate queries,\nwill not work and needs to be redesigned. We formally define the\nproblem and model it as a hyperparameter optimization problem.\nWe discuss how the Bayesian Optimization can be applied here\nand propose a novel warm-up strategy to optimize it. To make our\nalgorithm more practical, we also study how to identify promising\nattribute combinations for predicates. We show that how the\nbeam search idea can partially solve the problem and propose\nseveral techniques to further optimize it. Our experiments on\nfour real-world datasets demonstrate that FeatAug extracts more\neffective features compared to Featuretools and other baselines.\nThe code is open-sourced at https://github.com/sfu-db/FeatAug.\nIndex Terms\u2014automatic feature augmentation, automatic fea-\nture engineering, data preparation, one-to-many relational tables\nI."}, {"group": "Structural Biology", "id": 280, "label": "SFVInt: Simple, Fast and Generic Variable-Length Integer Decoding using Bit Manipulation Instructions", "shape": "dot", "size": 10, "title": "Authors: Gang Liao, Yonghua Ding, Le Cai, Jianjun Chen, ye.liu, yonghua.ding\u003cbr\u003eYear: 2020\u003cbr\u003eAbstract: The ubiquity of variable-length integers in data storage and\ncommunication necessitates efficient decoding techniques. In\nthis paper, we present SFVInt, a simple and fast approach to\ndecode the prevalent Little Endian Base-128 (LEB128) varints.\nOur approach, distilled into a mere 500 lines of code, effec-\ntively utilizes the Bit Manipulation Instruction Set 2 (BMI2)\nin modern Intel and AMD processors, achieving significant\nperformance improvement while maintaining simplicity and\navoiding overengineering. SFVInt, with its generic design,\neffectively processes both 32-bit and 64-bit unsigned inte-\ngers using a unified code template, marking a significant\nleap forward in varint decoding efficiency. We thoroughly\nevaluate SFVInt\u2019s performance across various datasets and\nscenarios, demonstrating that it achieves up to a 2x increase\nin decoding speed when compared to varint decoding meth-\nods used in established frameworks like Facebook Folly and\nGoogle Protobuf."}, {"group": "Data Science", "id": 281, "label": "LIST: Learning to Index Spatio-Textual Data for Embedding based Spatial Keyword Queries", "shape": "dot", "size": 10, "title": "Authors: Ziqi Yin\u2020, Shanshan Feng\u2021, Shang Liu\u2020, Gao Cong\u2020, Yew Soon Ong\u2020\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: \u2014With the proliferation of spatio-textual data, Top-\nk KNN spatial keyword queries (TkQs), which return a list of\nobjects based on a ranking function that evaluates both spatial\nand textual relevance, have found many real-life applications.\nExisting geo-textual indexes for TkQs use traditional retrieval\nmodels like BM25 to compute text relevance and usually exploit\na simple linear function to compute spatial relevance, but its\neffectiveness is limited. To improve effectiveness, several deep\nlearning models have recently been proposed, but they suffer\nsevere efficiency issues. To the best of our knowledge, there are\nno efficient indexes specifically designed to accelerate the top-k\nsearch process for these deep learning models.\nTo tackle these issues, we propose a novel technique, which\nLearns to Index the Spatio-Textual data for answering em-\nbedding based spatial keyword queries (called LIST). LIST\nis featured with two novel components. Firstly, we propose a\nlightweight and effective relevance model that is capable of learn-\ning both textual and spatial relevance. Secondly, we introduce a\nnovel machine learning based Approximate Nearest Neighbor\nSearch (ANNS) index, which utilizes a new learning-to-cluster\ntechnique to group relevant queries and objects together while\nseparating irrelevant queries and objects. Two key challenges\nin building an effective and efficient index are the absence of\nhigh-quality labels and unbalanced clustering results. We develop\na novel pseudo-label generation technique to address the two\nchallenges. Experimental results show that LIST significantly\noutperforms state-of-the-art methods on effectiveness, with im-\nprovements up to 19.21% and 12.79% in terms of NDCG@1\nand Recall@10, and is three orders of magnitude faster than the\nmost effective baseline.\nI."}, {"group": "Structural Biology", "id": 282, "label": "Efficient Fault Tolerance for Pipelined Query Engines via Write-ahead Lineage", "shape": "dot", "size": 10, "title": "Authors: Ziheng Wang, Alex Aiken\u003cbr\u003eYear: 2011\u003cbr\u003eAbstract: \u2014Modern distributed pipelined query engines either\ndo not support intra-query fault tolerance or employ high-\noverhead approaches such as persisting intermediate outputs or\ncheckpointing state. In this work, we present write-ahead lineage,\na novel fault recovery technique that combines Spark\u2019s lineage-\nbased replay and write-ahead logging. Unlike Spark, where\nthe lineage is determined before query execution, write-ahead\nlineage persistently logs lineage at runtime to support dynamic\ntask dependencies in pipelined query engines. Since only KB-\nsized lineages are persisted instead of MB-sized intermediate\noutputs, the normal execution overhead is minimal compared\nto spooling or checkpointing based approaches. To ensure fast\nfault recovery times, tasks only consume intermediate outputs\nwith persisted lineage, preventing global rollbacks upon failure.\nIn addition, lost tasks from different stages can be recovered in\na pipelined parallel manner. We implement write-ahead lineage\nin a distributed pipelined query engine called Quokka. We show\nthat Quokka is around 2x faster than SparkSQL on the TPC-H\nbenchmark with similar fault recovery performance.\nI."}, {"group": "Structural Biology", "id": 283, "label": "arXiv:2403.08375v1  [cs.DB]  13 Mar 2024", "shape": "dot", "size": 10, "title": "Authors: Salwa Alamir, Xiaomo Liu\u003cbr\u003eYear: 2022\u003cbr\u003eAbstract: Migrations of systems from on-site premises to the cloud has been\na fundamental endeavor by many industrial institutions. A crucial\ncomponent of such cloud migrations is the transition of databases\nto be hosted online. In this work, we consider the di\ufb03culties of this\nmigration for SQL databases. While SQL is one of the prominent\nmethods for storing database procedures, there are a plethora of\ndi\ufb00erent SQL dialects (e.g., MySQL, Postgres, etc.) which can com-\nplicate migrations when the on-premise SQL dialect di\ufb00ers to the\ndialect hosted on the cloud. Tools exist by common cloud provides\nsuch as AWS and Azure to aid in translating between dialects in\norder to mitigate the majority of the di\ufb03culties. However, these\ntools do not successfully translate 100% of the code. Consequently,\nsoftware engineers must manually convert the remainder of the\nuntranslated database. For large organizations, this task quickly\nbecomes intractable and so more innovative solutions are required.\nWe consider this challenge a novel yet vital industrial research\nproblem for any large corporation that is considering cloud mi-\ngrations. Furthermore, we introduce potential avenues of research\nto tackle this challenge that have yielded promising preliminary\nresults.\nCCS CONCEPTS\n\u2022 Theory of computation \u2192Database query processing and opti-\nmization (theory); \u2022 Information systems \u2192Cloud based storage;\n\u2022 Computing methodologies \u2192Machine translation.\nKEYWORDS\nCloud Migration, SQL, Code Translation\nACM Reference Format:\nRan Zmigrod, Salwa Alamir, and Xiaomo Liu. 2024. Translating between\nSQL Dialects for Cloud Migration. In 46th International Conference on Soft-\nware Engineering: Software Engineering in Practice (ICSE-SEIP \u201924), April 14\u2013\n20, 2024, Lisbon, Portugal. ACM, New York, NY, USA, 3 pages. https://doi.org/10.1145/3639477.3639727"}, {"group": "Natural Language Processing", "id": 284, "label": "Query Rewriting via Large Language Models", "shape": "dot", "size": 10, "title": "Authors: Jie Liu, Barzan Mozafari\u003cbr\u003eYear: 2015\u003cbr\u003eAbstract: Query rewriting is one of the most effective techniques for coping\nwith poorly written queries before passing them down to the query\noptimizer. Manual rewriting is not scalable, as it is error-prone\nand requires deep expertise. Similarly, traditional query rewriting\nalgorithms can only handle a small subset of queries: rule-based\ntechniques do not generalize to new query patterns and synthesis-\nbased techniques cannot handle complex queries. Fortunately, the\nrise of Large Language Models (LLMs), equipped with broad general\nknowledge and advanced reasoning capabilities, has created hopes\nfor solving some of these previously open problems.\nIn this paper, we present GenRewrite, the first holistic system\nthat leverages LLMs for query rewriting. We introduce the notion of\nNatural Language Rewrite Rules (NLR2s), and use them as hints to\nthe LLM but also a means for transferring knowledge from rewrit-\ning one query to another, and thus becoming smarter and more\neffective over time. We present a novel counterexample-guided\ntechnique that iteratively corrects the syntactic and semantic errors\nin the rewritten query, significantly reducing the LLM costs and the\nmanual effort required for verification. GenRewrite speeds up 22\nout of 99 TPC queries (the most complex public benchmark) by more\nthan 2x, which is 2.5x\u20133.2x higher coverage than state-of-the-art\ntraditional query rewriting and 2.1x higher than the out-of-the-box\nLLM baseline.\nPVLDB Reference Format:\nJie Liu and Barzan Mozafari. Query Rewriting via Large Language Models.\nPVLDB, 14(1): XXX-XXX, 2020.\ndoi:XX.XX/XXX.XX\nPVLDB Artifact Availability:\nThe source code, data, and/or other artifacts have been made available at\nURL_TO_YOUR_ARTIFACTS."}, {"group": "Logic", "id": 285, "label": "ITERATIVE FORGETTING: ONLINE DATA STREAM REGRESSION USING DATABASE-INSPIRED ADAPTIVE GRANULATION \u2217", "shape": "dot", "size": 10, "title": "Authors: Niket Kathiriya, Hossein Haeri, Cindy Chen, Kshitij Jerath\u003cbr\u003eYear: 2010\u003cbr\u003eAbstract: Many modern systems, such as financial, transportation and telecommunications systems, are time-\nsensitive in the sense that they demand low-latency predictions for real-time decision-making. Such\nsystems often have to contend with continuous unbounded data streams as well as concept drift,\nwhich are challenging requirements that traditional regression techniques are unable to cater to. There\nexists a need to create novel data stream regression methods that can handle these scenarios. We\npresent a database-inspired datastream regression model that (a) uses inspiration from R*-trees to\ncreate granules from incoming datastreams such that relevant information is retained, (b) iteratively\nforgets granules whose information is deemed to be outdated, thus maintaining a list of only recent,\nrelevant granules, and (c) uses the recent data and granules to provide low-latency predictions.\nThe R*-tree-inspired approach also makes the algorithm amenable to integration with database\nsystems. Our experiments demonstrate that the ability of this method to discard data produces a\nsignificant order-of-magnitude improvement in latency and training time when evaluated against the\nmost accurate state-of-the-art algorithms, while the R*-tree-inspired granulation technique provides\ncompetitively accurate predictions.\nKeywords Data stream, forgetting, regression, granulation, aggregation, time-sensitive systems, low latency, concept\ndrift"}, {"group": "Data Science", "id": 286, "label": "Schema-Aware Multi-Task Learning for Complex Text-to-SQL", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2018\u003cbr\u003eAbstract: Conventional text-to-SQL parsers are not good\nat synthesizing complex SQL queries that in-\nvolve multiple tables or columns, due to the\nchallenges inherent in identifying the correct\nschema items and performing accurate align-\nment between question and schema items. To\naddress the above issue, we present a schema-\naware multi-task learning framework (named\nMTSQL) for complicated SQL queries. Specif-\nically, we design a schema linking discrimina-\ntor module to distinguish the valid question-\nschema linkings, which explicitly instructs\nthe encoder by distinctive linking relations to\nenhance the alignment quality.\nOn the de-\ncoder side, we define 6-type relationships to\ndescribe the connections between tables and\ncolumns (e.g., WHERE_TC), and introduce\nan operator-centric triple extractor to recognize\nthose associated schema items with the prede-\nfined relationship. Also, we establish a rule set\nof grammar constraints via the predicted triples\nto filter the proper SQL operators and schema\nitems during the SQL generation. On Spider, a\ncross-domain challenging text-to-SQL bench-\nmark, experimental results indicate that MT-\nSQL is more effective than baselines, especially\nin extremely hard scenarios. Moreover, fur-\nther analyses verify that our approach leads to\npromising improvements for complicated SQL\nqueries."}, {"group": "Structural Biology", "id": 287, "label": "Accelerating Regular Path Queries over Graph Database with Processing-in-Memory", "shape": "dot", "size": 10, "title": "Authors: Ruoyan Ma, Shengan Zheng, Guifeng Wang, Jin Pu, Yifan Hua, Wentao Wang, Linpeng Huang\u003cbr\u003eYear: 2020\u003cbr\u003eAbstract: Regular path queries (RPQs) in graph databases are bottlenecked\nby the memory wall. Emerging processing-in-memory (PIM) tech-\nnologies offer a promising solution to dispatch and execute path\nmatching tasks in parallel within PIM modules. We present Mocto-\npus, a PIM-based data management system for graph databases that\nsupports efficient batch RPQs and graph updates. Moctopus em-\nploys a PIM-friendly dynamic graph partitioning algorithm, which\ntackles graph skewness and preserves graph locality with low over-\nhead for RPQ processing. Moctopus enables efficient graph update\nby amortizing the host CPU\u2019s update overhead to PIM modules.\nEvaluation of Moctopus demonstrates superiority over the state-of-\nthe-art traditional graph database.\nKEYWORDS\nRegular Path Query, Processing-in-Memory, path matching, graph\npartition, load balance"}, {"group": "Logic", "id": 288, "label": "Worst-Case Convergence Time of ML Algorithms via  Extreme Value Theory", "shape": "dot", "size": 10, "title": "Authors: Saeid Tizpaz-Niari, Sriram Sankaranarayanan\u003cbr\u003eYear: 2016\u003cbr\u003eAbstract: This paper leverages the statistics of extreme values to predict\nthe worst-case convergence times of machine learning algorithms.\nTiming is a critical non-functional property of ML systems, and\nproviding the worst-case converge times is essential to guarantee\nthe availability of ML and its services. However, timing properties\nsuch as worst-case convergence times (WCCT) are difficult to verify\nsince (1) they are not encoded in the syntax or semantics of under-\nlying programming languages of AI, (2) their evaluations depend\non both algorithmic implementations and underlying systems, and\n(3) their measurements involve uncertainty and noise. Therefore,\nprevalent formal methods and statistical models fail to provide rich\ninformation on the amounts and likelihood of WCCT.\nOur key observation is that the timing information we seek rep-\nresents the extreme tail of execution times. Therefore, extreme\nvalue theory (EVT), a statistical discipline that focuses on under-\nstanding and predicting the distribution of extreme values in the\ntail of outcomes, provides an ideal framework to model and analyze\nWCCT in the training and inference phases of ML paradigm. Build-\ning upon the mathematical tools from EVT, we propose a practical\nframework to predict the worst-case timing properties of ML. Over\na set of linear ML training algorithms, we show that EVT achieves\na better accuracy for predicting WCCTs than relevant statistical\nmethods such as the Bayesian factor. On the set of larger machine\nlearning training algorithms and deep neural network inference,\nwe show the feasibility and usefulness of EVT models to accurately\npredict WCCTs, their expected return periods, and their likelihood.\nACM Reference Format:\nSaeid Tizpaz-Niari and Sriram Sankaranarayanan. 2024. Worst-Case Con-\nvergence Time of ML Algorithms via Extreme Value Theory. In Confer-\nence on AI Engineering - Software Engineering for AI (CAIN 2024), April\n14\u201315, 2024, Lisbon, Portugal. ACM, New York, NY, USA, 11 pages. https:\n//doi.org/10.1145/3644815.3644989"}, {"group": "Structural Biology", "id": 289, "label": "Synthesis via Graph Compilation and Optimization Rishov Sarkar, Rachel Paul, Cong (Callie) Hao", "shape": "dot", "size": 10, "title": "Authors: Rishov Sarkar, Rachel Paul, rishov.sarkar, rachel.paul\u003cbr\u003eYear: 2015\u003cbr\u003eAbstract: \u2014High-Level Synthesis (HLS) enables rapid prototyp-\ning of complex hardware designs by translating C or C++ code to\nlow-level RTL code. However, the testing and evaluation of HLS\ndesigns still typically rely on slow RTL-level simulators that can\ntake hours to provide feedback, especially for complex designs.\nA recent work, LightningSim, helps to solve this problem by\nproviding a simulation workflow one to two orders of magnitude\nfaster than RTL simulation. However, it still exhibits inefficiencies\ndue to several types of redundant computation, making it slow for\nlarge design simulation and design space exploration. Addressing\nthese inefficiencies, we introduce LightningSimV2, a much faster\nand scalable simulation tool. LightningSimV2 features three\nmain innovations. First, we perform compile-time static analysis,\nexploiting the repetitive structures in HLS designs, e.g., loops,\nto reduce the simulation workload. Second, we propose a novel\ngraph-based simulation approach, with decoupled simulation\ngraph construction step and graph traversal step, significantly\nreducing repeated computation. Third, benefiting from the decou-\npled approach, LightningSimV2 can perform incremental stall\nanalysis extremely fast, enabling highly efficient design space\nexploration of large numbers of complex hardware parameters,\ne.g., optimal FIFO depths. Moreover, the DSE is well-suited\nfor parallel computing, further improving the DSE efficiency.\nCompared with LightningSim, LightningSimV2 achieves up to\n3.5\u00d7 speedup in full simulation and up to 577\u00d7 speed up\nfor incremental DSE. Our code is open-source on GitHub at\nhttps://github.com/sharc-lab/LightningSim/tree/v0.2.0.\nI."}, {"group": "Data Science", "id": 290, "label": "VDTuner: Automated Performance Tuning for Vector Data Management Systems", "shape": "dot", "size": 10, "title": "Authors: Tiannuo Yang, Wen Hu, Wangqi Peng, Yusen Li, Jianguo Li, Gang Wang, Xiaoguang Liu, yangtn, liyusen\u003cbr\u003eYear: 2017\u003cbr\u003eAbstract: \u2014Vector data management systems (VDMSs) have\nbecome an indispensable cornerstone in large-scale information\nretrieval and machine learning systems like large language\nmodels. To enhance the efficiency and flexibility of similarity\nsearch, VDMS exposes many tunable index parameters and\nsystem parameters for users to specify. However, due to the\ninherent characteristics of VDMS, automatic performance tuning\nfor VDMS faces several critical challenges, which cannot be well\naddressed by the existing auto-tuning methods.\nIn this paper, we introduce VDTuner, a learning-based au-\ntomatic performance tuning framework for VDMS, leveraging\nmulti-objective Bayesian optimization. VDTuner overcomes the\nchallenges associated with VDMS by efficiently exploring a\ncomplex multi-dimensional parameter space without requiring\nany prior knowledge. Moreover, it is able to achieve a good\nbalance between search speed and recall rate, delivering an\noptimal configuration. Extensive evaluations demonstrate that\nVDTuner can markedly improve VDMS performance (14.12%\nin search speed and 186.38% in recall rate) compared with\ndefault setting, and is more efficient compared with state-of-the-\nart baselines (up to 3.57\u00d7 faster in terms of tuning time). In\naddition, VDTuner is scalable to specific user preference and\ncost-aware optimization objective. VDTuner is available online\nat https://github.com/tiannuo-yang/VDTuner.\nIndex\nTerms\u2014vector\ndatabase,\nparameter\ntuning,\nsearch\nspeed, recall rate, machine learning\nI."}, {"group": "Theoretical Physics", "id": 291, "label": "Weighted Scaling Approach for Metabolomics Data Analysis", "shape": "dot", "size": 10, "title": "Authors: Nishith Kumar, Aminul Hoque, Ashad Alam\u003cbr\u003eYear: 2016\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Structural Biology", "id": 292, "label": "Stochastic failure of cell infection post viral entry: Implications for infection outcomes and antiviral therapy", "shape": "dot", "size": 10, "title": "Authors: Christian Quirouette, Daniel Cresta, Jizhou Li, Kathleen P. Wilkie, Haozhao Liang, \u00a4, Catherine A.A. Beauchemin, \u2217\u003cbr\u003eYear: 2015\u003cbr\u003eAbstract: A virus infection can be initiated with very few or even a single infectious virion, and as such can\nbecome extinct, i.e. stochastically fail to take hold or spread signi\ufb01cantly. There are many ways that\na fully competent infectious virion, having successfully entered a cell, can fail to cause a productive\ninfection, i.e. one that yields infectious virus progeny. Though many discrete, stochastic mathematical\nmodels (DSMs) have been developed and used to estimate a virus infection\u2019s extinction probability,\nthese typically neglect infection failure post viral entry. The DSM presented herein introduces parameter\n\u03b3 \u2208(0, 1] which corresponds to the probability that a virion\u2019s entry into a cell will result in a productive\ncell infection. We derive an expression for the likelihood of infection extinction in this new DSM, and\n\ufb01nd that prophylactic therapy with an antiviral acting to reduce \u03b3 is best at increasing an infection\u2019s\nextinction probability, compared to antivirals acting on the rates of virus production or virus entry into\ncells. Using the DSM, we investigate the di\ufb00erence in the fraction of cells consumed by so-called extinct\nversus established virus infections, and \ufb01nd that this distinction becomes biologically meaningless as\nthe probability of extinction approaches 100%. We show that infections wherein virus is release by an\ninfected cell as a single burst, rather than at a constant rate over the cell\u2019s infectious lifespan, has the\nsame probability of infection extinction, despite previous claims to this e\ufb00ect [28]. Instead, extending\nprevious work by others [41], we show how the assumed distribution for the stochastic virus burst size,\na\ufb00ects the extinction probability and associated critical antiviral e\ufb03cacy.\n1\narXiv:2208.00637v1  [q-bio.CB]  1 Aug 2022"}, {"group": "Structural Biology", "id": 293, "label": "SFILES 2.0", "shape": "dot", "size": 10, "title": "Authors: Gabriel Vogel, Lukas Schulze, Edwin Hirtreiter, Artur M. Schweidtmann\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: SFILES is a text-based notation for chemical process \ufb02owsheets. It was originally proposed by\nd\u2019Anterroches [1] who was inspired by the text-based SMILES notation for molecules. The text-\nbased format has several advantages compared to \ufb02owsheet images regarding the storage format,\ncomputational accessibility, and eventually for data analysis and processing. However, the original\nSFILES version cannot describe essential \ufb02owsheet con\ufb01gurations unambiguously, such as the\ndistinction between top and bottom products. Neither is it capable of describing the control structure\nrequired for the safe and reliable operation of chemical processes. Also, there is no publicly\navailable software for decoding or encoding chemical process topologies to SFILES. We propose\nthe SFILES 2.0 with a complete description of the extended notation and naming conventions.\nAdditionally, we provide open-source software for the automated conversion between \ufb02owsheet\ngraphs and SFILES 2.0 strings. This way, we hope to encourage researchers and engineers to publish\ntheir \ufb02owsheet topologies as SFILES 2.0 strings. The ultimate goal is to set the standards for creating\na FAIR database of chemical process \ufb02owsheets, which would be of great value for future data\nanalysis and processing.\nKeywords Flowsheet graph \u00b7 Process \ufb02ow diagram \u00b7 Arti\ufb01cial intelligence \u00b7 FAIR data \u00b7 STRING notation"}, {"group": "Speech Processing", "id": 294, "label": "Acoustic Signal Embeddings Jia Qi Yip\u00a7\u2020, Dianwen Ng\u00a7\u2020, Bin Ma\u00a7, Konstantin Pervushin\u2020 and Eng Siong Chng\u2020", "shape": "dot", "size": 10, "title": "Authors: Jia Qi Yip\u00a7\u2020, Dianwen Ng\u00a7\u2020, Bin Ma\u00a7\u003cbr\u003eYear: 2012\u003cbr\u003eAbstract: \u2014Nuclear Magnetic Resonance (NMR) is used in\nstructural biology to experimentally determine the structure of\nproteins, which is used in many areas of biology and is an\nimportant part of drug development. Unfortunately, NMR data\ncan cost thousands of dollars per sample to collect and it can take\na specialist weeks to assign the observed resonances to speci\ufb01c\nchemical groups. There has thus been growing interest in the\nNMR community to use deep learning to automate NMR data\nannotation. Due to similarities between NMR and audio data, we\npropose that methods used in acoustic signal processing can be\napplied to NMR as well. Using a simulated amino acid dataset,\nwe show that by swapping out \ufb01lter banks with a trainable\nconvolutional encoder, acoustic signal embeddings from speaker\nveri\ufb01cation models can be used for amino acid classi\ufb01cation\nin 2D NMR spectra by treating each amino acid as a unique\nspeaker. On an NMR dataset comparable in size with of 46 hours\nof audio, we achieve a classi\ufb01cation performance of 97.7% on a\n20-class problem. We also achieve a 23% relative improvement\nby using an acoustic embedding model compared to an existing\nNMR-based model.\nI."}, {"group": "Structural Biology", "id": 295, "label": "AI-driven Hypergraph Network of Organic Chemistry:  Network Statistics and Applications in Reaction Classification", "shape": "dot", "size": 10, "title": "Authors: Venkat Venkatasubramanian\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Rapid discovery of new reactions and molecules\nin recent years has been facilitated by the ad-\nvances in high throughput screening, accessibility\nto a highly complex chemical design space, and\nthe development of accurate molecular model-\ning frameworks. A holistic study of the grow-\ning chemistry literature is, therefore, required\nthat focuses on understanding the recent trends\nin organic chemistry and extrapolating them to\ninfer possible future trajectories. To this end, sev-\neral network theory-based studies have been re-\nported that use a directed graph representation\nof chemical reactions. Here, we perform a study\nbased on representing chemical reactions as hy-\npergraphs where the nodes represent the partici-\npating molecules and hyperedges represent reac-\ntions between nodes. We use a standard reactions\ndataset to construct a hypergraph network of or-\nganic chemistry and report its statistics such as\ndegree distribution, average path length, assorta-\ntivity or degree correlations, PageRank centrality,\nand graph-based clusters (or communities). We\nalso compute each statistic for an equivalent di-\nrected graph representation of reactions to draw\nparallels and highlight differences between the\ntwo. To demonstrate the AI applicability of hyper-\ngraph reaction representation, we generate dense\nhypergraph embeddings and use them in the reac-\ntion classi\ufb01cation problem. We conclude that the\nhypergraph representation is \ufb02exible, preserves re-\naction context, and uncovers hidden insights that\nare otherwise not apparent in a traditional directed\ngraph representation of chemical reactions.\n1Department of Chemical Engineering, Columbia University,\nNew York, USA. Correspondence to: Venkat Venkatasubramanian\n\u003cvenkat@columbia.edu\u003e.\n1."}, {"group": "Structural Biology", "id": 296, "label": "An Optimal Likelihood Free Method for Biological Model Selection Systems biology seeks to create math models of", "shape": "dot", "size": 10, "title": "Authors: Vincent D. Zaballa, Elliot E. Hui\u003cbr\u003eYear: 2020\u003cbr\u003eAbstract: Systems biology seeks to create math models of\nbiological systems to reduce inherent biological\ncomplexity and provide predictions for applica-\ntions such as therapeutic development. However,\nit remains a challenge to determine which math\nmodel is correct and how to arrive optimally at the\nanswer. We present an algorithm for automated\nbiological model selection using mathematical\nmodels of systems biology and likelihood free in-\nference methods. Our algorithm shows improved\nperformance in arriving at correct models without\na priori information over conventional heuristics\nused in experimental biology and random search.\nThis method shows promise to accelerate biologi-\ncal basic science and drug discovery.\n1."}, {"group": "Theoretical Physics", "id": 297, "label": "Non-Gaussian displacement distributions in models of heterogeneous active particle dynamics", "shape": "dot", "size": 10, "title": "Authors: Igor M. Sokolov, Ralf Metzler\u2020, \u266f, Aleksei V. Chechkin\u2020, \u2021, \u00a7\u003cbr\u003eYear: 2022\u003cbr\u003eAbstract: .\nWe study the e\ufb00ect of randomly distributed di\ufb00usivities and speeds in\ntwo models for active particle dynamics with active and passive \ufb02uctuations.\nWe\ndemonstrate how non-Gaussian displacement distributions emerge in these models in\nthe long time limit, including Cauchy-type and exponential (Laplace) shapes. Notably\nthe resulting shapes of the displacement distributions with distributed di\ufb00usivities for\nthe active models considered here are in striking contrast to passive di\ufb00usion models.\nFor the active motion models our discussion points out the di\ufb00erences between active-\nand passive-noise. Speci\ufb01cally, we demonstrate that the case with active-noise is in\nnice agreement with measured data for the displacement distribution of social amoeba.\n1."}, {"group": "Science and Technology", "id": 298, "label": "Causality in Cardiorespiratory Signals in Pediatric Cardiac Patients", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2010\u003cbr\u003eAbstract: \u2014 Four different Granger causality-based methods -\none linear and three nonlinear (Granger Causality, Kernel \nGranger Causality, large-scale Nonlinear Granger Causality, \nand Neural Network Granger Causality) were used for \nassessment and causal-based quantification of the respiratory \nsinus arrythmia (RSA) in the group of pediatric cardiac patients, \nbased on the single-lead ECG and impedance pneumography \nsignals (the latter as the tidal volume curve equivalent). Each \nmethod was able to detect the dependency (in terms of causal \ninference) between respiratory and cardiac signals. The \ncorrelations between quantified RSA and the demographic \nparameters were also studied, but the results differ for each \nmethod. \n \nClinical relevance\u2014 The presented methods (among which \nNNGC seems to be the most valid) allow for quantification of \nRSA and study of dependency between tidal volume and RR \nintervals, which may help to better understand association \nbetween respiratory and cardiovascular systems in different \npopulations.  \nI."}, {"group": "Data Science", "id": 299, "label": "NRBdMF: Recommendation Algorithm for Drug Effects Prediction Considering Directionality", "shape": "dot", "size": 10, "title": "Authors: Iori Azuma, Tadahaya Mizuno, Hiroyuki Kusuhara, Tadahaya Mizuno\u003cbr\u003eYear: 2020\u003cbr\u003eAbstract: Predicting the novel effects of drugs based on information about approved drugs can be \nregarded as a recommendation system. Matrix factorization is one of the most used \nrecommendation systems and various algorithms have been devised for it. A literature survey \nand summary of existing algorithms for predicting drug effects demonstrated that most such \nmethods, including neighborhood regularized logistic matrix factorization, which was the \nbest performer in benchmark tests, used a binary matrix that considers only the presence or \nabsence of interactions. However, drug effects are known to have two opposite aspects, such \nas side effects and therapeutic effects. In the present study, we proposed using neighborhood \nregularized bidirectional matrix factorization (NRBdMF) to predict drug effects by \n2 \nincorporating bidirectionality, which is a characteristic property of drug effects. We used this \nproposed method for predicting side effects using a matrix that considered the bidirectionality \nof drug effects, in which known side effects were assigned a positive (+1) label and known \ntreatment effects were assigned a negative (\u22121) label. The NRBdMF model, which utilizes \ndrug bidirectional information, achieved enrichment of side effects at the top and indications \nat the bottom of the prediction list. This first attempt to consider the bidirectional nature of \ndrug effects using NRBdMF showed that it reduced false positives and produced a highly \ninterpretable output. \nKeywords: \nMatrix factorization \nRecommendation system \nSide effects \nTherapeutic indications \n1."}, {"group": "Structural Biology", "id": 300, "label": "peptides based on triple coding matrix and transfer", "shape": "dot", "size": 10, "title": "Authors: Chuqi Lei, Jianxin Wang, Yaohang Li, Min Li\u003cbr\u003eYear: 2019\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Structural Biology", "id": 301, "label": " Clustering Optimisation Method for Highly Connected Biological Data ", "shape": "dot", "size": 10, "title": "Authors: Richard Tj\u00f6rnhammara\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Currently, data-driven discovery in biological sciences resides in \ufb01nding seg-\nmentation strategies in multivariate data that produce sensible descriptions of the\ndata. Clustering is but one of several approaches and sometimes falls short because\nof dif\ufb01culties in assessing reasonable cutoffs, the number of clusters that need to\nbe formed or that an approach fails to preserve topological properties of the orig-\ninal system in its clustered form. In this work, we show how a simple metric for\nconnectivity clustering evaluation leads to an optimised segmentation of biological\ndata.\nThe novelty of the work resides in the creation of a simple optimisation method\nfor clustering crowded data. The resulting clustering approach only relies on met-\nrics derived from the inherent properties of the clustering. The new method facili-\ntates knowledge for optimised clustering, which is easy to implement.\nWe discuss how the clustering optimisation strategy corresponds to the viable\ninformation content yielded by the \ufb01nal segmentation. We further elaborate on\nhow the clustering results, in the optimal solution, corresponds to prior knowledge\nof three different data sets.\nKeywords: Clustering, Connectivity, Unimodal Optimisation, Dimensionality\nReduction, Statistical Learning, Hierarchical Agglomerative Clustering\n1."}, {"group": "Structural Biology", "id": 302, "label": "Bridging the gap between target-based and cell-based drug discovery with a graph generative multi-task model", "shape": "dot", "size": 10, "title": "Authors: Fan Hu, Dongqi Wang, Huazhen Huang, Yishen Hu, Peng Yin\u003cbr\u003eYear: 2012\u003cbr\u003eAbstract: Drug discovery is vitally important for protecting human against disease. Target-based screening is one \nof the most popular methods to develop new drugs in the past several decades. This method efficiently \nscreens candidate drugs inhibiting target protein in vitro, but it often fails due to inadequate activity of \nthe selected drugs in vivo. Accurate computational methods are needed to bridge this gap. Here, we \npropose a novel graph multi task deep learning model to identify compounds carrying both target \ninhibitory and cell active (MATIC) properties. On a carefully curated SARS-CoV-2 dataset, the proposed \nMATIC model shows advantages comparing with traditional method in screening effective compounds \nin vivo. Next, we explored the model interpretability and found that the learned features for target \ninhibition (in vitro) or cell active (in vivo) tasks are different with molecular property correlations and \natom functional attentions. Based on these findings, we utilized a monte carlo based reinforcement \nlearning generative model to generate novel multi-property compounds with both in vitro and in vivo \nefficacy, thus bridging the gap between target-based and cell-based drug discovery."}, {"group": "Structural Biology", "id": 303, "label": "Modeling Diverse Chemical Reactions for Single-step Retrosynthesis via Discrete Latent Variables", "shape": "dot", "size": 10, "title": "Authors: Jie Wang\u2217\u003cbr\u003eYear: 2011\u003cbr\u003eAbstract: Single-step retrosynthesis is the cornerstone of retrosynthesis plan-\nning, which is a crucial task for computer-aided drug discovery.\nThe goal of single-step retrosynthesis is to identify the possible\nreactants that lead to the synthesis of the target product in one\nreaction. By representing organic molecules as canonical strings,\nexisting sequence-based retrosynthetic methods treat the product-\nto-reactant retrosynthesis as a sequence-to-sequence translation\nproblem. However, most of them struggle to identify diverse chemi-\ncal reactions for a desired product due to the deterministic inference,\nwhich contradicts the fact that many compounds can be synthesized\nthrough various reaction types with different sets of reactants.\nIn this work, we aim to increase reaction diversity and generate\nvarious reactants using discrete latent variables. We propose a novel\nsequence-based approach, namely RetroDCVAE, which incorpo-\nrates conditional variational autoencoders into single-step retrosyn-\nthesis and associates discrete latent variables with the generation\nprocess. Specifically, RetroDCVAE uses the Gumbel-Softmax distri-\nbution to approximate the categorical distribution over potential re-\nactions and generates multiple sets of reactants with the variational\ndecoder. Experiments demonstrate that RetroDCVAE outperforms\nstate-of-the-art baselines on both benchmark dataset and home-\nmade dataset. Both quantitative and qualitative results show that\nRetroDCVAE can model the multi-modal distribution over reaction\ntypes and produce diverse reactant candidates.\n\u2217Corresponding Author\nPermission to make digital or hard copies of all or part of this work for personal or\nclassroom use is granted without fee provided that copies are not made or distributed\nfor profit or commercial advantage and that copies bear this notice and the full citation\non the first page. Copyrights for components of this work owned by others than ACM\nmust be honored. Abstracting with credit is permitted. To copy otherwise, or republish,\nto post on servers or to redistribute to lists, requires prior specific permission and/or a\nfee. Request permissions from permissions@acm.org.\nCIKM \u201922, October 17\u201322, 2022, Atlanta, GA\n\u00a9 2022 Association for Computing Machinery.\nCCS CONCEPTS\n\u2022 Applied computing \u2192Computational biology; Chemistry; \u2022\nComputing methodologies \u2192Natural language processing; La-\ntent variable models.\nKEYWORDS\nRetrosynthesis, Variational Autoencoder, Transformer, Graph Neu-\nral Network, Discrete Latent Variable\nACM Reference Format:\nHuarui He, Jie Wang, Yunfei Liu, and Feng Wu. 2022. Modeling Diverse\nChemical Reactions for Single-step Retrosynthesis via Discrete Latent Vari-\nables. In Proceedings of Make sure to enter the correct conference title from your\nrights confirmation emai (CIKM \u201922). ACM, New York, NY, USA, 11 pages."}, {"group": "Structural Biology", "id": 304, "label": "Full Paper", "shape": "dot", "size": 10, "title": "Authors: Chengyu Liu, Wei Wang, Wei Wang\u003cbr\u003eYear: 2010\u003cbr\u003eAbstract: Developing models with high interpretability and even deriving formulas to quantify relationships\nbetween biological data is an emerging need. We propose here a framework for ab initio derivation of\nsequence motifs and linear formula using a new approach based on the interpretable neural network\nmodel called contextual regression model. We showed that this linear model could predict gene\nexpression levels using promoter sequences with a performance comparable to deep neural network\nmodels. We uncovered a list of 300 motifs with important regulatory roles on gene expression and showed\nthat they also had significant contributions to cell-type specific gene expression in 154 diverse cell types.\nThis work illustrates the possibility of deriving formulas to represent biology laws that may not be easily\nelucidated. (https://github.com/Wang-lab-UCSD/Motif_Finding_Contextual_Regression)"}, {"group": "Structural Biology", "id": 305, "label": "Genome-wide Nucleotide-resolution Model of Single-strand Break Site Reveals Species Evolutionary Hierarchy", "shape": "dot", "size": 10, "title": "Authors: Sheng Xu, Junkang Wei, Yu Li\u003cbr\u003eYear: 2013\u003cbr\u003eAbstract: Single-strand breaks (SSBs) are the major DNA damage in the genome arising spontaneously as\nthe outcome of genotoxins and intermediates of DNA transactions. SSBs play a crucial role in\nvarious biological processes and show a non-random distribution in the genome. Several SSB\ndetection approaches such as S1 END-seq and SSiNGLe-ILM emerged to characterize the genomic\nlandscape of SSB with nucleotide resolution. However, these sequencing-based methods are costly\nand unfeasible for large-scale analysis of diverse species. Thus, we proposed the \ufb01rst computational\napproach, SSBlazer, which is an explainable and scalable deep learning framework for genome-wide\nnucleotide-resolution SSB site prediction. We demonstrated that SSBlazer can accurately predict\nSSB sites and suf\ufb01ciently alleviate false positives by constructing an imbalanced dataset to simulate\nthe realistic SSB distribution. The model interpretation analysis reveals that SSBlazer captures\nthe pattern of individual CpG in genomic context and the motif of TGCC in the center region as\ncritical features. Besides, SSBlazer is a lightweight model with robust cross-species generalization\nability in the cross-species evaluation, which enables the large-scale genome-wide application in\ndiverse species. Strikingly, the putative SSB genomic landscapes of 216 vertebrates reveal a negative\ncorrelation between SSB frequency and evolutionary hierarchy, suggesting that the genome tends to\nbe integrity during evolution."}, {"group": "Structural Biology", "id": 306, "label": "From Static to Dynamic Structures: Improving Binding Affinity Prediction with a", "shape": "dot", "size": 10, "title": "Authors: Yaosen Min\u2020, Ye Wei*\u2020, Peizhuo Wang\u2020, Xiaoting, Wang, Han Li, Nian Wu, Stefan Bauer, Shuxin Zheng, Yu, Shi, Yingheng Wang, Ji Wu, Dan Zhao, JianyangZeng, wuji\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Accurate prediction of the protein-ligand binding affinities is an essen-\ntial challenge in the structure-based drug design. Despite recent advance\nin data-driven methods in affinity prediction, their accuracy is still lim-\nited, partially because they only take advantage of static crystal structures\nwhile the actual binding affinities are generally depicted by the thermo-\ndynamic ensembles between proteins and ligands. One effective way to\napproximate such a thermodynamic ensemble is to use molecular dynam-\nics (MD) simulation. Here, we curated an MD dataset containing 3,218\ndifferent protein-ligand complexes, and further developed Dynaformer,\nwhich is a graph-based deep learning model. Dynaformer was able to\naccurately predict the binding affinities by learning the geometric char-\nacteristics of the protein-ligand interactions from the MD trajectories.\nIn silico experiments demonstrated that our model exhibits state-of-the-\nart scoring and ranking power on the CASF-2016 benchmark dataset,\n1\narXiv:2208.10230v3  [q-bio.BM]  3 Jun 2023\n2\noutperforming the methods hitherto reported. Moreover, we performed a\nvirtual screening on the heat shock protein 90 (HSP90) using Dynaformer\nthat identified 20 candidates and further experimentally validated their\nbinding affinities. We demonstrated that our approach is more efficient,\nwhich can identify 12 hit compounds (two were in the submicromolar\nrange), including several newly discovered scaffolds. We anticipate this new\nsynergy between large-scale MD datasets and deep learning models will\nprovide a new route toward accelerating the early drug discovery process."}, {"group": "Deep Learning", "id": 307, "label": "Predicting microsatellite instability and key biomarkers in colorectal cancer from H\u0026E-stained images: Achieving SOTA predictive performance with", "shape": "dot", "size": 10, "title": "Authors: Xingyu Li, Jitendra Jonnagaddala, Hong Zhang, Xu Steven Xu, Jitendra Jonnagaddala, Hong Zhang, Xu Steven Xu\u003cbr\u003eYear: 2017\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Structural Biology", "id": 308, "label": "Revised calculation of the coefficient of parentage in plant breeding", "shape": "dot", "size": 10, "title": "Authors: Carlos Hernandez-Suareza, \u2217\u003cbr\u003eYear: 2015\u003cbr\u003eAbstract: The Coe\ufb03cient of Parentage (COP) between two individuals is the expected\ninbreeding of their o\ufb00spring. Originally exploited by animal breeders, is now a\nroutine calculation among plant breeders as part of crop improvement programs.\nHere we show that the COP between strains requires a di\ufb00erent calculation than\nthe used to calculate the COP between individuals. Failure to do so may result\nin an overestimation of the amount of inbreeding. Here we provide a simple\nmethodology to calculate the correct coe\ufb03cient of parentage between strains.\nKeywords:\nCoe\ufb03cient of parentage, Coe\ufb03cient of inbreeding, Coe\ufb03cient of\nkinship, Coe\ufb03cient of coancestry, COP\n1."}, {"group": "Theoretical Physics", "id": 309, "label": "Microsoft Word - _scientific_data__meg_masc-3.docx", "shape": "dot", "size": 10, "title": "Authors: Graham Flick, Alec Marantz, Liina Pylkka\u00a8, David, Poeppel, Jean-Re\u00b4 mi King\u003cbr\u003eYear: 2020\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Deep Learning", "id": 310, "label": "Prognostic Significance of Tumor-Infiltrating Lymphocytes Determined Using Deep Learning on Colorectal Cancer Pathology Images", "shape": "dot", "size": 10, "title": "Authors: Anran Liu, Xingyu Li, Hongyi Wu, Bangwei Guo, Jitendra Jonnagaddala, Hong Zhang, Xu Steven Xu\u003cbr\u003eYear: 2014\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Theoretical Physics", "id": 311, "label": "Simulating how animals learn: a new modelling framework applied to the process of optimal foraging", "shape": "dot", "size": 10, "title": "Authors: Peter R. Thompson, \u2217M\u00b4elodie Kunegel-Lion
