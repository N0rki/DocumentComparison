\u003cbr\u003eYear: 2014\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Deep Learning", "id": 312, "label": "Microsoft Word - Paper-Zahra-InfiltrationArxiv.docx", "shape": "dot", "size": 10, "title": "Authors: Drew Parker, Hamed Akbari, Spyridon Bakas, Ronald L. Wolf, Steven, Brem, Ragini Verma, Zahra Riahi Samani\u003cbr\u003eYear: 2016\u003cbr\u003eAbstract: In malignant primary brain tumors, cancer cells infiltrate into the peritumoral brain structures which \nresults in inevitable recurrence. Quantitative assessment of infiltrative heterogeneity in the peritumoral \nregion, the area where biopsy or resection can be hazardous, is important for clinical decision making. \nPrevious work on characterizing the infiltrative heterogeneity in the peritumoral region used various \nimaging modalities, but information of extracellular free water movement restriction has been limitedly \nexplored. Here, we derive a unique set of Artificial Intelligence (AI)-based markers capturing the \nheterogeneity of tumor infiltration, by characterizing free water movement restriction in the peritumoral \nregion using Diffusion Tensor Imaging (DTI)-based free water volume fraction maps. A novel voxel-wise \ndeep learning-based peritumoral microenvironment index (PMI) is first extracted by leveraging the widely \ndifferent water diffusivity properties of glioblastomas and brain metastases as regions with and without \ninfiltrations in the peritumoral tissue. Descriptive characteristics of locoregional hubs of uniformly high \nPMI values are extracted as AI-based markers to capture distinct aspects of infiltrative heterogeneity. The \nproposed markers are applied to two clinical use cases on an independent population of 275 adult-type \ndiffuse gliomas (CNS WHO grade 4), analyzing the duration of survival among Isocitrate-Dehydrogenase \n1 (IDH1)-wildtypes and the differences with IDH1-mutants. Our findings provide a panel of markers as \nsurrogates of infiltration that captures unique insight about underlying biology of peritumoral \nmicrostructural heterogeneity, establishing them as biomarkers of prognosis pertaining to survival and \nmolecular stratification, with potential applicability in clinical decision making."}, {"group": "Structural Biology", "id": 313, "label": "Adaptive altruistic strategy in cyclic models during an epidemic Amsterdam, The Netherlands", "shape": "dot", "size": 10, "title": "Authors: Senador Salgado Filho\u003cbr\u003eYear: 2018\u003cbr\u003eAbstract: \u2013 We investigate a cyclic game system where organisms face an epidemic beyond being\nthreatened by natural enemies.\nAs a survival strategy, individuals of one out of the species\nusually safeguard themselves by approaching the enemies of their enemies and performing social\ndistancing to escape contamination when an outbreak a\ufb00ects the neighbourhood. We simulate\nhow the survival movement strategy to local epidemic surges must adapt if a pathogen mutation\nmakes the disease deadlier. We study the spatial distribution of local outbreaks and observe the\nin\ufb02uence of disease mortality on individuals\u2019 spatial organisation. We show that adapting the\nsurvival movement strategy for a high mortality disease demands an altruistic behaviour of the\norganisms since their death risk increases. Despite weakening the disease transmission chain, which\nbene\ufb01ts the species, abandoning refuges provided by safeguarding social interaction increases the\nvulnerability to being eliminated in the cyclic game. Considering that not all individuals exhibit\naltruism, we \ufb01nd the relative growth in the species density as a function of the proportion of\nindividuals behaving altruistically. Our results may be helpful for biologists and data scientists to\nunderstand how adaptive altruistic processes can a\ufb00ect population dynamics in complex systems."}, {"group": "Robotics", "id": 314, "label": "Towards Embedding Dynamic Personas in Interactive Robots: Masquerading Animated Social Kinematics (MASK)", "shape": "dot", "size": 10, "title": "Authors: Jeongeun Park, Taemoon Jeong, Hyeonseong Kim, Taehyun Byun, Seungyoon Shin, Keunjun Choi, Jaewoon Kwon, Taeyoon Lee, Matthew Pan, Sungjoon Choi\u003cbr\u003eYear: 2017\u003cbr\u003eAbstract: \u2014 This paper presents the design and development\nof an innovative interactive robotic system to enhance au-\ndience engagement using character-like personas. Built upon\nthe foundations of persona-driven dialog agents, this work\nextends the agent\u2019s application to the physical realm, employing\nrobots to provide a more immersive and interactive experience.\nThe proposed system, named the Masquerading Animated\nSocial Kinematics (MASK), leverages an anthropomorphic\nrobot which interacts with guests using non-verbal interactions,\nincluding facial expressions and gestures. A behavior generation\nsystem based upon a finite-state machine structure effectively\nconditions robotic behavior to convey distinct personas The\nMASK framework integrates a perception engine, a behav-\nior selection engine, and a comprehensive action library to\nenable real-time, dynamic interactions with minimal human\nintervention in behavior design. Throughout the user subject\nstudies, we examined whether the users could recognize the\nintended character in film-character-based persona conditions.\nWe conclude by discussing the role of personas in interactive\nagents and the factors to consider for creating an engaging user\nexperience.\nI."}, {"group": "Robotics", "id": 315, "label": "HeR-DRL:Heterogeneous Relational Deep Reinforcement Learning for Decentralized", "shape": "dot", "size": 10, "title": "Authors: Songhao Piao\u2217, Wenzheng Chi, Liguo Chen, Wei Li\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: \u2014Crowd navigation has received significant research\nattention in recent years, especially DRL-based methods. While\nsingle-robot crowd scenarios have dominated research, they\noffer limited applicability to real-world complexities. The het-\nerogeneity of interaction among multiple agent categories, like\nin decentralized multi-robot pedestrian scenarios, are frequently\ndisregarded. This \u201dinteraction blind spot\u201d hinders generaliz-\nability and restricts progress towards robust navigation algo-\nrithms. In this paper, we propose a heterogeneous relational\ndeep reinforcement learning(HeR-DRL), based on customised\nheterogeneous GNN, in order to improve navigation strategies in\ndecentralized multi-robot crowd navigation. Firstly, we devised a\nmethod for constructing robot-crowd heterogenous relation graph\nthat effectively simulates the heterogeneous pair-wise interaction\nrelationships. We proposed a new heterogeneous graph neural\nnetwork for transferring and aggregating the heterogeneous state\ninformation. Finally, we incorporate the encoded information into\ndeep reinforcement learning to explore the optimal policy. HeR-\nDRL are rigorously evaluated through comparing it to state-\nof-the-art algorithms in both single-robot and multi-robot circle\ncrowssing scenario. The experimental results demonstrate that\nHeR-DRL surpasses the state-of-the-art approaches in overall\nperformance, particularly excelling in safety and comfort metrics.\nThis underscores the significance of interaction heterogeneity for\ncrowd navigation. The source code will be publicly released in\nhttps://github.com/Zhouxy-Debugging-Den/HeR-DRL.\nI."}, {"group": "Robotics", "id": 316, "label": "Axis Arm Equipped Quadruped Robot and Generative AI: A examines the utilization of generative AI and mobile robotics for", "shape": "dot", "size": 10, "title": "Authors: Shunichi Hato, Nozomi Ogawa\u003cbr\u003eYear: 2012\u003cbr\u003eAbstract: \u2014This paper presents a proof-of-concept study that\nexamines the utilization of generative AI and mobile robotics for\nautonomous laboratory monitoring in the pharmaceutical R\u0026D\nlaboratory. The study investigates the potential advantages of\nanomaly detection and automated reporting by multi-modal model\nand Vision Foundation Model (VFM), which have the potential\nto enhance compliance and safety in laboratory environments.\nAdditionally, the paper discusses the current limitations of the\ngenerative AI approach and proposes future directions for its\napplication in lab monitoring.\nIndex Terms\u2014Quadruped, Mobile Robotics, Autonomous In-\nspection, Laboratory Automation\nI."}, {"group": "Natural Language Processing", "id": 317, "label": "Do Visual-Language Maps Capture Latent Semantics? Matti Pekkanen, Tsvetomila Mihaylova, Francesco Verdoja, and Ville Kyrki", "shape": "dot", "size": 10, "title": "Authors: Matti Pekkanen, Tsvetomila Mihaylova, Francesco Verdoja\u003cbr\u003eYear: 2013\u003cbr\u003eAbstract: \u2014 Visual-language models (VLMs) have recently\nbeen introduced in robotic mapping by using the latent rep-\nresentations, i.e., embeddings, of the VLMs to represent the\nnatural language semantics in the map. The main benefit is\nmoving beyond a small set of human-created labels toward\nopen-vocabulary scene understanding. While there is anecdotal\nevidence that maps built this way support downstream tasks,\nsuch as navigation, rigorous analysis of the quality of the\nmaps using these embeddings is lacking. We investigate two\ncritical properties of map quality: queryability and consistency.\nThe evaluation of queryability addresses the ability to retrieve\ninformation from the embeddings. We investigate two aspects of\nconsistency: intra-map consistency and inter-map consistency.\nIntra-map consistency captures the ability of the embeddings to\nrepresent abstract semantic classes, and inter-map consistency\ncaptures the generalization properties of the representation.\nIn this paper, we propose a way to analyze the quality of\nmaps created using VLMs, which forms an open-source bench-\nmark to be used when proposing new open-vocabulary map\nrepresentations. We demonstrate the benchmark by evaluating\nthe maps created by two state-of-the-art methods, VLMaps\nand OpenScene, using two encoders, LSeg and OpenSeg, using\nreal-world data from the Matterport3D data set. We find that\nOpenScene outperforms VLMaps with both encoders, and LSeg\noutperforms OpenSeg with both methods.\nI."}, {"group": "Science and Technology", "id": 318, "label": "Ultra-Wideband (UWB) Positioning System Based University of Applied Sciences HTWG Konstanz", "shape": "dot", "size": 10, "title": "Authors: Sebastian Krebs, Tom Herter\u003cbr\u003eYear: 2022\u003cbr\u003eAbstract: \u2014 In this paper, an Ultra-Wideband (UWB) position-\ning system is introduced, that leverages six identical custom-\ndesigned boards, each featuring an ESP32 microcontroller and\na DWM3000 module from Quorvo.\nThe system is capable of achieving localization with an accuracy\nof up to 10 cm, by utilizing Two-Way-Ranging (TWR) measure-\nments between one designated \u201dtag\u201d and five \u201danchor\u201d devices.\nThe gathered distance measurements are subsequently processed\nby an Extended Kalman Filter (EKF) running locally on the tag\nboard, enabling it to determine its own position, relying on fixed,\na priori known positions of the anchor boards.\nThis paper presents a comprehensive overview of the system\u2019s\narchitecture, the key components, and the capabilities it offers\nfor indoor positioning and tracking applications.\nI."}, {"group": "Robotics", "id": 319, "label": "SculptDiff: Learning Robotic Clay Sculpting from Humans with Goal Conditioned Diffusion Policy", "shape": "dot", "size": 10, "title": "Authors: Alison Bartsch, Arvind Car, Charlotte Avra, Amir Barati Farimani\u003cbr\u003eYear: 2020\u003cbr\u003eAbstract: \u2014 Manipulating\ndeformable\nobjects\nremains\na\nchallenge within robotics due to the difficulties of state\nestimation, long-horizon planning, and predicting how the\nobject will deform given an interaction. These challenges\nare\nthe\nmost\npronounced\nwith\n3D\ndeformable\nobjects.\nWe propose SculptDiff, a goal-conditioned diffusion-based\nimitation learning framework that works with point cloud\nstate observations to directly learn clay sculpting policies for a\nvariety of target shapes. To the best of our knowledge this is the\nfirst real-world method that successfully learns manipulation\npolicies for 3D deformable objects. For sculpting videos and\naccess to our dataset and hardware CAD models, see the project\nwebsite:\nhttps://sites.google.com/andrew.cmu.edu/imitation-\nsculpting/home\nI."}, {"group": "Robotics", "id": 320, "label": "H-MaP: An Iterative and Hybrid Sequential Manipulation Planner nipulation Planner (H-MaP), a novel approach that iteratively", "shape": "dot", "size": 10, "title": "Authors: Cankut Bora Tuncer, Busenaz Kerimgil, Ozgur S. Oguz\u003cbr\u003eYear: 2021\u003cbr\u003eAbstract: \u2014 This study introduces the Hybrid Sequential Ma-\nnipulation Planner (H-MaP), a novel approach that iteratively\ndoes motion planning using contact points and waypoints for\ncomplex sequential manipulation tasks in robotics. Combining\noptimization-based methods for generalizability and sampling-\nbased methods for robustness, H-MaP enhances manipulation\nplanning through active contact mode switches and enables\ninteractions with auxiliary objects and tools. This framework,\nvalidated by a series of diverse physical manipulation tasks and\nreal-robot experiments, offers a scalable and adaptable solution\nfor complex real-world applications in robotic manipulation.\nhttps://sites.google.com/view/h-map/\nI."}, {"group": "Robotics", "id": 321, "label": "Online Concurrent Multi-Robot Coverage Path Planning", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2016\u003cbr\u003eAbstract: \u2014 Recently,\ncentralized\nreceding\nhorizon\nonline\nmulti-robot coverage path planning algorithms have shown\nremarkable scalability in thoroughly exploring large, complex,\nunknown workspaces with many robots. In a horizon, the path\nplanning and the path execution interleave, meaning when the\npath planning occurs for robots with no paths, the robots\nwith outstanding paths do not execute, and subsequently, when\nthe robots with new or outstanding paths execute to reach\nrespective goals, path planning does not occur for those robots\nyet to get new paths, leading to wastage of both the robotic\nand the computation resources. As a remedy, we propose a\ncentralized algorithm that is not horizon-based. It plans paths\nat any time for a subset of robots with no paths, i.e., who\nhave reached their previously assigned goals, while the rest\nexecute their outstanding paths, thereby enabling concurrent\nplanning and execution. We formally prove that the proposed\nalgorithm ensures complete coverage of an unknown workspace\nand analyze its time complexity. To demonstrate scalability, we\nevaluate our algorithm to cover eight large 2D grid bench-\nmark workspaces with up to 512 aerial and ground robots,\nrespectively. A comparison with a state-of-the-art horizon-based\nalgorithm shows its superiority in completing the coverage with\nup to"}, {"group": "Robotics", "id": 322, "label": "Stimulate the Potential of Robots via Competition tion environment, which arises from the desire to obtain success", "shape": "dot", "size": 10, "title": "Authors: Kangyao Huang, Di Guo, Xinyu Zhang, Xiangyang Ji, Huaping Liu\u2020\u003cbr\u003eYear: 2019\u003cbr\u003eAbstract: \u2014 It is common for us to feel pressure in a competi-\ntion environment, which arises from the desire to obtain success\ncomparing with other individuals or opponents. Although we\nmight get anxious under the pressure, it could also be a drive\nfor us to stimulate our potentials to the best in order to keep\nup with others. Inspired by this, we propose a competitive\nlearning framework which is able to help individual robot to\nacquire knowledge from the competition, fully stimulating its\ndynamics potential in the race. Specifically, the competition\ninformation among competitors is introduced as the additional\nauxiliary signal to learn advantaged actions. We further build\na Multiagent-Race environment, and extensive experiments are\nconducted, demonstrating that robots trained in competitive\nenvironments outperform ones that are trained with SoTA\nalgorithms in single robot environment.\nI."}, {"group": "Robotics", "id": 323, "label": "retail stores relies on maintaining data despite objects being", "shape": "dot", "size": 10, "title": "Authors: Adam Rashid, Chung Min Kim, Justin Kerr, Letian Fu, Kush Hari, Ayah Ahmad, Kaiyuan Chen, Huang Huang, Marcus Gualtieri, Michael Wang, Christian Juette, Nan Tian, Liu Ren, Ken Goldberg\u003cbr\u003eYear: 2016\u003cbr\u003eAbstract: \u2014 Inventory monitoring in homes, factories, and\nretail stores relies on maintaining data despite objects being\nswapped, added, removed, or moved. We introduce Lifelong\nLERF, a method that allows a mobile robot with minimal\ncompute to jointly optimize a dense language and geometric\nrepresentation of its surroundings. Lifelong LERF maintains\nthis representation over time by detecting semantic changes\nand selectively updating these regions of the environment,\navoiding the need to exhaustively remap. Human users can\nquery inventory by providing natural language queries and\nreceiving a 3D heatmap of potential object locations. To\nmanage the computational load, we use Fog-ROS2, a cloud\nrobotics platform, to offload resource-intensive tasks. Lifelong\nLERF obtains poses from a monocular RGBD SLAM backend,\nand uses these poses to progressively optimize a Language\nEmbedded Radiance Field (LERF) for semantic monitoring.\nExperiments with 3-5 objects arranged on a tabletop and a\nTurtlebot with a RealSense camera suggest that Lifelong LERF\ncan persistently adapt to changes in objects with up to 91%\naccuracy.\nI."}, {"group": "Natural Language Processing", "id": 324, "label": "Reconfigurable Robot Identification from Motion Data", "shape": "dot", "size": 10, "title": "Authors: Yuhang Hu, Yunzhe Wang, Ruibo, Liu, Zhou Shen, Hod Lipson\u003cbr\u003eYear: 2013\u003cbr\u003eAbstract: \u2014 Integrating Large Language Models (LLMs) and\nVision-Language Models (VLMs) with robotic systems enables\nrobots to process and understand complex natural language\ninstructions and visual information. However, a fundamental\nchallenge remains: for robots to fully capitalize on these\nadvancements, they must have a deep understanding of their\nphysical embodiment. The gap between AI models\u2019 cognitive\ncapabilities and the understanding of physical embodiment\nleads to the following question: Can a robot autonomously\nunderstand and adapt to its physical form and functionali-\nties through interaction with its environment? This question\nunderscores the transition towards developing self-modeling\nrobots without reliance on external sensory or pre-programmed\nknowledge about their structure. Here, we propose a meta-\nself-modeling that can deduce robot morphology through pro-\nprioception\u2014the robot\u2019s internal sense of its body\u2019s position\nand movement. Our study introduces a 12-DoF reconfigurable\nlegged robot, accompanied by a diverse dataset of 200k unique\nconfigurations, to systematically investigate the relationship\nbetween robotic motion and robot morphology. Utilizing a deep\nneural network model comprising a robot signature encoder\nand a configuration decoder, we demonstrate the capability\nof our system to accurately predict robot configurations from\nproprioceptive signals. This research contributes to the field of\nrobotic self-modeling, aiming to enhance robot\u2019s understanding\nof their physical embodiment and adaptability in real-world\nscenarios.\nI."}, {"group": "Media Studies", "id": 325, "label": "Semi-supervised Stance Detection of Tweets Via Distant Network Supervision", "shape": "dot", "size": 10, "title": "Authors: Soumen Chakrabarti\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Detecting and labeling stance in social media text is strongly moti-\nvated by hate speech detection, poll prediction, engagement fore-\ncasting, and concerted propaganda detection. Today\u2019s best neural\nstance detectors need large volumes of training data, which is dif-\nficult to curate given the fast-changing landscape of social media\ntext and issues on which users opine. Homophily properties over\nthe social network provide strong signal of coarse-grained user-\nlevel stance. But semi-supervised approaches for tweet-level stance\ndetection fail to properly leverage homophily. In light of this, We\npresent SANDS, a new semi-supervised stance detector. SANDS starts\nfrom very few labeled tweets. It builds multiple deep feature views\nof tweets. It also uses a distant supervision signal from the social net-\nwork to provide a surrogate loss signal to the component learners.\nWe prepare two new tweet datasets comprising over 236,000 politi-\ncally tinted tweets from two demographics (US and India) posted\nby over 87,000 users, their follower-followee graph, and over 8,000\ntweets annotated by linguists. SANDS achieves a macro-F1 score of\n0.55 (0.49) on US (India)-based datasets, outperforming 17 baselines\n(including variants of SANDS) substantially, particularly for minor-\nity stance labels and noisy text. Numerous ablation experiments on\nSANDS disentangle the dynamics of textual and network-propagated\nstance signals.\nACM Reference Format:\n1Subhabrata Dutta, 2Samiya Caur, 3Soumen Chakrabarti, 2Tanmoy Chakraborty.\n2022. Semi-supervised Stance Detection of Tweets Via Distant Network\nSupervision. In Proceedings of the Fifteenth ACM International Conference on\nWeb Search and Data Mining (WSDM \u201922), February 21\u201325, 2022, Tempe, AZ,\nUSA. ACM, New York, NY, USA, 11 pages. https://doi.org/10.1145/3488560.\n3498511"}, {"group": "Structural Biology", "id": 326, "label": "On the Persistence of Higher-Order Interactions in Real-World Hypergraphs A hypergraph, which generalizes an ordinary graph, naturally represents group interactions as hyperedges", "shape": "dot", "size": 10, "title": "Authors: Hyunjin Choo\u2217, Kijung Shin\u2020\u003cbr\u003eYear: 2022\u003cbr\u003eAbstract: A hypergraph, which generalizes an ordinary graph, naturally represents group interactions as hyperedges\n(i.e., arbitrary-sized subsets of nodes). Such group interactions are ubiquitous: the sender and receivers of an\nemail, the co-authors of a publication, and the items co-purchased by a customer, to name a few. A higher-\norder interaction (HOI) in a hypergraph is de\ufb01ned as the co-appearance of a set of nodes in any hyperedge.\nOur focus is the persistence of HOIs repeated over time, which is naturally interpreted as the strength of\ngroup relationships, aiming at answering three questions: (a) How do HOIs in real-world hypergraphs persist\nover time? (b) What are the key factors governing the persistence? (c) How accurately can we predict the\npersistence?\nIn order to answer the questions above, we investigate the persistence of HOIs in 13 real-world hypergraphs\nfrom six domains. First, we de\ufb01ne how to measure the persistence of HOIs. Then, we examine global patterns\nand anomalies in the persistence, revealing a power-law relationship. After that, we study the relations between\nthe persistence and 16 structural features of HOIs, some of which are closely related to the persistence. Lastly,\nbased on the 16 structural features, we assess the predictability of the persistence under various settings and\n\ufb01nd strong predictors. Note that predicting the persistence of HOIs has many potential applications, such as\nrecommending items to be purchased together and predicting missing recipients of emails.\nKeywords: Temporal Hypergraph, Higher-Order Interaction, Persistence, Predictability"}, {"group": "Structural Biology", "id": 327, "label": "Graph embedding techniques have led to signi\ufb01-", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2013\u003cbr\u003eAbstract: Graph embedding techniques have led to signi\ufb01-\ncant progress in recent years.\nHowever, present\ntechniques are not effective enough to capture the\npatterns of networks. This paper propose neigh-\nbor2vec, a neighbor-based sampling strategy used\nalgorithm to learn the neighborhood representa-\ntions of node, a framework to gather the struc-\nture information by feature propagation between\nthe node and its neighbors. We claim that neigh-\nbor2vec is a simple and effective approach to en-\nhancing the scalability as well as equality of graph\nembedding, and it breaks the limits of the exist-\ning state-of-the-art unsupervised techniques.\nWe\nconduct experiments on several node classi\ufb01ca-\ntion and link prediction tasks for networks such\nas ogbn-arxiv, ogbn-products, ogbn-proteins, ogbl-\nppa,ogbl-collab and ogbl-citation2.\nThe result\nshows that Neighbor2vec\u2019s representations pro-\nvide an average accuracy scores up to 6.8 percent\nhigher than competing methods in node classi\ufb01ca-\ntion tasks and 3.0 percent higher in link prediction\ntasks. The neighbor2vec\u2019s representations are able\nto outperform all baseline methods and two classi-\ncal GNN models in all six experiments."}, {"group": "Structural Biology", "id": 328, "label": "Noname manuscript No.", "shape": "dot", "size": 10, "title": "Authors: Weiqing Wang, Hongzhi Yin, Lei Zhao(B, Xiaofang Zhou\u003cbr\u003eYear: 2010\u003cbr\u003eAbstract: Sources of complementary information are\nconnected when we link user accounts belonging to the\nsame user across di\ufb00erent platforms or devices. The\nexpanded information promotes the development of a\nwide range of applications, such as cross-platform pre-\ndiction, cross-platform recommendation, and advertise-\nment. Due to the signi\ufb01cance of user account linkage\nand the widespread popularization of GPS-enabled mo-\nbile devices, there are increasing research studies on\nlinking user account with spatio-temporal data across\nlocation-aware social networks. Being di\ufb00erent from most\nexisting studies in this domain that only focus on the\ne\ufb00ectiveness, we propose a novel framework entitled\nHFUL (A Hybrid Framework for User Account Linkage\nacross Location-Aware Social Networks), where e\ufb03ciency,\ne\ufb00ectiveness, scalability, robustness, and application of\nuser account linkage are considered. Speci\ufb01cally, to im-\nprove the e\ufb03ciency, we develop a comprehensive in-\ndex structure from the spatio-temporal perspective, and\ndesign novel pruning strategies to reduce the search\nWei Chen\nrobertchen@suda.edu.cn\nWeiqing Wang\nteresa.wang@monash.edu\nHongzhi Yin\ny.yin1@uq.edu.au\nLei Zhao\nzhaol@suda.edu.cn\nXiaofang Zhou\nzxf@cse.ust.hk\n1Institute of Arti\ufb01cial Intelligence, School of Computer Sci-\nence and Technology, Soochow University, China\n2Faculty of Information Technology, Monash University, Mel-\nbourne, Australia\n3School of ITEE, The University of Queensland, Bribane,\nAustralia\n4The Hong Kong University of Science and Technology, Hong\nKong, China\nspace. To improve the e\ufb00ectiveness, a kernel density\nestimation-based method has been proposed to alle-\nviate the data sparsity problem in measuring users\u2019\nsimilarities. Additionally, we investigate the application\nof HFUL in terms of user prediction, time prediction,\nand location prediction. The extensive experiments con-\nducted on three real-world datasets demonstrate the su-\nperiority of HFUL in terms of e\ufb00ectiveness, e\ufb03ciency,\nscalability, robustness, and application compared with\nthe state-of-the-art methods.\nKeywords User Account Linkage \u00b7 Social Networks \u00b7\nLocation Data"}, {"group": "Media Studies", "id": 329, "label": "Format guide for AIRCC", "shape": "dot", "size": 10, "title": "Authors: David C. Wyld, Emmanuel Etuh, Francis S. Bakpo, Eneh Agozie H\u003cbr\u003eYear: 2017\u003cbr\u003eAbstract: We live in a virtual world where actual lifestyles are replicated.  The growing reliance on the \nuse of social media networks worldwide has resulted in great concern for information security. \nOne of the factors popularizing the social media platforms is how they connect people \nworldwide to interact, share content, and engage in mutual interactions of common interest that \ncut across geographical boundaries. Behind all these incredible gains are digital crime \nequivalence that threatens the physical socialization. Criminal minded elements and hackers \nare exploiting Social Media Platforms (SMP) for many nefarious activities to harm others. As \ndetection tools are developed to control these crimes, hackers\u2019 tactics and techniques are \nconstantly evolving. Hackers are constantly developing new attacking tools and hacking \nstrategies to gain malicious access to systems and attack social media network thereby making \nit difficult for security administrators and organizations to develop and implement the proper \npolicies and procedures necessary to prevent the hackers\u2019 attacks. The increase in cyber-attacks \non the social media platforms calls for urgent and more intelligent security measures to \nenhance the effectiveness of social media platforms. This paper explores the mode and tactics of \nhackers\u2019 mode of attacks on social media and ways of preventing their activities against users to \nensure secure social cyberspace and enhance virtual socialization. Social media platforms are \nbriefly categorized, the various types of attacks are also highlighted with current state-of-the-art  \npreventive mechanisms to overcome the attacks as proposed in research works, finally, social \nmedia intrusion detection mechanism is suggested as a second line of defence to combat \ncybercrime on social media networks \n \nKEYWORDS \n \nIntrusion Detection System, Data Warehouse, Machine Learning, Hackers, Social Media \nPlatform, Online Social Network Intrusion. \n \n1."}, {"group": "Structural Biology", "id": 330, "label": "Differentially Describing Groups of Graphs How does neural connectivity in autistic children differ from", "shape": "dot", "size": 10, "title": "Authors: Sebastian Dalleiger, *, Jilles Vreeken\u003cbr\u003eYear: 2020\u003cbr\u003eAbstract: How does neural connectivity in autistic children differ from\nneural connectivity in healthy children or autistic youths?\nWhat patterns in global trade networks are shared across\nclasses of goods, and how do these patterns change over time?\nAnswering questions like these requires us to differentially\ndescribe groups of graphs: Given a set of graphs and a parti-\ntion of these graphs into groups, discover what graphs in one\ngroup have in common, how they systematically differ from\ngraphs in other groups, and how multiple groups of graphs are\nrelated. We refer to this task as graph group analysis, which\nseeks to describe similarities and differences between graph\ngroups by means of statistically signi\ufb01cant subgraphs. To per-\nform graph group analysis, we introduce GRAGRA, which\nuses maximum entropy modeling to identify a non-redundant\nset of subgraphs with statistically signi\ufb01cant associations to\none or more graph groups. Through an extensive set of ex-\nperiments on a wide range of synthetic and real-world graph\ngroups, we con\ufb01rm that GRAGRA works well in practice."}, {"group": "Structural Biology", "id": 331, "label": "VGAER: Graph Neural Network Reconstruction based Community Detection Chenyang Qiu, Zhaoci Huang, Wenzhe Xu, Huijia Li* \u2020", "shape": "dot", "size": 10, "title": "Authors: Chenyang Qiu, Zhaoci Huang, Wenzhe Xu, Huijia Li, cyqiu\u003cbr\u003eYear: 2012\u003cbr\u003eAbstract: Community detection is a fundamental and important issue\nin network science, but there are only a few community de-\ntection algorithms based on graph neural networks, among\nwhich unsupervised algorithms are almost blank. By fus-\ning the high-order modularity information with network fea-\ntures, this paper proposes a Variational Graph AutoEncoder\nReconstruction based community detection VGAER for the\n\ufb01rst time, and gives its non-probabilistic version. They do\nnot need any prior information. We have carefully designed\ncorresponding input features, decoder, and downstream tasks\nbased on the community detection task and these designs\nare concise, natural, and perform well (NMI values under\nour design are improved by 59.1% - 565.9%). Based on\na series of experiments with wide range of datasets and\nadvanced methods, VGAER has achieved superior perfor-\nmance and shows strong competitiveness and potential with\na simpler design. Finally, we report the results of algo-\nrithm convergence analysis and t-SNE visualization, which\nclearly depicted the stable performance and powerful net-\nwork modularity ability of VGAER. Our codes are available\nat https://github.com/qcydm/VGAER."}, {"group": "Media Studies", "id": 332, "label": "Understanding how people consume low quality and extreme news using web Zhouhan Chen, Juliana Freire, Jonathan Nagler, Joshua A. Tucker", "shape": "dot", "size": 10, "title": "Authors: Zhouhan Chen, Juliana Freire, Jonathan Nagler, Haohan Chen\u003cbr\u003eYear: 2017\u003cbr\u003eAbstract: To mitigate the spread of fake news, researchers need to un-\nderstand who visit fake new sites, what brings people to those\nsites, where visitors come from, and what content they pre-\nfer to consume. In this paper, we analyze web traf\ufb01c data\nfrom The Gateway Pundit (TGP), a popular far-right website\nthat is known for repeatedly sharing false information that\nhas made its web traf\ufb01c available to the general public. We\ncollect data on 68 million web traf\ufb01c visits to the site over\na month period and analyze how people consume news via\nmultiple features. Our traf\ufb01c analysis shows that search en-\ngines and social media platforms are main drivers of traf\ufb01c;\nour geo-location analysis reveals that TGP is more popular in\ncounties that voted for Trump in 2020; and our topic analy-\nsis shows that conspiratorial articles receive more visits than\nfactual articles.\nDue to the inability to observe direct website traf\ufb01c, exist-\ning research uses alternative data source such as engage-\nment signals from social media posts. To validate if social\nmedia engagement signals correlate with actual web visit\ncounts, we collect all Facebook and Twitter posts with URLs\nfrom TGP during the same time period. We show that all en-\ngagement signals positively correlate with web visit counts,\nbut with varying correlation strengths. Metrics based on Face-\nbook posts correlate better than metrics based on Twitter. Our\nunique web traf\ufb01c data set and insights can help researchers\nto better measure the impact of far-right and fake news URLs\non social media platforms."}, {"group": "Robotics", "id": 333, "label": "Generating Connected, Simple, and Realistic Cyber Graphs for Smart Grids", "shape": "dot", "size": 10, "title": "Authors: Katherine Davis\u003cbr\u003eYear: 2019\u003cbr\u003eAbstract: \u2014Smart grids integrate communication systems with\npower networks to enable power grids operation and command\nthrough real-time data collection and control signals. Designing,\nanalyzing, and simulating smart grid infrastructures as well\nas predicting the impact of power network failures strongly\ndepend on the topologies of the underlying power network\nand communication system. Despite the substantial impact that\nthe communication systems bring to smart grid operation, the\ntopology of communication systems employed in smart grids\nwas less studied. The power community lacks realistic generative\ncommunication system models that can be calibrated to match\nreal-world data. To address this issue, this paper proposes a\nframework to generate the underlying topological graphs for\nthe communication systems deployed in smart grids by mim-\nicking the topology of real-world smart grids. In this regard,\nwe have updated the Chung-Lu algorithm to guarantee the\ncommunication network connectivity and to match the degree\ndistribution of a real-world smart grid rather than following\nan expected degree distribution. In addition, key characteristics\nof communication systems such as diameter, average shortest\npaths, clustering coef\ufb01cients, assortativity, and spectral gap were\ntaken into consideration to generate the most similar real-world\ncommunication network for smart grid studies. We believe that\nthe proposed algorithm to generate realistic cyber graphs for\nsmart grid studies will bene\ufb01t the power community.\nNOMENCLATURE\nG, V, E\nGraph, set of nodes, set of edges\nn, m P Z\n|V|, |E|\nu.d P R\nDegree of a node u\nS P Zn\nDegree sequence\nd P Z\nMax. degree\nx\np\u00a8q\nNormalization operation s.t. \u0159n\n1 x\np\u00a8q \u201c 1\nD P Zd\nDegree vector D \u201c r1, . . . , ds\npK P Rd\nNormalized frequency vector\nG.g P t0, 1u G is graphical (no self loops and parallel edges)\nG.c P t0, 1u G is connected\n\u03c1 P R\nDensity as m{n\nI P R\nDiameter as the longest shortest path\nrsp P R\nAverage shortest path\ncc P R\nClustering coef\ufb01cient\na P R\nAssortativity as the Pearson correlation coef\ufb01-\ncient of degrees between pairs of linked nodes\n\u03bb P R\nSpectral gap as the minimum non-zero eigen-\nvalue of the normalized Laplacian\nThis work was supported by NSF under Award Number 1808064.\nI."}, {"group": "Media Studies", "id": 334, "label": "No Community Can Do Everything: Why People Participate in Similar Online Communities", "shape": "dot", "size": 10, "title": "Authors: NATHAN TEBLUNTHUIS, CHARLES KIENE, ISABELLA BROWN, LAURA (ALIA) LEVI, USANICOLE MCGINNIS, BENJAMIN MAKO HILL, Nathan TeBlunthuis, Charles Kiene, Isabella Brown, Laura (Alia) Levi, Nicole McGinnis, Benjamin Mako, Hill\u003cbr\u003eYear: 2019\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Data Science", "id": 335, "label": "A simple article template", "shape": "dot", "size": 10, "title": "Authors: Ran Ziv, Ilan Gronau, Michael Fire\u003cbr\u003eYear: 2010\u003cbr\u003eAbstract: Entity Matching is an essential part of all real-world systems that take in structured and un-\nstructured data coming from di\ufb00erent sources. Typically no common key is available for connecting\nrecords. Massive data cleaning and integration processes require completion before any data ana-\nlytics, or further processing can be performed. Although record linkage is frequently regarded as a\nsomewhat tedious but necessary step, it reveals valuable insights, supports data visualization, and\nguides further analytic approaches to the data. Here, we focus on organization entity matching. We\nintroduce CompanyName2Vec, a novel algorithm to solve company entity matching (CEM) using a\nneural network model to learn company name semantics from a job ad corpus, without relying on\nany information on the matched company besides its name. Based on a real-world data, we show\nthat CompanyName2Vec outperforms other evaluated methods and solves the CEM challenge with\nan average success rate of 89.3%.\nKeywords: Entity Matching, Organization Name Matching, LSTM, CompanyName2Vec"}, {"group": "Media Studies", "id": 336, "label": "An Intelligent System for Multi-topic Social Spam Detection in Microblogging", "shape": "dot", "size": 10, "title": "Authors: Dana Al Qudah, Malak Al-Hassan, Seyed Mohssen Ghafari, Tomayess Issa, Ibrahim Aljarah, Amin Beheshti, Sulaiman Alqahtani\u003cbr\u003eYear: 2017\u003cbr\u003eAbstract: : The communication revolution has perpetually reshaped the means through which people send and \nreceive information. Social media is an important pillar of this revolution and has brought profound changes to \nvarious aspects of our lives. However, the open environment and popularity of these platforms inaugurate \nwindows of opportunities for various cyber threats, thus social networks have become a fertile venue for \nspammers and other illegitimate users to execute their malicious activities. These activities include phishing hot \nand trendy topics and posting a wide range of contents in many topics. Hence, it is crucial to continuously \nintroduce new techniques and approaches to detect and stop this category of users. This paper proposes a \nnovel and effective approach to detect social spammers. An investigation into several attributes to measure \ntopic-dependent and topic-independent users\u2019 behaviours on Twitter is carried out. The experiments of this \nstudy are undertaken on various machine learning classifiers. The performance of these classifiers are compared \nand their effectiveness is measured via a number of robust evaluation measures. Further, the proposed approach \nis benchmarked against state-of-the-art social spam and anomalous detection techniques. These experiments \nreport the effectiveness and utility of the proposed approach and embedded modules. \nKeywords: Social Spammers, Online Social Networks, Machine Learning, Social Credibility, Semantic Analysis, \nCyber Threats. \n1."}, {"group": "Media Studies", "id": 337, "label": "This Must Be the Place: Predicting Engagement of Online Communities in a Large-scale Distributed Campaign", "shape": "dot", "size": 10, "title": "Authors: Abraham Israeli, Alexander Kremiansky, Oren Tsur\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Understanding collective decision making at a large-scale, and elu-\ncidating how community organization and community dynamics\nshape collective behavior are at the heart of social science research.\nIn this work we study the behavior of thousands of communities\nwith millions of active members. We define a novel task: predict-\ning which community will undertake an unexpected, large-scale,\ndistributed campaign. To this end, we develop a hybrid model, com-\nbining textual cues, community meta-data, and structural proper-\nties. We show how this multi-faceted model can accurately predict\nlarge-scale collective decision-making in a distributed environment.\nWe demonstrate the applicability of our model through Reddit\u2019s\nr/place \u2013 a large-scale online experiment in which millions of\nusers, self-organized in thousands of communities, clashed and\ncollaborated in an effort to realize their agenda.\nOur hybrid model achieves a high F1 prediction score of 0.826.\nWe find that coarse meta-features are as important for prediction\naccuracy as fine-grained textual cues, while explicit structural fea-\ntures play a smaller role. Interpreting our model, we provide and\nsupport various social insights about the unique characteristics of\nthe communities that participated in the r/place experiment.\nOur results and analysis shed light on the complex social dy-\nnamics that drive collective behavior, and on the factors that pro-\npel user coordination. The scale and the unique conditions of the\nr/place experiment suggest that our findings may apply in broader\ncontexts, such as online activism, (countering) the spread of hate\nspeech and reducing political polarization. The broader applica-\nbility of the model is demonstrated through an extensive analysis\nof the WallStreetBets community, their role in r/place and four\nyears later, in the GameStop short squeeze campaign of 2021.\nCCS CONCEPTS\n\u2022 Computing methodologies \u2192Neural networks; \u2022 Informa-\ntion systems \u2192Social networks; \u2022 Applied computing \u2192Ethnog-\nraphy; Sociology; \u2022 Social and professional topics \u2192Cultural\ncharacteristics;\nPermission to make digital or hard copies of all or part of this work for personal or\nclassroom use is granted without fee provided that copies are not made or distributed\nfor profit or commercial advantage and that copies bear this notice and the full citation\non the first page. Copyrights for components of this work owned by others than the\nauthor(s) must be honored. Abstracting with credit is permitted. To copy otherwise, or\nrepublish, to post on servers or to redistribute to lists, requires prior specific permission\nand/or a fee. Request permissions from permissions@acm.org.\nWWW \u201922, April 25\u201329, 2022, Virtual Event, Lyon, France\n\u00a9 2022 Copyright held by the owner/author(s). Publication rights licensed to ACM.\nACM ISBN 978-1-4503-9096-5/22/04...$15.00\nhttps://doi.org/10.1145/3485447.3512238\nKEYWORDS\nOnline Communities, Natural Language Processing, Social Net-\nworks, Computational Social Science, Reddit, rPlace, wallStreetBets,\nGameStop\nACM Reference Format:\nAbraham Israeli, Alexander Kremiansky, Oren Tsur. 2022. This Must Be\nthe Place: Predicting Engagement of Online Communities in a Large-scale\nDistributed Campaign. In Proceedings of the ACM Web Conference 2022\n(WWW \u201922), April 25\u201329, 2022, Virtual Event, Lyon, France. ACM, New York,\nNY, USA, 12 pages. https://doi.org/10.1145/3485447.3512238"}, {"group": "Structural Biology", "id": 338, "label": "NCPAM16_313", "shape": "dot", "size": 10, "title": "Authors: B Jaganathan, Pankaj Shukla\u003cbr\u003eYear: 2019\u003cbr\u003eAbstract: \u2014The purpose of the research is to find a centrality \nmeasure that can be used in place of PageRank and to find out \nthe conditions where we can use it in place of PageRank. After \nanalysis and comparison of graphs with a large number of nodes \nusing Spearman\u2019s Rank Coefficient Correlation, the conclusion is \nevident that Eigenvector can be safely used in place of PageRank \nin directed networks to improve the performance in terms of the \ntime complexity.\nKeywords\u2014 PageRank, Centrality, Eigenvector, Webgraph\nI."}, {"group": "Media Studies", "id": 339, "label": "A Fine-Grained Analysis of Public Opinion toward Chinese Technology Enting Zhou*, Yurong Liu*, Hanjia Lyu, Jiebo Luo", "shape": "dot", "size": 10, "title": "Authors: Enting Zhou, Yurong Liu, Hanjia Lyu\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: In the face of the growing global in\ufb02uence and prevalence\nof Chinese technology companies, governments worldwide\nhave expressed concern and mistrust toward these compa-\nnies. There is a scarcity of research that speci\ufb01cally exam-\nines the widespread public response to this phenomenon on a\nlarge scale. This study aims to \ufb01ll in the gap in understanding\npublic opinion toward Chinese technology companies using\nReddit data, a popular news-oriented social media platform.\nWe employ the state-of-the-art transformer model to build\na reliable sentiment classi\ufb01er. We then use LDA to extract\nthe topics associated with positive and negative comments.\nWe also conduct content analysis by studying the changes in\nthe semantic meaning of the companies\u2019 names over time.\nOur main \ufb01ndings include the following: 1) Notable differ-\nence exists in the proportions of positive comments (8.42%)\nand negative comments (14.12%); 2) Positive comments are\nmostly associated with the companies\u2019 consumer products,\nsuch as smartphones, laptops, and wearable electronics. Neg-\native comments have a more diverse topic distribution (no-\ntable topics include criticism toward the platform, dissatisfac-\ntion with the companies\u2019 smartphone products, companies\u2019\nties to the Chinese government, data security concerns, 5G\nconstruction, and general political discussions); and 3) Char-\nacterization of each technology company is usually centered\naround a particular predominant theme related to the com-\npany, while real-world political events may trigger drastic\nchanges in users\u2019 characterization."}, {"group": "Structural Biology", "id": 340, "label": "Predicting Research Trends in Arti\ufb01cial Intelligence with Gradient Boosting Decision Trees and", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2020\u003cbr\u003eAbstract: \u2014The Science4cast 2021 competition focuses on pre-\ndicting future edges in an evolving semantic network, where each\nvertex represents an arti\ufb01cial intelligence concept, and an edge\nbetween a pair of vertices denotes that the two concepts have\nbeen investigated together in a scienti\ufb01c paper. In this paper,\nwe describe our solution to this competition. We present two\ndistinct approaches: a tree-based gradient boosting approach and\na deep learning approach, and demonstrate that both approaches\nachieve competitive performance. Our \ufb01nal solution, which is\nbased on a blend of the two approaches, achieved the 1st place\namong all the participating teams. The source code for this paper\nis available at https://github.com/YichaoLu/Science4cast2021.\nIndex Terms\u2014semantic network, link prediction, network\nanalysis, feature engineering, graph neural network\nI."}, {"group": "Media Studies", "id": 341, "label": "\u201cI Can\u2019t Keep It Up.\u201d A Dataset from the Defunct Voat.co News Aggregator", "shape": "dot", "size": 10, "title": "Authors: Amin Mekacher\u003cbr\u003eYear: 2022\u003cbr\u003eAbstract: Voat.co was a news aggregator website that shut down on De-\ncember 25, 2020. The site had a troubled history and was\nknown for hosting various banned subreddits.\nThis paper\npresents a dataset with over 2.3M submissions and 16.2M\ncomments posted from 113K users in 7.1K subverses (the\nequivalent of subreddit for Voat).\nOur dataset covers the\nwhole lifetime of Voat, from its developing period starting\non November 8, 2013, the day it was founded, April 2014, up\nuntil the day it shut down (December 25, 2020).\nThis work presents the largest and most complete publicly\navailable Voat dataset, to the best of our knowledge. Along\nwith the release of this dataset, we present a preliminary anal-\nysis covering posting activity and daily user and subverse reg-\nistration on the platform so that researchers interested in our\ndataset can know what to expect.\nOur data may prove helpful to false news dissemination\nstudies as we analyze the links users share on the platform,\n\ufb01nding that many communities rely on alternative news press,\nlike Breitbart and GatewayPundit, for their daily discussions.\nIn addition, we perform network analysis on user interactions\n\ufb01nding that many users prefer not to interact with subverses\noutside their narrative interests, which could be helpful to re-\nsearchers focusing on polarization and echo chambers. Also,\nsince Voat was one of the platforms banned Reddit commu-\nnities migrated to, we are con\ufb01dent our dataset will motivate\nand assist researchers studying deplatforming. Finally, many\nhateful and conspiratorial communities were very popular on\nVoat, which makes our work valuable for researchers focus-\ning on toxicity, conspiracy theories, cross-platform studies of\nsocial networks, and natural language processing."}, {"group": "Media Studies", "id": 342, "label": "Understanding Political Polarization via Jointly Modeling Users, Connections and Multimodal Contents on Heterogeneous Graphs", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2016\u003cbr\u003eAbstract: Understanding political polarization on social platforms is\nimportant as public opinions may become increasingly ex-\ntreme when they are circulated in homogeneous communi-\nties, thus potentially causing damage in the real world. Au-\ntomatically detecting the political ideology of social media\nusers can help better understand political polarization. How-\never, it is challenging due to the scarcity of ideology la-\nbels, complexity of multimodal contents, and cost of time-\nconsuming data collection process. Most previous frame-\nworks either focus on unimodal content or do not scale up\nwell. In this study, we adopt a heterogeneous graph neu-\nral network to jointly model user characteristics, multimodal\npost contents as well as user-item relations in a bipartite graph\nto learn a comprehensive and effective user embedding with-\nout requiring ideology labels. We apply our framework to on-\nline discussions about economy and public health topics. The\nlearned embeddings are then used to detect political ideology\nand understand political polarization. Our framework outper-\nforms the unimodal, early/late fusion baselines, and homoge-\nneous GNN frameworks by a margin of at least 9% absolute\ngain in the area under the receiver operating characteristic on\ntwo social media datasets. More importantly, our work does\nnot require a time-consuming data collection process, which\nallows faster detection and in turn allows the policy makers\nto conduct analysis and design policies in time to respond\nto crises. We also show that our framework learns mean-\ningful user embeddings and can help better understand po-\nlitical polarization. Notable differences in user descriptions,\ntopics, images, and levels of retweet/quote activities are ob-\nserved. Our framework for decoding user-content interaction\nshows wide applicability in understanding political polariza-\ntion. Furthermore, it can be extended to user-item bipartite\ninformation networks for other applications such as content\nand product recommendation."}, {"group": "Media Studies", "id": 343, "label": "Arsal Imtiaz, Danish Khan, Hanjia Lyu, Jiebo Luo University of Rochester, Rochester, New York", "shape": "dot", "size": 10, "title": "Authors: Arsal Imtiaz, Danish Khan, Hanjia Lyu, aimtiaz, dkhan\u003cbr\u003eYear: 2021\u003cbr\u003eAbstract: The Israel-Palestine Con\ufb02ict, one of the most enduring con-\n\ufb02icts in history, dates back to the start of 20th century, with\nthe establishment of the British Mandate in Palestine and has\ndeeply rooted complex issues in politics, demography, reli-\ngion, and other aspects, making it harder to attain resolve. To\nunderstand the con\ufb02ict in 2021, we devise an observational\nstudy to aggregate stance held by English-speaking countries.\nWe collect Twitter data using popular hashtags around and\nspeci\ufb01c to the con\ufb02ict portraying opinions neutral or partial to\nthe two parties. We use different tools and methods to classify\ntweets into pro-Palestinian, pro-Israel, or neutral. This paper\nfurther describes the implementation of data mining method-\nologies to obtain insights and reason the stance held by citi-\nzens around the con\ufb02ict."}, {"group": "Structural Biology", "id": 344, "label": "SigGAN : Adversarial Model for Learning Signed Relationships in Networks", "shape": "dot", "size": 10, "title": "Authors: Roshni Chakraborty, Joydeep Chandra\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Signed link prediction in graphs is an important problem that\nhas applications in diverse domains. It is a binary classi\ufb01cation\nproblem that predicts whether an edge between a pair of nodes\nis positive or negative. Existing approaches for link prediction\nin unsigned networks cannot be directly applied for signed link\nprediction due to their inherent di\ufb00erences. Further, additional\nstructural constraints, like, the structural balance property of the\nsigned networks must be considered for signed link prediction.\nRecent signed link prediction approaches generate node repre-\nsentations using either generative models or discriminative mod-\nels. Inspired by the recent success of Generative Adversarial Net-\nwork (GAN) based models which comprises of a discriminator\nand generator in several applications, we propose a Generative\nAdversarial Network (GAN) based model for signed networks,\nSigGAN. It considers the requirements of signed networks, such\nas, integration of information from negative edges, high imbal-\nance in number of positive and negative edges and structural\nbalance theory. Comparing the performance with state of the\nart techniques on several real-world datasets validates the e\ufb00ec-\ntiveness of SigGAN.\nKEYWORDS\nSigned Networks, Generative Adversarial Networks, Link Pre-\ndiction, Structural Awareness, Structural Balance"}, {"group": "Media Studies", "id": 345, "label": "FacebookConfounding_v1.docx", "shape": "dot", "size": 10, "title": "Authors: Alexander Ruch, Yujia Zhang, Michael Macy\u003cbr\u003eYear: 2015\u003cbr\u003eAbstract: Lifestyle politics emerge when activities that have no substantive relevance to ideology\nbecome politically aligned and polarized. Homophily and social influence are able\ngenerate these fault lines on their own; however, social identities from demographics may\nserve as coordinating mechanisms through which lifestyle politics are mobilized are\nspread. Using a dataset of 137,661,886 observations from 299,327 Facebook interests\naggregated across users of different racial/ethnic, education, age, gender, and income\ndemographics, we find that the most extreme instances of lifestyle politics are those\nwhich are highly confounded by demographics such as race/ethnicity (e.g., Black artists\nand performers). After adjusting political alignment for demographic effects, lifestyle\npolitics decreased by 27.36% toward the political \u201ccenter\u201d and demographically\nconfounded interests were no longer among the most polarized interests. Instead, after\ndemographic deconfounding, we found that the most liberal interests included electric\ncars, Planned Parenthood, and liberal satire while the most conservative interests included\nthe Republican Party and conservative commentators. We validate our measures of\npolitical alignment and lifestyle politics using the General Social Survey and find similar\ndemographic entanglements with lifestyle politics existed before social media such as\nFacebook were ubiquitous, giving us strong confidence that our results are not due to\necho chambers or filter bubbles. Likewise, since demographic characteristics exist prior\nto ideological values, we argue that the demographic confounding we observe is causally\nresponsible for the extreme instances of lifestyle politics that we find among the\naggregated interests. We conclude our paper by relating our results to Simpson\u2019s paradox,\ncultural omnivorousness, and network autocorrelation.\nKeywords: social networks, social media, polarization, lifestyle politics, demographics."}, {"group": "Media Studies", "id": 346, "label": "Millions of Co-purchases and Reviews Reveal the Spread of Polarization and Lifestyle Politics across Online Markets", "shape": "dot", "size": 10, "title": "Authors: Alexander Ruch, Ari Decter-Frain, Raghav Batra\u003cbr\u003eYear: 2019\u003cbr\u003eAbstract: Polarization in America has reached a high point as markets are also becoming polarized. \nExisting research, however, focuses on specific market segments and products and has not \nevaluated this trend\u2019s full breadth. If such fault lines do spread into other segments that are \nnot explicitly political, it would indicate the presence of lifestyle politics \u2013 when ideas and \nbehaviors not inherently political become politically aligned through their connections with \nexplicitly political things. We study the pervasiveness of polarization and lifestyle politics \nover different product segments in a diverse market and test the extent to which consumer- \nand platform-level network effects and morality may explain lifestyle politics. Specifically, \nusing graph and language data from Amazon (82.5M reviews of 9.5M products and product \nand category metadata from 1996\u20132014), we sample 234.6 million relations among"}, {"group": "Media Studies", "id": 347, "label": "Toxic Synergy Between Hate Speech and Fake News Exposure", "shape": "dot", "size": 10, "title": "Authors: Filippo Menczer\u003cbr\u003eYear: 2015\u003cbr\u003eAbstract: Hate speech on social media is a pressing concern. Under-\nstanding the factors associated with hate speech may help\nmitigate it. Here we explore the association between hate\nspeech and exposure to fake news by studying the correla-\ntion between exposure to news from low-credibility sources\nthrough following connections and the use of hate speech on\nTwitter. Using news source credibility labels and a dataset\nof posts with hate speech targeting various populations, we\nfind that hate speakers are exposed to lower percentages of\nposts linking to credible news sources. When taking the tar-\nget population into account, we find that this association is\nmainly driven by anti-semitic and anti-Muslim content. We\nalso observe that hate speakers are more likely to be exposed\nto low-credibility news with low popularity. Finally, while\nhate speech is associated with low-credibility news from par-\ntisan sources, we find that those sources tend to skew to the\npolitical left for antisemitic content and to the political right\nfor hate speech targeting Muslim and Latino populations. Our\nresults suggest that mitigating fake news and hate speech may\nhave synergistic effects."}, {"group": "Structural Biology", "id": 348, "label": "Interest Maximization in Social Networks Rahul Kumar Gautam, Anjeneya Swami Kare, and S. Durga Bhavani", "shape": "dot", "size": 10, "title": "Authors: Rahul Kumar Gautam, Anjeneya Swami Kare\u003cbr\u003eYear: 2017\u003cbr\u003eAbstract: . Nowadays, organizations use viral marketing strategies to promote their products\nthrough social networks. It is expensive to directly send the product promotional information\nto all the users in the network. In this context, Kempe et al. [10] introduced the Influence\nMaximization (IM) problem, which identifies k most influential nodes (spreader nodes), such\nthat the maximum number of people in the network adopts the promotional message.\nMany variants of the IM problem have been studied in the literature, namely, Perfect Evan-\ngelising Set (PES), Perfect Awareness Problem (PAP), etc. In this work, we propose a maxi-\nmization version of PAP called the Interest Maximization problem. Different people have\ndifferent levels of interest in a particular product. This is modeled by assigning an interest\nvalue to each node in the network. Then, the problem is to select k initial spreaders such\nthat the sum of the interest values of the people (nodes) who become aware of the message\nis maximized.\nWe study the Interest Maximization problem under two popular diffusion models: the\nLinear Threshold Model (LTM) and the Independent Cascade Model (ICM). We show that\nthe Interest Maximization problem is NP-Hard under LTM. We give linear programming\nformulation for the problem under LTM. We propose four heuristic algorithms for the In-\nterest Maximization problem: Level Based Greedy Heuristic (LBGH), Maximum Degree\nFirst Heuristic (MDFH), Profit Based Greedy Heuristic (PBGH), and Maximum Profit Based\nGreedy Heuristic (MPBGH). Extensive experimentation has been carried out on many real-\nworld benchmark data sets for both the diffusion models. The results show that among the\nproposed heuristics, MPBGH performs better in maximizing the interest value."}, {"group": "Structural Biology", "id": 349, "label": "Efficient GPU Implementation of Static and Incrementally Expanding DF-P PageRank for Dynamic Graphs", "shape": "dot", "size": 10, "title": "Authors: Subhajit Sahu\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: PageRank is a widely used centrality measure that \"ranks\" vertices\nin a graph by considering the connections and their importance.\nIn this report, we first introduce one of the most efficient GPU\nimplementations of Static PageRank, which recomputes PageRank\nscores from scratch. It uses a synchronous pull-based atomics-free\nPageRank computation, with the low and high in-degree vertices\nbeing partitioned and processed by two separate kernels. Next,\nwe present our GPU implementation of incrementally expanding\n(and contracting) Dynamic Frontier with Pruning (DF-P) PageRank,\nwhich processes only a subset of vertices likely to change ranks.\nIt is based on Static PageRank, and uses an additional partitioning\nbetween low and high out-degree vertices for incremental expan-\nsion of the set of affected vertices with two additional kernels. On\na server with an NVIDIA A100 GPU, our Static PageRank outper-\nforms Hornet and Gunrock\u2019s PageRank implementations by 31\u00d7\nand 5.9\u00d7 respectively. On top of the above, DF-P PageRank outper-\nforms Static PageRank by 2.1\u00d7 on real-world dynamic graphs, and\nby 3.1\u00d7 on large static graphs with random batch updates.\nKEYWORDS\nParallel GPU-based PageRank, Dynamic Frontier approach"}, {"group": "Data Science", "id": 350, "label": "BOND: Bootstrapping From-Scratch Name Disambiguation with Multi-task Promoting", "shape": "dot", "size": 10, "title": "Authors: Yuqing Cheng\u2217\u2020, Fanjin Zhang\u2217\u2021, Jie Tang\u2021\u003cbr\u003eYear: 2015\u003cbr\u003eAbstract: From-scratch name disambiguation is an essential task for estab-\nlishing a reliable foundation for academic platforms. It involves\npartitioning documents authored by identically named individu-\nals into groups representing distinct real-life experts. Canonically,\nthe process is divided into two decoupled tasks: locally estimat-\ning the pairwise similarities between documents followed by glob-\nally grouping these documents into appropriate clusters. However,\nsuch a decoupled approach often inhibits optimal information ex-\nchange between these intertwined tasks. Therefore, we present\nBOND, which bootstraps the local and global informative signals\nto promote each other in an end-to-end regime. Specifically, BOND\nharnesses local pairwise similarities to drive global clustering, sub-\nsequently generating pseudo-clustering labels. These global signals\nfurther refine local pairwise characterizations. The experimental re-\nsults establish BOND\u2019s superiority, outperforming other advanced\nbaselines by a substantial margin. Moreover, an enhanced version,\nBOND+, incorporating ensemble and post-match techniques, rivals\nthe top methods in the WhoIsWho competition1.\nCCS CONCEPTS\n\u2022 Information systems \u2192Data extraction and integration; Entity\nresolution.\nKEYWORDS\nname disambiguation, multi-task learning\n\u2217Equal contribution.\n\u2020Work was done when Yuqing interned at Zhipu AI.\n\u2021Fanjin Zhang and Jie Tang are the corresponding authors.\n1http://whoiswho.biendata.xyz/\nPermission to make digital or hard copies of all or part of this work for personal or\nclassroom use is granted without fee provided that copies are not made or distributed\nfor profit or commercial advantage and that copies bear this notice and the full citation\non the first page. Copyrights for components of this work owned by others than the\nauthor(s) must be honored. Abstracting with credit is permitted. To copy otherwise, or\nrepublish, to post on servers or to redistribute to lists, requires prior specific permission\nand/or a fee. Request permissions from permissions@acm.org.\nWWW \u201924, May 13\u201317, 2024, Singapore, Singapore\n\u00a9 2024 Copyright held by the owner/author(s). Publication rights licensed to ACM.\nACM ISBN 979-8-4007-0171-9/24/05...$15.00\nhttps://doi.org/10.1145/3589334.3645580\nACM Reference Format:\nYuqing Cheng, Bo Chen, Fanjin Zhang, and Jie Tang. 2024. BOND: Boot-\nstrapping From-Scratch Name Disambiguation with Multi-task Promot-\ning. In Proceedings of the ACM Web Conference 2024 (WWW \u201924), May\n13\u201317, 2024, Singapore, Singapore. ACM, New York, NY, USA, 11 pages.\nhttps://doi.org/10.1145/3589334.3645580"}, {"group": "Natural Language Processing", "id": 351, "label": "Targeted aspect-based emotion analysis to detect opportunities and precaution in financial Twitter messages", "shape": "dot", "size": 10, "title": "Authors: Silvia Garc\u00b4\u0131a-M\u00b4endeza, \u2217, Francisco de Arriba-P\u00b4ereza, Ana Barros-Vilaa, Francisco J. Gonz\u00b4alez-Casta\u02dcnoaaInformation\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Microblogging platforms, of which Twitter is a representative example, are valuable information sources for\nmarket screening and financial models. In them, users voluntarily provide relevant information, including\neducated knowledge on investments, reacting to the state of the stock markets in real-time and, often,\ninfluencing this state. We are interested in the user forecasts in financial, social media messages expressing\nopportunities and precautions about assets. We propose a novel Targeted Aspect-Based Emotion Analysis\n(tabea) system that can individually discern the financial emotions (positive and negative forecasts) on the\ndifferent stock market assets in the same tweet (instead of making an overall guess about that whole tweet).\nIt is based on Natural Language Processing (nlp) techniques and Machine Learning streaming algorithms.\nThe system comprises a constituency parsing module for parsing the tweets and splitting them into simpler\ndeclarative clauses; an offline data processing module to engineer textual, numerical and categorical features\nand analyse and select them based on their relevance; and a stream classification module to continuously\nprocess tweets on-the-fly. Experimental results on a labelled data set endorse our solution. It achieves over\n90% precision for the target emotions, financial opportunity, and precaution on Twitter. To the best of\nour knowledge, no prior work in the literature has addressed this problem despite its practical interest in\ndecision-making, and we are not aware of any previous nlp nor online Machine Learning approaches to\ntabea.\nKeywords:\nAspect-Based Emotion Analysis, Machine Learning, Natural Language Processing, Opinion\nMining, Personal Finance Management, Portfolio Optimisation\n1."}, {"group": "Satellite Technology", "id": 352, "label": "Beam Management in Low Earth Orbit Satellite Networks with Random Traffic Arrival and", "shape": "dot", "size": 10, "title": "Authors: Jianfeng Zhu, Yaohua Sun, Mugen Peng\u003cbr\u003eYear: 2012\u003cbr\u003eAbstract: \u2014Low earth orbit (LEO) satellite communication net-\nworks have been considered as promising solutions to providing\nhigh data rate and seamless coverage, where satellite beam\nmanagement plays a key role. However, due to the limitation of\nbeam resource, dynamic network topology, beam spectrum reuse,\ntime-varying traffic arrival and service continuity requirement,\nit is challenging to effectively allocate time-frequency resource\nof satellite beams to multiple cells. In this paper, aiming at\nreducing time-averaged beam revisit time and mitigate inter-\nsatellite handover, a beam management problem is formulated for\ndynamic LEO satellite communication networks, under inter-cell\ninterference and network stability constraints. Particularly, inter-\ncell interference constraints are further simplified into off-axis\nangle based constraints, which provide tractable rules for spec-\ntrum sharing between two beam cells. To deal with the long-term\nperformance optimization, the primal problem is transformed\ninto a series of single epoch problems by adopting Lyapunov\noptimization framework. Since the transformed problem is NP-\nhard, it is further divided into three subproblems, including\nserving beam allocation, beam service time allocation and serving\nsatellite allocation. With the help of conflict graphs built with\noff-axis angle based constraints, serving beam allocation and\nbeam service time allocation algorithms are developed to reduce\nbeam revisit time and cell packet queue length. Then, we further\ndevelop a satellite-cell service relationship optimization algorithm\nto better adapt to dynamic network topology. Compared with\nbaselines, numerical results show that our proposal can reduce\naverage beam revisit time by 20.8% and keep strong network\nstability with similar inter-satellite handover frequency.\nIndex Terms\u2014Low earth orbit satellite communication, beam\nmanagement, beam revisit time, inter-satellite handover, interfer-\nence mitigation.\nI."}, {"group": "Satellite Technology", "id": 353, "label": "Timing Advance Estimation in Low Earth Orbit Jianfeng Zhu, Yaohua Sun and Mugen Peng, Fellow, IEEE", "shape": "dot", "size": 10, "title": "Authors: Jianfeng Zhu, Mugen Peng\u003cbr\u003eYear: 2014\u003cbr\u003eAbstract: \u2014Low earth orbit (LEO) satellite communication\nbased on 3GPP standard is seen as a promising solution to\nrolling out communication services in areas without terrestrial\nbase stations. However, due to the fast movement of satellites\nand large beam footprint size, the existing 5G timing advance\n(TA) estimation mechanism cannot be directly applied when\nglobal navigation satellite system is unavailable. In this article, an\nenhanced TA estimation approach is proposed for LEO satellite\ncommunication networks. Specifically, a user-side time-frequency\npre-compensation method is introduced at first, which leverages\nfrequency offset measurement on synchronization signal blocks\nbroadcasted by satellites in initial cell search phase. For the\nrandom access phase, the upper bound of inter-preamble inter-\nference incurred by partial-period cross-correlation operations\nis derived for a preamble format advised by 3GPP, and it is\nshown that the interference level is closely related to the square\nof the number of such operations. Inspired by this result, a cyclic\nprefix free preamble format is further designed, which features\nextended guard time, differential power allocation and flexible\npreamble structure. Numerical results show that our proposal\ncan reduce the missed detection rate of preamble within a beam.\nParticularly, the missed detection rates of preamble under 32,\n48, and 64 users are lower than 1% when SNR = -6 dB, which\nis a significant improvement compared to baselines. In addition,\nour proposal can limit the TA estimation error of the detected\nusers to the time length of 25 time-domain sampling points when\nthe subcarrier spacing is 30 kHz and operation frequency is 27\nGHz.\nIndex Terms\u2014Low earth orbit satellite, random access, timing\nadvance estimation, preamble format design.\nI."}, {"group": "Satellite Technology", "id": 354, "label": "Beam Management in Low Earth Orbit Satellite Communication With Handover Frequency Control", "shape": "dot", "size": 10, "title": "Authors: Yaohua Sun, Jianfeng Zhu, Mugen Peng\u003cbr\u003eYear: 2011\u003cbr\u003eAbstract: \u2014To achieve ubiquitous wireless connectivity, low\nearth orbit (LEO) satellite networks have drawn much attention.\nHowever, effective beam management is challenging due to time-\nvarying cell load, high dynamic network topology, and complex\ninterference situations. In this paper, under inter-satellite han-\ndover frequency and satellite-terrestrial/inter-beam interference\nconstraints, we formulate a practical beam management problem,\naiming to maximize the long-term service satisfaction of cells.\nParticularly, Lyapunov framework is leveraged to equivalently\ntransform the primal problem into multiple single epoch op-\ntimization problems, where virtual queue stability constraints\nreplace inter-satellite handover frequency constraints. Since each\nsingle epoch problem is NP-hard, we further decompose it into\nthree subproblems, including inter-satellite handover decision,\nbeam hopping design and satellite-terrestrial spectrum sharing.\nFirst, a proactive inter-satellite handover mechanism is developed\nto balance handover frequency and satellite loads. Subsequently,\na beam hopping design algorithm is presented based on conflict\ngraphs to achieve interference mitigation among beams, and then\na flexible satellite-terrestrial spectrum sharing algorithm is de-\nsigned to satisfy the demands of beam cells and improve spectral\nefficiency. Simulation results show that our proposal significantly\nimproves service satisfaction compared with baselines, where the\naverage data queue length of beam cells is reduced by over 50%\nwith affordable handover frequency.\nIndex Terms\u2014Low earth orbit satellite, beam management,\ninter-satellite handover, interference mitigation, spectrum shar-\ning.\nI."}, {"group": "Theoretical Physics", "id": 355, "label": "Rethinking the Graph Polynomial Filter via Positive and Negative Coupling Analysis", "shape": "dot", "size": 10, "title": "Authors: Haodong Wen\u2217\u003cbr\u003eYear: 2018\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Science and Technology", "id": 356, "label": "INTELLIGENT INFORMATION PROCESSING LABORATORY, SCHOOL OF EIE, BEIJING JIAOTONG UNIVERSITY Stampede Alert Clustering Algorithmic System", "shape": "dot", "size": 10, "title": "Authors: Mingze Sun\u2217, Yiqing Wang\u2020, Zhenyi Zhao\u2021\u003cbr\u003eYear: 2015\u003cbr\u003eAbstract: \u2014A novel crowd stampede detection and prediction\nalgorithm based on Deformable DETR is proposed to address the\nchallenges of detecting a large number of small targets and target\nocclusion in crowded airport and train station environments.\nIn terms of model design, the algorithm incorporates a multi-\nscale feature fusion module to enlarge the receptive field and en-\nhance the detection capability of small targets. Furthermore, the\ndeformable attention mechanism is improved to reduce missed\ndetections and false alarms for critical targets [1]. Additionally,\na new algorithm is innovatively introduced for stampede event\nprediction and visualization. Experimental evaluations on the\nPKX-LHR dataset demonstrate that the enhanced algorithm\nachieves an 34% performance in small target detection accuracy\nwhile maintaining the original detection speed.\nIndex Terms\u2014Multi Scale Deformable Attention; small target\ndetection; stampede event prediction; multi-scale feature fusion\nmodule.\nI."}, {"group": "Structural Biology", "id": 357, "label": "Community detection and anomaly prediction in dynamic networks Anomaly detection is an essential task in the analysis of dynamic networks, as it can provide early warning of", "shape": "dot", "size": 10, "title": "Authors: Caterina De Bacco\u003cbr\u003eYear: 2018\u003cbr\u003eAbstract: Anomaly detection is an essential task in the analysis of dynamic networks, as it can provide early warning of\npotential threats or abnormal behavior. We present a principled approach to detect anomalies in dynamic networks\nthat integrates community structure as a foundational model for regular behavior. Our model identifies anomalies as\nirregular edges while capturing structural changes. Leveraging a Markovian approach for temporal transitions and\nincorporating structural information via latent variables for communities and anomaly detection, our model infers these\nhidden parameters to pinpoint abnormal interactions within the network. Our approach is evaluated on both synthetic\nand real-world datasets. Real-world network analysis shows strong anomaly detection across diverse scenarios. In a\nmore specific study of transfers of professional male football players, we observe various types of unexpected patterns\nand investigate how the country and wealth of clubs influence interactions. Additionally, we identify anomalies between\nclubs with incompatible community memberships, but also instances of anomalous transactions between clubs with\nsimilar memberships. The latter is due in particular to the dynamic nature of the transactions, as we find that the\nfrequency of transfers results in anomalous behaviors that are otherwise expected to interact as they belong to similar\ncommunities.\nI."}, {"group": "Structural Biology", "id": 358, "label": "CORE: Data Augmentation for Link Prediction via Information Bottleneck", "shape": "dot", "size": 10, "title": "Authors: Nitesh V. Chawla\u003cbr\u003eYear: 2020\u003cbr\u003eAbstract: Link prediction (LP) is a fundamental task in graph representation\nlearning, with numerous applications in diverse domains. However,\nthe generalizability of LP models is often compromised due to the\npresence o
