Electromagnetic slot models are employed to efficiently simulate electromagnetic penetration through open-\nings in an otherwise closed electromagnetic scatterer. Such models, which incorporate varying assumptions\nabout the geometry of the openings, are typically coupled with electromagnetic surface integral equations\nthat model electromagnetic scattering. In this paper, we introduce novel code-verification approaches and\nbuild upon our previously developed methodologies to assess the correctness of the numerical implementa-\ntion of an arbitrary-depth slot model. Through these approaches, we measure the convergence rates of the\ndifferent interacting sources of numerical error and demonstrate the impact of various factors on these rates\nfor several cases.\nKeywords:\nelectromagnetic penetration, code verification, electric-field integral equation, manufactured\nsolutions, electromagnetic slot models\n1."}, {"group": "Natural Language Processing", "id": 49, "label": "Cognitive-Mental-LLM: Evaluating Reasoning in Large Language Models for Mental Health", "shape": "dot", "size": 10, "title": "Authors: Avinash Patil, Amardeep Kour Gedhu\u003cbr\u003eYear: 2016\u003cbr\u003eAbstract: \u2014Large Language Models (LLMs) have demonstrated\npotential in predicting mental health outcomes from online text,\nyet traditional classification methods often lack interpretabil-\nity and robustness. This study evaluates structured reason-\ning techniques\u2014Chain-of-Thought (CoT), Self-Consistency (SC-\nCoT), and Tree-of-Thought (ToT)\u2014to improve classification\naccuracy across multiple mental health datasets sourced from\nReddit. We analyze reasoning-driven prompting strategies, in-\ncluding Zero-shot CoT and Few-shot CoT, using key performance\nmetrics such as Balanced Accuracy, F1 score, and Sensitiv-\nity/Specificity. Our findings indicate that reasoning-enhanced\ntechniques improve classification performance over direct predic-\ntion, particularly in complex cases. Compared to baselines such\nas Zero Shot non-CoT Prompting, and fine-tuned pre-trained\ntransformers such as BERT and Mental-RoBerta, and fine-\ntuned Open Source LLMs such as Mental Alpaca and Mental-\nFlan-T5, reasoning-driven LLMs yield notable gains on datasets\nlike Dreaddit (+0.52% over M-LLM, +0.82% over BERT) and\nSDCNL (+4.67% over M-LLM, +2.17% over BERT). However,\nperformance declines in Depression Severity, and CSSRS predic-\ntions suggest dataset-specific limitations, likely due to our using\na more extensive test set. Among prompting strategies, Few-shot\nCoT consistently outperforms others, reinforcing the effective-\nness of reasoning-driven LLMs. Nonetheless, dataset variability\nhighlights challenges in model reliability and interpretability.\nThis study provides a comprehensive benchmark of reasoning-\nbased LLM techniques for mental health text classification. It\noffers insights into their potential for scalable clinical applications\nwhile identifying key challenges for future improvements. Code,\nprompts and llm reasoning for classification are available at\nhttps://github.com/av9ash/cognitive mental llm\nIndex Terms\u2014Large Language Models, Reasoning, Mental\nHealth Prediction, Chain-of-Thought, Self-consistency, Tree-of-\nthought, Few-shot learning, Natural Language Processing, Online\nText Analysis\nI."}, {"group": "Theoretical Physics", "id": 50, "label": "Constraint-based causal discovery with tiered background knowledge and latent variables in single or overlapping datasets", "shape": "dot", "size": 10, "title": "Authors: Christine W Bang, Vanessa Didelez, Biwei Huang, Mathias Drton\u003cbr\u003eYear: 2017\u003cbr\u003eAbstract: In this paper we consider the use of tiered background knowledge within constraint based causal\ndiscovery. Our focus is on settings relaxing causal sufficiency, i.e. allowing for latent variables\nwhich may arise because relevant information could not be measured at all, or not jointly, as in\nthe case of multiple overlapping datasets. We first present novel insights into the properties of\nthe \u2018tiered FCI\u2019 (tFCI) algorithm. Building on this, we introduce a new extension of the IOD\n(integrating overlapping datasets) algorithm incorporating tiered background knowledge, the \u2018tiered\nIOD\u2019 (tIOD) algorithm. We show that under full usage of the tiered background knowledge tFCI\nand tIOD are sound, while simple versions of the tIOD and tFCI are sound and complete. We\nfurther show that the tIOD algorithm can often be expected to be considerably more efficient and\ninformative than the IOD algorithm even beyond the obvious restriction of the Markov equivalence\nclasses. We provide a formal result on the conditions for this gain in efficiency and informativeness.\nOur results are accompanied by a series of examples illustrating the exact role and usefulness of\ntiered background knowledge.\nKeywords: Causal inference, graphical models, multi-cohort studies, temporal structure\n1."}, {"group": "Game Theory", "id": 51, "label": "CONSUMPTION-PORTFOLIO CHOICE WITH PREFERENCES FOR LIQUID ASSETS Guohui Guana,b,\u2217, Jiaqi Huc,\u2020, Zongxia Liangc,\u2021", "shape": "dot", "size": 10, "title": "Authors: Guohui Guana, Jiaqi Huc, \u2020\u003cbr\u003eYear: 2020\u003cbr\u003eAbstract: . This paper investigates an infinite horizon, discounted, consumption-portfolio prob-\nlem in a market with one bond, one liquid risky asset, and one illiquid risky asset with pro-\nportional transaction costs.\nWe consider an agent with liquidity preference, modeled by a\nCobb-Douglas utility function that includes the liquid wealth. We analyze the properties of\nthe value function and divide the solvency region into three regions: the buying region, the\nno-trading region, and the selling region, and prove that all three regions are non-empty. We\nmathematically characterize and numerically solve the optimal policy and prove its optimality.\nOur numerical analysis sheds light on the impact of various parameters on the optimal policy,\nand some intuition and economic insights behind it are also analyzed. We find that liquidity\npreference encourages agents to retain more liquid wealth and inhibits consumption, and may\neven result in a negative allocation to the illiquid asset. The liquid risky asset not only affects\nthe location of the three regions but also has an impact on consumption. However, whether\nthis impact on consumption is promoted or inhibited depends on the degree of risk aversion of\nagents.\n2020 Mathematics Subject Classification: 91G10, 49L12, 91B05, 93E20\nJEL Classifications: G11, C61, E21\nKeywords: Consumption-portfolio choice; Singular stochastic control; Transaction costs; Mul-\ntiple assets; Liquidity preference; Hamilton-Jacobi-Bellman equation.\n1."}, {"group": "Natural Language Processing", "id": 52, "label": "Contextual AD Narration with Interleaved Multimodal Sequence", "shape": "dot", "size": 10, "title": "Authors: Hanlin Wang, Zhan Tong, Kecheng Zheng, Yujun Shen, Limin Wang, \u2020, Lisa, Lisa, Reese Witherspoon, Annie, Kathryn Hahn, Terry, Shelley Conn., Lisa, Lisa\u003cbr\u003eYear: 2018\u003cbr\u003eAbstract: The Audio Description (AD) task aims to generate\ndescriptions of visual elements for visually impaired indi-\nviduals to help them access long-form video content, like\nmovies. With video feature, text, character bank and context\ninformation as inputs, the generated ADs are able to cor-\nrespond to the characters by name and provide reasonable,\ncontextual descriptions to help audience understand the sto-\nryline of movie. To achieve this goal, we propose to leverage\npre-trained foundation models through a simple and unified\nframework to generate ADs with interleaved multimodal\nsequence as input, termed as Uni-AD. To enhance the\nalignment of features across various modalities with finer\ngranularity, we introduce a simple and lightweight module\nthat maps video features into the textual feature space.\nMoreover, we also propose a character-refinement module\n\u2020Corresponding author.\nto provide more precise information by identifying the main\ncharacters who play more significant roles in the video\ncontext. With these unique designs, we further incorporate\ncontextual information and a contrastive loss into our\narchitecture to generate smoother and more contextually\nappropriate ADs.\nExperiments on multiple AD datasets\nshow that Uni-AD performs well on AD generation, which\ndemonstrates the effectiveness of our approach. Our code\nis available at: https://github.com/ant-research/UniAD.\n1."}, {"group": "Logic", "id": 53, "label": "Contextual Similarity Distillation: Ensemble Uncertainties with a Single Model", "shape": "dot", "size": 10, "title": "Authors: Moritz A. Zanger\u003cbr\u003eYear: 2010\u003cbr\u003eAbstract: Uncertainty quantification is a critical aspect of reinforcement learning and deep\nlearning, with numerous applications ranging from efficient exploration and sta-\nble offline reinforcement learning to outlier detection in medical diagnostics. The\nscale of modern neural networks, however, complicates the use of many theoret-\nically well-motivated approaches such as full Bayesian inference. Approximate\nmethods like deep ensembles can provide reliable uncertainty estimates but still\nremain computationally expensive. In this work, we propose contextual simi-\nlarity distillation, a novel approach that explicitly estimates the variance of an\nensemble of deep neural networks with a single model, without ever learning\nor evaluating such an ensemble in the first place. Our method builds on the\npredictable learning dynamics of wide neural networks, governed by the neural\ntangent kernel, to derive an efficient approximation of the predictive variance of\nan infinite ensemble. Specifically, we reinterpret the computation of ensemble\nvariance as a supervised regression problem with kernel similarities as regression\ntargets. The resulting model can estimate predictive variance at inference time\nwith a single forward pass, and can make use of unlabeled target-domain data\nor data augmentations to refine its uncertainty estimates. We empirically val-\nidate our method across a variety of out-of-distribution detection benchmarks\nand sparse-reward reinforcement learning environments. We find that our single-\nmodel method performs competitively and sometimes superior to ensemble-based\nbaselines and serves as a reliable signal for efficient exploration. These results,\nwe believe, position contextual similarity distillation as a principled and scalable\nalternative for uncertainty quantification in reinforcement learning and general\ndeep learning."}, {"group": "Logic", "id": 54, "label": "Continual learning via probabilistic exchangeable sequence modelling", "shape": "dot", "size": 10, "title": "Authors: Hanwen Xing, Christopher Yau\u003cbr\u003eYear: 2019\u003cbr\u003eAbstract: Continual learning (CL) refers to the ability to\ncontinuously learn and accumulate new knowl-\nedge while retaining useful information from past\nexperiences. Although numerous CL methods\nhave been proposed in recent years, it is not\nstraightforward to deploy them directly to real-\nworld decision-making problems due to their com-\nputational cost and lack of uncertainty quantifi-\ncation. To address these issues, we propose CL-\nBRUNO, a probabilistic, Neural Process-based\nCL model that performs scalable and tractable\nBayesian update and prediction. Our proposed\napproach uses deep-generative models to create\na unified probabilistic framework capable of han-\ndling different types of CL problems such as task-\nand class-incremental learning, allowing users to\nintegrate information across different CL scenar-\nios using a single model. Our approach is able\nto prevent catastrophic forgetting through distri-\nbutional and functional regularisation without the\nneed of retaining any previously seen samples,\nmaking it appealing to applications where data\nprivacy or storage capacity is of concern. Experi-\nments show that CL-BRUNO outperforms exist-\ning methods on both natural image and biomedi-\ncal data sets, confirming its effectiveness in real-\nworld applications.\n1."}, {"group": "Theoretical Physics", "id": 55, "label": "CONTRACTION RATES AND PROJECTION SUBSPACE ESTIMATION WITH GAUSSIAN PROCESS PRIORS IN HIGH", "shape": "dot", "size": 10, "title": "Authors: Elie ODIN, Fran\u00e7ois BACHOC, Agn\u00e8s LAGNOUX\u003cbr\u003eYear: 2016\u003cbr\u003eAbstract: This work explores the dimension reduction problem for Bayesian nonparametric regression and density\nestimation. More precisely, we are interested in estimating a functional parameter f over the unit ball in Rd,\nwhich depends only on a d\u2217-dimensional subspace of Rd, with d\u2217\u003c d. It is well-known that rescaled Gaus-\nsian process priors over a given function space achieve smoothness adaptation and posterior contraction with\nnear minimax-optimal rates. Furthermore, hierarchical extensions of this approach, equipped with subspace\nprojection, can also adapt to the intrinsic dimension d\u2217([Tok11]). When the ambient dimension d does not\nvary with n, the minimax rate remains of the order n\u2212\u03b2/(2\u03b2+d\u2217), where \u03b2 denotes the smoothness of f. How-\never, this is up to multiplicative constants that can become prohibitively large as d increases. The dependence\nbetween the contraction rate and the ambient dimension has not been fully explored yet and this work provides\na first insight: we let the dimensions d\u2217and d grow with n, and by combining the arguments of [Tok11] and\n[CR24], we derive growth rates for them that still lead to posterior consistency with minimax rate. We also\ndiscuss the optimality of the growth rate for d. Additionally, we provide a set of assumptions under which a\nconsistent estimation of f leads to correct estimation of the subspace projection, assuming that d\u2217is known.\n*elie.odin@math.univ-toulouse.fr\n\u2020francois.bachoc@math.univ-toulouse.fr\n\u2021lagnoux@univ-tlse2.fr\n1\narXiv:2403.03540v2  [math.ST]  27 Mar 2025\nCONTRACTION RATES AND PROJECTION SUBSPACE ESTIMATION WITH GP PRIORS IN HIGH DIMENSION"}, {"group": "Structural Biology", "id": 56, "label": "Cost-effective multi-fidelity strategy for the optimization of high-Reynolds number turbine flows guided by LES", "shape": "dot", "size": 10, "title": "Authors: LESCamille Matara, Paola Cinnellab\u003cbr\u003eYear: 2016\u003cbr\u003eAbstract: A cost-effective multi-objective shape optimization strategy is proposed for high-Reynolds number flows involving\ncomplex phenomena such as boundary layer transition, shock-wave interactions, and turbulent wakes. These processes\nare poorly captured by Reynolds-Averaged Navier\u2013Stokes (RANS) models, necessitating higher-fidelity approaches\nlike Large Eddy Simulation (LES). However, LES is computationally prohibitive at high Reynolds numbers, making\nits direct use in optimization impractical. To address this, we introduce a low-dimensional design space representa-\ntion using Singular Value Decomposition (SVD) and construct a multi-fidelity co-Kriging (MFK) surrogate model\ncombining wall-resolved LES (WRLES) and RANS. Adaptive infill criteria are employed to strategically enrich the\nsurrogate model within a limited computational budget (fewer than 10 LES samples). The methodology is applied\nto optimize a supersonic turbine vane for Organic Rankine Cycles (ORC), operating at Reynolds numbers of \u223c106.\nWhile RANS-LES correlation weakens near the optimal region, the MFK model outperforms single-fidelity Krig-\ning (SFK) trained on the same LES data, effectively leveraging both abundant low-fidelity and scarce high-fidelity\ndata. RANS accurately predicts global objective function trends but fails to resolve key flow features, whereas the\nMFK model captures fine-detail geometry trends from LES. Loss analysis reveals that LES is essential for identifying\nperformance-detrimental mechanisms, while RANS-only optimization yields sub-optimal designs.\nKeywords: Large Eddy Simulation, Surrogate-based optimization, Turbulent flow, Infill strategy, High-pressure\nturbine, Organic Rankine Cycle\n1."}, {"group": "Logic", "id": 57, "label": "Counterfactual Influence in Markov Decision Processes", "shape": "dot", "size": 10, "title": "Authors: Kazemi, Jessica Lally, Ekaterina Tishchenko, Hana Chockler, Nicola Paoletti, Biwei Huang, Mathias Drton\u003cbr\u003eYear: 2022\u003cbr\u003eAbstract: Our work addresses a fundamental problem in the context of counterfactual inference for Markov\nDecision Processes (MDPs). Given an MDP path \u03c4, counterfactual inference allows us to derive\ncounterfactual paths \u03c4 \u2032 describing what-if versions of \u03c4 obtained under different action sequences\nthan those observed in \u03c4. However, as the counterfactual states and actions deviate from the observed\nones over time, the observation \u03c4 may no longer influence the counterfactual world, meaning that\nthe analysis is no longer tailored to the individual observation, resulting in interventional outcomes\nrather than counterfactual ones. This issue specifically affects the popular Gumbel-max structural\ncausal model used for MDP counterfactuals, and yet, it has remained overlooked until now. In\nthis work, we introduce a formal characterisation of influence based on comparing counterfactual\nand interventional distributions. We devise an algorithm to construct counterfactual models that\nautomatically satisfy influence constraints. Leveraging such models, we derive counterfactual\npolicies that are not just optimal for a given reward structure but also remain tailored to the observed\npath. Even though there is an unavoidable trade-off between policy optimality and strength of\ninfluence constraints, our experiments demonstrate that it is possible to derive (near-)optimal policies\nwhile remaining under the influence of the observation.\nKeywords: Counterfactual Inference, Markov Decision Processes\n1."}, {"group": "Structural Biology", "id": 58, "label": "Critical Iterative Denoising  A Discrete Generative Model Applied to Graphs", "shape": "dot", "size": 10, "title": "Authors: Alexandros Kalousis\u003cbr\u003eYear: 2020\u003cbr\u003eAbstract: Discrete Diffusion and Flow Matching models\nhave significantly advanced generative modeling\nfor discrete structures, including graphs. How-\never, the time dependencies in the noising process\nof these models lead to error accumulation and\npropagation during the backward process. This\nissue, particularly pronounced in mask diffusion,\nis a known limitation in sequence modeling and,\nas we demonstrate, also impacts discrete diffusion\nmodels for graphs.\nTo address this problem, we propose a novel\nframework called Iterative Denoising, which sim-\nplifies discrete diffusion and circumvents the is-\nsue by assuming conditional independence across\ntime. Additionally, we enhance our model by\nincorporating a Critic, which during generation\nselectively retains or corrupts elements in an in-\nstance based on their likelihood under the data\ndistribution.\nOur empirical evaluations demonstrate that the\nproposed method significantly outperforms exist-\ning discrete diffusion baselines in graph genera-\ntion tasks.\n1."}, {"group": "Structural Biology", "id": 59, "label": "DATA-WA: Demand-based Adaptive Task Assignment with Dynamic Worker Availability", "shape": "dot", "size": 10, "title": "Authors: Jinwen Chen, Jiannan Guo, Dazhuo Qiu, Yawen Li, Guanhua Ye, Yan Zhao, B, Kai Zheng, B\u003cbr\u003eYear: 2020\u003cbr\u003eAbstract: \u2014With the rapid advancement of mobile networks\nand the widespread use of mobile devices, spatial crowdsourcing,\nwhich involves assigning location-based tasks to mobile workers,\nhas gained significant attention. However, most existing research\nfocuses on task assignment at the current moment, overlooking\nthe fluctuating demand and supply between tasks and workers\nover time. To address this issue, we introduce an adaptive task\nassignment problem, which aims to maximize the number of\nassigned tasks by dynamically adjusting task assignments in\nresponse to changing demand and supply. We develop a spatial\ncrowdsourcing framework, namely demand-based adaptive task\nassignment with dynamic worker availability windows, which\nconsists of two components including task demand prediction\nand task assignment. In the first component, we construct a\ngraph adjacency matrix representing the demand dependency\nrelationships in different regions and employ a multivariate\ntime series learning approach to predict future task demands.\nIn the task assignment component, we adjust tasks to workers\nbased on these predictions, worker availability windows, and the\ncurrent task assignments, where each worker has an availability\nwindow that indicates the time periods they are available for\ntask assignments. To reduce the search space of task assignments\nand be efficient, we propose a worker dependency separation\napproach based on graph partition and a task value function with\nreinforcement learning. Experiments on real data demonstrate\nthat our proposals are both effective and efficient.\nIndex Terms\u2014task assignment, spatial crowdsourcing, task\ndemand\nI."}, {"group": "Media Studies", "id": 60, "label": "Datasets for Depression Modeling in Social Media: An Overview", "shape": "dot", "size": 10, "title": "Authors: Ana-Maria Bucur, Andreea-Codrina Moldovan, Krutika Parvatikar, Ashiqur R. KhudaBukhsh, Liviu P Dinu\u003cbr\u003eYear: 2011\u003cbr\u003eAbstract: Depression is the most common mental health\ndisorder, and its prevalence increased during\nthe COVID-19 pandemic. As one of the most\nextensively researched psychological condi-\ntions, recent research has increasingly focused\non leveraging social media data to enhance\ntraditional methods of depression screening.\nThis paper addresses the growing interest in\ninterdisciplinary research on depression, and\naims to support early-career researchers by pro-\nviding a comprehensive and up-to-date list of\ndatasets for analyzing and predicting depres-\nsion through social media data. We present an\noverview of datasets published between 2019\nand 2024. We also make the comprehensive\nlist of datasets available online as a continu-\nously updated resource, with the hope that it\nwill facilitate further interdisciplinary research\ninto the linguistic expressions of depression on\nsocial media."}, {"group": "Logic", "id": 61, "label": "Debiased Offline Representation Learning for Fast Online Adaptation in Non-stationary Dynamics", "shape": "dot", "size": 10, "title": "Authors: Xinyu Zhang, Wenjie Qiu, Yi-Chen Li\u003cbr\u003eYear: 2010\u003cbr\u003eAbstract: Developing policies that can adapt to non-\nstationary environments is essential for real-world\nreinforcement learning applications. Neverthe-\nless, learning such adaptable policies in offline\nsettings, with only a limited set of pre-collected\ntrajectories, presents significant challenges. A\nkey difficulty arises because the limited offline\ndata makes it hard for the context encoder to dif-\nferentiate between changes in the environment\ndynamics and shifts in the behavior policy, of-\nten leading to context misassociations. To ad-\ndress this issue, we introduce a novel approach\ncalled Debiased Offline Representation learning\nfor fast online Adaptation (DORA). DORA in-\ncorporates an information bottleneck principle\nthat maximizes mutual information between the\ndynamics encoding and the environmental data,\nwhile minimizing mutual information between\nthe dynamics encoding and the actions of the be-\nhavior policy. We present a practical implemen-\ntation of DORA, leveraging tractable bounds of\nthe information bottleneck principle. Our experi-\nmental evaluation across six benchmark MuJoCo\ntasks with variable parameters demonstrates that\nDORA not only achieves a more precise dynam-\nics encoding but also significantly outperforms\nexisting baselines in terms of performance.\n1."}, {"group": "Structural Biology", "id": 62, "label": "Deep Cut-informed Graph Embedding and Clustering", "shape": "dot", "size": 10, "title": "Authors: Zhiyuan Ninga, Zaitian Wanga, Ran Zhanga, Ping Xua, Kunpeng Liuc, Pengyang Wangd, Wei Jue, Pengfei Wanga, Yuanchun Zhoua, Erik Cambriaf\u003cbr\u003eYear: 2010\u003cbr\u003eAbstract: Graph clustering aims to divide the graph into different clusters. The recently\nemerging deep graph clustering approaches are largely built on graph neu-\nral networks (GNN). However, GNN is designed for general graph encoding\nand there is a common issue of representation collapse in existing GNN-\nbased deep graph clustering algorithms. We attribute two main reasons for\nsuch issues: (i) the inductive bias of GNN models: GNNs tend to gener-\nate similar representations for proximal nodes. Since graphs often contain a\nnon-negligible amount of inter-cluster links, the bias results in error message\npassing and leads to biased clustering; (ii) the clustering guided loss function:\nmost traditional approaches strive to make all samples closer to pre-learned\ncluster centers, which causes a degenerate solution assigning all data points\nto a single label thus make all samples and less discriminative. To address\nthese challenges, we investigate graph clustering from a graph cut perspective\nand propose an innovative and non-GNN-based Deep Cut-informed Graph\nembedding and Clustering framework, namely DCGC. This framework in-\ncludes two modules: (i) cut-informed graph encoding; (ii) self-supervised\ngraph clustering via optimal transport. For the encoding module, we derive\n\u2217Corresponding author.\n1Equal contribution.\nPreprint submitted to Information Fusion\nMarch 28, 2025\narXiv:2503.06635v2  [cs.LG]  27 Mar 2025\na cut-informed graph embedding objective to fuse graph structure and at-\ntributes by minimizing their joint normalized cut. For the clustering module,\nwe utilize the optimal transport theory to obtain the clustering assignments,\nwhich can balance the guidance of \u201cproximity to the pre-learned cluster cen-\nter\u201d. With the above two tailored designs, DCGC is more suitable for the\ngraph clustering task, which can effectively alleviate the problem of repre-\nsentation collapse and achieve better performance. We conduct extensive\nexperiments to demonstrate that our method is simple but effective com-\npared with benchmarks.\nKeywords:\nGraph Embedding, Deep Clustering, Cut-informed\nRose.\n2015\nXi.\n2015\nLucy.\n2016\nRoc.\n2017\nKumar.\n2015\nMike.\n2014\nLily.\n2014\nChris.\n2013\nAnna.\n2014\nBar.\n2002\nXu.\n2016\nVo.\n2013\nStein.\n2017\nEyal.\n2016\n(a) GNN-based\nRose.\n2015\nXi.\n2015\nLucy.\n2016\nRoc.\n2017\nKumar.\n2015\nMike.\n2014\nLily.\n2014\nChris.\n2013\nAnna.\n2014\nBar.\n2002\nXu.\n2016\nVo.\n2013\nStein.\n2017\nEyal.\n2016\n(b) Cut-informed\nFigure 1: The motivation of our deep cut-informed graph embedding and clustering: (a)\nthe GNN-based methods can lead to error message passing when noisy links exist. (b)\nOur cut-informed approach learns embeddings corresponding to minimal normalized cut.\n1."}, {"group": "Data Science", "id": 63, "label": "DeepIFSAC: Deep Imputation of Missing Values Using Feature and Sample Attention within Contrastive Framework", "shape": "dot", "size": 10, "title": "Authors: Ibna Kowsar, Shourav B. Rabbani, Yina Hou, Manar D. Samad\u003cbr\u003eYear: 2013\u003cbr\u003eAbstract: Missing values of varying patterns and rates in real-world tabular data pose a significant challenge\nin developing reliable data-driven models. The most commonly used statistical and machine learn-\ning methods for missing value imputation may be ineffective when the missing rate is high and\nnot random. This paper explores row and column attention in tabular data as between-feature and\nbetween-sample attention in a novel framework to reconstruct missing values. The proposed method\nuses CutMix data augmentation within a contrastive learning framework to improve the uncertainty\nof missing value estimation. The performance and generalizability of trained imputation models are\nevaluated in set-aside test data folds with missing values. The proposed framework is compared\nwith 11 state-of-the-art statistical, machine learning, and deep imputation methods using 12 diverse\ntabular data sets. The average performance rank of our proposed method demonstrates its superi-\nority over the state-of-the-art methods for missing rates between 10% and 90% and three missing\nvalue types, especially when the missing values are not random. The quality of the imputed data\nusing our proposed method is compared in a downstream patient classification task using real-world\nelectronic health records. This paper highlights the heterogeneity of tabular data sets to recommend\nimputation methods based on missing value types and data characteristics.\nKeywords attention, missing values, imputation, tabular data, contrastive learning, CutMix."}, {"group": "Structural Biology", "id": 64, "label": "DeepSilencer: A Novel Deep Learning Model for Predicting siRNA Knockdown Efficiency", "shape": "dot", "size": 10, "title": "Authors: Wangdan Liao, Weidong Wang\u003cbr\u003eYear: 2020\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Theoretical Physics", "id": 65, "label": "Demand Estimation with Text and Image Data\u2217 University of Chicago", "shape": "dot", "size": 10, "title": "Authors: Giovanni Compiani, Ilya Morozov, Stephan Seiler, Steve Berry, Alex Burnap, Matt Gentzkow, Joonhwi Joo, Philip Haile, Yufeng Huang, Ayush Kanodia, Carl Mela, Sanjog Misra, Olivia Natan, Matt Osborne, Katja Seim, Adam Smith, Yuyan, Wang, Kevin Williams, Celina Park, Tanner Parsons, James Ryan, Janani Sekar, Andrew Sharng, Franklin She, Adam Sy, Vitalii Tubdenov, Giovanni Com-piani, Ilya Morozov, Stephan Seiler, Giovanni Compiani, Hausman\u003cbr\u003eYear: 2014\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Structural Biology", "id": 66, "label": "Detecting Arbitrary Planted Subgraphs in Random", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2014\u003cbr\u003eAbstract: The problems of detecting and recovering planted structures/subgraphs in Erd\u02ddos-\nR\u00b4enyi random graphs, have received signi\ufb01cant attention over the past three decades,\nleading to many exciting results and mathematical techniques. However, prior work\nhas largely focused on speci\ufb01c ad hoc planted structures and inferential settings, while\na general theory has remained elusive. In this paper, we bridge this gap by investigat-\ning the detection of an arbitrary planted subgraph \u0393 = \u0393n in an Erd\u02ddos-R\u00b4enyi random\ngraph G(n, qn), where the edge probability within \u0393 is pn. We examine both the sta-\ntistical and computational aspects of this problem and establish the following results.\nIn the dense regime, where the edge probabilities pn and qn are \ufb01xed, we tightly char-\nacterize the information-theoretic and computational thresholds for detecting \u0393, and\nprovide conditions under which a computational-statistical gap arises. Most notably,\nthese thresholds depend on \u0393 only through its number of edges, maximum degree, and\nmaximum subgraph density. Our lower and upper bounds are general and apply to any\nvalue of pn and qn as functions of n. Accordingly, we also analyze the sparse regime\nwhere qn = \u0398(n\u2212\u03b1) and pn \u2212qn = \u0398(qn), with \u03b1 \u2208[0, 2], as well as the critical regime\nwhere pn = 1 \u2212o(1) and qn = \u0398(n\u2212\u03b1), both of which have been widely studied, for\nspeci\ufb01c choices of \u0393. For these regimes, we show that our bounds are tight for all\nplanted subgraphs investigated in the literature thus far\u2014and many more. Finally, we\nidentify conditions under which detection undergoes sharp phase transition, where the\nboundaries at which algorithms succeed or fail shift abruptly as a function of qn."}, {"group": "Structural Biology", "id": 67, "label": "Differentiable Lagrangian Shock Hydrodynamics with application to stable shock acceleration of density interfaces", "shape": "dot", "size": 10, "title": "Authors: Kevin Korner, Brandon Talamini, Julian Andrej, Michael Tupek, Bill Moses, Rob Rieben, Tzanio Kolev, Jamie Bramwell, Dan White, Jon Belof, William Schill, Lawrence Livermore\u003cbr\u003eYear: 2010\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Game Theory", "id": 68, "label": "Diffusion on the circle and a stochastic Department of Management Sciences, Indian Institute of Technology", "shape": "dot", "size": 10, "title": "Authors: Sourav Majumdar, Arnab Kumar\u003cbr\u003eYear: 2013\u003cbr\u003eAbstract: We propose analytically tractable SDE models for correlation in financial markets.\nWe study diffusions on the circle, namely the Brownian motion on the circle and the\nvon Mises process, and consider these as models for correlation.\nThe von Mises\nprocess was proposed in Kent 1975 as a probabilistic justification for the von Mises\ndistribution which is widely used in Circular statistics. The transition density of the\nvon Mises process has been unknown, we identify an approximate analytic transition\ndensity for the von Mises process. We discuss the estimation of these diffusion models\nand a stochastic correlation model in finance. We illustrate the application of the\nproposed model on real-data of equity-currency pairs.\nKeywords: Directional Statistics, Statistical inference of continuous-time processes, von\nMises process, Quantitative Finance\n1\narXiv:2412.06343v2  [math.ST]  26 Mar 2025"}, {"group": "Logic", "id": 69, "label": "Do We Need to Verify Step by Step? Rethinking Process Supervision from a Theoretical Perspective", "shape": "dot", "size": 10, "title": "Authors: Alexander Rakhlin, Tengyang Xie\u003cbr\u003eYear: 2022\u003cbr\u003eAbstract: As large language models have evolved, it has become crucial to distinguish between process super-\nvision and outcome supervision\u2014two key reinforcement learning approaches to complex reasoning tasks.\nWhile process supervision o\ufb00ers intuitive advantages for long-term credit assignment, the precise rela-\ntionship between these paradigms has remained an open question. Conventional wisdom suggests that\noutcome supervision is fundamentally more challenging due to the trajectory-level coverage problem,\nleading to signi\ufb01cant investment in collecting \ufb01ne-grained process supervision data.\nIn this paper, we take steps towards resolving this debate. Our main theorem shows that, under\nstandard data coverage assumptions, reinforcement learning through outcome supervision is no more\nstatistically di\ufb03cult than through process supervision, up to polynomial factors in horizon. At the core of\nthis result lies the novel Change of Trajectory Measure Lemma\u2014a technical tool that bridges return-based\ntrajectory measure and step-level distribution shift. Furthermore, for settings with access to a veri\ufb01er or\na rollout capability, we prove that any policy\u2019s advantage function can serve as an optimal process reward\nmodel, providing a direct connection between outcome and process supervision. These \ufb01ndings suggest\nthat the empirically observed performance gap\u2014if any\u2014between outcome and process supervision likely\nstems from algorithmic limitations rather than inherent statistical di\ufb03culties, potentially transforming\nhow we approach data collection and algorithm design for reinforcement learning."}, {"group": "Theoretical Physics", "id": 70, "label": "Double Blind Imaging with Generative Modeling University of Texas at Austin", "shape": "dot", "size": 10, "title": "Authors: Brett Levac, Ajil Jalal, Kannan Ramchandran, Jonathan I. Tamir\u003cbr\u003eYear: 2020\u003cbr\u003eAbstract: Blind inverse problems in imaging arise from uncertain-\nties in the system used to collect (noisy) measurements of\nimages. Recovering clean images from these measurements\ntypically requires identifying the imaging system, either im-\nplicitly or explicitly. A common solution leverages genera-\ntive models as priors for both the images and the imaging\nsystem parameters (e.g., a class of point spread functions).\nTo learn these priors in a straightforward manner requires\naccess to a dataset of clean images as well as samples of the\nimaging system. We propose an AmbientGAN-based gener-\native technique to identify the distribution of parameters in\nunknown imaging systems, using only unpaired clean im-\nages and corrupted measurements. This learned distribu-\ntion can then be used in model-based recovery algorithms\nto solve blind inverse problems such as blind deconvolu-\ntion. We successfully demonstrate our technique for learn-\ning Gaussian blur and motion blur priors from noisy mea-\nsurements and show their utility in solving blind deconvolu-\ntion with diffusion posterior sampling.\n1."}, {"group": "Structural Biology", "id": 71, "label": "Dynamics-Aware Gaussian Splatting Streaming", "shape": "dot", "size": 10, "title": "Authors: Zhening Liu, Yingdong Hu, Xinjie Zhang, Rui Song, Jiawei Shao, Zehong Lin, Jun Zhang\u003cbr\u003eYear: 2014\u003cbr\u003eAbstract: The recent development of 3D Gaussian Splatting (3DGS)\nhas led to great interest in 4D dynamic spatial reconstruc-\ntion. Existing approaches mainly rely on full-length multi-\nview videos, while there has been limited exploration of on-\nline reconstruction methods that enable on-the-fly training\nand per-timestep streaming. Current 3DGS-based stream-\ning methods treat the Gaussian primitives uniformly and\nconstantly renew the densified Gaussians, thereby overlook-\ning the difference between dynamic and static features as\nwell as neglecting the temporal continuity in the scene. To\naddress these limitations, we propose a novel three-stage\npipeline for iterative streamable 4D dynamic spatial recon-\nstruction. Our pipeline comprises a selective inheritance\nstage to preserve temporal continuity, a dynamics-aware\nshift stage to distinguish dynamic and static primitives and\noptimize their movements, and an error-guided densifica-\ntion stage to accommodate emerging objects. Our method\nachieves state-of-the-art performance in online 4D recon-\nstruction, demonstrating the fastest on-the-fly training, su-\nperior representation quality, and real-time rendering ca-\npability. Project page: https://www.liuzhening.\ntop/DASS\n1."}, {"group": "Logic", "id": 72, "label": "Efficient Continual Adaptation of Pretrained Robotic Policy with Online Meta-Learned Adapters", "shape": "dot", "size": 10, "title": "Authors: Ruiqi Zhu, Endong Sun, Guanhe Huang, Oya Celiktutan\u003cbr\u003eYear: 2018\u003cbr\u003eAbstract: \u2014 Continual adaptation is essential for general au-\ntonomous agents. For example, a household robot pretrained\nwith a repertoire of skills must still adapt to unseen tasks\nspecific to each household. Motivated by this, building upon\nparameter-efficient fine-tuning in language models, prior works\nhave explored lightweight adapters to adapt pretrained policies,\nwhich can preserve learned features from the pretraining phase\nand demonstrate good adaptation performances. However, these\napproaches treat task learning separately, limiting knowledge\ntransfer between tasks. In this paper, we propose Online Meta-\nLearned adapters (OMLA). Instead of applying adapters di-\nrectly, OMLA can facilitate knowledge transfer from previously\nlearned tasks to current learning tasks through a novel meta-\nlearning objective. Extensive experiments in both simulated\nand real-world environments demonstrate that OMLA can lead\nto better adaptation performances compared to the baseline\nmethods. The project link: https://ricky-zhu.github.\nio/OMLA/.\nI."}, {"group": "Natural Language Processing", "id": 73, "label": "Embodied-Reasoner: Synergizing Visual Search, Reasoning, and Action for Embodied Interactive Tasks", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2014\u003cbr\u003eAbstract: Recent advances in deep thinking models have demon-\nstrated remarkable reasoning capabilities on mathematical\nand coding tasks. However, their effectiveness in embod-\nied domains which require continuous interaction with en-\nvironments through image action interleaved trajectories\nremains largely -unexplored. We present Embodied Rea-\nsoner, a model that extends o1 style reasoning to interac-\ntive embodied search tasks. Unlike mathematical reason-\ning that relies primarily on logical deduction, embodied\nscenarios demand spatial understanding, temporal reason-\ning, and ongoing self-reflection based on interaction his-\ntory. To address these challenges, we synthesize 9.3k co-\nherent Observation-Thought-Action trajectories containing\n64k interactive images and 90k diverse thinking processes\n(analysis, spatial reasoning, reflection, planning, and verifi-\ncation). We develop a three stage training pipeline that pro-\ngressively enhances the model\u2019s capabilities through imita-\ntion learning, self exploration via rejection sampling, and\nself-correction through reflection tuning.\nThe evaluation\nshows that our model significantly outperforms those ad-\nvanced visual reasoning models, e.g., it exceeds OpenAI o1,\no3-mini, and Claude-3.7 by +9%, 24%, and +13%. Analy-\nsis reveals our model exhibits fewer repeated searches and\nlogical inconsistencies, with particular advantages in com-\nplex long horizon tasks. Real-world environments also show\nour superiority while exhibiting fewer repeated searches\nand logical inconsistency cases.\n*The first two authors have equal contributions.\n\u2020Corresponding author.\nObs1\nThought1\nAction1\nTask\nQ: Could you find \nthe keychain and \nthen put it beside \nthe desk lamp?\n\u003cSelf-Reflection\u003e The above places were \nnot found. I need to reflect on my search \nplan. I may overlooked some potential \nlocations. Perhaps it is in the drawer \u2026\n\u003cVerification\u003e\u2026\u003cTask Planning\u003e Where \nis the drawer? I need ..\n\u003cAction\u003e Observe \nEmbodied-Reasoner\n\u003cAction\u003e\nNavigate to sidetable\nNavigate to desk\n\u2026.\nObsn\nThoughtn\nActionn\n\u2026.\n\u003cSituation Analysis\u003e Let me \nobserve the room and analyze \u2026\n\u003cSpatial Reasoning\u003e According to \nthe objects and layout of the room ... \n\u003cTask Planning\u003e I will search for \nthe keychain, which may be on the \nbedside table, desk, or left on the sofa. \nThen, I need to find the desk lamp\u2026\n\u2022\nInteractive Scenario\n\u2022\nLong-horizon Search Task\n\u2022\nImage-text Interleaved Trajectory\n\u2022\nSpontaneous Reasoning with \nCoherent and Diverse Thoughts\n#0 Init\n#1 Navigate to sidetable\n#2 Navigate to desk\n#0 Init\n#1 Nav to Countertop\n#4 Nav to Countertop\n#6 Nav to Cabinet\n#7 Open Cabinet\n#10 Put in microwave\n\u2026.\nReal-world Experiment:  Can you help me find the coffee and heat it up?\n#8 Pickup\u2026\nTried searching multiple areas but didn\u0027t find coffee.\nAfter reflection, realize that it may be hidden in cabinet\n\u2026.\n\u2026.\n#1\n#2\n#3\n#4\nFigure 1.\nWe design an embodied interactive task: searching\nfor objects in an unknown room. Then we propose Embodied-\nReasoner, which presents spontaneous reasoning and interac-\ntion ability.\nBefore each action, it generates diverse thoughts,\ne.g., self-reflection or spatial reasoning, forming an image-text in-\nterleaved trajectory. It shows consistent reasoning and efficient\nsearch behaviors, whereas OpenAI o3-mini often exhibits repeti-\ntive searches and logical inconsistencies with higher failure rates.\n1."}, {"group": "Structural Biology", "id": 74, "label": "Energy Efficiency trends in HPC: what high-energy and astrophysicists need to know", "shape": "dot", "size": 10, "title": "Authors: Estela Suarez, Jorge Amaya, Martin Frank, Oliver Freyermuth, MariaGirone, Bartosz Kostrzewa, Susanne Pfalzner, Estela Suarez\u003cbr\u003eYear: 2011\u003cbr\u003eAbstract: The growing energy demands of High Performance Computing (HPC) systems have made\nenergy efficiency a critical concern for system developers and operators. However, HPC users\nare generally less aware of how these energy concerns influence the design, deployment,\nand operation of supercomputers even though they experience the consequences. This paper\nexamines the implications of HPC\u2019s energy consumption, providing an overview of current trends\naimed at improving energy efficiency. We describe how hardware innovations such as energy-\nefficient processors, novel system architectures, power management techniques, and advanced\nscheduling policies do have a direct impact on how applications need to be programmed and\nexecuted on HPC systems. For application developers, understanding how these new systems\nwork and how to analyse and report the performances of their own software is critical in the dialog\nwith HPC system designers and administrators. The paper aims to raise awareness about energy\nefficiency among users, particularly in the high energy physics and astrophysics domains, offering\npractical advice on how to analyse and optimise applications to reduce their energy consumption\nwithout compromising on performance.\nKeywords: High Performance Computing, HPC, energy efficiency, monitoring, programming, application optimisation"}, {"group": "Robotics", "id": 75, "label": "Energy Minimization for Participatory Federated Learning in IoT Analyzed via Game Theory", "shape": "dot", "size": 10, "title": "Authors: Alessandro Buratto\u2217, Elia Guerra\u2020, Marco Miozzo\u2020, Paolo Dini\u2020, Leonardo Badia\u2217, eguerra\u003cbr\u003eYear: 2018\u003cbr\u003eAbstract: \u2014The Internet of Things requires intelligent decision\nmaking in many scenarios. To this end, resources available at the\nindividual nodes for sensing or computing, or both, can be lever-\naged. This results in approaches known as participatory sensing\nand federated learning, respectively. We investigate the simultane-\nous implementation of both, through a distributed approach based\non empowering local nodes with game theoretic decision making.\nA global objective of energy minimization is combined with the\nindividual node\u2019s optimization of local expenditure for sensing\nand transmitting data over multiple learning rounds. We present\nextensive evaluations of this technique, based on both a theoretical\nframework and experiments in a simulated network scenario with\nreal data. Such a distributed approach can reach a desired level of\naccuracy for federated learning without a centralized supervision\nof the data collector. However, depending on the weight attributed\nto the local costs of the single node, it may also result in a\nsigni\ufb01cantly high Price of Anarchy (from"}, {"group": "Theoretical Physics", "id": 76, "label": "Estimation and variable selection in nonlinear mixed-effects models.", "shape": "dot", "size": 10, "title": "Authors: Estelle Kuhn, Sarah Lemler\u003cbr\u003eYear: 2022\u003cbr\u003eAbstract: . We consider nonlinear mixed effects models including high-dimensional co-\nvariates to model individual parameters. The objective is to identify relevant covariates\nand estimate model parameters. We combine a penalized LASSO-type estimator with an\neBIC model choice criterion to select the covariates of interest. Then we estimate the\nparameters by maximum likelihood in the reduced model. We calculate the LASSO-type\npenalized estimator by a weighted proximal gradient descent algorithm with an adaptive\nlearning rate. This choice allows us in particular to consider models that do not nec-\nessarily belong to the curved exponential family. We compare first the performance of\nthe proposed methodology with those of the glmmLasso procedure in a linear mixed\neffects model in a simulation study. We then illustrate its performance in a nonlinear\nmixed-effects logistic growth model through simulation.\nKeywords. nonlinear mixed effects model, high dimension, variable selection, LASSO\npenalty, stochastic gradient descent, weighted proximal.\n1\narXiv:2503.20401v1  [math.ST]  26 Mar 2025"}, {"group": "Natural Language Processing", "id": 77, "label": "Evaluating book summaries from internal knowledge in Large Language Models: a cross-model and semantic", "shape": "dot", "size": 10, "title": "Authors: Javier Coronado-Bl\u00b4azquez\u003cbr\u003eYear: 2011\u003cbr\u003eAbstract: We study the ability of large language models (LLMs) to generate comprehensive and\naccurate book summaries solely from their internal knowledge, without recourse to the\noriginal text. Employing a diverse set of books and multiple LLM architectures, we exam-\nine whether these models can synthesize meaningful narratives that align with established\nhuman interpretations. Evaluation is performed with a LLM-as-a-judge paradigm: each\nAI-generated summary is compared against a high-quality, human-written summary via a\ncross-model assessment, where all participating LLMs evaluate not only their own outputs\nbut also those produced by others. This methodology enables the identification of potential\nbiases, such as the proclivity for models to favor their own summarization style over oth-\ners. In addition, alignment between the human-crafted and LLM-generated summaries is\nquantified using ROUGE and BERTScore metrics, assessing the depth of grammatical and\nsemantic correspondence. The results reveal nuanced variations in content representation\nand stylistic preferences among the models, highlighting both strengths and limitations in-\nherent in relying on internal knowledge for summarization tasks. These findings contribute\nto a deeper understanding of LLM internal encodings of factual information and the dy-\nnamics of cross-model evaluation, with implications for the development of more robust\nnatural language generative systems.\nKeywords:\nGenerative Artificial Intelligence, Large Language Models, Natural Language\nProcessing"}, {"group": "Game Theory", "id": 78, "label": "Expressions of Market-Based Correlations Between Prices and Returns of Two Assets", "shape": "dot", "size": 10, "title": "Authors: Victor Olkhov\u003cbr\u003eYear: 2016\u003cbr\u003eAbstract: This paper derives the expressions of correlations between prices of two assets, returns of two \nassets, and price-return correlations of two assets that depend on statistical moments and \ncorrelations of the current values, past values, and volumes of their market trades. The usual \nfrequency-based expressions of correlations of time series of prices and returns describe a \npartial case of our model when all trade volumes and past trade values are constant. Such an \nassumptions are rather far from market reality, and its use results in excess losses and wrong \nforecasts. Traders, banks, and funds that perform multi-million market transactions or \nmanage billion-valued portfolios should consider the impact of large trade volumes on \nmarket prices and returns. The use of the market-based correlations of prices and returns of \ntwo assets is mandatory for them. The development of macroeconomic models and market \nforecasts like those being created by BlackRock\u0027s Aladdin, JP Morgan, and the U.S. Fed., is \nimpossible without the use of market-based correlations of prices and returns of two assets. \n \n \n \nKeywords : correlation of prices and returns of two assets, random trade values and volumes, \nstatistical moments \nJEL: G12 \n \n \n \n \n \n This research received no support, specific grant or financial assistance from funding agencies in the public, \ncommercial or nonprofit sectors. We welcome valuable offers of grants, support and positions. \n \n2\n1."}, {"group": "Theoretical Physics", "id": 79, "label": "An Example Article", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2014\u003cbr\u003eAbstract: .\nWe explore extensions and applications of the regret minimization framework in-\ntroduced by [1] for solving optimal experimental design problems. Specifically, we incorporate the\nentropy regularizer into this framework, leading to a novel sample selection objective and a provable\nsample complexity bound that guarantees a (1 + \u03f5)-near optimal solution. We further extend the\nmethod to handle regularized optimal design settings. As an application, we use our algorithm to\nselect a small set of representative samples from image classification datasets without relying on label\ninformation. To evaluate the quality of the selected samples, we train a logistic regression model and\ncompare performance against several baseline sampling strategies. Experimental results on MNIST,\nCIFAR-10, and a 50-class subset of ImageNet show that our approach consistently outperforms\ncompeting methods in most cases.\nKey words. optimal design, online optimization, logistic regression\nMSC codes. 62J12, 62L05, 68W27, 68W40, 68T05\n1."}, {"group": "Natural Language Processing", "id": 80, "label": "Shuhe Wang\u25bc, Xiaoya Li\u2663, Jiwei Li\u25b2, Guoyin Wang\u25b6,Xiaofei Sun\u25b2, Bob Zhu\u29eb, Han Qiu\u2660, Mo Yu\u2665, Shengjie Shen\u25c0, Tianwei Zhang\u2666, Eduard Hovy\u25bc", "shape": "dot", "size": 10, "title": "Authors: Shuhe Wang, Xiaoya Li, Jiwei Li, Guoyin Wang, Xiaofei Sun, Bob Zhu\u29eb, Han Qiu, Mo Yu, Shengjie Shen, Tianwei Zhang, Eduard Hovy\u003cbr\u003eYear: 2021\u003cbr\u003eAbstract: Due to the data-driven nature of current face identity\n(FaceID) customization methods, all state-of-the-art mod-\nels rely on large-scale datasets containing millions of high-\nquality text-image pairs for training.\nHowever, none of\nthese datasets are publicly available, which restricts trans-\nparency and hinders further advancements in the field.\nTo address this issue, in this paper, we collect and re-\nlease FaceID-6M, the first large-scale, open-source FaceID\ndataset containing 6 million high-quality text-image pairs.\nFiltered from LAION-5B [29], FaceID-6M undergoes a rig-\norous image and text filtering steps to ensure dataset qual-\nity, including resolution filtering to maintain high-quality\nimages and faces, face filtering to remove images that lack\nhuman faces, and keyword-based strategy to retain descrip-\ntions containing human-related terms (e.g., nationality, pro-\nfessions and names).\nThrough these cleaning processes,\nFaceID-6M provides a high-quality dataset optimized for\ntraining powerful FaceID customization models, facilitat-\ning advancements in the field by offering an open resource\nfor research and development.\nWe conduct extensive experiments to show the effective-\nness of our FaceID-6M, demonstrating that models trained\non our FaceID-6M dataset achieve performance that is\ncomparable to, and slightly better than currently available\nindustrial models. Additionally, to support and advance re-\nsearch in the FaceID customization community, we make\nour code, datasets, and models fully publicly available.\n1."}, {"group": "Theoretical Physics", "id": 81, "label": "Federated Causal Inference: Multi-Study ATE Estimation beyond Meta-Analysis", "shape": "dot", "size": 10, "title": "Authors: R\u00e9mi Khellaf, Julie Josse\u003cbr\u003eYear: 2016\u003cbr\u003eAbstract: We study Federated Causal Inference, an ap-\nproach to estimate treatment effects from de-\ncentralized data. We compare three classes of\nAverage Treatment Effect (ATE) estimators\nderived from the Plug-in G-Formula, rang-\ning from simple meta-analysis to one-shot\nand multi-shot federated learning, the lat-\nter leveraging the full data to learn the out-\ncome model (albeit requiring more communi-\ncation). Focusing on Randomized Controlled\nTrial studies (RCTs), we derive the asymp-\ntotic variance of these estimators for linear\nmodels. Our results provide practical guid-\nance on selecting the appropriate estimator\nfor various scenarios, including heterogeneity\nin sample sizes, covariate distributions, treat-\nment assignment schemes, and study-effects.\nWe validate these findings through experi-\nments on simulated and semi-synthetic data."}, {"group": "Natural Language Processing", "id": 82, "label": "From User Preferences to Optimization Constraints Using Large Language Models", "shape": "dot", "size": 10, "title": "Authors: Alessandra Perniciano[\u2212\u2212\u2212, Luca Zedda[\u2212\u2212\u2212, Andrea Loddo[\u2212\u2212\u2212, Maurizio Atzori[\u2212\u2212\u2212\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: . This work explores using Large Language Models (LLMs) to\ntranslate user preferences into energy optimization constraints for home\nappliances. We describe a task where natural language user utterances\nare converted into formal constraints for smart appliances, within the\nbroader context of a renewable energy community (REC) and in the\nItalian scenario. We evaluate the effectiveness of various LLMs currently\navailable for Italian in translating these preferences resorting to clas-\nsical zero-shot, one-shot, and few-shot learning settings, using a pilot\ndataset of Italian user requests paired with corresponding formal con-\nstraint representation. Our contributions include establishing a baseline\nperformance for this task, publicly releasing the dataset and code for\nfurther research, and providing insights on observed best practices and\nlimitations of LLMs in this particular domain.\nKeywords: natural language \u00b7 energy optimization \u00b7 large language\nmodels."}, {"group": "Logic", "id": 83, "label": "Functional Acceleration for Policy Mirror Descent Veronica Chelu\u2740\u273f, Doina Precup\u2740\u273f\u2741\u2743", "shape": "dot", "size": 10, "title": "Authors: Doina Precup\u003cbr\u003eYear: 2018\u003cbr\u003eAbstract: We apply functional acceleration to the Policy Mirror Descent (PMD) general family of\nalgorithms, which cover a wide range of novel and fundamental methods in Reinforce-\nment Learning (RL). Leveraging duality, we propose a momentum-based PMD update.\nBy taking the functional route, our approach is independent of the policy parametrization\nand applicable to large-scale optimization, covering previous applications of momentum\nat the level of policy parameters as a special case. We theoretically analyze several\nproperties of this approach and complement with a numerical ablation study, which\nserves to illustrate the policy optimization dynamics on the value polytope, relative to\ndifferent algorithmic design choices in this space. We further characterize numerically\nseveral features of the problem setting relevant for functional acceleration, and lastly, we\ninvestigate the impact of approximation on their learning mechanics1."}, {"group": "Logic", "id": 84, "label": "GD-VAEs: Geometric Dynamic Variational Autoencoders for Learning Nonlinear Dynamics and Dimension Reductions", "shape": "dot", "size": 10, "title": "Authors: Ryan Lopez, Paul J. Atzberger\u003cbr\u003eYear: 2018\u003cbr\u003eAbstract: We develop data-driven methods incorporating geometric and topological information to learn\nparsimonious representations of nonlinear dynamics from observations.\nThe approaches learn\nnonlinear state-space models of the dynamics for general manifold latent spaces using training\nstrategies related to Variational Autoencoders (VAEs). Our methods are referred to as Geomet-\nric Dynamic (GD) Variational Autoencoders (GD-VAEs). We learn encoders and decoders for\nthe system states and evolution based on deep neural network architectures that include general\nMultilayer Perceptrons (MLPs), Convolutional Neural Networks (CNNs), and other architectures.\nMotivated by problems arising in parameterized PDEs and physics, we investigate the performance\nof our methods on tasks for learning reduced dimensional representations of the nonlinear Burg-\ners Equations, Constrained Mechanical Systems, and spatial fields of Reaction-Diffusion Systems.\nGD-VAEs provide methods that can be used to obtain representations in manifold latent spaces\nfor diverse learning tasks involving dynamics.\nKeywords:\nvariational autoencoders, dimension reduction, dynamical systems, scientific ma-\nchine learning"}, {"group": "Theoretical Physics", "id": 85, "label": "GENEOnet: Statistical analysis supporting explainability and trustworthiness.", "shape": "dot", "size": 10, "title": "Authors: Giovanni Bocchi\u2217, Patrizio Frosini, Alessandra Micheletti, Alessandro Pedretti, Carmen Gratteri, Filippo Lunghini, AndreaR. Beccari, Carmine Talarico\u003cbr\u003eYear: 2022\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Structural Biology", "id": 86, "label": "GenoTEX: A Benchmark for Automated Gene Expression Data Analysis in Alignment with Bioinformaticians", "shape": "dot", "size": 10, "title": "Authors: Haoyang Liu, Shuyu Chen, Ye Zhang, Haohan Wang, shuyu\u003cbr\u003eYear: 2021\u003cbr\u003eAbstract: Recent advancements in machine learning have significantly improved the identification of disease-\nassociated genes from gene expression datasets. However, these processes often require extensive\nexpertise and manual effort, limiting their scalability. Large Language Model (LLM)-based agents have\nshown promise in automating these tasks due to their increasing problem-solving abilities. To support\nthe evaluation and development of such methods, we introduce GenoTEX, a benchmark dataset for\nthe automated analysis of gene expression data. GenoTEX provides annotated code and results for\nsolving a wide range of gene identification problems, encompassing dataset selection, preprocessing,\nand statistical analysis, in a pipeline that follows computational genomics standards. The benchmark\nincludes expert-curated annotations from bioinformaticians to ensure accuracy and reliability. To\nprovide baselines for these tasks, we present GenoAgent, a team of LLM-based agents that adopt\na multi-step programming workflow with flexible self-correction, to collaboratively analyze gene\nexpression datasets. Our experiments demonstrate the potential of LLM-based methods in analyzing\ngenomic data, while error analysis highlights the challenges and areas for future improvement. We\npropose GenoTEX as a promising resource for benchmarking and enhancing automated methods for\ngene expression data analysis. The benchmark is available at https://github.com/Liu-Hy/GenoTex."}, {"group": "Structural Biology", "id": 87, "label": "GI-GS: GLOBAL ILLUMINATION DECOMPOSITION ON GAUSSIAN SPLATTING FOR INVERSE RENDERING", "shape": "dot", "size": 10, "title": "Authors: Hongze Chen, Zehong Lin\u2217, Jun Zhang\u003cbr\u003eYear: 2022\u003cbr\u003eAbstract: We present GI-GS, a novel inverse rendering framework that leverages 3D Gaus-\nsian Splatting (3DGS) and deferred shading to achieve photo-realistic novel view\nsynthesis and relighting. In inverse rendering, accurately modeling the shading\nprocesses of objects is essential for achieving high-fidelity results. Therefore, it\nis critical to incorporate global illumination to account for indirect lighting that\nreaches an object after multiple bounces across the scene. Previous 3DGS-based\nmethods have attempted to model indirect lighting by characterizing indirect illu-\nmination as learnable lighting volumes or additional attributes of each Gaussian,\nwhile using baked occlusion to represent shadow effects. These methods, how-\never, fail to accurately model the complex physical interactions between light and\nobjects, making it impossible to construct realistic indirect illumination during re-\nlighting. To address this limitation, we propose to calculate indirect lighting using\nefficient path tracing with deferred shading. In our framework, we first render\na G-buffer to capture the detailed geometry and material properties of the scene.\nThen, we perform physically-based rendering (PBR) only for direct lighting. With\nthe G-buffer and previous rendering results, the indirect lighting can be calcu-\nlated through a lightweight path tracing. Our method effectively models indirect\nlighting under any given lighting conditions, thereby achieving better novel view\nsynthesis and competitive relighting. Quantitative and qualitative results show that\nour GI-GS outperforms existing baselines in both rendering quality and efficiency.\nProject page: https://stopaimme.github.io/GI-GS-site/.\n\u2217Corresponding author\n1\narXiv:2410.02619v2  [cs.CV]  27 Mar 2025\nPublished as a conference paper at ICLR 2025"}, {"group": "Structural Biology", "id": 88, "label": "GNN-Transformer Cooperative Architecture for Trustworthy Graph Contrastive Learning", "shape": "dot", "size": 10, "title": "Authors: Jianqing Liang, Xinkai Wei, Min Chen, Zhiqiang Wang, Jiye Liang\u003cbr\u003eYear: 2017\u003cbr\u003eAbstract: Graph contrastive learning (GCL) has become a hot topic\nin the field of graph representation learning. In contrast to\ntraditional supervised learning relying on a large number\nof labels, GCL exploits augmentation strategies to gener-\nate multiple views and positive/negative pairs, both of which\ngreatly influence the performance. Unfortunately, commonly\nused random augmentations may disturb the underlying se-\nmantics of graphs. Moreover, traditional GNNs, a type of\nwidely employed encoders in GCL, are inevitably confronted\nwith over-smoothing and over-squashing problems. To ad-\ndress these issues, we propose GNN-Transformer Coopera-\ntive Architecture for Trustworthy Graph Contrastive Learn-\ning (GTCA), which inherits the advantages of both GNN and\nTransformer, incorporating graph topology to obtain compre-\nhensive graph representations. Theoretical analysis verifies\nthe trustworthiness of the proposed method. Extensive ex-\nperiments on benchmark datasets demonstrate state-of-the-art\nempirical performance.\nCode \u2014 https://github.com/a-hou/GTCA"}, {"group": "Structural Biology", "id": 89, "label": "Graph Anomaly Detection in Time Series: Thi Kieu Khanh Ho, Ali Karami, Narges Armanfard", "shape": "dot", "size": 10, "title": "Authors: Thi Kieu Khanh Ho, Ali Karami\u003cbr\u003eYear: 2021\u003cbr\u003eAbstract: \u2014With the recent advances in technology, a wide range of systems continue to collect a large amount of data over time and\nthus generate time series. Time-Series Anomaly Detection (TSAD) is an important task in various time-series applications such as\ne-commerce, cybersecurity, vehicle maintenance, and healthcare monitoring. However, this task is very challenging as it requires\nconsidering both the intra-variable dependency (relationships within a variable over time) and the inter-variable dependency\n(relationships between multiple variables) existing in time-series data. Recent graph-based approaches have made impressive\nprogress in tackling the challenges of this field. In this survey, we conduct a comprehensive and up-to-date review of TSAD using\ngraphs, referred to as G-TSAD. First, we explore the significant potential of graph representation for time-series data and \u007fand its\ncontributions to facilitating anomaly detection. Then, we review state-of-the-art graph anomaly detection techniques, \u007fmostly leveraging\ndeep learning architectures, in the context of time series. For each method, we discuss its strengths, limitations, and the specific\napplications where it excels. Finally, we address both the technical and application challenges currently facing the field, and suggest\npotential future directions for advancing research and improving practical outcomes.\nIndex Terms\u2014Time-Series Anomaly Detection, Graphs, \u007fDeep Learning, Time-series Signals, Dynamic Social Networks, Videos.\n\u2726"}, {"group": "Natural Language Processing", "id": 90, "label": "Graph-to-Vision: Multi-graph Understanding and Reasoning using Vision-Language Models", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2021\u003cbr\u003eAbstract: Graph Neural Networks (GNNs), as the dom-\ninant paradigm for graph-structured learning,\nhave long faced dual challenges of exponen-\ntially escalating computational complexity and\ninadequate cross-scenario generalization capa-\nbility. With the rapid advancement of mul-\ntimodal learning, Vision-Language Models\n(VLMs) have demonstrated exceptional cross-\nmodal relational reasoning capabilities and gen-\neralization capacities, thereby opening up novel\npathways for overcoming the inherent limita-\ntions of conventional graph learning paradigms.\nHowever, current research predominantly con-\ncentrates on investigating the single-graph rea-\nsoning capabilities of VLMs, which fundamen-\ntally fails to address the critical requirement\nfor coordinated reasoning across multiple het-\nerogeneous graph data in real-world applica-\ntion scenarios. To address these limitations,\nwe propose the first multi-graph joint reason-\ning benchmark for VLMs. Our benchmark\nencompasses four graph categories: knowl-\nedge graphs, flowcharts, mind maps, and route\nmaps,with each graph group accompanied by\nthree progressively challenging instruction-\nresponse pairs. Leveraging this benchmark,\nwe conducted comprehensive capability assess-\nments of state-of-the-art VLMs and performed\nfine-tuning on open-source models. This study\nnot only addresses the underexplored evalua-\ntion gap in multi-graph reasoning for VLMs but\nalso empirically validates their generalization\nsuperiority in graph-structured learning."}, {"group": "Structural Biology", "id": 91, "label": "GraphXForm: Graph transformer for computer-aided molecular design", "shape": "dot", "size": 10, "title": "Authors: Jonathan Pirnay, Jan G. Rittig, Alexander B. Wolf, Martin Grohe, Jakob Burger, Alexander Mitsos, Dominik G. Grimm\u003cbr\u003eYear: 2016\u003cbr\u003eAbstract: Generative deep learning has become pivotal in\nmolecular design for drug discovery, materials science,\nand chemical engineering. A widely used paradigm is\nto pretrain neural networks on string representations\nof molecules and fine-tune them using reinforcement\nlearning on specific objectives. However, string-based\nmodels face challenges in ensuring chemical validity\nand enforcing structural constraints like the presence\nof specific substructures. We propose to instead com-\nbine graph-based molecular representations, which can\nnaturally ensure chemical validity, with transformer ar-\nchitectures, which are highly expressive and capable\nof modeling long-range dependencies between atoms.\nOur approach iteratively modifies a molecular graph\nby adding atoms and bonds, which ensures chemical\nvalidity and facilitates the incorporation of structural\nconstraints. We present GraphXForm, a decoder-only\ngraph transformer architecture, which is pretrained on\nexisting compounds and then fine-tuned using a new\ntraining algorithm that combines elements of the deep\ncross-entropy method and self-improvement learning.\nWe evaluate GraphXForm on various drug design tasks,\ndemonstrating superior objective scores compared to\nstate-of-the-art molecular design approaches. Further-\nmore, we apply GraphXForm to two solvent design\ntasks for liquid\u2013liquid extraction, again outperforming\nalternative methods while flexibly enforcing structural\nconstraints or initiating design from existing molecular\nstructures.\n1."}, {"group": "Natural Language Processing", "id": 92, "label": "Harnessing Chain-of-Thought Metadata for Task Routing and Adversarial Prompt Detection", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2017\u003cbr\u003eAbstract: . In this work, we propose a metric called \u201cNumber of Thoughts\n(NofT)\u201d to determine the difficulty of tasks pre-prompting and sup-\nport Large Language Models (LLMs) in production contexts. By set-\nting thresholds based on the number of thoughts, this metric can discern\nthe difficulty of prompts and support more effective prompt routing.\nA 2% decrease in latency is achieved when routing prompts from the\nMathInstruct dataset through quantized, distilled versions of Deepseek\nwith"}, {"group": "Game Theory", "id": 93, "label": "Hedge Fund Portfolio Construction Using PolyModel Theory Stony Brook University", "shape": "dot", "size": 10, "title": "Authors: Raphael Douady, Yi\u003cbr\u003eYear: 2013\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Structural Biology", "id": 94, "label": "Astronomy \u0026 Astrophysics manuscript no. main HERACLES++: A multidimensional Eulerian code for exascale", "shape": "dot", "size": 10, "title": "Authors: T. Padioleau, Y. Wang\u003cbr\u003eYear: 2012\u003cbr\u003eAbstract: Numerical simulations of multidimensional astrophysical fluids present considerable challenges. However, the development of ex-\nascale computing has significantly enhanced computational capabilities, motivating the development of new codes that can take full\nadvantage of these resources. In this article, we introduce HERACLES++, a new hydrodynamics code with high portability, optimized\nfor exascale machines with different architectures and running efficiently both on CPUs and GPUs. The code is Eulerian and employs\na Godunov finite-volume method to solve the hydrodynamics equations, which ensures accuracy in capturing shocks and discontinu-\nities. It includes different Riemann solvers, equations of state, and gravity solvers. It works in Cartesian and spherical coordinates,\neither in 1D, 2D, or 3D, and uses passive scalars to handle gases with several species. The code accepts a user-supplied heating or\ncooling term to treat a variety of astrophysical contexts. In addition to the usual series of benchmarking tests, we use HERACLES++\nto simulate the propagation of a supernova shock in a red-supergiant star envelope, from minutes after core collapse until shock\nemergence. In 1D, the results from HERACLES++ are in agreement with those of V1D for the same configuration. In 3D, the Rayleigh-\nTaylor instability develops and modifies the 1D picture by introducing density and composition fluctuations as well as turbulence.\nThe focus on a wedge, rather than the full solid angle, and the ability to run HERACLES++ with a large number of GPUs allow\nfor long-term simulations of 3D supernova ejecta with a sub-degree resolution. Future developments will extend HERACLES++ to a\nradiation-hydrodynamics code.\nKey words. computational fluid dynamics \u2013 shock waves \u2013 instabilities \u2013 supernova: general\n1."}, {"group": "Theoretical Physics", "id": 95, "label": "How do language models learn facts? Dynamics, curricula and hallucinations", "shape": "dot", "size": 10, "title": "Authors: Nicolas Zucchet, +, J\u00f6rg Bornschein, Stephanie Chan, Andrew Lampinen, Razvan Pascanu, SohamDe, ETH Z\u00fcrich, Pavlov, Hopfield, Li, Allen-Zhuand Li\u003cbr\u003eYear: 2017\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Science and Technology", "id": 96, "label": "Reshaping SLAM: a Survey", "shape": "dot", "size": 10, "title": "Authors: Youmin Zhang, Ziren Gong, Martin R. Oswald, Matteo Poggi, Duan, Mokssit, Surveys, Grisetti, Yousif, Cadena\u003cbr\u003eYear: 2016\u003cbr\u003eAbstract: \u2014Over the past two decades, research in the field of\nSimultaneous Localization and Mapping (SLAM) has undergone\na significant evolution, highlighting its critical role in enabling\nautonomous exploration of unknown environments. This evo-\nlution ranges from hand-crafted methods, through the era of\ndeep learning, to more recent developments focused on Neural\nRadiance Fields (NeRFs) and 3D Gaussian Splatting (3DGS) rep-\nresentations. Recognizing the growing body of research and the\nabsence of a comprehensive survey on the topic, this paper aims\nto provide the first comprehensive overview of SLAM progress\nthrough the lens of the latest advancements in radiance fields.\nIt sheds light on the background, evolutionary path, inherent\nstrengths and limitations, and serves as a fundamental reference\nto highlight the dynamic progress and specific challenges.\nIndex Terms\u2014SLAM, Deep Learning, Neural Radiance Field,\nNeRF, 3D Gaussian Splatting\nI."}, {"group": "Logic", "id": 97, "label": "HybridoNet-Adapt: A Domain-Adapted Framework for Accurate Lithium-Ion Battery RUL Prediction", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2022\u003cbr\u003eAbstract: Accurate prediction of the remaining useful life (RUL) in Lithium-ion bat-\ntery (LIB) health management systems is crucial for ensuring reliability and\nsafety.\nCurrent methods typically assume that training and testing data\nshare the same distribution, overlooking the benefits of incorporating di-\nverse data sources to enhance model performance. To address this limita-\ntion, we introduce a data-independent RUL prediction framework along with\nits domain adaptation (DA) approach, which leverages heterogeneous data\nsources for improved target predictions. Our approach integrates comprehen-\nsive data preprocessing\u2014comprising feature extraction, denoising, and nor-\nmalization\u2014with a data-independent prediction model that combines Long\nShort-Term Memory (LSTM), Multihead Attention, and a Neural Ordi-\nnary Differential Equation (NODE) block, termed HybridoNet. The domain-\nadapted version, HybridoNet-Adapt, is trained using a novel technique in-\nspired by the Domain-Adversarial Neural Network (DANN) framework, a\nregression ensemble method, and Maximum Mean Discrepancy (MMD) to\nlearn domain-invariant features from labeled cycling data in the source and\ntarget domain. Experimental results demonstrate that our approach out-\nperforms state-of-the-art techniques, providing reliable RUL predictions for\nreal-world applications.\nKeywords\u2014Battery Health Management, Lithium-ion Batteries, Remain-\ning Useful Life, Signal Processing, Data-Independent Prediction\n\u2217Corresponding author: khoa.tran@aiware.website\nPreprint submitted to Mechanical Systems and Signal Processing\nMarch 28, 2025\narXiv:2503.21392v1  [cs.AI]  27 Mar 2025\n1."}, {"group": "Structural Biology", "id": 98, "label": "ICG-MVSNet: Learning Intra-view and Cross-view Relationships for Guidance in Multi-View Stereo", "shape": "dot", "size": 10, "title": "Authors: Yuxi Hu, Zhe Zhang, Rafael Weilharter, Yuchen Rao, Kuangyi Chen, Runze Yuan, Friedrich Fraundorfer\u003cbr\u003eYear: 2020\u003cbr\u003eAbstract: \u2014Multi-view Stereo (MVS) aims to estimate depth\nand reconstruct 3D point clouds from a series of overlapping\nimages. Recent learning-based MVS frameworks overlook the\ngeometric information embedded in features and correlations,\nleading to weak cost matching. In this paper, we propose ICG-\nMVSNet, which explicitly integrates intra-view and cross-view\nrelationships for depth estimation. Specifically, we develop an\nintra-view feature fusion module that leverages the feature\ncoordinate correlations within a single image to enhance robust\ncost matching. Additionally, we introduce a lightweight cross-\nview aggregation module that efficiently utilizes the contextual\ninformation from volume correlations to guide regularization.\nOur method is evaluated on the DTU dataset and Tanks and\nTemples benchmark, consistently achieving competitive perfor-\nmance against state-of-the-art works, while requiring lower\ncomputational resources.\nIndex Terms\u2014Multi-View Stereo, 3D Reconstruction\nI."}, {"group": "Theoretical Physics", "id": 99, "label": "INDICES OF QUADRATIC PROGRAMS OVER REPRODUCING KERNEL HILBERT SPACES FOR", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2016\u003cbr\u003eAbstract: . We give an abstract perspective on quadratic pro-\ngramming with
