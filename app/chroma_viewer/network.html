              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"group": "Natural Language Processing", "id": 266, "label": "Stance Detection on Social Media with Fine-Tuned Large Language Models Lausanne, Switzerland", "shape": "dot", "size": 10, "title": "Authors: Ilker G\u00fcl, EPFL, R\u00e9mi Lebret, Karl Aberer\u003cbr\u003eYear: 2010\u003cbr\u003eAbstract: Stance detection, a key task in natural language\nprocessing, determines an author\u2019s viewpoint\nbased on textual analysis. This study evaluates\nthe evolution of stance detection methods,\ntransitioning from early machine learning\napproaches to the groundbreaking BERT model,\nand eventually to modern Large Language Mod-\nels (LLMs) such as ChatGPT, LLaMa-2, and\nMistral-7B. While ChatGPT\u2019s closed-source\nnature and associated costs present challenges,\nthe open-source models like LLaMa-2 and\nMistral-7B offers an encouraging alternative.\nInitially, our research focused on fine-tuning\nChatGPT, LLaMa-2, and Mistral-7B using sev-\neral publicly available datasets. Subsequently,\nto provide a comprehensive comparison, we\nassess the performance of these models in\nzero-shot and few-shot learning scenarios. The\nresults underscore the exceptional ability of\nLLMs in accurately detecting stance, with all\ntested models surpassing existing benchmarks.\nNotably, LLaMa-2 and Mistral-7B demonstrate\nremarkable efficiency and potential for stance\ndetection, despite their smaller sizes compared\nto ChatGPT. This study emphasizes the\npotential of LLMs in stance detection and calls\nfor more extensive research in this field."}, {"group": "Natural Language Processing", "id": 363, "label": "Stance Detection on Social Media with Fine-Tuned Large Language Models Lausanne, Switzerland", "shape": "dot", "size": 10, "title": "Authors: Ilker G\u00fcl, EPFL, R\u00e9mi Lebret, Karl Aberer\u003cbr\u003eYear: 2022\u003cbr\u003eAbstract: Stance detection, a key task in natural language\nprocessing, determines an author\u2019s viewpoint\nbased on textual analysis. This study evaluates\nthe evolution of stance detection methods,\ntransitioning from early machine learning\napproaches to the groundbreaking BERT model,\nand eventually to modern Large Language Mod-\nels (LLMs) such as ChatGPT, LLaMa-2, and\nMistral-7B. While ChatGPT\u2019s closed-source\nnature and associated costs present challenges,\nthe open-source models like LLaMa-2 and\nMistral-7B offers an encouraging alternative.\nInitially, our research focused on fine-tuning\nChatGPT, LLaMa-2, and Mistral-7B using sev-\neral publicly available datasets. Subsequently,\nto provide a comprehensive comparison, we\nassess the performance of these models in\nzero-shot and few-shot learning scenarios. The\nresults underscore the exceptional ability of\nLLMs in accurately detecting stance, with all\ntested models surpassing existing benchmarks.\nNotably, LLaMa-2 and Mistral-7B demonstrate\nremarkable efficiency and potential for stance\ndetection, despite their smaller sizes compared\nto ChatGPT. This study emphasizes the\npotential of LLMs in stance detection and calls\nfor more extensive research in this field."}, {"group": "Natural Language Processing", "id": 0, "label": "A Measure Based Generalizable Approach to Understandability", "shape": "dot", "size": 10, "title": "Authors: Vikas Kushwaha, Sruti, Srinivasa Ragavan, Subhajit Roy\u003cbr\u003eYear: 2017\u003cbr\u003eAbstract: Successful agent-human partnerships require that any agent gen-\nerated information is understandable to the human, and that the\nhuman can easily steer the agent towards a goal. Such effective\ncommunication requires the agent to develop a finer-level notion\nof what is understandable to the human. State-of-the-art agents, in-\ncluding LLMs, lack this detailed notion of understandability because\nthey only capture average human sensibilities from the training\ndata, and therefore afford limited steerability (e.g., requiring non-\ntrivial prompt engineering).\nIn this paper, instead of only relying on data, we argue for devel-\noping generalizable, domain-agnostic measures of understandabil-\nity that can be used as directives for these agents. Existing research\non understandability measures is fragmented, we survey various\nsuch efforts across domains, and lay a cognitive-science-rooted\ngroundwork for more coherent and domain-agnostic research in-\nvestigations in future."}, {"group": "Structural Biology", "id": 1, "label": "Empirical Hyper Element Integration Method (EHEIM) with Unified Integration Criteria for Efficient Hyper Reduced FE2 Simulations", "shape": "dot", "size": 10, "title": "Authors: Nils Langea, Geralf H\u00fctter\u2020a, Bjoern Kiefera\u003cbr\u003eYear: 2011\u003cbr\u003eAbstract: Numerical homogenization for mechanical multiscale modeling by means of the finite element method (FEM)\nis an elegant way of obtaining structure-property relations, if the behavior of the constituents of the lower scale\nis well understood. However, the computational costs of this so-called FE2 method are so high that reduction\nmethods are essential. While the construction of a reduced basis for the microscopic nodal displacements using\nproper orthogonal decomposition (POD) has become a standard technique, the reduction of the computational\neffort for the projected nodal forces, the so-called hyper reduction, is an additional challenge, for which different\nstrategies have been proposed in the literature. The empirical cubature method (ECM), which has been proven\nto be very robust, implemented the conservation of the total volume is used as a constraint in the resulting\noptimization problem, while energy-based criteria have been proposed in other contributions.\nThe present contribution presents a unified integration criteria concept, involving the aforementioned criteria,\namong others. These criteria are used both with a Gauss point-based as well as with an element-based hyper\nreduction scheme, the latter retaining full compatibility with the common modular finite element framework.\nThe methods are combined with a previously proposed clustered training strategy and a monolithic solver.\nNumerical examples empirically demonstrate that the additional criteria improve the accuracy for a given\nnumber of modes. Vice verse, less modes and thus lower computational costs are required to reach a given level\nof accuracy.\nKeywords:\nComputational Homogenization, Multiscale Simulation, FE2, Reduced Order Modeling, Hyper\nReduction, Unified Criteria\n1."}, {"group": "Game Theory", "id": 2, "label": "Exponential utility maximization in small/large \ufb01nancial", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2010\u003cbr\u003eAbstract: Obtaining utility maximizing optimal portfolio in closed form is a challenging issue when\nthe return vector follows a more general distribution than the normal one. In this note, we give\nclosed form expression, in markets based on \ufb01nitely many assets, for optimal portfolios that\nmaximize exponential utility function when the return vector follows normal mean-variance\nmixture models. Especially, our approach expresses the closed form solution in terms of the\nLaplace transformation of the mixing distribution of the normal mean-variance mixture model\nand no any distributional assumptions on the mixing distribution are made.\nWe then consider large \ufb01nancial markets based on normal mean-variance mixture models also\nand show that the optimal exponential utilities based on small markets converge to the optimal\nexponential utility in the large \ufb01nancial market. This shows, in particular, that to reach the\nbest utility level investors need to diversify their investment to include in\ufb01nitely many assets\ninto their portfolio and with portfolios based on only \ufb01nitely many assets they never be able to\nreach the optimum level of utility.\nKeywords: Expected utility; Mean-variance mixtures; Hara utility functions; Large \ufb01nan-\ncial markets; Martingale measures.\nJEL Classi\ufb01cation: G11"}, {"group": "Logic", "id": 3, "label": "Pretraining with random noise for uncertainty calibration Jeonghwan Cheon and Se-Bum Paik*", "shape": "dot", "size": 10, "title": "Authors: Se-Bum Paik\u003cbr\u003eYear: 2015\u003cbr\u003eAbstract: Uncertainty calibration is crucial for various machine learning applications, yet it remains challenging. Many models exhibit\nhallucinations \u2014 confident yet inaccurate responses \u2014 due to miscalibrated confidence. Here, we show that the common\npractice of random initialization in deep learning, often considered a standard technique, is an underlying cause of this\nmiscalibration, leading to excessively high confidence in untrained networks. Our method, inspired by developmental\nneuroscience, addresses this issue by simply pretraining networks with random noise and labels, reducing overconfidence\nand bringing initial confidence levels closer to chance. This ensures optimal calibration, aligning confidence with accuracy\nduring subsequent data training, without the need for additional pre- or post-processing. Pre-calibrated networks excel at\nidentifying \u201cunknown data,\u201d showing low confidence for out-of-distribution inputs, thereby resolving confidence miscalibration."}, {"group": "Structural Biology", "id": 4, "label": "Role of spatial embedding and planarity in shaping the topology of the Street Networks", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2020\u003cbr\u003eAbstract: The topology of city street networks (SNs) is constrained by spatial embedding, requiring non-\ncrossing links and preventing random node placement or overlap. Here, we analyzed SNs of 33 Indian\ncities to explore how the spatial embedding and the planarity jointly shape their topology. Overall, we\nfound that all the studied SNs have small-world properties with higher clustering and efficiency. The\nefficiency of the empirical networks is even higher than that of the corresponding degree of preserved\nrandom networks. This increased efficiency can be explained by Dijkstra\u2019s path-length distribution,\nwhich closely fits a right-skewed normal or log-normal distribution. Moreover, we observed that the\nconnectivity of the streets is length-dependent: the smaller streets connect preferably to the smaller\nstreets, while longer streets tend to connect with the longer counterparts. This length-dependent\nconnectivity is more profound in the empirical SNs than in the corresponding degree preserved\nrandom and random planar networks. However, planar networks maintaining the empirical spatial\ncoordinates replicate the connectivity behavior of empirical SNs, highlighting the influence of spatial\nembedding. Moreover, the robustness of the cities in terms of resilience to random errors and targeted\nattacks is independent of the SN\u2019s size, indicating other factors, such as geographical constraints,\nsubstantially influence network stability.\nKeywords\nStreet Networks, Spatial small-world, Normal Distribution, Rich Club, Robustness"}, {"group": "Structural Biology", "id": 5, "label": "FORMATION FOR MOLECULE-TEXT MODELING", "shape": "dot", "size": 10, "title": "Authors: Rui Yan, \u2020, Kaiyuan Gao\u003cbr\u003eYear: 2013\u003cbr\u003eAbstract: The integration of molecular and natural language representations has emerged as\na focal point in molecular science, with recent advancements in Language Models\n(LMs) demonstrating significant potential for comprehensive modeling of both do-\nmains. However, existing approaches face notable limitations, particularly in their\nneglect of three-dimensional (3D) information, which is crucial for understanding\nmolecular structures and functions. While some efforts have been made to incorpo-\nrate 3D molecular information into LMs using external structure encoding modules,\nsignificant difficulties remain, such as insufficient interaction across modalities\nin pre-training and challenges in modality alignment. To address the limitations,\nwe propose 3D-MolT5, a unified framework designed to model molecule in both\nsequence and 3D structure spaces. The key innovation of our approach lies in\nmapping fine-grained 3D substructure representations into a specialized 3D token\nvocabulary. This methodology facilitates the seamless integration of sequence\nand structure representations in a tokenized format, enabling 3D-MolT5 to encode\nmolecular sequences, molecular structures, and text sequences within a unified\narchitecture. Leveraging this tokenized input strategy, we build a foundation model\nthat unifies the sequence and structure data formats. We then conduct joint pre-\ntraining with multi-task objectives to enhance the model\u2019s comprehension of these\ndiverse modalities within a shared representation space. Thus, our approach signifi-\ncantly improves cross-modal interaction and alignment, addressing key challenges\nin previous work. Further instruction tuning demonstrated that our 3D-MolT5\nhas strong generalization ability and surpasses existing methods with superior\nperformance in multiple downstream tasks, such as nearly 70% improvement on\nthe molecular property prediction task compared to state-of-the-art methods. Our\ncode is available at https://github.com/QizhiPei/3D-MolT5."}, {"group": "Theoretical Physics", "id": 6, "label": "A Computational Theory of Evaluation for Parameterisable Subject", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2022\u003cbr\u003eAbstract: Evaluation is critical to advance decision making across domains, yet existing\nmethodologies often struggle to balance theoretical rigor and practical scala-\nbility. In order to reduce the cost of experimental evaluation, we introduce a\ncomputational theory of evaluation for parameterisable subjects. We prove upper\nbounds of generalized evaluation error and generalized causal effect error of eval-\nuation metric on subject. We also prove efficiency, and consistency to estimated\ncausal effect of subject on metric by prediction. To optimize evaluation models,\nwe propose a meta-learner to handle heterogeneous evaluation subjects space.\nComparing with other computational approaches, our (conditional) evaluation\nmodel reduced 24.1%-99.0% evaluation errors across 12 scenes, including individ-\nual medicine, scientific simulation, business activities, and quantum trade. The\nevaluation time is reduced 3-7 order of magnitude comparing with experiments\nor simulations.\nKeywords: evaluatology, computational evaluation, error upper bound,\nmeta-learning, heterogeneous subjects, causal effect"}, {"group": "Structural Biology", "id": 7, "label": "A Generalist Cross-Domain Molecular Learning Framework for Structure-Based Drug Discovery", "shape": "dot", "size": 10, "title": "Authors: Yiheng Zhu, \u2020, Mingyang Li\u2020, Junlong Liu, Kun Fu, Jiansheng Wu, Qiuyi Li, Mingze Yin, Jieping Ye, Jian Wu, Zheng Wang\u003cbr\u003eYear: 2022\u003cbr\u003eAbstract: Structure-based drug discovery (SBDD) is a systematic scientific process that\ndevelops new drugs by leveraging the detailed physical structure of the tar-\nget protein. Recent advancements in pre-trained models for biomolecules have\ndemonstrated remarkable success across various biochemical applications, includ-\ning drug discovery and protein engineering. However, in most approaches,\nthe pre-trained models primarily focus on the characteristics of either small\nmolecules or proteins, without delving into their binding interactions which\nare essential cross-domain relationships pivotal to SBDD. To fill this gap, we\npropose a general-purpose foundation model named BIT (an abbreviation for\nBiomolecular Interaction Transformer), which is capable of encoding a range\nof biochemical entities, including small molecules, proteins, and protein-ligand\ncomplexes, as well as various data formats, encompassing both 2D and 3D struc-\ntures. Specifically, we introduce Mixture-of-Domain-Experts (MoDE) to handle\n1\narXiv:2503.04362v1  [cs.LG]  6 Mar 2025\nthe biomolecules from diverse biochemical domains and Mixture-of-Structure-\nExperts (MoSE) to capture positional dependencies in the molecular structures.\nThe proposed mixture-of-experts approach enables BIT to achieve both deep\nfusion and domain-specific encoding, effectively capturing fine-grained molecular\ninteractions within protein-ligand complexes. Then, we perform cross-domain pre-\ntraining on the shared Transformer backbone via several unified self-supervised\ndenoising tasks. Experimental results on various benchmarks demonstrate that\nBIT achieves exceptional performance in downstream tasks, including binding\naffinity prediction, structure-based virtual screening, and molecular property pre-\ndiction. Furthermore, we develop a BIT-driven virtual screening pipeline that\nhas identified two hit compounds with compelling inhibitory activity against the\nGluN1/GluN3A N-methyl-D-aspartate (NMDA) receptor, as validated by wet-lab\nassays. The code and pre-trained models will be made publicly available.\nKeywords: structure-based drug discovery, molecular representation learning,\nmolecular interaction, multimodal learning"}, {"group": "Theoretical Physics", "id": 8, "label": "A Geometric Modeling of Occam\u2019s Razor in Deep Learning Sony Computer Science Laboratories Inc. (Sony CSL)", "shape": "dot", "size": 10, "title": "Authors: Frank Nielsen\u003cbr\u003eYear: 2017\u003cbr\u003eAbstract: Why do deep neural networks (DNNs) benefit from very high dimensional parameter\nspaces? Their huge parameter complexities vs. stunning performances in practice is all the\nmore intriguing and not explainable using the standard theory of model selection for regular\nmodels. In this work, we propose a geometrically flavored information-theoretic approach to\nstudy this phenomenon. With the belief that simplicity is linked to better generalization, as\ngrounded in the theory of minimum description length, the objective of our analysis is to\nexamine and bound the complexity of DNNs. We introduce the locally varying dimensionality\nof the parameter space of neural network models by considering the number of significant\ndimensions of the Fisher information matrix, and model the parameter space as a manifold\nusing the framework of singular semi-Riemannian geometry. We derive model complexity\nmeasures which yield short description lengths for deep neural network models based on\ntheir singularity analysis thus explaining the good performance of DNNs despite their large\nnumber of parameters."}, {"group": "Structural Biology", "id": 9, "label": "A LOCAL PERSPECTIVE-BASED MODEL FOR OVERLAPPING", "shape": "dot", "size": 10, "title": "Authors: Rui-Feng Wang, *, \u2020, Kangning Cui\u003cbr\u003eYear: 2013\u003cbr\u003eAbstract: Community detection, which identifies densely connected node clusters with sparse\nbetween-group links, is vital for analyzing network structure and function in real-\nworld systems. Most existing community detection methods based on GCNs pri-\nmarily focus on node-level information while overlooking community-level fea-\ntures, leading to performance limitations on large-scale networks. To address this\nissue, we propose LQ-GCN, an overlapping community detection model from a lo-\ncal community perspective. LQ-GCN employs a Bernoulli-Poisson model to con-\nstruct a community affiliation matrix and form an end-to-end detection framework.\nBy adopting local modularity as the objective function, the model incorporates lo-\ncal community information to enhance the quality and accuracy of clustering re-\nsults. Additionally, the conventional GCNs\u2019 architecture is optimized to improve\nthe model\u2019s capability in identifying overlapping communities in large-scale net-\nworks. Experimental results demonstrate that LQ-GCN achieves up to a 33% im-\nprovement in Normalized Mutual Information (NMI) and a 26.3% improvement in\nRecall compared to baseline models across multiple real-world benchmark datasets."}, {"group": "Natural Language Processing", "id": 10, "label": "A Logic for Reasoning about Aggregate-Combine Graph Neural Networks", "shape": "dot", "size": 10, "title": "Authors: Marco S\u00e4lzer, Fran\u00e7ois Schwarzentruber, Nicolas Troquard\u003cbr\u003eYear: 2019\u003cbr\u003eAbstract: We propose a modal logic in which counting\nmodalities appear in linear inequalities. We show\nthat each formula can be transformed into an equiv-\nalent graph neural network (GNN). We also show\nthat a broad class of GNNs can be transformed ef\ufb01-\nciently into a formula, thus signi\ufb01cantly improving\nupon the literature about the logical expressiveness\nof GNNs. We also show that the satis\ufb01ability prob-\nlem is PSPACE-complete. These results bring to-\ngether the promise of using standard logical meth-\nods for reasoning about GNNs and their properties,\nparticularly in applications such as GNN querying,\nequivalence checking, etc. We prove that such nat-\nural problems can be solved in polynomial space."}, {"group": "Theoretical Physics", "id": 11, "label": "A multiscale cavity method for sublinear-rank symmetric matrix factorization", "shape": "dot", "size": 10, "title": "Authors: Jean Barbier, Justin Ko, Anas A. Rahman*\u003cbr\u003eYear: 2011\u003cbr\u003eAbstract: We consider a statistical model for symmetric matrix factorization with ad-\nditive Gaussian noise in the high-dimensional regime where the rank M of the\nsignal matrix to infer scales with its size N as M = o(\n\u221a\nln N). Allowing for an\nN-dependent rank o\ufb00ers new challenges and requires new methods. Working in\nthe Bayes-optimal setting, we show that whenever the signal has i.i.d. entries,\nthe limiting mutual information between signal and data is given by a variational\nformula involving a rank-one replica symmetric potential. In other words, from\nthe information-theoretic perspective, the case of a (slowly) growing rank is the\nsame as when M = 1 (namely, the standard spiked Wigner model). The proof\nis primarily based on a novel multiscale cavity method allowing for growing rank\nalong with some information-theoretic identities on worst noise for the vector\nGaussian channel. We believe that the cavity method developed here will play\na role in the analysis of a broader class of inference and spin models where the\ndegrees of freedom are large arrays instead of vectors."}, {"group": "Game Theory", "id": 12, "label": "A semi-parametric dynamic conditional correlation framework for risk forecasting", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2022\u003cbr\u003eAbstract: We develop a novel multivariate semi-parametric framework for joint portfolio\nValue-at-Risk (VaR) and Expected Shortfall (ES) forecasting. Unlike existing uni-\nvariate semi-parametric approaches, the proposed framework explicitly models the\ndependence structure among portfolio asset returns through a dynamic conditional\ncorrelation (DCC) parameterization. To estimate the model, a two-step procedure\nbased on the minimization of a strictly consistent VaR and ES joint loss function is\nemployed. This procedure allows to simultaneously estimate the DCC parameters\nand the portfolio risk factors. The performance of the proposed model in risk fore-\ncasting on various probability levels is evaluated by means of a forecasting study on\nthe components of the Dow Jones index for an out-of-sample period from December\n2016 to September 2021. The empirical results support effectiveness of the proposed\nframework compared to a variety of existing approaches.\nKeywords: multivariate; semi-parametric; Value-at-Risk; Expected Shortfall; fore-\ncasting.\n\u2217Email: storti@unisa.it.\n\u2020Corresponding author. Email: chao.wang@sydney.edu.au.\n1\narXiv:2207.04595v4  [q-fin.RM]  20 Dec 2024"}, {"group": "Structural Biology", "id": 13, "label": "A SURVEY ON COMPUTATIONAL SOLUTIONS FOR RECONSTRUCTING COMPLETE OBJECTS BY REASSEMBLING THEIR FRACTURED PARTS", "shape": "dot", "size": 10, "title": "Authors: Jiaxin Lu\u2020, Yongqing Liang\u2020, Jiacheng Hua\u2020, Qixing Huang\u2217\u003cbr\u003eYear: 2018\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Robotics", "id": 14, "label": "A Survey on Self-play Methods in Reinforcement Learning Ruize Zhang, Tsinghua University", "shape": "dot", "size": 10, "title": "Authors: Ruize Zhang, Zelai Xu, Chengdong Ma, Chao Yu, Wei-Wei Tu, Wenhao Tang, Shiyu Huang, Deheng Ye, Wenbo Ding, Yaodong Yang, Yu Wang\u003cbr\u003eYear: 2013\u003cbr\u003eAbstract: Self-play, characterized by agents\u2019 interactions with copies or past versions of themselves,\nhas recently gained prominence in reinforcement learning (RL). This paper first clarifies the\npreliminaries of self-play, including the multi-agent reinforcement learning framework and\nbasic game theory concepts. Then, it provides a unified framework and classifies existing\nself-play algorithms within this framework. Moreover, the paper bridges the gap between\nthe algorithms and their practical implications by illustrating the role of self-play in different\nscenarios. Finally, the survey highlights open challenges and future research directions in\nself-play. This paper is an essential guide map for understanding the multifaceted landscape\nof self-play in RL."}, {"group": "Natural Language Processing", "id": 15, "label": "A Theoretical Framework for Prompt Engineering: Approximating Smooth Functions with Transformer Prompts", "shape": "dot", "size": 10, "title": "Authors: Ryumei Nakada, Wenlong Ji, Tianxi Cai, James Zou, Linjun Zhang\u003cbr\u003eYear: 2017\u003cbr\u003eAbstract: Prompt engineering has emerged as a powerful technique for guiding large language\nmodels (LLMs) toward desired responses, significantly enhancing their performance\nacross diverse tasks.\nBeyond their role as static predictors, LLMs increasingly\nfunction as intelligent agents, capable of reasoning, decision-making, and adapting\ndynamically to complex environments. However, the theoretical underpinnings of\nprompt engineering remain largely unexplored. In this paper, we introduce a formal\nframework demonstrating that transformer models, when provided with carefully\ndesigned prompts, can act as a configurable computational system by emulating\na \u201cvirtual\u201d neural network during inference. Specifically, input prompts effectively\ntranslate into the corresponding network configuration, enabling LLMs to adjust their\ninternal computations dynamically. Building on this construction, we establish an\napproximation theory for \u03b2-times differentiable functions, proving that transformers\ncan approximate such functions with arbitrary precision when guided by appropriately\nstructured prompts. Moreover, our framework provides theoretical justification for\nseveral empirically successful prompt engineering techniques, including the use of longer,\nstructured prompts, filtering irrelevant information, enhancing prompt token diversity,\nand leveraging multi-agent interactions. By framing LLMs as adaptable agents rather\nthan static models, our findings underscore their potential for autonomous reasoning\nand problem-solving, paving the way for more robust and theoretically grounded\nadvancements in prompt engineering and AI agent design."}, {"group": "Structural Biology", "id": 16, "label": "Ab-initio simulation of excited-state potential energy surfaces with transferable deep quantum", "shape": "dot", "size": 10, "title": "Authors: Alice Cuzzocrea\u003cbr\u003eYear: 2012\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Structural Biology", "id": 17, "label": "Accelerating detector simulations with Celeritas: profiling and performance optimizations", "shape": "dot", "size": 10, "title": "Authors: Amanda L. Lund, Julien Esseiva, Seth R. Johnson, Elliott Biondo, Philippe, Canal, Thomas Evans, Hayden Hollenbeck, Soon Yung Jun, Guilherme Lima, Ben Morgan, Stefano C. Tognini\u003cbr\u003eYear: 2012\u003cbr\u003eAbstract: . Celeritas is a GPU-optimized Monte Carlo (MC) particle transport\ncode designed to meet the growing computational demands of next-generation\nhigh energy physics (HEP) experiments. It provides efficient simulation of elec-\ntromagnetic (EM) physics processes in complex geometries with magnetic fields,\ndetector hit scoring, and seamless integration into Geant4-driven applications\nto offload EM physics to GPUs. Recent efforts have focused on performance\noptimizations and expanding profiling capabilities. This paper presents some\nkey advancements, including the integration of the Perfetto system profiling tool\nfor detailed performance analysis and the development of track-sorting methods\nto improve computational efficiency."}, {"group": "Natural Language Processing", "id": 18, "label": "ADAPTING LANGUAGE-SPECIFIC LLMS TO A REA- SONING MODEL IN ONE DAY VIA MODEL MERGING", "shape": "dot", "size": 10, "title": "Authors: Pittawat Taveekitworachai, Potsawee Manakul, Kasima Tharnpipitchai\u003cbr\u003eYear: 2017\u003cbr\u003eAbstract: This paper investigates data selection and model merging methodologies aimed at\nincorporating advanced reasoning capabilities such as those of DeepSeek R1 into\nlanguage-specific large language models (LLMs), with a particular focus on the\nThai LLM. Our goal is to enhance the reasoning capabilities of language-specific\nLLMs while maintaining their target language abilities. DeepSeek R1 excels in\nreasoning but primarily benefits high-resource languages such as English and Chi-\nnese. However, low-resource languages remain underserved due to the dominance\nof English-centric training data and model optimizations, which limit performance\nin these languages. This limitation results in unreliable code-switching and dimin-\nished effectiveness on tasks in low-resource languages. Meanwhile, local and re-\ngional LLM initiatives have attempted to bridge this gap by developing language-\nspecific LLMs that focus on improving local linguistic fidelity. We demonstrate\nthat, with only publicly available datasets and a computational budget of $1201,\nit is possible to enhance the reasoning capabilities of language-specific LLMs to\nmatch the level of DeepSeek R1, without compromising their performance on tar-\nget language tasks. This work releases the data, merge configurations, and model\nweights to promote the advancement of language-specific LLM initiatives.2"}, {"group": "Theoretical Physics", "id": 19, "label": "ADAPTIVE RESAMPLING WITH BOOTSTRAP FOR NOISY MULTI-OBJECTIVE OPTIMIZATION PROBLEMS", "shape": "dot", "size": 10, "title": "Authors: Timo Budszuhn, Mark Joachim Krallmann, Daniel Horn\u003cbr\u003eYear: 2022\u003cbr\u003eAbstract: The challenge of noisy multi-objective optimization lies in the constant trade-off between exploring\nnew decision points and improving the precision of known points through resampling. This decision\nshould take into account both the variability of the objective functions and the current estimate of a\npoint in relation to the Pareto front. Since the amount and distribution of noise are generally unknown,\nit is desirable for a decision function to be highly adaptive to the properties of the optimization\nproblem. This paper presents a resampling decision function that incorporates the stochastic nature of\nthe optimization problem by using bootstrapping and the probability of dominance. The distribution-\nfree estimation of the probability of dominance is achieved using bootstrap estimates of the means. To\nmake the procedure applicable even with very few observations, we transfer the distribution observed\nat other decision points. The efficiency of this resampling approach is demonstrated by applying it in\nthe NSGA-II algorithm with a sequential resampling procedure under multiple noise variations."}, {"group": "Structural Biology", "id": 20, "label": "Addressing general measurements in quantum Monte Carlo", "shape": "dot", "size": 10, "title": "Authors: Zheng Yan\u003cbr\u003eYear: 2011\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Structural Biology", "id": 21, "label": "Advances in Protein Representation Learning: Methods, Applications, and Future Directions", "shape": "dot", "size": 10, "title": "Authors: Viet Thanh Duy Nguyen, Truong-Son Hy\u2217\u003cbr\u003eYear: 2011\u003cbr\u003eAbstract: Proteins are complex biomolecules that play a central role in various biological processes,\nmaking them critical targets for breakthroughs in molecular biology, medical research, and\ndrug discovery. Deciphering their intricate, hierarchical structures, and diverse functions is\nessential for advancing our understanding of life at the molecular level. Protein Represen-\ntation Learning (PRL) has emerged as a transformative approach, enabling the extraction of\nmeaningful computational representations from protein data to address these challenges. In\nthis paper, we provide a comprehensive review of PRL research, categorizing methodologies\ninto five key areas: feature-based, sequence-based, structure-based, multimodal, and complex-\nbased approaches. To support researchers in this rapidly evolving field, we introduce widely\nused databases for protein sequences, structures, and functions, which serve as essential re-\nsources for model development and evaluation. We also explore the diverse applications of\nthese approaches in multiple domains, demonstrating their broad impact. Finally, we discuss\npressing technical challenges and outline future directions to advance PRL, offering insights\nto inspire continued innovation in this foundational field.\n1\narXiv:2503.16659v1  [cs.LG]  20 Mar 2025\n1."}, {"group": "Game Theory", "id": 22, "label": "Advancing Portfolio Optimization: Adaptive Minimum-Variance Portfolios and Minimum Risk Rate Frameworks\u2217", "shape": "dot", "size": 10, "title": "Authors: Ayush Jha\u2217, Abootaleb Shirvani, Ali Jaffri, Svetlozar T. Rachev, Frank J. Fabozzi, Ayush Jha\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: This study presents the Adaptive Minimum-Variance Portfolio (AMVP) framework and the Adaptive\nMinimum-Risk Rate (AMRR) metric, innovative tools designed to optimize portfolios dynamically\nin volatile and nonstationary financial markets. Unlike traditional minimum-variance approaches,\nthe AMVP framework incorporates real-time adaptability through advanced econometric models,\nincluding ARFIMA-FIGARCH processes and non-Gaussian innovations. Empirical applications on\ncryptocurrency and equity markets demonstrate the proposed framework\u2019s superior performance in\nrisk reduction and portfolio stability, particularly during periods of structural market breaks and\nheightened volatility. The findings highlight the practical implications of using the AMVP and AMRR\nmethodologies to address modern investment challenges, offering actionable insights for portfolio\nmanagers navigating uncertain and rapidly changing market conditions.\nKeywords: Shadow Riskless Rate, Adaptive Minimum-Variance Portfolio, Adaptive Minimum-Risk Rate, Long-\nRange Depedence, Asset Pricing, Risk Premia"}, {"group": "Structural Biology", "id": 23, "label": "AlignDiff: Learning Physically-Grounded Camera Alignment via Diffusion", "shape": "dot", "size": 10, "title": "Authors: Liuyue Xie, Jiancong Guo, Ozan Cakmakci, Andre Araujo\u003cbr\u003eYear: 2012\u003cbr\u003eAbstract: Accurate camera calibration is a fundamental task for 3D\nperception, especially when dealing with real-world, in-the-\nwild environments where complex optical distortions are\ncommon. Existing methods often rely on pre-rectified im-\nages or calibration patterns, which limits their applicabil-\nity and flexibility. In this work, we introduce a novel frame-\nwork that addresses these challenges by jointly modeling\ncamera intrinsic and extrinsic parameters using a generic\nray camera model. Unlike previous approaches, AlignDiff\nshifts focus from semantic to geometric features, enabling\nmore accurate modeling of local distortions. We propose\nAlignDiff, a diffusion model conditioned on geometric pri-\nors, enabling the simultaneous estimation of camera distor-\ntions and scene geometry. To enhance distortion prediction,\nwe incorporate edge-aware attention, focusing the model\non geometric features around image edges, rather than se-\nmantic content. Furthermore, to enhance generalizability\nto real-world captures, we incorporate a large database of\nray-traced lenses containing over three thousand samples.\nThis database characterizes the distortion inherent in a di-\nverse variety of lens forms. Our experiments demonstrate\nthat the proposed method significantly reduces the angu-\nlar error of estimated ray bundles by \u223c8.2\u25e6and overall\ncalibration accuracy, outperforming existing approaches on\nchallenging, real-world datasets.\n1."}, {"group": "Game Theory", "id": 24, "label": "AlphaSharpe: LLM-Driven Discovery of Robust Risk-Adjusted Metrics Kamer Ali Yuksel and Hassan Sawaf", "shape": "dot", "size": 10, "title": "Authors: Hassan SawafaiXplain\u003cbr\u003eYear: 2013\u003cbr\u003eAbstract: Financial metrics like the Sharpe ratio are piv-\notal in evaluating investment performance by\nbalancing risk and return. However, traditional\nmetrics often struggle with robustness and gen-\neralization, particularly in dynamic and volatile\nmarket conditions. This paper introduces Al-\nphaSharpe, a novel framework leveraging large\nlanguage models (LLMs) to iteratively evolve\nand optimize financial metrics to discover en-\nhanced risk-return metrics that outperform tra-\nditional approaches in robustness and correla-\ntion with future performance metrics by em-\nploying iterative crossover, mutation, and eval-\nuation. Key contributions of this work include:\n(1) a novel use of LLMs to generate and refine\nfinancial metrics with implicit domain-specific\nknowledge, (2) a scoring mechanism to en-\nsure that evolved metrics generalize effectively\nto unseen data, and (3) an empirical demon-\nstration of 3x predictive power for future risk-\nreturns, and 2x portfolio performance. Experi-\nmental results in a real-world dataset highlight\nthe superiority of discovered metrics, making\nthem highly relevant to portfolio managers and\nfinancial decision-makers. This framework not\nonly addresses the limitations of existing met-\nrics but also showcases the potential of LLMs\nin advancing financial analytics, paving the way\nfor informed and robust investment strategies."}, {"group": "Natural Language Processing", "id": 25, "label": "AlphaSpace: Enabling Robotic Actions through Semantic Tokenization and Symbolic Reasoning", "shape": "dot", "size": 10, "title": "Authors: Alan Dao, Dinh Bach Vu, Bui Quang Huy\u003cbr\u003eYear: 2022\u003cbr\u003eAbstract: This paper presents AlphaSpace, a novel methodology\ndesigned to enhance the spatial reasoning capabilities of\nlanguage models for robotic manipulation in 3D Carte-\nsian space. AlphaSpace employs a hierarchical semantics-\nbased tokenization strategy that encodes spatial informa-\ntion at both coarse and fine-grained levels. Our approach\nrepresents objects with their attributes, positions, and\nheight information through structured tokens, enabling\nprecise spatial reasoning without relying on traditional\nvision-based embeddings. This approach enables LLMs\nto accurately manipulate objects by positioning them at\nspecific (x, y, z) coordinates.\nExperimental results sug-\ngest that AlphaSpace demonstrates promising potential\nfor improving manipulation tasks, achieving a total ac-\ncuracy of 66.67%, compared to 37.5% for GPT-4o and\n29.17% for Claude 3.5 Sonnet. These results demonstrate\nthe potential of structured spatial encoding for manipu-\nlation tasks and warrant further exploration."}, {"group": "Natural Language Processing", "id": 26, "label": "An evaluation of LLMs and Google Translate for translation of selected Indian languages via sentiment and semantic analyses", "shape": "dot", "size": 10, "title": "Authors: Rohitash Chandraa, Aryan Chaudharib, Yeshwanth Rayavarapua\u003cbr\u003eYear: 2019\u003cbr\u003eAbstract: Large Language models (LLMs) have been prominent for language translation, including low-resource languages. There has\nbeen limited study about the assessment of the quality of translations generated by LLMs, including Gemini, GPT and Google\nTranslate. In this study, we address this limitation by using semantic and sentiment analysis of selected LLMs for Indian languages,\nincluding Sanskrit, Telugu and Hindi. We select prominent texts that have been well translated by experts and use LLMs to generate\ntheir translations to English, and then we provide a comparison with selected expert (human) translations. Our findings suggest\nthat while LLMs have made significant progress in translation accuracy, challenges remain in preserving sentiment and semantic\nintegrity, especially in figurative and philosophical contexts. The sentiment analysis revealed that GPT-4o and GPT-3.5 are better at\npreserving the sentiments for the Bhagavad Gita (Sanskrit-English) translations when compared to Google Translate. We observed\na similar trend for the case of Tamas (Hindi-English) and Maha P (Telugu-English) translations. GPT-4o performs similarly to\nGPT-3.5 in the translation in terms of sentiments for the three languages. We found that LLMs are generally better at translation\nfor capturing sentiments when compared to Google Translate.\n1."}, {"group": "Theoretical Physics", "id": 27, "label": "AN IMPROVED CENTRAL LIMIT THEOREM FOR THE EMPIRICAL SLICED WASSERSTEIN DISTANCE", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2017\u003cbr\u003eAbstract: Optimal transport theory has become a fundamental tool for handling diverse types of data, with\ngrowing applications across various fields. However, the Wasserstein distance presents significant\ncomputational and statistical challenges in high-dimensional settings. To address these issues,\nalternative distances such as the sliced Wasserstein distance, which leverages one-dimensional\nprojections, have been introduced. In this work, we establish a novel central limit theorem for the\np-sliced Wasserstein distance, for p \u003e 1, using the Efron-Stein inequality\u2014a technique that has\nproven effective in related problems. This approach yields a central limit theorem centered at the\nexpected value of the empirical cost, under mild regularity conditions. Notably, unlike the general\nWasserstein distance in arbitrary dimensions, we demonstrate that, under specific assumptions, the\ncentering constants can be replaced by the population cost, which is essential for statistical inference.\nThis generalizes and significantly refines existing results for the one-dimensional case. Consequently,\nwe present the first asymptotically valid inference framework for the sliced Wasserstein distance\napplicable to measures that are not necessarily compactly supported, for p \u003e 1. Finally, we address\nkey practical aspects for inference, including Monte Carlo estimation of the integral and estimation\nof the asymptotic variance, ensuring applicability in real-world scenarios.\nKeywords Optimal transport \u00b7 Sliced Wasserstein distance \u00b7 Efron-Stein inequality"}, {"group": "Structural Biology", "id": 28, "label": "An RNA condensate model for the origin of life.", "shape": "dot", "size": 10, "title": "Authors: Alan M. Moses\u003cbr\u003eYear: 2012\u003cbr\u003eAbstract: Proposed mechanism of compartmentalization and self-replication via an RNA condensate: (1) \ncondensation, (2) RNA-templated polymerization (green arrows) and growth, and (3) division. \nResearch Highlights \n \n1. RNA condensates may have served as self-replicating catalysts for the origin of life and \nthe RNA World. \n2. Catalytic RNA condensates formed by short and low-complexity RNAs lower the error \nthreshold and unify replication and compartmentalization.  \n3. RNA condensates capable of self-templated polymerization may spontaneously begin a \n\u2018condensate chain reaction\u2019 leading to natural selection \n4. Within a standard polymer physics framework, key biophysical parameters are defined for \ncondensate-dependent self-templated RNA polymerization, leading to a thermodynamic \nand information theoretic framework for the origin of life. \n5. These hypotheses about the origin of life can readily be tested by experiment or \nsimulations. \n \nAbstract \nThe RNA World hypothesis predicts that self-replicating RNAs evolved before DNA genomes and \ncoded proteins. Despite widespread support for the RNA World, self-replicating RNAs have yet to \nbe identified in a natural context, leaving a key \u2018missing link\u2019 for this explanation of the origin of \n \n2 \nlife. Inspired by recent work showing that condensates of charged polymers are capable of \ncatalyzing chemical reactions, we consider a catalytic RNA condensate as a candidate for the \nself-replicating RNA. Specifically, we propose that short, low-complexity RNA polymers formed \ncatalytic condensates capable of templated RNA polymerization. Because the condensate \nproperties depend on the RNA sequences, RNAs that formed condensates with improved \npolymerization and demixing capacity would be amplified, leading to a \u2018condensate chain reaction\u2019 \nand evolution by natural selection. Many of the needed properties of this self-replicating RNA \ncondensate have been realized experimentally in recent studies and our predictions could be \ntested with current experimental and theoretical tools. Our theory addresses central problems in \nthe origins of life: (i) the origin of compartmentalization, (ii) the error threshold for the accuracy of \ntemplated replication, (iii) the free energy cost of maintaining an information-rich population of \nreplicating RNA polymers. Furthermore, we note that the extant nucleolus appears to satisfy many \nof the requirements of an evolutionary relic for the model we propose. More generally, we suggest \nthat future work on the origin of life would benefit from condensate-centric biophysical models of \nRNA evolution. \nKeywords: origin of life, RNA world, condensates, Eigen\u2019s error threshold, polymer physics, \ninformation theory, theoretical biology."}, {"group": "Theoretical Physics", "id": 29, "label": "An (\u03f5, \u03b4)-accurate level set estimation with a stopping crite- Kyushu Institute of Technology", "shape": "dot", "size": 10, "title": "Authors: Kota Matsui, RIKEN AIP, Kentaro Kutsukake, Hideitsu Hino\u003cbr\u003eYear: 2017\u003cbr\u003eAbstract: The level set estimation problem seeks to identify regions within a set of candidate points\nwhere an unknown and costly to evaluate function\u2019s value exceeds a specified threshold, pro-\nviding an efficient alternative to exhaustive evaluations of function values. Traditional meth-\nods often use sequential optimization strategies to find \u03f5-accurate solutions, which permit a\nmargin around the threshold contour but frequently lack effective stopping criteria, leading\nto excessive exploration and inefficiencies. This paper introduces an acquisition strategy for\nlevel set estimation that incorporates a stopping criterion, ensuring the algorithm halts when\nfurther exploration is unlikely to yield improvements, thereby reducing unnecessary function\nevaluations. We theoretically prove that our method satisfies \u03f5-accuracy with a confidence\nlevel of 1 \u2212\u03b4, addressing a key gap in existing approaches. Furthermore, we show that\nthis also leads to guarantees on the lower bounds of performance metrics such as F-score.\nNumerical experiments demonstrate that the proposed acquisition function achieves compa-\nrable precision to existing methods while confirming that the stopping criterion effectively\nterminates the algorithm once adequate exploration is completed."}, {"group": "Structural Biology", "id": 30, "label": "Analysis of the inference of ratings and rankings in complex networks using discrete exterior calculus on higher\u2013order networks", "shape": "dot", "size": 10, "title": "Authors: Juan I. Perotti, Jiang, Ramon Llull, Llull, Borda, Condorcet, Zermelo, Bradley, Terry, Zermelo, Brin, Page, Euler\u003cbr\u003eYear: 2017\u003cbr\u003eAbstract: simplicial complexes, or simply, simplicial com-\nplexes.\nAlthough terminology and definitions may vary by\ncontext, many concepts from differential geometry on\nsmooth manifolds can be adapted to the discrete or\ncombinatorial setting of simplicial complexes [14, 22\u2013\n26].\nSpecifically, within the framework of discrete ex-\nterior calculus, discrete or combinatorial analogs of dif-\nferential forms, gradients, divergences, and Laplacians\ncan be defined on simplicial complexes. This is the rea-\nson for which simplicial complexes are often preferred\nover general hypergraphs. In particular, and thanks to\nthe property of topological closure, combinatorial Hodge\ntheory can be applied to decompose cochains on simpli-\narXiv:"}, {"group": "Natural Language Processing", "id": 31, "label": "Audio-driven Gesture Generation via Deviation Feature in the Latent Space", "shape": "dot", "size": 10, "title": "Authors: Jiahui Chen, \u2217, Huan Yang\u2217, Runhua Shi, Chaofan Ding, Xiaoqi Mo, Siyu Xiong, Yinong He, Trump\u003cbr\u003eYear: 2018\u003cbr\u003eAbstract: \u2014Gestures are essential for enhancing co-speech com-\nmunication, offering visual emphasis and complementing verbal\ninteractions. While prior work has concentrated on point-level\nmotion or fully supervised data-driven methods, we focus on co-\nspeech gestures, advocating for weakly supervised learning and\npixel-level motion deviations. We introduce a weakly supervised\nframework that learns latent representation deviations, tailored\nfor co-speech gesture video generation. Our approach employs a\ndiffusion model to integrate latent motion features, enabling more\nprecise and nuanced gesture representation. By leveraging weakly\nsupervised deviations in latent space, we effectively generate\nhand gestures and mouth movements, crucial for realistic video\nproduction. Experiments show our method significantly improves\nvideo quality, surpassing current state-of-the-art techniques.\nIndex Terms\u2014Co-speech gesture, audio-driven, multi-modal\nI."}, {"group": "Logic", "id": 32, "label": "AutoBayes: A Compositional Framework for Generalized Variational Inference", "shape": "dot", "size": 10, "title": "Authors: Marco Perin\u003cbr\u003eYear: 2020\u003cbr\u003eAbstract: We introduce a new compositional framework for generalized variational inference, clarify-\ning the di\ufb00erent parts of a model, how they interact, and how they compose. We explain\nthat both exact Bayesian inference and the loss functions typical of variational inference\n(such as variational free energy and its generalizations) satisfy chain rules akin to that of\nreverse-mode automatic di\ufb00erentiation, and we advocate for exploiting this to build and\noptimize models accordingly. To this end, we construct a series of compositional tools: for\nbuilding models; for constructing their inversions; for attaching local loss functions; and\nfor exposing parameters. Finally, we explain how the resulting parameterized statistical\ngames may be optimized locally, too. We illustrate our framework with a number of classic\nexamples, pointing to new areas of extensibility that are revealed.\n1."}, {"group": "Structural Biology", "id": 33, "label": "Automated and Risk-Aware Engine Control Calibration Using Constrained Bayesian Optimization", "shape": "dot", "size": 10, "title": "Authors: Maarten Vlaswinkel, \u2217, Frank Willems\u003cbr\u003eYear: 2017\u003cbr\u003eAbstract: Decarbonization of the transport sector sets increasingly strict demands to maximize thermal efficiency and\nminimize greenhouse gas emissions of Internal Combustion Engines. This has led to complex engines with a\nsurge in the number of corresponding tuneable parameters in actuator set points and control settings. Automated\ncalibration is therefore essential to keep development time and costs at acceptable levels. In this work, an\ninnovative self-learning calibration method is presented based on in-cylinder pressure curve shaping. This\nmethod combines Principal Component Decomposition with constrained Bayesian Optimization. To realize\nmaximal thermal engine efficiency, the optimization problem aims at minimizing the difference between the\nactual in-cylinder pressure curve and an Idealized Thermodynamic Cycle. By continuously updating a Gaussian\nProcess Regression model of the pressure\u2019s Principal Components weights using measurements of the actual\noperating conditions, the mean in-cylinder pressure curve as well as its uncertainty bounds are learned. This\ninformation drives the optimization of calibration parameters, which are automatically adapted while dealing\nwith the risks and uncertainties associated with operational safety and combustion stability. This data-driven\nmethod does not require prior knowledge of the system. The proposed method is successfully demonstrated\nin simulation using a Reactivity Controlled Compression Ignition engine model. The difference between the\nGross Indicated Efficiency of the optimal solution found and the true optimum is 0.017 %. For this complex\nengine, the optimal solution was found after 64.4 s, which is relatively fast compared to conventional calibration\nmethods.\nKeywords: Machine Learning; Bayesian Optimisation; Gaussian Process Regression; Principle Component\nDecomposition; Auto-calibration"}, {"group": "Theoretical Physics", "id": 34, "label": "Automatically Adaptive Conformal Risk Control Anastasios N. Angelopoulos", "shape": "dot", "size": 10, "title": "Authors: Vincent Blot, Michael I. Jordan, Nicolas J-B. Brunel\u003cbr\u003eYear: 2022\u003cbr\u003eAbstract: Science and technology have a growing need\nfor effective mechanisms that ensure reliable,\ncontrolled performance from black-box ma-\nchine learning algorithms. These performance\nguarantees should ideally hold conditionally\non the input\u2014that is the performance guar-\nantees should hold, at least approximately, no\nmatter what the input. However, beyond styl-\nized discrete groupings such as ethnicity and\ngender, the right notion of conditioning can\nbe difficult to define. For example, in prob-\nlems such as image segmentation, we want the\nuncertainty to reflect the intrinsic difficulty of\nthe test sample, but this may be difficult to\ncapture via a conditioning event. Building on\nthe recent work of Gibbs et al. (2023), we pro-\npose a methodology for achieving approximate\nconditional control of statistical risks\u2014the ex-\npected value of loss functions\u2014by adapting\nto the difficulty of test samples. Our frame-\nwork goes beyond traditional conditional risk\ncontrol based on user-provided conditioning\nevents to the algorithmic, data-driven determi-\nnation of appropriate function classes for con-\nditioning. We apply this framework to various\nregression and segmentation tasks, enabling\nfiner-grained control over model performance\nand demonstrating that by continuously mon-\nProceedings of the 28th International Conference on Artifi-\ncial Intelligence and Statistics (AISTATS) 2025, Mai Khao,\nThailand. PMLR: Volume 258. Copyright 2025 by the au-\nthor(s).\nitoring and adjusting these parameters, we\ncan achieve superior precision compared to\nconventional risk-control methods."}, {"group": "Natural Language Processing", "id": 35, "label": "BACON: Improving Clarity of Image Captions via Bag-of-Concept Graphs", "shape": "dot", "size": 10, "title": "Authors: Zhantao Yang, \u22c6, Ruili Feng\u22c6\u22c4, Keyu Yan, Huangji Wang, Zhicai Wang, Shangwen Zhu, Han Zhang, Jie Xiao, Pingyu Wu, Kai Zhu, Jixuan Chen, Chen-Wei Xie, Yue Yang, Hongyang Zhang, Yu Liu, Fan Cheng\u2020, yankeyu, zhushangwen, hzhang, jiexiao\u003cbr\u003eYear: 2016\u003cbr\u003eAbstract: Advancements in large Vision-Language Models have\nbrought precise, accurate image captioning, vital for ad-\nvancing multi-modal image understanding and processing.\nYet these captions often carry lengthy, intertwined contexts\nthat are difficult to parse and frequently overlook essen-\ntial cues, posing a great barrier for models like Ground-\ningDINO and SDXL, which lack the strong text encoding\nand syntax analysis needed to fully leverage dense captions.\nTo address this, we propose BACON, a prompting method\nthat breaks down VLM-generated captions into disentan-\ngled, structured elements such as objects, relationships,\nstyles, and themes. This approach not only minimizes confu-\nsion from handling complex contexts but also allows for effi-\ncient transfer into a JSON dictionary, enabling models with-\nout linguistic processing capabilities to easily access key\ninformation.\nWe annotated 100,000 image-caption pairs\nusing BACON with GPT-4V and trained an LLaVA cap-\ntioner on this dataset, enabling it to produce BACON-style\ncaptions without relying on costly GPT-4V. Evaluations of\noverall quality, precision, and recall\u2014as well as user stud-\nies\u2014demonstrate that the resulting caption model consis-\ntently outperforms other SOTA VLM models in generating\nhigh-quality captions. Besides, we show that BACON-style\ncaptions exhibit better clarity when applied to various mod-\nels, enabling them to accomplish previously unattainable\ntasks or surpass existing SOTA solutions without training.\nFor example, BACON-style captions help GroundingDINO\nachieve"}, {"group": "Science and Technology", "id": 36, "label": "Bearing fault diagnosis based on multi-scale spectral images and convolutional neural network", "shape": "dot", "size": 10, "title": "Authors: Tongchao Luo, Mingquan Qiu, Zhenyu Wu, Zebo Zhao, Dingyou Zhang\u003cbr\u003eYear: 2019\u003cbr\u003eAbstract: .  To address the challenges of low diagnostic accuracy in traditional bearing fault diagnosis methods, this paper \nproposes a novel fault diagnosis approach based on multi-scale spectrum feature images and deep learning. Firstly, the vibration \nsignal are preprocessed through mean removal and then converted to multi-length spectrum with fast Fourier transforms (FFT). \nSecondly, a novel feature called multi-scale spectral image (MSSI) is constructed by multi-length spectrum paving scheme. \nFinally, a deep learning framework, convolutional neural network (CNN), is formulated to diagnose the bearing faults. Two \nexperimental cases are utilized to verify the effectiveness of the proposed method. Experimental results demonstrate that the \nproposed method significantly improves the accuracy of fault diagnosis. \nKeywords: Bearing, fault diagnosis, multi-scale spectral image (MSSI), convolutional neural network (CNN). \n1."}, {"group": "Structural Biology", "id": 37, "label": "Benchmarking Data Efficiency in \u2206-ML and Multifidelity Models for Quantum Chemistry", "shape": "dot", "size": 10, "title": "Authors: Peter Zaspel[\u2212\u2212\u2212\u003cbr\u003eYear: 2013\u003cbr\u003eAbstract: . The development of machine learning (ML) methods has made quantum chem-\nistry (QC) calculations more accessible by reducing the compute cost incurred in conventional\nQC methods. This has since been translated into the overhead cost of generating training data.\nIncreased work in reducing the cost of generating training data resulted in the development\nof \u2206-ML and multifidelity machine learning methods which use data at more than one QC\nlevel of accuracy, or fidelity.\nThis work compares the data costs associated with \u2206-ML, multifidelity machine learning\n(MFML), and optimized MFML (o-MFML) in contrast with a newly introduced Multifidelity\u2206-\nMachine Learning (MF\u2206ML) method for the prediction of ground state energies, vertical ex-\ncitation energies, and the magnitude of electronic contribution of molecular dipole moments\nfrom the multifidelity benchmark dataset QeMFi. This assessment is made on the basis of\ntraining data generation cost associated with each model and is compared with the single\nfidelity kernel ridge regression (KRR) case. The results indicate that the use of multifidelity\nmethods surpasses the standard \u2206-ML approaches in cases of a large number of predictions.\nFor applications which require only a few evaluations to be made using ML models, while the\n\u2206-ML method might be favored, the MF\u2206ML method is shown to be more efficient.\nKeywords: multifidelity \u00b7 machine learning \u00b7 quantum chemistry \u00b7 DFT \u00b7 excitation energies\n\u00b7 SCF \u00b7 sparse data"}, {"group": "Theoretical Physics", "id": 38, "label": "Benign landscape for Burer-Monteiro factorizations of MaxCut-type semide\ufb01nite", "shape": "dot", "size": 10, "title": "Authors: Ir`ene Waldspurger\u2020, Inria Mokaplan\u003cbr\u003eYear: 2014\u003cbr\u003eAbstract: We consider MaxCut-type semide\ufb01nite programs (SDP) which ad-\nmit a low rank solution. To numerically leverage the low rank hy-\npothesis, a standard algorithmic approach is the Burer-Monteiro fac-\ntorization, which allows to signi\ufb01cantly reduce the dimensionality of\nthe problem at the cost of its convexity. We give a sharp condition\non the conditioning of the Laplacian matrix associated with the SDP\nunder which any second-order critical point of the non-convex prob-\nlem is a global minimizer. By applying our theorem, we improve on\nrecent results about the correctness of the Burer-Monteiro approach\non Z2-synchronization problems and the Kuramoto model."}, {"group": "Theoretical Physics", "id": 39, "label": "Benign landscapes for synchronization on spheres via normalized Laplacian matrices", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2010\u003cbr\u003eAbstract: We study the nonconvex optimization landscapes of synchronization problems on spheres.\nFirst, we present new results for the statistical problem of synchronization over the two-element\ngroup Z2. We consider the nonconvex least-squares problem with Z2 = {\u00b11} relaxed to the\nunit sphere in Rr for r \u22652; for several popular models, including graph clustering under\nthe binary stochastic block model, we show that, for any r \u22652, every second-order critical\npoint recovers the ground truth in the asymptotic regimes where exact recovery is information-\ntheoretically possible. Such statistical optimality via spherical relaxations had previously only\nbeen shown for (potentially arbitrarily) larger relaxation dimension r. Second, we consider the\nglobal synchronization of networks of coupled oscillators under the (homogeneous) Kuramoto\nmodel.\nWe prove new and optimal asymptotic results for random signed networks on an\nErd\u02ddos\u2013R\u00b4enyi graph, and we give new and simple proofs for several existing state-of-the-art\nresults.\nOur key tool is a deterministic landscape condition that extends a recent result\nof Rakoto Endor and Waldspurger.\nThis result says that, if a certain problem-dependent\nLaplacian matrix has small enough condition number, the nonconvex landscape is benign. Our\nextension allows the condition number to include an arbitrary diagonal preconditioner, which\ngives tighter results for many problems. We show that, for the synchronization of Kuramoto\noscillator networks on nearest-neighbor circulant graphs as studied by Wiley, Strogatz, and\nGirvan, this condition is optimal. We also prove a natural complex extension that may be of\ninterest for synchronization on the special orthogonal group SO(2)."}, {"group": "Structural Biology", "id": 40, "label": " Beyond Atoms: Enhancing Molecular Pretrained Representations with 3D Space Modeling ", "shape": "dot", "size": 10, "title": "Authors: Shuqi Lu, Xiaohong Ji, Bohang Zhang, Lin Yao, Siyuan Liu, Zhifeng Gao, Linfeng Zhang, Guolin Ke\u003cbr\u003eYear: 2010\u003cbr\u003eAbstract: Molecular pretrained representations (MPR) has\nemerged as a powerful approach for addressing\nthe challenge of limited supervised data in ap-\nplications such as drug discovery and material\ndesign. While early MPR methods relied on 1D\nsequences and 2D graphs, recent advancements\nhave incorporated 3D conformational informa-\ntion to capture rich atomic interactions. However,\nthese prior models treat molecules merely as dis-\ncrete atom sets, overlooking the space surround-\ning them. We argue from a physical perspective\nthat only modeling these discrete points is insuffi-\ncient. We first present a simple yet insightful ob-\nservation: naively adding randomly sampled vir-\ntual points beyond atoms can surprisingly enhance\nMPR performance. In light of this, we propose a\nprincipled framework that incorporates the entire\n3D space spanned by molecules. We implement\nthe framework via a novel Transformer-based ar-\nchitecture, dubbed SpaceFormer, with three key\ncomponents: (1) grid-based space discretization;\n(2) grid sampling/merging; and (3) efficient 3D\npositional encoding. Extensive experiments show\nthat SpaceFormer significantly outperforms previ-\nous 3D MPR models across various downstream\ntasks with limited data, validating the benefit of\nleveraging the additional 3D space beyond atoms\nin MPR models.\n1."}, {"group": "Theoretical Physics", "id": 41, "label": "Bounds on the Distribution of a Sum of Two Random Variables: Revisiting a problem of Kolmogorov with application to", "shape": "dot", "size": 10, "title": "Authors: Zhehao Zhang, Thomas S. Richardson\u003cbr\u003eYear: 2017\u003cbr\u003eAbstract: We revisit the following problem, proposed by Kolmogorov: given prescribed marginal\ndistributions F and G for random variables X, Y respectively, characterize the set of\ncompatible distribution functions for the sum Z = X + Y . Bounds on the distribution\nfunction for Z were first given by Makarov (1982) and R\u00a8uschendorf (1982) independently.\nFrank et al. (1987) provided a solution to the same problem using copula theory. However,\nthough these authors obtain the same bounds, they make different assertions concerning\ntheir sharpness. In addition, their solutions leave some open problems in the case when\nthe given marginal distribution functions are discontinuous. These issues have led to\nsome confusion and erroneous statements in subsequent literature, which we correct.\nKolmogorov\u2019s problem is closely related to inferring possible distributions for individual\ntreatment effects Y1 \u2212Y0 given the marginal distributions of Y1 and Y0; the latter being\nidentified from a randomized experiment. We use our new insights to sharpen and correct\nthe results due to Fan and Park (2010) concerning individual treatment effects, and to\nfill some other logical gaps.\n1\narXiv:2405.08806v2  [math.ST]  25 Mar 2025"}, {"group": "Theoretical Physics", "id": 42, "label": "Calibration Bands for Mean Estimates within the Exponential", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2022\u003cbr\u003eAbstract: A statistical model is said to be calibrated if the resulting mean estimates perfectly match\nthe true means of the underlying responses. Aiming for calibration is often not achievable\nin practice as one has to deal with finite samples of noisy observations. A weaker notion of\ncalibration is auto-calibration. An auto-calibrated model satisfies that the expected value\nof the responses being given the same mean estimate matches this estimate. Testing for\nauto-calibration has only been considered recently in the literature and we propose a new\napproach based on calibration bands. Calibration bands denote a set of lower and upper\nbounds such that the probability that the true means lie simultaneously inside those bounds\nexceeds some given confidence level. Such bands were constructed by Yang\u2013Barber (2019)\nfor sub-Gaussian distributions. Dimitriadis et al. (2023) then introduced narrower bands\nfor the Bernoulli distribution and we use the same idea in order to extend the construction\nto the entire exponential dispersion family that contains for example the binomial, Poisson,\nnegative binomial, gamma and normal distributions. Moreover, we show that the obtained\ncalibration bands allow us to construct various tests for calibration and auto-calibration,\nrespectively.\nKeywords. Auto-calibration, calibration, calibration bands, exponential dispersion family,\nmean estimation, regression modeling, binomial distribution, Poisson distribution, negative\nbinomial distribution, gamma distribution, normal distribution."}, {"group": "Theoretical Physics", "id": 43, "label": "Can Large Language Models Predict Associations Among Human Attitudes? School of Social and Behavioral Sciences", "shape": "dot", "size": 10, "title": "Authors: Ana Ma, Derek Powell\u003cbr\u003eYear: 2010\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Game Theory", "id": 44, "label": "highly correlated market? Empirical evidence from", "shape": "dot", "size": 10, "title": "Authors: Heming ChenOkayama\u003cbr\u003eYear: 2022\u003cbr\u003eAbstract: This study systematically examines how several alternative approaches considered affect three as-\npects that determine portfolio performance (the gross return, the transaction costs and the portfolio\nrisk). We find that it is difficult to exploit the possible predictability of asset returns. However,\nthe predictability of asset return volatility produces obvious economic value, although in a highly\ncorrelated cryptocurrencies market.\nKeywords: mean-variance analysis, conditional mean, conditional variance, turnover penalty, per-\nformance fee."}, {"group": "Structural Biology", "id": 45, "label": "Causal invariant geographic network representations with feature and structural distribution shifts", "shape": "dot", "size": 10, "title": "Authors: Yuhan Wanga, Silu Hea, Qinyao Luoa, Hongyuan Yuana, Ling Zhaoa, Jiawei Zhub, Haifeng Lia, \u2217\u003cbr\u003eYear: 2019\u003cbr\u003eAbstract: Relationships between geographic entities, including human-land and human-people relationships, can be naturally modelled by\ngraph structures, and geographic network representation is an important theoretical issue. The existing methods learn geographic\nnetwork representations through deep graph neural networks (GNNs) based on the i.i.d. assumption. However, the spatial het-\nerogeneity and temporal dynamics of geographic data make the out-of-distribution (OOD) generalisation problem particularly\nsalient. We classify geographic network representations into invariant representations that always stabilise the predicted labels\nunder distribution shifts and background representations that vary with different distributions. The latter are particularly sensitive to\ndistribution shifts (feature and structural shifts) between testing and training data and are the main causes of the out-of-distribution\ngeneralisation (OOD) problem. Spurious correlations are present between invariant and background representations due to selection\nbiases/environmental effects, resulting in the model extremes being more likely to learn background representations. The existing\napproaches focus on background representation changes that are determined by shifts in the feature distributions of nodes in the\ntraining and test data while ignoring changes in the proportional distributions of heterogeneous and homogeneous neighbour nodes,\nwhich we refer to as structural distribution shifts. We propose a feature-structure mixed invariant representation learning (FSM-\nIRL) model that accounts for both feature distribution shifts and structural distribution shifts. To address structural distribution\nshifts, we introduce a sampling method based on causal attention, encouraging the model to identify nodes possessing strong causal\nrelationships with labels or nodes that are more similar to the target node. This approach significantly enhances the invariance of\nthe representations between the source and target domains while reducing the dependence on background representations that arise\nby chance or in specific patterns. Inspired by the Hilbert\u2013Schmidt independence criterion, we implement a reweighting strategy\nto maximise the orthogonality of the node representations, thereby mitigating the spurious correlations among the node repre-\nsentations and suppressing the learning of background representations. In addition, we construct an educational-level geographic\nnetwork dataset under out-of-distribution (OOD) conditions. Our experiments demonstrate that FSM-IRL exhibits strong learning\ncapabilities on both geographic and social network datasets in OOD scenarios.\nKeywords: Geographic Network Representation Learning, Out-of-Distribution Generalization, Casual Inference\n1."}, {"group": "Structural Biology", "id": 46, "label": "Centroid Decision Forest Amjad Ali, Zardad Khan, and Saeed Aldahmani,", "shape": "dot", "size": 10, "title": "Authors: Amjad Ali, Zardad Khan, Saeed Aldahmani\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: \u2014This paper introduces the centroid decision forest\n(CDF), a novel ensemble learning framework that rede\ufb01nes the\nsplitting strategy and tree building in the ordinary decision\ntrees for high-dimensional classi\ufb01cation. The splitting approach\nin CDF differs from the traditional decision trees in theat the\nclass separability score (CSS) determines the selection of the\nmost discriminative features at each node to construct centroids\nof the partitions (daughter nodes). The splitting criterion uses\nthe Euclidean distance measurements from each class centroid\nto achieve a splitting mechanism that is more \ufb02exible and\nrobust. Centroids are constructed by computing the mean feature\nvalues of the selected features for each class, ensuring a class-\nrepresentative division of the feature space. This centroid-driven\napproach enables CDF to capture complex class structures while\nmaintaining interpretability and scalability. To evaluate CDF, 23\nhigh-dimensional datasets are used to assess its performance\nagainst different state-of-the-art classi\ufb01ers through classi\ufb01ca-\ntion accuracy and Cohen\u2019s kappa statistic. The experimental\nresults show that CDF outperforms the conventional methods\nestablishing its effectiveness and \ufb02exibility for high-dimensional\nclassi\ufb01cation problems.\nIndex Terms\u2014High-dimensional data, class separability score\n(CSS), centroid based partitioning, decision trees, ensemble\nlearning.\nI."}, {"group": "Structural Biology", "id": 47, "label": "Target-aware Ligand Generation", "shape": "dot", "size": 10, "title": "Authors: Engin Tekin\u2020, Maryam Nadeem\u2020, Nancy A. ElNaker, MohammadAmaan Sayeed, Natalia Vassilieva, Boulbaba Ben Amor\u2021\u003cbr\u003eYear: 2014\u003cbr\u003eAbstract: Revolutionizing drug discovery demands more than just understanding molecular interac-\ntions\u2014it requires generative models that can design novel ligands tailored to specific biological\ntargets. While chemical Language Models (cLMs) have made strides in learning molecular prop-\nerties, most fail to incorporate target-specific insights, restricting their ability to drive de-novo\nligand generation.\nChem42, a cutting-edge family of generative chemical Language Models, is\ndesigned to bridge this gap. By integrating atomic-level interactions with multimodal inputs from\nProt42, a complementary protein Language Model [SNT+], Chem42 achieves a sophisticated cross-\nmodal representation of molecular structures, interactions, and binding patterns. This innovative\nframework enables the creation of structurally valid, synthetically accessible ligands with enhanced\ntarget specificity. Evaluations across diverse protein targets confirm that Chem42 surpasses ex-\nisting approaches in chemical validity, target-aware design, and predicted binding affinity.\nBy\nreducing the search space of viable drug candidates, Chem42 could accelerate the drug discov-\nery pipeline, offering a powerful generative AI tool for precision medicine. The Chem42 models,\navailable at huggingface.co/inceptionai, set a new benchmark in molecule property prediction,\nconditional molecule generation, and target-aware ligand design.\nFigure 1: Example of a Chem42-generated ligand designed to bind the Y220C mutant p53 protein\n(PDB ID: 8a32), shown on the right (panel (c)). For comparison, panel (a) presents the binding pose\nof the recently proposed small-molecule stabilizer JC769 as estimated using DiffDock-L [CDF+24],\nwhile panel (b) displays the stabilizer JC769 as originally reported in the literature [SCDD+22]. The\nprotein target context is captured using our protein Language Model (Prot42 [SNT+]) and integrated\ninto the chemical Language Model (Chem42) to guide ligand generation. Calculated metrics\u2014including\nDrug-likeness, Synthetic Accessibility, and Binding Affinity\u2014demonstrate the effectiveness of Chem42\nin achieving state-of-the-art molecular design results.\n\u2217Chem42 is part of the Omics42 platform which includes also a family of genomic LMs and a family of proteins LMs\nnamed Gene42 and Prot42, respectively. Refer to Omics42 blog at huggingface.co/inceptionai for further details.\n\u2020These authors contributed equally to this work.\n\u2021Corresponding author: Boulbaba Ben Amor boulbaba.amor@inceptionai.ai\n1\narXiv:2503.16563v1  [cs.LG]  20 Mar 2025"}, {"group": "Structural Biology", "id": 48, "label": "Code-Verification Techniques for an Arbitrary-Depth Electromagnetic Slot Model", "shape": "dot", "size": 10, "title": "Authors: Brian A. Frenoa, Neil R. Matulaa, Robert A. Pfeiffera, Vinh Q. Danga\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract:
