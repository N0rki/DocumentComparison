Theoretical Physics", "id": 209, "label": "The Local Approach to Causal Inference under Network Interference", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2022\u003cbr\u003eAbstract: We propose a new nonparametric modeling framework for causal inference when out-\ncomes depend on how agents are linked in a social or economic network. Such network\ninterference describes a large literature on treatment spillovers, social interactions,\nsocial learning, information di\ufb00usion, disease and \ufb01nancial contagion, social capital\nformation, and more.\nOur approach works by \ufb01rst characterizing how an agent is\nlinked in the network using the con\ufb01guration of other agents and connections nearby\nas measured by path distance.\nThe impact of a policy or treatment assignment is\nthen learned by pooling outcome data across similarly con\ufb01gured agents. We demon-\nstrate the approach by deriving \ufb01nite-sample bounds on the mean-squared error of a\nk-nearest-neighbor estimator for the average treatment response as well as proposing\nan asymptotically valid test for the hypothesis of policy irrelevance."}, {"group": "Logic", "id": 210, "label": "THE MATHEMATICS OF ADVERSARIAL ATTACKS IN AI WHY DEEP LEARNING IS UNSTABLE DESPITE THE EXISTENCE OF STABLE NEURAL", "shape": "dot", "size": 10, "title": "Authors: A. C. HANSEN, V. VLA\u02c7CI \u00b4\u003cbr\u003eYear: 2016\u003cbr\u003eAbstract: . The unprecedented success of deep learning (DL) makes it unchallenged when it comes to classi\ufb01-\ncation problems. However, it is well established that the current DL methodology produces universally unstable\nneural networks (NNs). The instability problem has caused a substantial research effort \u2013 with a vast literature on\nso-called adversarial attacks \u2013 yet there has been no solution to the problem. Our paper addresses why there has\nbeen no solution to the problem, as we prove the following: any training procedure based on training ReLU neural\nnetworks for classi\ufb01cation problems with a \ufb01xed architecture will yield neural networks that are either inaccurate\nor unstable (if accurate) \u2013 despite the provable existence of both accurate and stable neural networks for the same\nclassi\ufb01cation problems. The key is that the stable and accurate neural networks must have variable dimensions\ndepending on the input, in particular, variable dimensions is a necessary condition for stability. Our result points\ntowards the paradox that accurate and stable neural networks exist, however, modern algorithms do not compute\nthem. This yields the question: if the existence of neural networks with desirable properties can be proven, can\none also \ufb01nd algorithms that compute them? There are cases in mathematics where provable existence implies\ncomputability, but will this be the case for neural networks? The contrary is true, as we demonstrate how neural\nnetworks can provably exist as approximate minimisers to standard optimisation problems with standard cost\nfunctions, however, no randomised algorithm can compute them with probability better than 1/2.\nCONTENTS\n1."}, {"group": "Science and Technology", "id": 211, "label": "for Unsupervised Anomaly Detection", "shape": "dot", "size": 10, "title": "Authors: Jan-Hendrik Neudeck, Ulla Scheler, Rebecca K\u00a8onig, Carsten Steger\u003cbr\u003eYear: 2013\u003cbr\u003eAbstract: \u2014In recent years, performance on existing anomaly detection\nbenchmarks like MVTec AD and VisA has started to saturate in terms\nof segmentation AU-PRO, with state-of-the-art models often competing\nin the range of less than one percentage point. This lack of discrim-\ninatory power prevents a meaningful comparison of models and thus\nhinders progress of the field, especially when considering the inherent\nstochastic nature of machine learning results. We present MVTec AD 2,\na collection of eight anomaly detection scenarios with more than 8000\nhigh-resolution images. It comprises challenging and highly relevant in-\ndustrial inspection use cases that have not been considered in previous\ndatasets, including transparent and overlapping objects, dark-field and\nback light illumination, objects with high variance in the normal data,\nand extremely small defects. We provide comprehensive evaluations\nof state-of-the-art methods and show that their performance remains\nbelow 60% average AU-PRO. Additionally, our dataset provides test\nscenarios with lighting condition changes to assess the robustness of\nmethods under real-world distribution shifts. We host a publicly acces-\nsible evaluation server that holds the pixel-precise ground truth of the\ntest set (https://benchmark.mvtec.com/). All image data is available at\nhttps://www.mvtec.com/company/research/datasets/mvtec-ad-2.\nIndex Terms\u2014Anomaly detection, datasets, benchmarks, evaluation\nmetrics, deep learning"}, {"group": "Robotics", "id": 212, "label": "The Procedural Content Generation Benchmark: An Open-source Testbed for Generative Challenges in Games", "shape": "dot", "size": 10, "title": "Authors: Ahmed Khalifa, Roberto Gallotta, Matthew Barthet, Antonios Liapis, Julian Togelius, Georgios N. Yannakakis\u003cbr\u003eYear: 2022\u003cbr\u003eAbstract: This paper introduces the Procedural Content Generation Bench-\nmark for evaluating generative algorithms on different game con-\ntent creation tasks. The benchmark comes with 12 game-related\nproblems with multiple variants on each problem. Problems vary\nfrom creating levels of different kinds to creating rule sets for sim-\nple arcade games. Each problem has its own content representation,\ncontrol parameters, and evaluation metrics for quality, diversity,\nand controllability. This benchmark is intended as a first step to-\nwards a standardized way of comparing generative algorithms. We\nuse the benchmark to score three baseline algorithms: a random\ngenerator, an evolution strategy, and a genetic algorithm. Results\nshow that some problems are easier to solve than others, as well\nas the impact the chosen objective has on quality, diversity, and\ncontrollability of the generated artifacts.\nCCS Concepts\n\u2022 Applied computing \u2192Computer games; \u2022 Theory of com-\nputation \u2192Evolutionary algorithms.\nKeywords\nProcedural Content Generation, Search-Based Generation, Evolu-\ntionary Algorithms, Evaluation, Benchmark\nACM Reference Format:\nAhmed Khalifa, Roberto Gallotta, Matthew Barthet, Antonios Liapis, Julian\nTogelius, and Georgios N. Yannakakis. 2025. The Procedural Content Gen-\neration Benchmark: An Open-source Testbed for Generative Challenges in\nGames. In International Conference on the Foundations of Digital Games (FDG\n\u201925), April 15\u201318, 2025, Graz, Austria. ACM, New York, NY, USA, 12 pages.\nhttps://doi.org/10.1145/3723498.3723794\nPermission to make digital or hard copies of all or part of this work for personal or\nclassroom use is granted without fee provided that copies are not made or distributed\nfor profit or commercial advantage and that copies bear this notice and the full citation\non the first page. Copyrights for third-party components of this work must be honored.\nFor all other uses, contact the owner/author(s).\nFDG \u201925, April 15\u201318, 2025, Graz, Austria\n\u00a9 2025 Copyright held by the owner/author(s).\nACM ISBN /25/04\nhttps://doi.org/10.1145/3723498.3723794"}, {"group": "Structural Biology", "id": 213, "label": "Time and Memory Trade-off of KV-Cache Compression in Tensor Transformer Decoding", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: The key-value (KV) cache in the tensor version of transformers presents a significant bottle-\nneck during inference. While previous work analyzes the fundamental space complexity barriers\nin standard attention mechanisms [Haris and Onak, 2025], our work generalizes the space com-\nplexity barriers result to tensor attention version. Our theoretical contributions rely on a reduc-\ntion from communication complexity and deduce the memory lower bound for tensor-structured\nattention mechanisms when d = \u2126(log n). Furthermore, we introduce two types of tensor at-\ntention cache and present a trade-off between time and memory for two scenarios. Overall,\nour work provides a theoretical foundation for us to understand the time-memory tradeoff of\nKV-Cache compression in tensor attention decoding and offers more perspectives in developing\nmore memory-efficient tensor attention Transformer architectures.\n\u2217yifangc@uchicago.edu. The University of Chicago.\n\u2020 xli216@stevens.edu. Stevens Institute of Technology.\n\u2021 yingyul@hku.hk. The University of Hong Kong.\nyliang@cs.wisc.edu. University of Wisconsin-Madison.\n\u00a7 zhmeishi@cs.wisc.edu. University of Wisconsin-Madison.\n\u00b6 magic.linuxkde@gmail.com. The Simons Institute for the Theory of Computing at UC Berkeley.\n\u2016 kingyutian01@gmail.com. Independent Researcher.\narXiv:2503.11108v2  [cs.LG]  27 Mar 2025\nContents"}, {"group": "Game Theory", "id": 214, "label": "Time-consistent portfolio selection with strictly monotone mean-variance preference", "shape": "dot", "size": 10, "title": "Authors: Yike Wang\u2020, Yusha Chen\u2021.\u003cbr\u003eYear: 2012\u003cbr\u003eAbstract: This paper is devoted to time-consistent control problems of portfolio selection with strictly\nmonotone mean-variance preferences. These preferences are variational modifications of the conven-\ntional mean-variance preferences, and remain time-inconsistent as in mean-variance optimization\nproblems. To tackle the time-inconsistency, we study the Nash equilibrium controls of both the\nopen-loop type and the closed-loop type, and characterize them within a random parameter setting.\nThe problem is reduced to solving a flow of forward-backward stochastic differential equations for\nopen-loop equilibria, and to solving extended Hamilton-Jacobi-Bellman equations for closed-loop\nequilibria. In particular, we derive semi-closed-form solutions for these two types of equilibria under\na deterministic parameter setting. Both solutions are represented by the same function, which is\nindependent of wealth state and random path. This function can be expressed as the conventional\ntime-consistent mean-variance portfolio strategy multiplied by a factor greater than one. Furthermore,\nwe find that the state-independent closed-loop Nash equilibrium control is a strong equilibrium\nstrategy in a constant parameter setting only when the interest rate is sufficiently large.\nKeywords: monotone mean-variance preference, portfolio selection, time-consistency, Nash equilibrium\ncontrol, non-linear law-dependent reference\nAMS2010 classification: Primary: 91G10, 49N10; Secondary: 91B05, 49N90"}, {"group": "Structural Biology", "id": 215, "label": "Topology-enhanced machine learning model (Top-ML) for anticancer peptides prediction", "shape": "dot", "size": 10, "title": "Authors: Xue Gong, \u2217, \u2020, Kelin Xia\u2217, \u2020\u003cbr\u003eYear: 2018\u003cbr\u003eAbstract: Recently, therapeutic peptides have demonstrated great promise for cancer treat-\nment. To explore powerful anticancer peptides, artificial intelligence (AI)-based ap-\nproaches have been developed to systematically screen potential candidates. However,\nthe lack of efficient featurization of peptides has become a bottleneck for these machine-\nlearning models. In this paper, we propose a topology-enhanced machine learning model\n(Top-ML) for anticancer peptides prediction. Our Top-ML employs peptide topological\nfeatures derived from its sequence \u201cconnection\u201d information characterized by vector and\nspectral descriptors. Our Top-ML model, employing an Extra-Trees classifier, has been\nvalidated on the AntiCP 2.0 and mACPpred 2.0 benchmark datasets, achieving state-\nof-the-art performance or results comparable to existing deep learning models, while\nproviding greater interpretability. Our results highlight the potential of leveraging novel\ntopology-based featurization to accelerate the identification of anticancer peptides.\n1\narXiv:2407.08974v3  [q-bio.QM]  6 Mar"}, {"group": "Robotics", "id": 216, "label": "Towards Fully Automated Decision-Making Systems for Greenhouse Control: Challenges and Opportunities", "shape": "dot", "size": 10, "title": "Authors: Yongshuai Liu, Taeyeong Choi, Xin Liu, yshliu\u003cbr\u003eYear: 2018\u003cbr\u003eAbstract: Machine learning has been successful in building control\npolicies to drive a complex system to desired states in vari-\nous applications (e.g. games, robotics, etc.). To be specific,\na number of parameters of policy can be automatically op-\ntimized from the observations of environment to be able to\ngenerate a sequence of decisions leading to the best perfor-\nmance. In this survey paper, we particularly explore such\npolicy-learning techniques for another unique, practical use-\ncase scenario\u2014farming, in which critical decisions (e.g., wa-\nter supply, heating, etc.) must be made in a timely manner\nto minimize risks (e.g., damage to plants) while maximizing\nthe revenue (e.g., healthy crops) in the end. We first provide\na broad overview of latest studies on it to identify not only\ndomain-specific challenges but opportunities with potential\nsolutions, some of which are suggested as promising direc-\ntions for future research. Also, we then introduce our suc-\ncessful approach to being ranked second among 46 teams\nat the \u201c3rd Autonomous Greenhouse Challenge\u201d to use this\nspecific example to discuss the lessons learned about impor-\ntant considerations for design to create autonomous farm-\nmanagement systems."}, {"group": "Structural Biology", "id": 217, "label": "Towards Interpretable Protein Structure Prediction with Sparse Autoencoders", "shape": "dot", "size": 10, "title": "Authors: John J. Yang\u2020\u003cbr\u003eYear: 2020\u003cbr\u003eAbstract: Protein language models have revolutionized structure prediction, but their\nnonlinear nature obscures how sequence representations inform structure\nprediction. While sparse autoencoders (SAEs) offer a path to interpretabil-\nity here by learning linear representations in high-dimensional space, their\napplication has been limited to smaller protein language models unable to\nperform structure prediction. In this work, we make two key advances: (1)\nwe scale SAEs to ESM2-3B, the base model for ESMFold, enabling mech-\nanistic interpretability of protein structure prediction for the first time,\nand (2) we adapt Matryoshka SAEs for protein language models, which\nlearn hierarchically organized features by forcing nested groups of latents\nto reconstruct inputs independently. We demonstrate that our Matryoshka\nSAEs achieve comparable or better performance than standard architec-\ntures.\nThrough comprehensive evaluations, we show that SAEs trained\non ESM2-3B significantly outperform those trained on smaller models for\nboth biological concept discovery and contact map prediction. Finally, we\npresent an initial case study demonstrating how our approach enables tar-\ngeted steering of ESMFold predictions, increasing structure solvent acces-\nsibility while fixing the input sequence. To facilitate further investigation\nby the broader community, we open-source our code, dataset, pretrained\nmodels, and visualizer."}, {"group": "Natural Language Processing", "id": 218, "label": "Pittawat Taveekitworachai, Potsawee Manakul, Kasima Tharnpipitchai, and Kunat Pipatanakul", "shape": "dot", "size": 10, "title": "Authors: Pittawat Taveekitworachai, Potsawee Manakul, Kasima Tharnpipitchai\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: This paper introduces Typhoon T1, an open effort to develop an open Thai rea-\nsoning model. A reasoning model is a relatively new type of generative model\nbuilt on top of large language models (LLMs). A reasoning model generates\na long chain of thought before arriving at a final answer, an approach found to\nimprove performance on complex tasks. However, details on developing such a\nmodel are limited, especially for reasoning models that can generate traces in a\nlow-resource language. Typhoon T1 presents an open effort that dives into the\ndetails of developing a reasoning model in a more cost-effective way by leverag-\ning supervised fine-tuning using open datasets, instead of reinforcement learning.\nThis paper shares the details about synthetic data generation and training, as well\nas our dataset and model weights. Additionally, we provide insights gained from\ndeveloping a reasoning model that generalizes across domains and is capable of\ngenerating reasoning traces in a low-resource language, using Thai as an example.\nWe hope this open effort provides a foundation for further research in this field.1"}, {"group": "Science and Technology", "id": 219, "label": "UAV-DETR: Efficient End-to-End Object Detection for Unmanned Aerial Vehicle Imagery", "shape": "dot", "size": 10, "title": "Authors: Huaxiang Zhang, Hao Zhang, Kai Liu, Zhongxue Gan, Guo-Niu Zhu\u003cbr\u003eYear: 2015\u003cbr\u003eAbstract: \u2014 Unmanned aerial vehicle object detection (UAV-\nOD) has been widely used in various scenarios. However,\nmost existing UAV-OD algorithms rely on manually designed\ncomponents, which require extensive tuning. End-to-end models\nthat do not depend on such manually designed components are\nmainly designed for natural images, which are less effective for\nUAV imagery. To address such challenges, this paper proposes\nan efficient detection transformer (DETR) framework tailored\nfor UAV imagery, i.e., UAV-DETR. The framework includes a\nmulti-scale feature fusion with frequency enhancement module,\nwhich captures both spatial and frequency information at\ndifferent scales. In addition, a frequency-focused downsampling\nmodule is presented to retain critical spatial details during\ndownsampling. A semantic alignment and calibration module\nis developed to align and fuse features from different fusion\npaths. Experimental results demonstrate the effectiveness and\ngeneralization of our approach across various UAV imagery\ndatasets. On the VisDrone dataset, our method improves AP\nby 3.1% and AP50 by 4.2% over the baseline. Similar enhance-\nments are observed on the UAVVaste dataset. The project page:\nhttps://github.com/ValiantDiligent/UAV-DETR\nI."}, {"group": "Logic", "id": 220, "label": "Uncertainty propagation in feed-forward neural network models", "shape": "dot", "size": 10, "title": "Authors: Jeremy Diamzona, Daniele Venturia, \u2217\u003cbr\u003eYear: 2014\u003cbr\u003eAbstract: We develop new uncertainty propagation methods for feed-forward neural network architectures with leaky\nReLu activation functions subject to random perturbations in the input vectors. In particular, we derive\nanalytical expressions for the probability density function (PDF) of the neural network output and its sta-\ntistical moments as a function of the input uncertainty and the parameters of the network, i.e., weights and\nbiases. A key finding is that an appropriate linearization of the leaky ReLu activation function yields ac-\ncurate statistical results even for large perturbations in the input vectors. This can be attributed to the way\ninformation propagates through the network. We also propose new analytically tractable Gaussian copula\nsurrogate models to approximate the full joint PDF of the neural network output. To validate our theorical\nresults, we conduct Monte Carlo simulations and a thorough error analysis on a multi-layer neural network\nrepresenting a nonlinear integro-differential operator between two polynomial function spaces. Our findings\ndemonstrate excellent agreement between the theoretical predictions and Monte Carlo simulations.\n1."}, {"group": "Structural Biology", "id": 221, "label": "UNIGEM: A UNIFIED APPROACH TO GENERATION AND PROPERTY PREDICTION FOR MOLECULES", "shape": "dot", "size": 10, "title": "Authors: Yuyan Ni, \u2217\u2020, Yan Lu, Zhi-Ming Ma, Wei-Ying Ma, Yanyan Lan\u003cbr\u003eYear: 2022\u003cbr\u003eAbstract: Molecular generation and molecular property prediction are both crucial for drug\ndiscovery, but they are often developed independently. Inspired by recent studies,\nwhich demonstrate that diffusion model, a prominent generative approach, can\nlearn meaningful data representations that enhance predictive tasks, we explore\nthe potential for developing a unified generative model in the molecular domain\nthat effectively addresses both molecular generation and property prediction tasks.\nHowever, the integration of these tasks is challenging due to inherent inconsisten-\ncies, making simple multi-task learning ineffective. To address this, we propose\nUniGEM, the first diffusion-based unified model to successfully integrate molec-\nular generation and property prediction, delivering superior performance in both\ntasks. Our key innovation lies in a novel two-phase generative process, where pre-\ndictive tasks are activated in the later stages, after the molecular scaffold is formed.\nWe further enhance task balance through innovative training strategies. Rigorous\ntheoretical analysis and comprehensive experiments demonstrate our significant\nimprovements in both tasks. The principles behind UniGEM hold promise for\nbroader applications, including natural language processing and computer vision."}, {"group": "Structural Biology", "id": 222, "label": "UniMoMo: Unified Generative Modeling of 3D Molecules  for De Novo Binder Design", "shape": "dot", "size": 10, "title": "Authors: Xiangzhe Kong, Zishen Zhang, Ziting Zhang, Rui Jiao, Jianzhu Ma, Kai Liu, Wenbing Huang, Yang Liu\u003cbr\u003eYear: 2018\u003cbr\u003eAbstract: The design of target-specific molecules such as\nsmall molecules, peptides, and antibodies is vital\nfor biological research and drug discovery. Exist-\ning generative methods are restricted to single-\ndomain molecules, failing to address versatile\ntherapeutic needs or utilize cross-domain trans-\nferability to enhance model performance. In this\npaper, we introduce Unified generative Modeling\nof 3D Molecules (UniMoMo), the first framework\ncapable of designing binders of multiple molec-\nular domains using a single model. In particular,\nUniMoMo unifies the representations of differ-\nent molecules as graphs of blocks, where each\nblock corresponds to either a standard amino acid\nor a molecular fragment. Based on these unified\nrepresentations, UniMoMo utilizes a geometric\nlatent diffusion model for 3D molecular genera-\ntion, featuring an iterative full-atom autoencoder\nto compress blocks into latent space points, fol-\nlowed by an E(3)-equivariant diffusion process.\nExtensive benchmarks across peptides, antibodies,\nand small molecules demonstrate the superiority\nof our unified framework over existing domain-\nspecific models, highlighting the benefits of multi-\ndomain training.\n1."}, {"group": "Structural Biology", "id": 223, "label": "Unravel the rotational and translational behavior of a single squirmer in flexible polymer solutions at different Reynolds numbers", "shape": "dot", "size": 10, "title": "Authors: Yuan Zhou, Kevin Stratford, Ignacio Pagonabarraga\u2020, William, Quincke, Quincke, Li, Zhu\u003cbr\u003eYear: 2022\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Structural Biology", "id": 224, "label": "Unveiling Latent Information in Transaction Hashes: Hypergraph Learning for Ethereum", "shape": "dot", "size": 10, "title": "Authors: Yixin Yang, Chengxiang Jin, Silu Mu, Xiaolei Qian, Jiajun Zhou, Shanqing Yu, Qi Xuan\u003cbr\u003eYear: 2020\u003cbr\u003eAbstract: . With the widespread adoption of Ethereum, financial frauds\nsuch as Ponzi schemes have become increasingly rampant in the blockchain\necosystem, posing significant threats to the security of account assets. Ex-\nisting Ethereum fraud detection methods typically model account trans-\nactions as graphs, but this approach primarily focuses on binary trans-\nactional relationships between accounts, failing to adequately capture\nthe complex multi-party interaction patterns inherent in Ethereum. To\naddress this, we propose a hypergraph modeling method for the Ponzi\nscheme detection method in Ethereum, called HyperDet. Specifically,\nwe treat transaction hashes as hyperedges that connect all the relevant\naccounts involved in a transaction. Additionally, we design a two-step hy-\npergraph sampling strategy to significantly reduce computational com-\nplexity. Furthermore, we introduce a dual-channel detection module, in-\ncluding the hypergraph detection channel and the hyper-homo graph\ndetection channel, to be compatible with existing detection methods.\nExperimental results show that, compared to traditional homogeneous\ngraph-based methods, the hyper-homo graph detection channel achieves\nsignificant performance improvements, demonstrating the superiority of\nhypergraph in Ponzi scheme detection. This research offers innovations\nfor modeling complex relationships in blockchain data.\nKeywords: Ethereum; Ponzi Scheme; Hypergraph"}, {"group": "Natural Language Processing", "id": 225, "label": "The Chinese University of Hong Kong", "shape": "dot", "size": 10, "title": "Authors: sjhuang\u003cbr\u003eYear: 2015\u003cbr\u003eAbstract: The rapid advancement of Multimodal Large Language\nModels (MLLMs) has significantly impacted various mul-\ntimodal tasks. However, these models face challenges in\ntasks that require spatial understanding within 3D environ-\nments. Efforts to enhance MLLMs, such as incorporating\npoint cloud features, have been made, yet a considerable\ngap remains between the models\u2019 learned representations\nand the inherent complexity of 3D scenes. This discrep-\nancy largely stems from the training of MLLMs on pre-\ndominantly 2D data, which restricts their effectiveness in\ncomprehending 3D spaces. To address this issue, in this\npaper, we propose a novel generalist model, i.e., Video-\n3D LLM, for 3D scene understanding.\nBy treating 3D\nscenes as dynamic videos and incorporating 3D position\nencoding into these representations, our Video-3D LLM\naligns video representations with real-world spatial con-\ntexts more accurately. In addition, we have implemented\na maximum coverage sampling technique to optimize the\ntrade-off between computational cost and performance. Ex-\ntensive experiments demonstrate that our model achieves\nstate-of-the-art performance on several 3D scene under-\nstanding benchmarks, including ScanRefer, Multi3DRefer,\nScan2Cap, ScanQA, and SQA3D. Our code is available\nat https://github.com/LaVi-Lab/Video-3D-\nLLM.\n1."}, {"group": "Natural Language Processing", "id": 226, "label": "Video-Panda: Parameter-efficient Alignment for Encoder-free Video-Language", "shape": "dot", "size": 10, "title": "Authors: Yanan Luo*\u003cbr\u003eYear: 2017\u003cbr\u003eAbstract: We present an efficient encoder-free approach for video-\nlanguage understanding that achieves competitive perfor-\nmance while significantly reducing computational over-\nhead.\nCurrent video-language models typically rely on\nheavyweight image encoders (300M-"}, {"group": "Theoretical Physics", "id": 227, "label": "Overleaf Example", "shape": "dot", "size": 10, "title": "Authors: Logan Bolton\u22c6, Mohammad Reza Taesiri\u22c6\u003cbr\u003eYear: 2018\u003cbr\u003eAbstract: . While large language models with vision capabilities (VLMs),\ne.g., GPT-4o and Gemini-"}, {"group": "Structural Biology", "id": 228, "label": "Volumetric Surfaces: Representing Fuzzy Geometries with Layered Meshes", "shape": "dot", "size": 10, "title": "Authors: Stefano Esposito, Anpei Chen, Christian Reiser, Samuel Rota, Lorenzo Porzi, Katja Schwarz, Christian Richardt, Michael Zollh\u00a8ofer, Peter Kontschieder, Andreas Geiger\u003cbr\u003eYear: 2021\u003cbr\u003eAbstract: High-quality view synthesis relies on volume rendering, splat-\nting, or surface rendering. While surface rendering is typi-\ncally the fastest, it struggles to accurately model fuzzy geom-\netry like hair. In turn, alpha-blending techniques excel at rep-\nresenting fuzzy materials but require an unbounded number\nof samples per ray (P1). Further overheads are induced by\nempty space skipping in volume rendering (P2) and sorting\ninput primitives in splatting (P3). We present a novel repre-\nsentation for real-time view synthesis where the (P1) number\nof sampling locations is small and bounded, (P2) sampling\nlocations are efficiently found via rasterization, and (P3)\nrendering is sorting-free. We achieve this by representing\nobjects as semi-transparent multi-layer meshes rendered in\na fixed order. First, we model surface layers as signed dis-\ntance function (SDF) shells with optimal spacing learned\nduring training. Then, we bake them as meshes and fit UV\ntextures. Unlike single-surface methods, our multi-layer rep-\nresentation effectively models fuzzy objects. In contrast to\nvolume and splatting-based methods, our approach enables\nreal-time rendering on low-power laptops and smartphones.\n1."}, {"group": "Natural Language Processing", "id": 229, "label": "Vision-Language Models via Voxel Representation", "shape": "dot", "size": 10, "title": "Authors: Alan Dao\u003cbr\u003eYear: 2014\u003cbr\u003eAbstract: Comprehending 3D environments is vital for intelligent\nsystems in domains like robotics and autonomous navi-\ngation. Voxel grids offer a structured representation of\n3D space, but extracting high-level semantic meaning\nremains challenging.\nThis paper proposes a novel ap-\nproach utilizing a Vision-Language Model (VLM) to ex-\ntract \u201dvoxel semantics\u201d\u2014object identity, color, and loca-\ntion\u2014from voxel data. Critically, instead of employing\ncomplex 3D networks, our method processes the voxel\nspace by systematically slicing it along a primary axis\n(e.g., the Z-axis, analogous to CT scan slices). These 2D\nslices are then formatted and sequentially fed into the\nimage encoder of a standard VLM. The model learns to\naggregate information across slices and correlate spatial\npatterns with semantic concepts provided by the language\ncomponent. This slice-based strategy aims to leverage the\npower of pre-trained 2D VLMs for efficient 3D semantic\nunderstanding directly from voxel representations."}, {"group": "Theoretical Physics", "id": 230, "label": "What is a good imputation under MAR missingness? CNRS, Laboratoire de Probabilites,", "shape": "dot", "size": 10, "title": "Authors: Jeffrey N\u00a8af, Erwan Scornet, Julie Josse\u003cbr\u003eYear: 2017\u003cbr\u003eAbstract: Missing values pose a persistent challenge in modern data science. Consequently, there is an\never-growing number of publications introducing new imputation methods in various fields. The\npresent paper attempts to take a step back and provide a more systematic analysis. Starting\nfrom an in-depth discussion of the Missing at Random (MAR) condition for nonparametric im-\nputation, we first develop an identification result showing that the widely used fully conditional\nspecification (FCS) approach indeed identifies the correct conditional distributions. Based on\nthis analysis, we propose three essential properties an ideal imputation method should meet,\nthus enabling a more principled evaluation of existing methods and more targeted development\nof new methods. In particular, we introduce a new imputation method, denoted mice-DRF,\nthat meets two out of the three criteria. We also discuss ways to compare imputation methods,\nbased on distributional distances. Finally, numerical experiments illustrate the points made in\nthis discussion.\nKeywords:\nNonparametric imputation, missing at random, pattern-mixture models, distribu-\ntional prediction"}, {"group": "Speech Processing", "id": 231, "label": "Whistle: Data-Efficient Multilingual and Crosslingual Speech Recognition via Weakly", "shape": "dot", "size": 10, "title": "Authors: Saierdaer Yusuyin, Te Ma, Hao Huang, Wenbo Zhao, Zhijian Ou\u003cbr\u003eYear: 2018\u003cbr\u003eAbstract: \u2014There exist three approaches for multilingual and\ncrosslingual automatic speech recognition (MCL-ASR) - su-\npervised pretraining with phonetic or graphemic transcription,\nand self-supervised pretraining. We find that pretraining with\nphonetic supervision has been underappreciated so far for MCL-\nASR, while conceptually it is more advantageous for informa-\ntion sharing between different languages. This paper explores\nthe approach of pretraining with weakly phonetic supervision\ntowards data-efficient MCL-ASR, which is called Whistle. We\nrelax the requirement of gold-standard human-validated phonetic\ntranscripts, and obtain International Phonetic Alphabet (IPA)\nbased transcription by leveraging the LanguageNet grapheme-to-\nphoneme (G2P) models. We construct a common experimental\nsetup based on the CommonVoice dataset, called CV-Lang10,\nwith 10 seen languages and 2 unseen languages. A set of\nexperiments are conducted on CV-Lang10 to compare, as fair as\npossible, the three approaches under the common setup for MCL-\nASR. Experiments demonstrate the advantages of phoneme-\nbased models (Whistle) for MCL-ASR, in terms of speech recog-\nnition for seen languages, crosslingual performance for unseen\nlanguages with different amounts of few-shot data, overcoming\ncatastrophic forgetting, and training efficiency. It is found that\nwhen training data is more limited, phoneme supervision can\nachieve better results compared to subword supervision and self-\nsupervision, thereby providing higher data-efficiency. To support\nreproducibility and promote future research along this direction,\nwe release the code, models and data for the entire pipeline\nof Whistle at https://github.com/thu-spmi/CAT/tree/master/egs/\ncv-lang10.\nIndex Terms\u2014speech recognition, multilingual, crosslingual,\ndata-efficient, IPA.\nI."}, {"group": "Structural Biology", "id": 232, "label": "Version: 22 Dec", "shape": "dot", "size": 10, "title": "Authors: Che\u0142kowska, Werwi\u0144ski, Szajek, Tro\u0107\u003cbr\u003eYear: 2014\u003cbr\u003eAbstract: The room temperature X-ray photoemission spectrum of the ferromagnetic compound \nUCu2Si2 (TC = 100 K) was measured using an Al K\u03b1 source. Related theoretical spectra were \ncomputed from densities of electronic states obtained in the local density approximation \n(LDA), the generalized gradient approximation (GGA), and using the GGA+U method. The \ncalculated spectrum is in a good agreement with the experimental one. The spin polarized \ncalculations based on the GGA+U approach as well as GGA/LSDA with orbital polarization \n(OP)  corrections  taken  into  account  provide  values  of  the  total  magnetic  moment  in \nreasonable agreement with the experimental values ranging between"}, {"group": "Structural Biology", "id": 233, "label": "HDReason: Algorithm-Hardware Codesign for Hyperdimensional Knowledge Graph Reasoning", "shape": "dot", "size": 10, "title": "Authors: Hanning Chen, Yang Ni, Ali Zakeri, Zhuowen Zou, Sanggeon Yun, Fei Wen, Khaleghi, Narayan Srinivasa, Hugo Latapie, Mohsen Imani\u003cbr\u003eYear: 2015\u003cbr\u003eAbstract: In recent times, a plethora of hardware accelerators have\nbeen put forth for graph learning applications such as vertex\nclassification and graph classification. However, previous\nworks have paid little attention to Knowledge Graph Com-\npletion (KGC), a task that is well-known for its significantly\nhigher algorithm complexity. The state-of-the-art KGC so-\nlutions based on graph convolution neural network (GCN)\ninvolve extensive vertex/relation embedding updates and\ncomplicated score functions, which are inherently cumber-\nsome for acceleration. As a result, existing accelerator de-\nsigns are no longer optimal, and a novel algorithm-hardware\nco-design for KG reasoning is needed.\nRecently, brain-inspired HyperDimensional Computing\n(HDC) has been introduced as a promising solution for light-\nweight machine learning, particularly for graph learning\napplications. In this paper, we leverage HDC for an intrin-\nsically more efficient and acceleration-friendly KGC algo-\nrithm. We also co-design an acceleration framework named\nHDReason targeting FPGA platforms. On the algorithm level,\nHDReason achieves a balance between high reasoning ac-\ncuracy, strong model interpretability, and less computation\ncomplexity. In terms of architecture, HDReason offers re-\nconfigurability, high training throughput, and low energy\nconsumption. When compared with NVIDIA RTX 4090 GPU,\nthe proposed accelerator achieves an average 10.6\u00d7 speedup\nand 65\u00d7 energy efficiency improvement. When conducting\ncross-models and cross-platforms comparison, HDReason\nyields an average 4.2\u00d7 higher performance and 3.4\u00d7 better\nenergy efficiency with similar accuracy versus the state-of-\nthe-art FPGA-based GCN training platform."}, {"group": "Structural Biology", "id": 234, "label": "Reconfigurable Intelligent Surfaces for THz: Hardware Design and Signal Processing Challenges", "shape": "dot", "size": 10, "title": "Authors: George C. Alexandropoulos, Antonio Clemente, S\u00b4ergio Matos, Ryan Husbands, Sean Ahearne, Qi Luo, Ver\u00b4onica Lain-Rubio, Thomas K\u00a8urner, Lu\u00b4\u0131s M. Pessoa\u003cbr\u003eYear: 2022\u003cbr\u003eAbstract: \u2014Wireless communications in the THz frequency\nband is an envisioned revolutionary technology for sixth Gener-\nation (6G) networks. However, such frequencies impose certain\ncoverage and device design challenges that need to be efficiently\novercome. To this end, the development of cost- and energy-\nefficient approaches for scaling these networks to realistic sce-\nnarios constitute a necessity. Among the recent research trends\ncontributing to these objectives belongs the technology of Recon-\nfigurable Intelligent Surfaces (RISs). In fact, several high-level\ndescriptions of THz systems based on RISs have been populating\nthe literature. Nevertheless, hardware implementations of those\nsystems are still very scarce, and not at the scale intended for most\nenvisioned THz scenarios. In this paper, we overview some of the\nmost significant hardware design and signal processing challenges\nwith THz RISs, and present a preliminary analysis of their impact\non the overall link budget and system performance, conducted\nin the framework of the ongoing TERRAMETA project.\nIndex Terms\u2014Reconfigurable intelligent surface, 6G, THz,\nbeamforming, beam squint, link budget, use cases.\nI."}, {"group": "Logic", "id": 235, "label": "MicroT: Low-Energy and Adaptive Models for MCUs", "shape": "dot", "size": 10, "title": "Authors: Yushan Huang, Ranya Aloufi, Yuchen Zhao, Payam Barnaghi, Hamed Haddadi\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: We propose MicroT, a low-energy, multi-task adaptive model\nframework for resource-constrained MCUs. We divide the\noriginal model into a feature extractor and a classifier. The\nfeature extractor is obtained through self-supervised knowl-\nedge distillation and further optimized into part and full mod-\nels through model splitting and joint training. These mod-\nels are then deployed on MCUs, with classifiers added and\ntrained on local tasks, ultimately performing stage-decision\nfor joint inference. In this process, the part model initially\nprocesses the sample, and if the confidence score falls below\nthe set threshold, the full model will resume and continue the\ninference. We evaluate MicroT on two models, three datasets,\nand two MCU boards. Our experimental evaluation shows\nthat MicroT effectively improves model performance and\nreduces energy consumption when dealing with multiple\nlocal tasks. Compared to the unoptimized feature extractor,\nMicroT can improve accuracy by up to 9.87%. On MCUs,\ncompared to the standard full model inference, MicroT can\nsave up to about 29.13% in energy consumption. MicroT also\nallows users to adaptively adjust the stage-decision ratio\nas needed, better balancing model performance and energy\nconsumption. Under the standard stage-decision ratio con-\nfiguration, MicroT can increase accuracy by 5.91% and save\nabout 14.47% of energy consumption.\nCCS Concepts\n\u2022 Computer systems organization \u2192Embedded sys-\ntems; \u2022 Computing methodologies \u2192Artificial intelli-\ngence; Machine learning.\nKeywords\nResource Constraints, Machine Learning, Low-Energy, MCUs"}, {"group": "Structural Biology", "id": 236, "label": "Wet TinyML: Chemical Neural Network Using Gene Regulation and Cell Plasticity", "shape": "dot", "size": 10, "title": "Authors: Samitha Somathilaka, Adrian Ratwatte, Sasitharan Balasubramaniam, Mehmet Can, Witawas Srisa\u003cbr\u003eYear: 2015\u003cbr\u003eAbstract: In our earlier work, we introduced the concept of Gene Regulatory\nNeural Network (GRNN), which utilizes natural neural network-\nlike structures inherent in biological cells to perform computing\ntasks using chemical inputs. We define this form of chemical-based\nneural network as Wet TinyML. The GRNN structures are based\non the gene regulatory network and have weights associated with\neach link based on the estimated interactions between the genes.\nThe GRNNs can be used for conventional computing by employing\nan application-based search process similar to the Network Archi-\ntecture Search. This study advances this concept by incorporating\ncell plasticity, to further exploit natural cell\u2019s adaptability, in order\nto diversify the GRNN search that can match larger spectrum as\nwell as dynamic computing tasks. As an example application, we\nshow that through the directed cell plasticity, we can extract the\nmathematical regression evolution enabling it to match to dynamic\nsystem applications. We also conduct energy analysis by comparing\nthe chemical energy of the GRNN to its silicon counterpart, where\nthis analysis includes both artificial neural network algorithms\nexecuted on von Neumann architecture as well as neuromorphic\nprocessors. The concept of Wet TinyML can pave the way for the\nnew emergence of chemical-based, energy-efficient and miniature\nBiological AI.\nKEYWORDS\nBiological AI, Cell Plasticity, Biocomputing, Neuromorphic.\nACM Reference Format:\nSamitha Somathilaka, Adrian Ratwatte, Sasitharan Balasubramaniam, Mehmet\nCan Vuran, Witawas Srisa-an, and Pietro Li\u00f2. 2024. Wet TinyML: Chemical\nNeural Network Using Gene Regulation and Cell Plasticity. In Proceedings\nof tinyML Research Symposium (tinyML Research Symposium\u201924). ACM, San\nFrancisco, USA, 7 pages.\nPermission to make digital or hard copies of part or all of this work for personal or\nclassroom use is granted without fee provided that copies are not made or distributed\nfor profit or commercial advantage and that copies bear this notice and the full citation\non the first page. Copyrights for third-party components of this work must be honored.\nFor all other uses, contact the owner/author(s).\ntinyML Research Symposium\u201924, April 2024, San Francisco, CA\n\u00a9 2024 Copyright held by the owner/author(s)."}, {"group": "Structural Biology", "id": 237, "label": "Architectural Implications of Neural Network Inference for High Data-Rate, Low-Latency Scientific Applications", "shape": "dot", "size": 10, "title": "Authors: Olivia Weng, Alexander Redding, Nhan Tran, Javier Mauricio Duarte, Ryan Kastner\u003cbr\u003eYear: 2013\u003cbr\u003eAbstract: \u2014With more scientific fields relying on neural networks (NNs)\nto process data incoming at extreme throughputs and latencies, it is\ncrucial to develop NNs with all their parameters stored on-chip. In\nmany of these applications, there is not enough time to go off-chip and\nretrieve weights. Even more so, off-chip memory such as DRAM does\nnot have the bandwidth required to process these NNs as fast as the data\nis being produced (e.g., every 25 ns). As such, these extreme latency and\nbandwidth requirements have architectural implications for the hardware\nintended to run these NNs: 1) all NN parameters must fit on-chip, and 2)\ncodesigning custom/reconfigurable logic is often required to meet these\nlatency and bandwidth constraints. In our work, we show that many\nscientific NN applications must run fully on chip, in the extreme case\nrequiring a custom chip to meet such stringent constraints.\nI."}, {"group": "Robotics", "id": 238, "label": "Development of control algorithms for mobile robotics focused on their potential use for FPGA-based robots", "shape": "dot", "size": 10, "title": "Authors: Andr\u00e9s-David Su\u00e1rez-G\u00f3mez, ANDRES A. HERNANDEZ ORTEGA\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: This paper investigates the development and optimization of control algorithms for mobile \nrobotics, with a keen focus on their implementation in Field-Programmable Gate Arrays \n(FPGAs). It delves into both classical control approaches such as PID and modern techniques \nincluding deep learning, addressing their application in sectors ranging from industrial \nautomation to medical care. The study highlights the practical challenges and advancements in \nembedding these algorithms into FPGAs, which offer significant benefits for mobile robotics \ndue to their high-speed processing and parallel computation capabilities. Through an analysis \nof various control strategies, the paper showcases the improvements in robot performance, \nparticularly in navigation and obstacle avoidance. It emphasizes the critical role of FPGAs in \nenhancing the efficiency and adaptability of control algorithms in dynamic environments. \nAdditionally, the research discusses the difficulties in benchmarking and evaluating the \nperformance of these algorithms in real-world applications, suggesting a need for standardized \nevaluation criteria. The contribution of this work lies in its comprehensive examination of \ncontrol algorithms\u0027 potential in FPGA-based mobile robotics, offering insights into future \nresearch directions for improving robotic autonomy and operational efficiency. \nIntroducci\u00f3n \nThe design and optimization of control algorithms is often investigated to improve different \naspects of a robot\u0027s performance, such as path-following control for moving from one point to \nanother. There is a large amount of research on robot control algorithms and new approaches \nare constantly being proposed. However, the problem arises of the difficulty in comparing the \nresults of these published research and evaluating the quality of the studies. Furthermore, in \nrobotics publications, performance evaluation criteria are often overlooked, making it difficult \nto make an objective comparison of algorithms. Tests, whether in simulation or experimental, \nare often limited to measuring the length of the path traversed or the time it takes the robot to \ncomplete a task. In addition, there are few standard methods to evaluate the capabilities and \nlimitations of these systems in a comparable manner (Norton et al, 2019). \n \nResearch in this field is typically conducted in controlled laboratory settings to validate proofs \nof concept and establish useful comparisons. However, it is important to keep in mind that the \nresults obtained may differ to some extent from the actual operation of a robot, as the latter is \ncharacterized by the presence of uncertainty (Martins et al., 2020). In addition, there is a lack \nof consensus on performance evaluation criteria, which often vary from one study to another. \nThis lack of consensus makes it difficult to compare the capabilities of navigation algorithms \nand detracts from the rigor of the evaluation of advances in this field. Consequently, a \ncomprehensive evaluation system is lacking (Ren et al., 2020). \nHindawi Template version: Apr19 \n \n \n2\nBackgroung \nDifferential drive mobile robots: Differential drive mobile robots are a common category in \nmobile robotics. These robots are characterized by having two independently driven wheels, \ngiving them great maneuverability and mechanical simplicity. Their ability to change the speed \nand direction of each wheel independently allows for precise movements and turns on the spot. \nA seminal text that addresses these types of robots is \""}, {"group": "Natural Language Processing", "id": 239, "label": "A Data-Driven Representation for Sign Language Production", "shape": "dot", "size": 10, "title": "Authors: Harry Walsh, Abolfazl Ravanshad, Mariam Rahmani, Richard Bowden\u003cbr\u003eYear: 2018\u003cbr\u003eAbstract: \u2014 Phonetic representations are used when record-\ning spoken languages, but no equivalent exists for recording\nsigned languages. As a result, linguists have proposed several\nannotation systems that operate on the gloss or sub-unit level;\nhowever, these resources are notably irregular and scarce.\nSign Language Production (SLP) aims to automatically\ntranslate spoken language sentences into continuous sequences\nof sign language. However, current state-of-the-art approaches\nrely on scarce linguistic resources to work. This has limited\nprogress in the field. This paper introduces an innovative solu-\ntion by transforming the continuous pose generation problem\ninto a discrete sequence generation problem. Thus, overcoming\nthe need for costly annotation. Although, if available, we\nleverage the additional information to enhance our approach.\nBy applying Vector Quantisation (VQ) to sign language\ndata, we first learn a codebook of short motions that can\nbe combined to create a natural sequence of sign. Where\neach token in the codebook can be thought of as the lexicon\nof our representation. Then using a transformer we perform\na translation from spoken language text to a sequence of\ncodebook tokens. Each token can be directly mapped to a\nsequence of poses allowing the translation to be performed\nby a single network. Furthermore, we present a sign stitching\nmethod to effectively join tokens together. We evaluate on\nthe RWTH-PHOENIX-Weather-2014T (PHOENIX14T) and the\nmore challenging meineDGST (mDGS) datasets. An extensive\nevaluation shows our approach outperforms previous methods,\nincreasing the BLEU-1 back translation score by up to 72%.\nI."}, {"group": "Natural Language Processing", "id": 240, "label": "Evaluating Span Extraction in Generative Paradigm: A Reflection on Aspect-Based Sentiment Analysis", "shape": "dot", "size": 10, "title": "Authors: Soyoung Yang, Won Ik Cho\u003cbr\u003eYear: 2013\u003cbr\u003eAbstract: In the era of rapid evolution of generative lan-\nguage models within the realm of natural lan-\nguage processing, there is an imperative call\nto revisit and reformulate evaluation method-\nologies, especially in the domain of aspect-\nbased sentiment analysis (ABSA). This paper\naddresses the emerging challenges introduced\nby the generative paradigm, which has moder-\nately blurred traditional boundaries between\nunderstanding and generation tasks.\nBuild-\ning upon prevailing practices in the field, we\nanalyze the advantages and shortcomings as-\nsociated with the prevalent ABSA evaluation\nparadigms.\nThrough an in-depth examina-\ntion, supplemented by illustrative examples, we\nhighlight the intricacies involved in aligning\ngenerative outputs with other evaluative met-\nrics, specifically those derived from other tasks,\nincluding question answering. While we steer\nclear of advocating for a singular and defini-\ntive metric, our contribution lies in paving the\npath for a comprehensive guideline tailored for\nABSA evaluations in this generative paradigm.\nIn this position paper, we aim to provide prac-\ntitioners with profound reflections, offering in-\nsights and directions that can aid in navigating\nthis evolving landscape, ensuring evaluations\nthat are both accurate and reflective of genera-\ntive capabilities."}, {"group": "Natural Language Processing", "id": 241, "label": "Quantifying Multilingual Performance of Large Language Models", "shape": "dot", "size": 10, "title": "Authors: Zihao Li\u2217, Yucheng Shi, Zirui Liu, Fan Yang, Ninghao Liu, Mengnan Du\u003cbr\u003eYear: 2016\u003cbr\u003eAbstract: The training process of Large Language Mod-\nels (LLMs) requires extensive text corpus.\nHowever, these data are often unevenly dis-\ntributed in different languages. As a result,\nLLMs perform well on common languages,\nsuch as English, German, and French, but per-\nform poorly on low-resource languages. How-\never, currently there is no work to quantita-\ntively measure the performance of LLMs in\nlow-resource languages. To fill this gap, we\nproposed the Language Ranker that aims to\nbenchmark and rank different languages ac-\ncording to the performance of LLMs on those\nlanguages. We employ the LLM\u2019s performance\non the English corpus as a baseline to compare\nthe performances of different languages and\nEnglish. We have the following three findings:\n1. The performance rankings of different LLMs\nin all languages are roughly the same. 2. LLMs\nwith different sizes have the same partial order\nof performance. 3. There is a strong correlation\nbetween LlaMa2\u2019s performance in different lan-\nguages and the proportion of the pre-training\ncorpus. These findings illustrate that the Lan-\nguage Ranker can be used as an indicator to\nmeasure the language performance of LLMs."}, {"group": "Natural Language Processing", "id": 242, "label": "Related Work and Citation Text Generation: A Survey Department of Computer Science", "shape": "dot", "size": 10, "title": "Authors: Jessica Ouyang\u003cbr\u003eYear: 2021\u003cbr\u003eAbstract: To convince readers of the novelty of their re-\nsearch paper, authors must perform a litera-\nture review and compose a coherent story that\nconnects and relates prior works to the cur-\nrent work. This challenging nature of literature\nreview writing makes automatic related work\ngeneration (RWG) academically and compu-\ntationally interesting, and also makes it an ex-\ncellent test bed for examining the capability of\nSOTA natural language processing (NLP) mod-\nels. Since the initial proposal of the RWG task,\nits popularity has waxed and waned, following\nthe capabilities of mainstream NLP approaches.\nIn this work, we survey the zoo of RWG his-\ntorical works, summarizing the key approaches\nand task definitions and discussing the ongoing\nchallenges of RWG."}, {"group": "Speech Processing", "id": 243, "label": "ADVANCING SPEECH TRANSLATION: A CORPUS OF MANDARIN-ENGLISH CONVERSATIONAL TELEPHONE SPEECH", "shape": "dot", "size": 10, "title": "Authors: Shannon Wotherspoon, William Hartmann, Matthew Snover, william.hartmann\u003cbr\u003eYear: 2013\u003cbr\u003eAbstract: This paper introduces a set of English translations for a\n123-hour subset of the CallHome Mandarin Chinese data\nand the HKUST Mandarin Telephone Speech data for the\ntask of speech translation.\nPaired source-language speech\nand target-language text is essential for training end-to-end\nspeech translation systems and can provide substantial perfor-\nmance improvements for cascaded systems as well, relative to\ntraining on more widely available text data sets. We demon-\nstrate that \ufb01ne-tuning a general-purpose translation model to\nour Mandarin-English conversational telephone speech train-\ning set improves target-domain BLEU by more than 8 points,\nhighlighting the importance of matched training data.\nIndex Terms\u2014 speech translation, corpus, conversational\ntelephone speech\n1."}, {"group": "Natural Language Processing", "id": 244, "label": "MEMLLM: Finetuning LLMs to Use An Explicit Read-Write Memory", "shape": "dot", "size": 10, "title": "Authors: Abdullatif K\u00f6ksal, Ayyoob Imani, Mohsen Fayyaz\u003cbr\u003eYear: 2021\u003cbr\u003eAbstract: While current large language models (LLMs)\ndemonstrate some capabilities in knowledge-\nintensive tasks, they are limited by relying on\ntheir parameters as an implicit storage mecha-\nnism. As a result, they struggle with infrequent\nknowledge and temporal degradation. In addi-\ntion, the uninterpretable nature of parametric\nmemorization makes it challenging to under-\nstand and prevent hallucination. Parametric\nmemory pools and model editing are only par-\ntial solutions. Retrieval Augmented Generation\n(RAG) \u2013 though non-parametric \u2013 has its own\nlimitations: it lacks structure, complicates in-\nterpretability and makes it hard to effectively\nmanage stored knowledge. In this paper, we\nintroduce MEMLLM, a novel method of en-\nhancing LLMs by integrating a structured and\nexplicit read-and-write memory module. MEM-\nLLM tackles the aforementioned challenges by\nenabling dynamic interaction with the memory\nand improving the LLM\u2019s capabilities in using\nstored knowledge. Our experiments indicate\nthat MEMLLM enhances the LLM\u2019s perfor-\nmance and interpretability, in language model-\ning in general and knowledge-intensive tasks in\nparticular. We see MEMLLM as an important\nstep towards making LLMs more grounded and\nfactual through memory augmentation."}, {"group": "Natural Language Processing", "id": 245, "label": "How often are errors in natural language reasoning due to paraphrastic variability?", "shape": "dot", "size": 10, "title": "Authors: Neha Srikanth, Marine Carpuat, Rachel Rudinger\u003cbr\u003eYear: 2018\u003cbr\u003eAbstract: Large language models have been shown\nto behave inconsistently in response to\nmeaning-preserving paraphrastic inputs. At\nthe same time, researchers evaluate the\nknowledge and reasoning abilities of these\nmodels with test evaluations that do not dis-\naggregate the effect of paraphrastic variabil-\nity on performance. We propose a metric,\nPC, for evaluating the paraphrastic consis-\ntency of natural language reasoning models\nbased on the probability of a model achiev-\ning the same correctness on two paraphrases\nof the same problem. We mathematically\nconnect this metric to the proportion of a\nmodel\u2019s variance in correctness attributable\nto paraphrasing. To estimate PC, we col-\nlect PARANLU, a dataset of 7,782 human-\nwritten and validated paraphrased reason-\ning problems constructed on top of exist-\ning benchmark datasets for defeasible and\nabductive natural language inference. Us-\ning PARANLU, we measure the paraphras-\ntic consistency of several model classes\nand show that consistency dramatically in-\ncreases with pretraining but not fine-tuning.\nAll models tested exhibited room for im-\nprovement in paraphrastic consistency."}, {"group": "Natural Language Processing", "id": 246, "label": "Investigating Gender Bias in Turkish Language Models Orhun Caglidil, Malte Ostendorff, Georg Rehm", "shape": "dot", "size": 10, "title": "Authors: Orhun Caglidil, Malte Ostendorff\u003cbr\u003eYear: 2019\u003cbr\u003eAbstract: Language models are trained mostly on Web\ndata, which often contains social stereotypes\nand biases that the models can inherit. This has\npotentially negative consequences, as models\ncan amplify these biases in downstream tasks\nor applications. However, prior research has\nprimarily focused on the English language, es-\npecially in the context of gender bias. In partic-\nular, grammatically gender-neutral languages\nsuch as Turkish are underexplored despite rep-\nresenting different linguistic properties to lan-\nguage models with possibly different effects on\nbiases. In this paper, we fill this research gap\nand investigate the significance of gender bias\nin Turkish language models. We build upon\nexisting bias evaluation frameworks and extend\nthem to the Turkish language by translating\nexisting English tests and creating new ones\ndesigned to measure gender bias in the con-\ntext of T\u00fcrkiye. Specifically, we also evaluate\nTurkish language models for their embedded\nethnic bias toward Kurdish people. Based on\nthe experimental results, we attribute possible\nbiases to different model characteristics such as\nthe model size, their multilingualism, and the\ntraining corpora. We make the Turkish gender\nbias dataset publicly available."}, {"group": "Natural Language Processing", "id": 247, "label": "Missed Connections: Lateral Thinking Puzzles for Large Language Models", "shape": "dot", "size": 10, "title": "Authors: Graham Todd, Tim Merino, Sam Earle, Julian Togelius\u003cbr\u003eYear: 2014\u003cbr\u003eAbstract: \u2014The Connections puzzle published each day by the\nNew York Times tasks players with dividing a bank of sixteen\nwords into four groups of four words that each relate to\na common theme. Solving the puzzle requires both common\nlinguistic knowledge (i.e. definitions and typical usage) as well as,\nin many cases, lateral or abstract thinking. This is because the\nfour categories ascend in complexity, with the most challenging\ncategory often requiring thinking about words in uncommon\nways or as parts of larger phrases. We investigate the capacity for\nautomated AI systems to play Connections and explore the game\u2019s\npotential as an automated benchmark for abstract reasoning\nand a way to measure the semantic information encoded by\ndata-driven linguistic systems. In particular, we study both a\nsentence-embedding baseline and modern large language models\n(LLMs). We report their accuracy on the task, measure the\nimpacts of chain-of-thought prompting, and discuss their failure\nmodes. Overall, we find that the Connections task is challenging\nyet feasible, and a strong test-bed for future work.\nIndex Terms\u2014Language models, reasoning, AI, evaluation\nI."}, {"group": "Media Studies", "id": 248, "label": "Mapping Violence: Developing an Extensive Framework to Build a Bangla Sectarian Expression Dataset from Social Media Interactions", "shape": "dot", "size": 10, "title": "Authors: Nazia Tasnim, Sujan Sen Gupta, Istiak Hossain Shihab, Fatiha Islam Juee, Arunima Tahsin, Pritom Ghum, Kanij Fatema, Marshia Haque, Wasema Farzana, Prionti Nasir, Ashique KhudaBukhsh, Farig Sadeque\u2020, Asif Sushmit\u2020\u003cbr\u003eYear: 2022\u003cbr\u003eAbstract: Communal violence in online forums has\nbecome extremely prevalent in South Asia,\nwhere many communities of different cultures\ncoexist and share resources. These societies\nexhibit a phenomenon characterized by strong\nbonds within their own groups and animos-\nity towards others, leading to con\ufb02icts that\nfrequently escalate into violent confrontations.\nTo address this issue, we have developed the\n\ufb01rst comprehensive framework for the auto-\nmatic detection of communal violence mark-\ners in online Bangla content accompanying the\nlargest collection (13K raw sentences) of so-\ncial media interactions that fall under the de\ufb01-\nnition of four major violence class and their 16\ncoarse expressions. Our work\ufb02ow introduces a\n7-step expert annotation process incorporating\ninsights from social scientists, linguists, and\npsychologists.\nBy\npresenting\ndata\nstatistics\nand\nbench-\nmarking performance using this dataset1, we\nhave determined that, aside from the cat-\negory of Non-communal violence, Religio-\ncommunal violence is particularly pervasive\nin Bangla text. Moreover, we have substanti-\nated the effectiveness of \ufb01ne-tuning language\nmodels in identifying violent comments by\nconducting preliminary benchmarking on the\nstate-of-the-art Bangla deep learning model."}, {"group": "Natural Language Processing", "id": 249, "label": "REQUAL-LM: Reliability and Equity through Aggregation in Large Language Models*", "shape": "dot", "size": 10, "title": "Authors: Sana Ebrahimi, Nima Shahbazi, Abolfazl Asudeh\u003cbr\u003eYear: 2012\u003cbr\u003eAbstract: The extensive scope of large language models\n(LLMs) across various domains underscores\nthe critical importance of responsibility in their\napplication, beyond natural language process-\ning. In particular, the randomized nature of\nLLMs, coupled with inherent biases and his-\ntorical stereotypes in data, raises critical con-\ncerns regarding reliability and equity. Address-\ning these challenges are necessary before using\nLLMs for applications with societal impact.\nTowards addressing this gap, we introduce\nREQUAL-LM, a novel method for finding re-\nliable and equitable LLM outputs through ag-\ngregation. Specifically, we develop a Monte-\ncarlo method based on repeated sampling to\nfind a reliable output close to the mean of the\nunderlying distribution of possible outputs. We\nformally define the terms such as reliability and\nbias, and design an equity-aware aggregation to\nminimize harmful bias while finding a highly\nreliable output. REQUAL-LM does not require\nspecialized hardware, does not impose a signifi-\ncant computing load, and uses LLMs as a black-\nbox. This design choice enables seamless scala-\nbility alongside the rapid advancement of LLM\ntechnologies. Our system does not require re-\ntraining the LLMs, which makes it deployment-\nready and easy to adapt.\nOur comprehensive experiments using various\ntasks and datasets demonstrate that REQUAL-\nLM effectively mitigates bias and selects a more\nequitable response, specifically the outputs that\nproperly represents minority groups."}, {"group": "Natural Language Processing", "id": 250, "label": "Enhancing Argument Summarization: Prioritizing Exhaustiveness in Key Point Generation and", "shape": "dot", "size": 10, "title": "Authors: Chenyang Huang\u003cbr\u003eYear: 2014\u003cbr\u003eAbstract: The proliferation of social media platforms has\ngiven rise to the amount of online debates and\narguments. Consequently, the need for auto-\nmatic summarization methods for such debates\nis imperative, however this area of summariza-\ntion is rather understudied.\nThe Key Point\nAnalysis (KPA) task formulates argument sum-\nmarization as representing the summary of a\nlarge collection of arguments in the form of\nconcise sentences in bullet-style format, called\nkey points. A sub-task of KPA, called Key\nPoint Generation (KPG), focuses on generating\nthese key points given the arguments. This pa-\nper introduces a novel extractive approach for\nkey point generation, that outperforms previ-\nous state-of-the-art methods for the task. Our\nmethod utilizes an extractive clustering based\napproach that offers concise, high quality gen-\nerated key points with higher coverage of refer-\nence summaries, and less redundant outputs. In\naddition, we show that the existing evaluation\nmetrics for summarization such as ROUGE are\nincapable of differentiating between generated\nkey points of different qualities. To this end, we\npropose a new evaluation metric for assessing\nthe generated key points by their coverage. Our\ncode can be accessed online.1"}, {"group": "Natural Language Processing", "id": 251, "label": "AdvisorQA: Towards Helpful and Harmless Advice-seeking Question Answering with Collective Intelligence", "shape": "dot", "size": 10, "title": "Authors: Hwaran Lee, minbeomkim\u003cbr\u003eYear: 2010\u003cbr\u003eAbstract: As the integration of large language models\ninto daily life is on the rise, there is a clear\ngap in benchmarks for advising on subjective\nand personal dilemmas. To address this, we\nintroduce AdvisorQA, the first benchmark de-\nveloped to assess LLMs\u2019 capability in offering\nadvice for deeply personalized concerns, uti-\nlizing the LifeProTips subreddit forum. This\nforum features a dynamic interaction where\nusers post advice-seeking questions, receiving\nan average of 8.9 advice per query, with 164.2\nupvotes from hundreds of users, embodying a\ncollective intelligence framework. Therefore,\nwe\u2019ve completed a benchmark encompassing\ndaily life questions, diverse corresponding re-\nsponses, and majority vote ranking to train our\nhelpfulness metric. Baseline experiments val-\nidate the efficacy of AdvisorQA through our\nhelpfulness metric, GPT-4, and human evalua-\ntion, analyzing phenomena beyond the trade-off\nbetween helpfulness and harmlessness. Advi-\nsorQA marks a significant leap in enhancing\nQA systems for providing personalized, empa-\nthetic advice, showcasing LLMs\u2019 improved un-\nderstanding of human subjectivity."}, {"group": "Media Studies", "id": 252, "label": "Challenging Negative Gender Stereotypes: A Study on the Effectiveness of Automated Counter-Stereotypes", "shape": "dot", "size": 10, "title": "Authors: Isar Nejadgholi, Kathleen C. Fraser, Anna Kerkhof, Svetlana Kiritchenko, isar.nejadgholi, kathleen.fraser\u003cbr\u003eYear: 2015\u003cbr\u003eAbstract: Content Warning: This paper presents examples of gender stereotypes that may be offensive or upsetting.\nGender stereotypes are pervasive beliefs about individuals based on their gender that play a significant\nrole in shaping societal attitudes, behaviours, and even opportunities. Recognizing the negative implications of\ngender stereotypes, particularly in online communications, this study investigates eleven strategies to automatically\ncounteract and challenge these views. We present AI-generated gender-based counter-stereotypes to (self-identified)\nmale and female study participants and ask them to assess their offensiveness, plausibility, and potential effectiveness.\nThe strategies of counter-facts and broadening universals (i.e., stating that anyone can have a trait regardless of\ngroup membership) emerged as the most robust approaches, while humour, perspective-taking, counter-examples,\nand empathy for the speaker were perceived as less effective. Also, the differences in ratings were more pronounced\nfor stereotypes about the different targets than between the genders of the raters. Alarmingly, many AI-generated\ncounter-stereotypes were perceived as offensive and/or implausible. Our analysis and the collected dataset offer\nfoundational insight into counter-stereotype generation, guiding future efforts to develop strategies that effectively\nchallenge gender stereotypes in online interactions.\nKeywords: Gender Stereotypes, Counter-Stereotypes, Social Influence, Online Conversations\n1."}, {"group": "Natural Language Processing", "id": 253, "label": "SKIP: Skill-Localized Prompt Tuning for Inference Speed Boost-Up", "shape": "dot", "size": 10, "title": "Authors: Junseok Kim, Jiwon Moon, Yunah Jang, Kyomin Jung\u003cbr\u003eYear: 2012\u003cbr\u003eAbstract: Prompt-tuning methods have shown compa-\nrable performance as parameter-efficient fine-\ntuning (PEFT) methods in various natural lan-\nguage understanding tasks. However, existing\nprompt tuning methods still utilize the entire\nmodel architecture; thus, they fail to accel-\nerate inference speed in the application. In\nthis paper, we propose a novel approach called\nSKIll-localized Prompt tuning (SKIP), which\nis extremely efficient in inference time. Our\nmethod significantly enhances inference effi-\nciency by investigating and utilizing a skill-\nlocalized subnetwork in a language model. Sur-\nprisingly, our method improves the inference\nspeed up to 160% times while pruning 52% of\nthe parameters. Furthermore, we demonstrate\nthat our method is applicable across various\ntransformer-based architectures, thereby con-\nfirming its practicality and scalability."}, {"group": "Natural Language Processing", "id": 254, "label": "CrossIn: An Efficient Instruction Tuning Approach for Cross-Lingual Knowledge Alignment", "shape": "dot", "size": 10, "title": "Authors: Bin Wang, Zhengyuan Liu, Nancy F. Chen\u003cbr\u003eYear: 2014\u003cbr\u003eAbstract: Multilingual proficiency presents a significant\nchallenge for large language models (LLMs).\nEnglish-centric models are usually suboptimal\nin other languages, particularly those that are\nlinguistically distant from English. This per-\nformance discrepancy mainly stems from the\nimbalanced distribution of training data across\nlanguages during pre-training and instruction\ntuning stages. To address this problem, we pro-\npose a novel approach called CrossIn, which\nutilizes a mixed composition of cross-lingual\ninstruction tuning data.\nOur method lever-\nages the compressed representation shared by\nvarious languages to efficiently enhance the\nmodel\u2019s task-solving capabilities and multilin-\ngual proficiency within a single process. In\naddition, we introduce a multi-task and multi-\nfaceted benchmark to evaluate the effective-\nness of CrossIn. Experimental results demon-\nstrate that our method substantially improves\nperformance across tasks and languages, and\nwe provide extensive insights into the impact of\ncross-lingual data volume and the integration\nof translation data on enhancing multilingual\nconsistency and accuracy.1"}, {"group": "Data Science", "id": 255, "label": "P-NAL: an Effective and Interpretable Entity Alignment Method", "shape": "dot", "size": 10, "title": "Authors: Jingwei Cheng, Zhang\u003cbr\u003eYear: 2020\u003cbr\u003eAbstract: Entity alignment (EA) aims to find equivalent entities between two\nKnowledge Graphs. Existing embedding-based EA methods usually\nencode entities as embeddings, triples as embeddings\u2019 constraint\nand learn to align the embeddings. The structural and side informa-\ntion are usually utilized via embedding propagation, aggregation\nor interaction. However, the details of the underlying logical in-\nference steps among the alignment process are usually omitted,\nresulting in inadequate inference process. In this paper, we intro-\nduce P-NAL, an entity alignment method that captures two types\nof logical inference paths with Non-Axiomatic Logic (NAL). Type I\nis the bridge-like inference path between to-be-aligned entity pairs,\nconsisting of two relation/attribute triples and a similarity sentence\nbetween the other two entities. Type II links the entity pair by\ntheir embeddings. P-NAL iteratively aligns entities and relations\nby integrating the conclusions of the inference paths. Moreover,\nour method is logically interpretable and extensible due to the ex-\npressiveness of NAL. Our proposed method is suitable for various\nEA settings. Experimental results show that our method outper-\nforms state-of-the-art methods in terms of Hits@1, achieving 0.98+\non all three datasets of \ud835\udc37\ud835\udc35\ud835\udc4315\ud835\udc3ewith both supervised and unsu-\npervised settings. To our knowledge, we present the first in-depth\nanalysis of entity alignment\u2019s basic principles from a unified logical\nperspective."}, {"group": "Natural Language Processing", "id": 256, "label": "Aligning Language Models to Explicitly Handle Ambiguity", "shape": "dot", "size": 10, "title": "Authors: Hyuhng Joon Kim, Youna Kim, Cheonbok Park, Junyeob Kim, Choonghyun Park, Kang Min Yoo, Sang-goo Lee, Taeuk Kim, juny\u003cbr\u003eYear: 2015\u003cbr\u003eAbstract: In spoken languages, utterances are often\nshaped to be incomplete or vague for efficiency.\nThis can lead to varying interpretations of the\nsame input, based on different assumptions\nabout the context.\nTo ensure reliable user-\nmodel interactions in such scenarios, it is cru-\ncial for models to adeptly handle the inherent\nambiguity in user queries. However, conversa-\ntional agents built upon even the most recent\nlarge language models (LLMs) face challenges\nin processing ambiguous inputs, primarily due\nto the following two hurdles: (1) LLMs are not\ndirectly trained to handle inputs that are too am-\nbiguous to be properly managed; (2) the degree\nof ambiguity in an input can vary according to\nthe intrinsic knowledge of the LLMs, which\nis difficult to investigate. To address these is-\nsues, this paper proposes a method to align\nLLMs to explicitly handle ambiguous inputs.\nSpecifically, we introduce a proxy task that\nguides LLMs to utilize their intrinsic knowl-\nedge to self-disambiguate a given input. We\nquantify the information gain from the disam-\nbiguation procedure as a measure of the extent\nto which the models perceive their inputs as\nambiguous. This measure serves as a cue for\nselecting samples deemed ambiguous from the\nmodels\u2019 perspectives, which are then utilized\nfor alignment. Experimental results from sev-\neral question-answering datasets demonstrate\nthat the LLMs fine-tuned with our approach are\ncapable of handling ambiguous inputs while\nstill performing competitively on clear ques-\ntions within the task."}, {"group": "Natural Language Processing", "id": 257, "label": "Token-level Direct Preference Optimization", "shape": "dot", "size": 10, "title": "Authors: Yongcheng Zeng, Guoqing Liu, Weiyu Ma, Ning Yang, Haifeng Zhang, Jun Wang\u003cbr\u003eYear: 2014\u003cbr\u003eAbstract: Fine-tuning pre-trained Large Language Models\n(LLMs) is essential to align them with human\nvalues and intentions.\nThis process often uti-\nlizes methods like pairwise comparisons and KL\ndivergence against a reference LLM, focusing\non the evaluation of full answers generated by\nthe models. However, the generation of these\nresponses occurs in a token level, following a\nsequential, auto-regressive fashion. In this pa-\nper, we introduce Token-level Direct Preference\nOptimization (TDPO), a novel approach to align\nLLMs with human preferences by optimizing pol-\nicy at the token level. Unlike previous methods,\nwhich face challenges in divergence efficiency,\nTDPO incorporates forward KL divergence con-\nstraints for each token, improving alignment and\ndiversity. Utilizing the Bradley-Terry model for\na token-based reward system, TDPO enhances\nthe regulation of KL divergence, while preserv-\ning simplicity without the need for explicit re-\nward modeling. Experimental results across vari-\nous text tasks demonstrate TDPO\u2019s superior per-\nformance in balancing alignment with genera-\ntion diversity. Notably, fine-tuning with TDPO\nstrikes a better balance than DPO in the controlled\nsentiment generation and single-turn dialogue\ndatasets, and significantly improves the quality of\ngenerated responses compared to both DPO and\nPPO-based RLHF methods. Our code is open-\nsourced at https://github.com/Vance0124/Token-\nlevel-Direct-Preference-Optimization.\n1."}, {"group": "Data Science", "id": 258, "label": "Variational Multi-Modal Hypergraph Attention Network for Multi-Modal Relation Extraction", "shape": "dot", "size": 10, "title": "Authors: Yuntao Wei, Jianxin Li\u003cbr\u003eYear: 2017\u003cbr\u003eAbstract: Multi-modal relation extraction (MMRE) is a challenging task that\naims to identify relations between entities in text leveraging im-\nage information. Existing methods are limited by their neglect of\nthe multiple entity pairs in one sentence sharing very similar con-\ntextual information (i.e., the same text and image), resulting in\nincreased difficulty in the MMRE task. To address this limitation,\nwe propose the Variational Multi-Modal Hypergraph Attention Net-\nwork (VM-HAN) for multi-modal relation extraction. Specifically,\nwe first construct a multi-modal hypergraph for each sentence\nwith the corresponding image, to establish different high-order\nintra-/inter-modal correlations for different entity pairs in each\nsentence. We further design the Variational Hypergraph Attention\nNetworks (V-HAN) to obtain representational diversity among dif-\nferent entity pairs using Gaussian distribution and learn a better\nhypergraph structure via variational attention. VM-HAN achieves\nstate-of-the-art performance on the MMRE task, outperforming\nexisting methods in terms of accuracy and efficiency.\nCCS CONCEPTS\n\u2022 Computing methodologies \u2192Information extraction.\nKEYWORDS\nMulti-modal relation extraction, hypergraph attention network.\n\u2217Corresponding author\nPermission to make digital or hard copies of all or part of this work for personal or\nclassroom use is granted with
