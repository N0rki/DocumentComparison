f noisy or spurious information in graphs and the inher-\nent incompleteness of graph data. To address these challenges, we\ndraw inspiration from the Information Bottleneck principle and\npropose a novel data augmentation method, COmplete and REduce\n(CORE) to learn compact and predictive augmentations for LP mod-\nels. In particular, CORE aims to recover missing edges in graphs\nwhile simultaneously removing noise from the graph structures,\nthereby enhancing the model\u2019s robustness and performance. Exten-\nsive experiments on multiple benchmark datasets demonstrate the\napplicability and superiority of CORE over state-of-the-art meth-\nods, showcasing its potential as a leading approach for robust LP\nin graph representation learning.\nCCS CONCEPTS\n\u2022 Information systems \u2192Data mining; \u2022 Computing method-\nologies \u2192Regularization.\nKEYWORDS\nlink prediction, data augmentation, information bottleneck, graph\nneural networks\nACM Reference Format:\nKaiwen Dong, Zhichun Guo, and Nitesh V. Chawla. 2024. CORE: Data\nAugmentation for Link Prediction via Information Bottleneck. In . ACM,\nNew York, NY, USA, 17 pages. https://doi.org/10.1145/nnnnnnn.nnnnnnn"}, {"group": "Media Studies", "id": 359, "label": "X-posing Free Speech: Examining the Impact of Moderation Relaxation on Online Social Networks", "shape": "dot", "size": 10, "title": "Authors: Ponnurangam Kumaraguru\u003cbr\u003eYear: 2013\u003cbr\u003eAbstract: We investigate the impact of free speech and\nthe relaxation of moderation on online social\nmedia platforms using Elon Musk\u2019s takeover\nof Twitter as a case study.\nBy curating a\ndataset of over 10 million tweets, our study\nemploys a novel framework combining content\nand network analysis. Our findings reveal a sig-\nnificant increase in the distribution of certain\nforms of hate content, particularly targeting the\nLGBTQ+ community and liberals. Network\nanalysis reveals the formation of cohesive hate\ncommunities facilitated by influential bridge\nusers, with substantial growth in interactions\nhinting at increased hate production and dif-\nfusion. By tracking the temporal evolution of\nPageRank, we identify key influencers, primar-\nily self-identified far-right supporters dissem-\ninating hate against liberals and woke culture.\nIronically, embracing free speech principles ap-\npears to have enabled hate speech against the\nvery concept of freedom of expression and free\nspeech itself. Our findings underscore the del-\nicate balance platforms must strike between\nopen expression and robust moderation to curb\nthe proliferation of hate online."}, {"group": "Structural Biology", "id": 360, "label": "A Fast Maximum Clique Algorithm Based on Network Decomposition for Large Sparse Networks", "shape": "dot", "size": 10, "title": "Authors: Tianlong Fan, Wenjun Jiang, Yi-Cheng Zhang, Linyuan L\u00fc, \u2020\u003cbr\u003eYear: 2015\u003cbr\u003eAbstract: Finding maximum cliques in large networks is a challenging combinatorial problem with many real-world applications. \nWe present a fast algorithm to achieve the exact solution for the maximum clique problem in large sparse networks based \non efficient graph decomposition. A bunch of effective techniques is being used to greatly prune the graph and a novel \nconcept called Complete-Upper-Bound-Induced Subgraph (CUBIS) is proposed to ensure that the structures with the \npotential to form the maximum clique are retained in the process of graph decomposition. Our algorithm first pre-prunes \nperipheral nodes, subsequently, one or two small-scale CUBISs are constructed guided by the core number and current \nmaximum clique size. Bron-Kerbosch search is performed on each CUBIS to find the maximum clique. Experiments on \n50 empirical networks with a scale of up to 20 million show the CUBIS scales are largely independent of the original \nnetwork scale. This enables an approximately linear runtime, making our algorithm amenable for large networks. Our \nwork provides a new framework for effectively solving maximum clique problems on massive sparse graphs, which not \nonly makes the graph scale no longer the bottleneck but also shows some light on solving other clique-related problems. \nKeywords \nGraph mining, Complex network, Maximum clique problem, Graph decomposition"}, {"group": "Structural Biology", "id": 361, "label": "Multi-view Graph Structural Representation Learning via Graph Coarsening Xiaorui Qi , Qijie Bai , Yanlong Wen\u2217, Haiwei Zhang and Xiaojie Yuan", "shape": "dot", "size": 10, "title": "Authors: Yanlong Wen\u2217, qixiaorui, wenyl, zhhaiwei\u003cbr\u003eYear: 2021\u003cbr\u003eAbstract: Graph Transformers (GTs) have made remarkable\nachievements in graph-level tasks. However, most\nexisting works regard graph structures as a form\nof guidance or bias for enhancing node represen-\ntations, which focuses on node-central perspec-\ntives and lacks explicit representations of edges and\nstructures. One natural question is, can we treat\ngraph structures node-like as a whole to learn high-\nlevel features? Through experimental analysis, we\nexplore the feasibility of this assumption. Based\non our findings, we propose a novel multi-view\ngraph structural representation learning model via\ngraph coarsening (MSLgo) on GT architecture for\ngraph classification.\nSpecifically, we build three\nunique views, original, coarsening, and conversion,\nto learn a thorough structural representation. We\ncompress loops and cliques via hierarchical heuris-\ntic graph coarsening and restrict them with well-\ndesigned constraints, which builds the coarsening\nview to learn high-level interactions between struc-\ntures. We also introduce line graphs for edge em-\nbeddings and switch to edge-central perspective to\nconstruct the conversion view. Experiments on six\nreal-world datasets demonstrate the improvements\nof MSLgo over 14 baselines from various architec-\ntures."}, {"group": "Structural Biology", "id": 362, "label": "Effective Individual Fairest Community Search over Heterogeneous Information Networks", "shape": "dot", "size": 10, "title": "Authors: Taige Zhao, Ningning Cui, Wei Luo\u003cbr\u003eYear: 2012\u003cbr\u003eAbstract: Community search over heterogeneous information networks has\nbeen applied to wide domains, such as activity organization and\nteam formation. From these scenarios, the members of a group\nwith the same treatment often have different levels of activity and\nworkloads, which causes unfairness in the treatment between ac-\ntive members and inactive members (called individual unfairness).\nHowever, existing works do not pay attention to individual fairness\nand do not sufficiently consider the rich semantics of HINs (e.g.,\nhigh-order structure), which disables complex queries. To fill the\ngap, we formally define the issue of individual fairest community\nsearch over HINs (denoted as IFCS), which aims to find a set of\nvertices from the HIN that own the same type, close relationships,\nand small difference of activity level and has been demonstrated to\nbe NP-hard. To do this, we first develop an exploration-based filter\nthat reduces the search space of the community effectively. Further,\nto avoid repeating computation and prune unfair communities in\nadvance, we propose a message-based scheme and a lower bound-\nbased scheme. At last, we conduct extensive experiments on four\nreal-world datasets to demonstrate the effectiveness and efficiency\nof our proposed algorithms, which achieve at least \u00d73 times faster\nthan the baseline solution.\nCCS CONCEPTS\n\u2022 Do Not Use This Code \u2192Generate the Correct Terms for\nYour Paper; Generate the Correct Terms for Your Paper; Generate\nthe Correct Terms for Your Paper; Generate the Correct Terms for\nYour Paper.\nACM Reference Format:\nTaige Zhao, Jianxin Li, Ningning Cui, and Wei Luo. 2018. Effective Individual\nFairest Community Search over Heterogeneous Information Networks. In\n\u2217Both authors contributed equally to this research.\nPermission to make digital or hard copies of all or part of this work for personal or\nclassroom use is granted without fee provided that copies are not made or distributed\nfor profit or commercial advantage and that copies bear this notice and the full citation\non the first page. Copyrights for components of this work owned by others than the\nauthor(s) must be honored. Abstracting with credit is permitted. To copy otherwise, or\nrepublish, to post on servers or to redistribute to lists, requires prior specific permission\nand/or a fee. Request permissions from permissions@acm.org.\nConference acronym \u2019XX, June 03\u201305, 2018, Woodstock, NY\n\u00a9 2018 Copyright held by the owner/author(s). Publication rights licensed to ACM.\nACM ISBN 978-1-4503-XXXX-X/18/06\nhttps://doi.org/XXXXXXX.XXXXXXX\nProceedings of Make sure to enter the correct conference title from your rights\nconfirmation emai (Conference acronym \u2019XX). ACM, New York, NY, USA,\n13 pages. https://doi.org/XXXXXXX.XXXXXXX"}, {"group": "Archaeology", "id": 364, "label": "The morphological variability of Maltese \u2018cart ruts\u2019 and its implications", "shape": "dot", "size": 10, "title": "Authors: Huw S. Groucutt\u003cbr\u003eYear: 2017\u003cbr\u003eAbstract: Hundreds of \u2018cart ruts\u2019 \u2013 pairs of incised parallel grooves in the bedrock \u2013 are found across the Maltese Archi\u00ad\npelago in the central Mediterranean. The age, functional association, formation processes, and taphonomic \nalteration of these ruts, which occur here with a globally unrivalled frequency, has been much debated. \nGenerally seen as being created by erosion from vehicles such as wheeled carts, or alternatively being cut into the \nrock to facilitate movement of such vehicles, specific models range from the use of carts to move soil in the \nNeolithic to them reflecting classical era stone quarrying, and many other possibilities. One interesting aspect \nconcerns the morphological variability of the cart ruts, such as the notion that they have a standard gauge (width \nbetween ruts), and that this gauge is very similar to that of modern railway tracks. Evaluating the morphological \nvariability of the cart ruts contributes to an understanding of the phenomenon, as, for instance, we might expect \nthat if they date to different periods, with different functions, and/or were extensively modified by geomor\u00ad\nphological processes this will be reflected in the character of their morphological variability. The analysis sug\u00ad\ngests that cart ruts are fairly standardised in terms of basic measurements such as widths and depth, perhaps \nsuggesting that they are of a consistent age and function. This study identified a need for definitional clarity as \nthe commonly cited gauge measurements are not taken in the same way as gauge is defined for railway tracks. \nThere are hints of rut shape changes reflecting extensive use and or processes such as limestone dissolution, \nwhich give insights into their formation histories.   \n1."}, {"group": "Science and Technology", "id": 365, "label": "The resonant acoustic signatures of lithic debitage", "shape": "dot", "size": 10, "title": "Authors: Margaret A. Morris a, Petr Krysl b, Isabel C. Rivera-Collazo\u003cbr\u003eYear: 2014\u003cbr\u003eAbstract: Acoustic methods to search for submerged archaeological sites have shown that concentrations of knapped flint \nproduce a visible acoustic response in chirp sonar profiles in a variety of geographical settings. Field tests and \nsimulations have suggested that the submerged lithic signal is due to acoustic resonances of the flaked stone. We \nmodel and measure the resonant acoustic signatures of chert, obsidian, metavolcanic, and granitic lithic debit\u00ad\nage. Struck lithics produce multiple resonant peaks under 30 kHz, with high quality factors that decrease with \nmaterial coarseness. We use a combination of the finite element and boundary element methods to model the \nnatural vibrations of lithic debitage in both air and water. Direct measurement of lithic material density and \nadjustment of the Young\u2019s modulus and Poisson\u2019s ratio provide excellent correspondence between measured and \nmodeled resonances. Using a coupled finite element and boundary integral method, we model the acoustic \nscattering return of individual lithics in water as a function of frequency and incidence angle. We find the \nstrongest resonant signal between 8 and 16 kHz for a collection of lithic debitage. Results indicate that the lithic \nresonance signal is highly directional, with target strength up to \u221220 dB when excited at optimal angles. For a \nflat-laying lithic, target strength at normal incidence is, on average, 10 dB lower than the strongest signal, \ntypically found 55\u25e6\u00b1 18\u25e6from normal incidence. We suggest that the best way to detect submerged lithics may \nnot be through standard mono-static sub-bottom profiling with a direct downward pulse, but with a chirp pulse \nsent and received at an angle with respect to the sea bottom.   \n1."}, {"group": "Archaeology", "id": 366, "label": "The search for a needle in a haystack \u2013 New studies on plant use during the Mesolithic in southwest Central Europe", "shape": "dot", "size": 10, "title": "Authors: Stefanie Jacomet, Patricia Vandorpe\u003cbr\u003eYear: 2021\u003cbr\u003eAbstract: The existence of Mesolithic agriculture is a subject of debate in the archaeobotanist community. So far, reliable \nand AMS-dated on-site evidence of cereal macro remains are lacking to support the hypothesis. Archaeobotanical \nanalysis of two rock shelters with Mesolithic occupation layers in NE-France and SW-Switzerland, namely Lutter, \nAbri St. Joseph (FR) and Arconciel, La Souche (CH), revealed the presence of cereal remains within the Meso\u00ad\nlithic deposits. They gave rise to a possible answer to the question, however direct dating of the individual cereal \ngrains revealed their intrusive nature in the older deposits. The main aim of this paper is to place the newly \nacquired data from both sites in the broader framework of archaeobotanical research on Mesolithic sites in \nCentral Europe with a special focus on methodological and taphonomic issues often encountered at such sites.   \n1."}, {"group": "Archaeology", "id": 367, "label": "Three-colored Sancai glazed ceramics excavated from Bohai sites in Primorye (Russia)", "shape": "dot", "size": 10, "title": "Authors: Buravlev, E.G. Lapo, V.A. Pimenov, A.V. Martynenko, Bohai (Balhae) Sancai\u003cbr\u003eYear: 2017\u003cbr\u003eAbstract: This paper presents the analytical results of polychrome and monochrome lead-glazed ceramic classified as \nSancai that was excavated from the Bohai sites of Kraskino and Gorbatka walled towns, and the Chernyatino-2 \nsettlement (Bohai layer) (Primorye, Russia). Thirty ceramic fragments were analyzed using non-destructive X-ray \nfluorescence analysis (pXRF), optical microscopy, and scanning electron microscopy (SEM) with energy- \ndispersive x-ray spectroscopy (EDS). This work presents new data on the elemental composition of lead glazes \nand discusses some aspects of their technology, including assumptions about the medieval potters\u2019 skill level and \ntechnological awareness. Data pertaining to the sample\u2019s elemental composition indicates their origin from \nvarious workshops practicing different approaches to pottery production. These ceramics have no slip layer with \nthe glaze coating having been applied directly onto the surface of the ceramic vessels. The intensity of the lead \ncomponent in the glaze composition varies significantly, in the range of concentration between 36 and 79 wt%. \nSurface features of filling and shine, as well as the nature of glaze defects demonstrates a low probability of the \npeak firing approach that was applied in the technological process. The results presented in this paper contribute \nto expanding our understanding of the Bohai (CE 698\u2013926) and Tang (CE 618\u2013907) periods for Sancai ceramics.   \n1."}, {"group": "Structural Biology", "id": 368, "label": "IMAGING DYNAMICS BENEATH TURBID MEDIA VIA PARALLELIZED SINGLE-PHOTON DETECTION", "shape": "dot", "size": 10, "title": "Authors: Shiqi Xu, Xi Yang, Wenhui Liu, Joakim Jonsson, Ruobing Qian, Pavan Chandra Konda, Kevin C. Zhou, Lucas, Kreiss, Qionghai Dai, Haoqian Wang, Edouard Berrocal, Roarke Horstmeyer\u003cbr\u003eYear: 2010\u003cbr\u003eAbstract: Noninvasive optical imaging through dynamic scattering media has numerous important biomedical\napplications but still remains a challenging task. While standard diffuse imaging methods measure\noptical absorption or \ufb02uorescent emission, it is also well-established that the temporal correlation of\nscattered coherent light diffuses through tissue much like optical intensity. Few works to date, however,\nhave aimed to experimentally measure and process such temporal correlation data to demonstrate\ndeep-tissue video reconstruction of decorrelation dynamics. In this work, we utilize a single-photon\navalanche diode (SPAD) array camera to simultaneously monitor the temporal dynamics of speckle\n\ufb02uctuations at the single-photon level from 12 different phantom tissue surface locations delivered\nvia a customized \ufb01ber bundle array. We then apply a deep neural network to convert the acquired\nsingle-photon measurements into video of scattering dynamics beneath rapidly decorrelating tissue\nphantoms. We demonstrate the ability to reconstruct images of transient (0.1-0.4s) dynamic events\noccurring up to 8 mm beneath a decorrelating tissue phantom with millimeter-scale resolution, and\nhighlight how our model can \ufb02exibly extend to monitor \ufb02ow speed within buried phantom vessels."}, {"group": "Deep Learning", "id": 369, "label": "Deep Learning models for benign and malign Ocular Tumor Growth Estimation Divyadrishti Imaging Laboratory, Department of Physics, Indian Institute of Technology Roorkee,", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2011\u003cbr\u003eAbstract: Relatively abundant availability of medical imaging data has provided significant support in the \ndevelopment and testing of Neural Network based image processing methods. Clinicians often face issues \nin selecting suitable image processing algorithm for medical imaging data. A strategy for the selection of a \nproper model is presented here. The training data set comprises optical coherence tomography (OCT) and \nangiography (OCT-A) images of 50 mice eyes with more than 100 days follow-up. The data contains \nimages from treated and untreated mouse eyes. \nFour deep learning variants are tested for automatic (a) differentiation of tumor region with healthy retinal \nlayer and (b) segmentation of 3D ocular tumor volumes. Exhaustive sensitivity analysis of deep learning \nmodels is performed with respect to the number of training and testing images using 8 eight performance \nindices to study accuracy, reliability/reproducibility, and speed. U-net with UVgg16 is best for malign \ntumor data set with treatment (having considerable variation) and U-net with Inception backbone for benign \ntumor data (with minor variation). Loss value and root mean square error (R.M.S.E.) are found most and \nleast sensitive performance indices, respectively. The performance (via indices) is found to be exponentially \nimproving regarding a number of training images. The segmented OCT-Angiography data shows that \nneovascularization drives the tumor volume. Image analysis shows that photodynamic imaging-assisted \ntumor treatment protocol is transforming an aggressively growing tumor into a cyst. \nAn empirical expression is obtained to help medical professionals to choose a particular model given the \nnumber of images and types of characteristics.  \nWe recommend that the presented exercise should be taken as standard practice before employing a \nparticular deep learning model for biomedical image analysis. \n \nKeywords: Deep CNN, OCT Imaging, OCT \nAngiography, Image Segmentation, Cancer \ngrowth. \n1."}, {"group": "Structural Biology", "id": 370, "label": "Commentaries on the publication entitled Evidence for continuity of interstitial spaces across tissue and organ boundaries in", "shape": "dot", "size": 10, "title": "Authors: Hongyi Li, Hongyi Li, Ernest Starling, Guyton, Levick, Kihara, Catchpole, G. Hauck\u003cbr\u003eYear: 2022\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Structural Biology", "id": 371, "label": "On Stress Driven Diffusion in Bone - An Experimental Study", "shape": "dot", "size": 10, "title": "Authors: Gustav Lindbergaand, Per St\u00e5hleb\u003cbr\u003eYear: 2013\u003cbr\u003eAbstract: The transport of nutrients or signal constituents that stimulate growth of bone\ntissue is supposed to be a\ufb00ected by a static mechanical load. It follows from\nbasic thermodynamical principles that constituents causing volumetric change\nare dragged along the gradients of hydrostatic stress. The present preliminary\nstudy examines the behaviour of iodine present in the medullary cavity of a\nbovine long bone exposed to mechanical load.\nA section of the bone is x-\nray scanned with the static load present, with and without the iodine. The\nresulting distribution in a selected 2D plane is numerically evaluated using a\ndiscrete Radon\u2019s inverse transform. The result suggests that iodine is a useful\nconstituent with a good attenuation e\ufb00ect on the x-ray beam and clearly reveals\nthe temporal distribution of its transport through the bone. It further result\nshows some indication that stress does a\ufb00ect the iodine distribution. .\nKeywords:\nStress-driven di\ufb00usion, tomography, bone, experimental, Radon\u2019s\nintegral\n1."}, {"group": "Archaeology", "id": 372, "label": "Uniform in diversity: Typological and technological analysis of Bronze Age fine ware from Kakucs-Turj\u00e1n", "shape": "dot", "size": 10, "title": "Authors: Attila Kreiter c, Gabriella Kulcs\u00b4ar d\u003cbr\u003eYear: 2017\u003cbr\u003eAbstract: The ceramic variability of fine ware pottery in Early and Middle Bronze Age Carpathian Basin (2600/ \n2500\u20131500/1450 BCE) has been used as an argument for the existence of distinct, large-scale communities. The \nrecent technological studies of coarse ware ceramics have shown that different stylistic groups are characterized \nby uniform technological traits, suggesting that current narratives result from an a priori classification of material \nculture. To verify whether fine ware ceramics were characterized by similar traits, a sample of 33 vessels from a \nmulti-layered, fortified settlement of Kakucs-Turj\u00b4an (Hungary) was analyzed in terms of vessel forms and un\u00ad\nderlying production processes. The analyses compared the classical local and non-local provenance objects to \ndetermine whether the impressionistic categorization of vessels is supported by discrete parameters. The results \nindicate that similarly to coarse ware, Early and Middle Bronze Age ceramics in the Carpathian Basin was \ncharacterized by uniform production processes suggesting the impact of multi-directional and persisting inter\u00ad\naction across the Carpathian Basin.   \n1."}, {"group": "Archaeology", "id": 373, "label": "Velika Pe\u0107ina: Zooarchaeology, taphonomy and technology of a LGM Upper Paleolithic site in the central Balkans (Serbia)", "shape": "dot", "size": 10, "title": "Authors: Velika Pe\u00b4cina, Mary C. Stiner, Vesna Dimitrijevi\u00b4c b, Dusan Mihailovi\u00b4c b, Steven L. Kuhn\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: The Last Glacial Maximum (MIS 2) was a period of rapid and extreme environmental change, prompting \nremarkable human adaptive responses across the world. While large parts of the temperate zone were unin\u00ad\nhabitable during this interval, other areas served as refugia for plant, animal and human populations. The \nBalkans region is identified as a biotic refugium zone for many species during high glacial intervals, but until \nrecently there has been little archaeological evidence that it was also a refugium for Paleolithic human pop\u00ad\nulations. This paper reports archaeological findings from the cave site of Velika Pe\u00b4cina (\u02c7Zagubica, Serbia), which \npreserves evidence for multiple episodes of human presence between 24,000 and 20,500 cal BP. Species com\u00ad\nbinations within the macro- and microfaunas attest to a mosaic environment with high habitat and species di\u00ad\nversity over relatively small areas in the periods leading into, during, and following the LGM. Humans hunted a \nwide spectrum of large mammals, birds, and small carnivores while occupying Velika Pe\u00b4cina. Other mammalian \nand avian carnivores used the cave when humans were not present. Lithic and osseous artifact assemblages \nindicate that a range of manufacturing activities took place in the cave, despite the relatively low density of \noccupational debris. The late Upper Paleolithic groups used the cave as a residential base during a series of brief, \nprobably seasonal visits. Human populations were small in the study area, but their presence was not diminished \nduring episodes of extreme variation in global climate.   \n1."}, {"group": "Science and Technology", "id": 374, "label": "Water penetrating radar (WPR) in archaeology: A crannog case study", "shape": "dot", "size": 10, "title": "Authors: Alastair Ruffell\u003cbr\u003eYear: 2021\u003cbr\u003eAbstract: WPR has had limited use in freshwater archaeology and can provide superb 2D data over sites with appropriate \nwater type and depth, such as exists in this case study at Castlewellan Lake, Northern Ireland. Here, a submerged \ncrannog (Prehistoric, usually Bronze Age to Medieval human structure in water) is only shown on one historic \nmap, yet is not presently visible nor on other historic/recent maps. This work used a desktop study, sonar and \nWPR to characterise the submerged structure as a crannog. The asymmetry, bathymetric position, upper surface \n(rock slabs) and general topography of the crannog are determined, yet the variable makeup of its interior and \nsides allow numerous theories and possibilities for further, probably non-invasive investigation. The limits, \nproblems, data processing and uses of WPR for archaeology in this environment are described, some of which \nmay be useful in other studies of freshwater archaeology, including crannogs, flooded dwellings, walkways/ \npiers/jetties and military archaeology.   \n1."}, {"group": "Archaeology", "id": 375, "label": "Who\u2019s eating pork? Investigating pig breeding and consumption in Byzantine, Islamic and Norman/Aragonese Sicily (7th-14th c. AD)", "shape": "dot", "size": 10, "title": "Authors: Veronica Aniceti, Umberto Albarella\u003cbr\u003eYear: 2012\u003cbr\u003eAbstract: This paper investigates the culture of pork consumption in Sicily by examining a number of archaeological faunal \nassemblages dated to chronological phases spanning from the Byzantine to the Norman/Aragonese period (7th- \n14th c. AD). Zooarchaeological analyses reveal substantial diachronic changes in the use of the main domesti\u00ad\ncates, particularly concerning pig frequencies. In the Islamic period (9th-11th c. AD), pig is poorly represented at \nurban sites; this is likely to reflect a socio-cultural acceptance of the Islamic religious precepts forbidding pork \nconsumption. By contrast, and in continuity with the Roman and Byzantine periods, pigs are well-represented in \nrural settlements, thus indicating a more resilient attitude of these communities toward newly imported religious \ntraditions. In the later Norman/Aragonese period, the frequency of pig increases at some urban sites, reflecting \nthe fact that that pork prohibition had been lifted and that new food production and consumption practices were \ndeveloped. Pig continues, however, to be almost absent at a number of urban sites and castles/fortified villages; \nthis may suggest the persistence of Islamised communities in Sicily after the end of Islamic rule.   \n1."}]);
