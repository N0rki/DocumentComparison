an eye toward long portfolio theory geared toward\nexplaining sparsity via maximum principles. Specifically, in opti-\nmal allocation problems, we see that support of an optimal distri-\nbution lies in a variety intersect a kind of distinguished boundary\nof a compact subspace to be allocated over. We demonstrate some\nof its intelligence by using it to solve mazes and interpret such\nbehavior as the underlying space trying to understand some hy-\npothetical platonic index for which the capital asset pricing model\nholds.\n1."}, {"group": "Structural Biology", "id": 100, "label": "Individual and cooperative superexchange enhancement in cuprates Nikolay A. Bogdanov\u2217", "shape": "dot", "size": 10, "title": "Authors: Tonghuan Jiang, Wang, Qin\u003cbr\u003eYear: 2010\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Data Science", "id": 101, "label": "Inducing Causal Structure for Interpretable Neural Networks Applied", "shape": "dot", "size": 10, "title": "Authors: Biwei Huang, Mathias Drton\u003cbr\u003eYear: 2010\u003cbr\u003eAbstract: Causal abstraction techniques such as Interchange Intervention Training (IIT) have been proposed\nto infuse neural network with expert knowledge encoded in causal models, but their application\nto real-world problems remains limited. This article explores the application of IIT in predicting\nblood glucose levels in Type 1 Diabetes Mellitus (T1DM) patients. The study utilizes an acyclic\nversion of the simglucose simulator approved by the FDA to train a Multi-Layer Perceptron (MLP)\nmodel, employing IIT to impose causal relationships. Results show that the model trained with IIT\neffectively abstracted the causal structure and outperformed the standard one in terms of predictive\nperformance across different prediction horizons (PHs) post-meal. Furthermore, the breakdown of\nthe counterfactual loss can be leveraged to explain which part of the causal mechanisms are more\nor less effectively captured by the model. These preliminary results suggest the potential of IIT in\nenhancing predictive models in healthcare by effectively complying with expert knowledge.\nKeywords: interchange intervention, causality, glucose prediction, interpretability, diabetes\n1."}, {"group": "Game Theory", "id": 102, "label": "\uf02a Corresponding author: Di Wu Institutional Adoption and Correlation Dynamics: Bitcoin\u2019s Evolving Role in Financial Markets", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2014\u003cbr\u003eAbstract: Bitcoin, the world\u2019s first cryptocurrency, has increasingly integrated into traditional financial markets, particularly U.S. equity \nindices, as institutional adoption accelerates. This study examines how mechanisms such as Bitcoin ETFs and corporate Bitcoin \nholdings influence Bitcoin\u2019s correlation with major indices like the Nasdaq 100 and S\u0026P 500. Rolling window correlation, static \ncorrelation coefficients, and an event study framework are applied to daily data from 2018 to 2025 to uncover dynamic \ncorrelation trends. The findings reveal a significant increase in correlation following institutional milestones, such as the"}, {"group": "Natural Language Processing", "id": 103, "label": "InteractionMap: Improving Online Vectorized HDMap Construction with", "shape": "dot", "size": 10, "title": "Authors: Kuang WuChuan Yang, Zhanbin Li\u003cbr\u003eYear: 2018\u003cbr\u003eAbstract: Vectorized high-definition (HD) maps are essential for\nan autonomous driving system. Recently, state-of-the-art\nmap vectorization methods are mainly based on DETR-like\nframework to generate HD maps in an end-to-end man-\nner. In this paper, we propose InteractionMap, which im-\nproves previous map vectorization methods by fully lever-\naging local-to-global information interaction in both time\nand space. Firstly, we explore enhancing DETR-like de-\ntectors by explicit position relation prior from point-level\nto instance-level, since map elements contain strong shape\npriors. Secondly, we propose a key-frame-based hierarchi-\ncal temporal fusion module, which interacts temporal in-\nformation from local to global. Lastly, the separate clas-\nsification branch and regression branch lead to the prob-\nlem of misalignment in the output distribution. We interact\nsemantic information with geometric information by intro-\nducing a novel geometric-aware classification loss in op-\ntimization and a geometric-aware matching cost in label\nassignment. InteractionMap achieves state-of-the-art per-\nformance on both nuScenes and Argoverse2 benchmarks.\n1."}, {"group": "Structural Biology", "id": 104, "label": "INTERACTIVE VISUALIZATION OF LARGE MOLECULAR SYSTEMS WITH VTX: EXAMPLE WITH A MINIMAL WHOLE-CELL MODEL \u2217", "shape": "dot", "size": 10, "title": "Authors: Maxime Maria, Valentin Guillaume, Simon Guionni\u00e8re, Nicolas Dacquay, Cyprien Plateau\u2013Holleville, VincentLarroque, Jean Lard\u00e9, Yassine Naimi, Jean-Philip Piquemal, Guillaume Levieux, Nathalie Lagarde, St\u00e9phane M\u00e9rillou, Matthieu Montes\u003cbr\u003eYear: 2012\u003cbr\u003eAbstract: VTX is an open-source molecular visualization software designed to overcome the scaling limitations\nof existing real-time molecular visualization software when handling massive molecular datasets.\nVTX employs a meshless molecular graphics engine utilizing impostor-based techniques and adaptive\nlevel-of-detail (LOD) rendering. This approach significantly reduces memory usage and enables\nreal-time visualization and manipulation of large molecular systems. Performance benchmarks\nagainst VMD, PyMOL, and ChimeraX using a 114-million-bead Martini minimal whole-cell model\ndemonstrate VTX\u2019s efficiency, maintaining consistent frame rates even under interactive manipu-\nlation on standard computer hardware. VTX incorporates features such as screen-space ambient\nocclusion (SSAO) for enhanced depth perception and free-fly navigation for intuitive exploration\nof large molecular systems. VTX is open-source and free for non commercial use. Binaries for\nWindows and Ubuntu Linux are available at http://vtx.drugdesign.fr. VTX source code is available at\nhttps://github.com/VTX-Molecular-Visualization.\nKeywords molecular visualization, molecular graphics, usability, molecular modeling, molecular dynamics,\nhigh-performance computing, protein structure, structural biology"}, {"group": "Logic", "id": 105, "label": "Interpretable Deep Regression Models with Interval-Censored Failure Time Data", "shape": "dot", "size": 10, "title": "Authors: Changhui Yuan, Shuwei Li\u003cbr\u003eYear: 2010\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Theoretical Physics", "id": 106, "label": "Interpretation of local false discovery rates under the zero assumption", "shape": "dot", "size": 10, "title": "Authors: Daniel Xiang, Nikolaos Ignatiadis, Peter McCullagh\u003cbr\u003eYear: 2020\u003cbr\u003eAbstract: In large-scale studies with parallel signal-plus-noise observations, the local false discovery rate is a summary statistic\nthat is often presumed to be equal to the posterior probability that the signal is null. We prefer to call the latter quantity\nthe local null-signal rate to emphasize our view that a null signal and a false discovery are not identical events. The local\nnull-signal rate is commonly estimated through empirical Bayes procedures that build on the \u2018zero density assumption,\u2019\nwhich attributes the density of observations near zero entirely to null signals. In this paper, we argue that this strategy does\nnot furnish estimates of the local null-signal rate, but instead of a quantity we call the complementary local activity rate\n(clar). Although it is likely to be small, an inactive signal is not necessarily zero. The clar dominates both the local null-\nsignal rate and the local false sign rate and is a weakly continuous functional of the signal distribution. As a consequence,\nit takes on sensible values when the signal is sparse but not exactly zero. Our findings clarify the interpretation of local\nfalse discovery rates estimated under the zero density assumption."}, {"group": "Structural Biology", "id": 107, "label": "Investigating Data Hierarchies in Multifidelity Machine Learning for Excitation Energies", "shape": "dot", "size": 10, "title": "Authors: Vivin Vinod\u2217and, Peter Zaspel\u003cbr\u003eYear: 2022\u003cbr\u003eAbstract: Recent progress in machine learning (ML) has made high-accuracy quantum chem-\nistry (QC) calculations more accessible. Of particular interest are multifidelity machine\nlearning (MFML) methods where training data from differing accuracies or fidelities are\nused. These methods usually employ a fixed scaling factor, \u03b3, to relate the number of\ntraining samples across different fidelities, which reflects the cost and assumed sparsity\nof the data. This study investigates the impact of modifying \u03b3 on model efficiency and\naccuracy for the prediction of vertical excitation energies using the QeMFi benchmark\ndataset. Further, this work introduces QC compute time informed scaling factors, de-\nnoted as \u03b8, that vary based on QC compute times at different fidelities. A novel error\nmetric, error contours of MFML, is proposed to provide a comprehensive view of model\nerror contributions from each fidelity. The results indicate that high model accuracy\ncan be achieved with just 2 training samples at the target fidelity when a larger num-\nber of samples from lower fidelities are used. This is further illustrated through a novel\nconcept, the \u0393-curve, which compares model error against the time-cost of generating\ntraining samples, demonstrating that multifidelity models can achieve high accuracy\nwhile minimizing training data costs.\n1\narXiv:2410.11392v2  [physics.chem-ph]  25 Mar 2025"}, {"group": "Structural Biology", "id": 108, "label": "Joint Estimation and Prediction of City-wide Delivery Demand: A Large Language Model Empowered Graph-based Learning Approach", "shape": "dot", "size": 10, "title": "Authors: Tong Niea, Junlin Hea, Yuewen Meib, Guoyang Qinb, Guilong Lia, Jian Sunb, \u2217, Wei Maa, \u2217\u003cbr\u003eYear: 2016\u003cbr\u003eAbstract: The proliferation of e-commerce and urbanization has significantly intensified delivery operations in urban\nareas, boosting the volume and complexity of delivery demand. Data-driven predictive methods, especially those\nutilizing machine learning techniques, have emerged to handle these complexities in urban delivery demand\nmanagement problems. One particularly pressing issue that has yet to be sufficiently addressed is the joint\nestimation and prediction of city-wide delivery demand, as well as the generalization of the model to new\ncities.\nTo this end, we formulate this problem as a transferable graph-based spatiotemporal learning task.\nFirst, an individual-collective message-passing neural network model is formalized to capture the interaction\nbetween demand patterns of associated regions. Second, by exploiting recent advances in large language models\n(LLMs), we extract general geospatial knowledge encodings from the unstructured locational data using the\nembedding generated by LLMs. Last, to encourage the cross-city generalization of the model, we integrate the\nencoding into the demand predictor in a transferable way. Comprehensive empirical evaluation results on two\nreal-world delivery datasets, including eight cities in China and the US, demonstrate that our model significantly\noutperforms state-of-the-art baselines in accuracy, efficiency, and transferability. PyTorch implementation is\navailable at: https://github.com/tongnie/IMPEL.\nKeywords: Urban logistics, Delivery demand, Demand estimation, Graph-based forecasting, Large language\nmodels\n1."}, {"group": "Media Studies", "id": 109, "label": "Keyword-Oriented Multimodal Modeling for Euphemism Identification", "shape": "dot", "size": 10, "title": "Authors: Junsong Li, Meixuan Chen, Tongguan Wang\u003cbr\u003eYear: 2014\u003cbr\u003eAbstract: \u2014Euphemism identification deciphers the true mean-\ning of euphemisms, such as linking \u201cweed\u201d (euphemism) to\n\u201cmarijuana\u201d (target keyword) in illicit texts, aiding content\nmoderation and combating underground markets. While existing\nmethods are primarily text-based, the rise of social media\nhighlights the need for multimodal analysis, incorporating text,\nimages, and audio. However, the lack of multimodal datasets for\neuphemisms limits further research. To address this, we regard\neuphemisms and their corresponding target keywords as key-\nwords and first introduce a keyword-oriented multimodal corpus\nof euphemisms (KOM-Euph), involving three datasets (Drug,\nWeapon, and Sexuality), including text, images, and speech.\nWe further propose a keyword-oriented multimodal euphemism\nidentification method (KOM-EI), which uses cross-modal feature\nalignment and dynamic fusion modules to explicitly utilize the\nvisual and audio features of the keywords for efficient euphemism\nidentification. Extensive experiments demonstrate that KOM-EI\noutperforms state-of-the-art models and large language models,\nand show the importance of our multimodal datasets 1.\nIndex Terms\u2014Euphemism identification, multimodal, align-\nment, fusion\nI."}, {"group": "Structural Biology", "id": 110, "label": "Lambda-ABF-OPES: Faster Convergence with High Accuracy in Alchemical Free Energy", "shape": "dot", "size": 10, "title": "Authors: Narjes Ansari, \u2217, \u2020, Francis Jing, Antoine Gagelin, \u2020, Florent H\u00e9din, \u2020, F\u00e9lix Aviat, \u2020, J\u00e9r\u00f4me H\u00e9nin, \u2021, Jean-Philip Piquemal, \u2020, \u00b6, Louis Lagard\u00e8re\u2217, \u2020, \u00b6\u003cbr\u003eYear: 2014\u003cbr\u003eAbstract: Predicting the binding affinity between small molecules and target macromolecules\nwhile combining both speed and accuracy, is a cornerstone of modern computational\ndrug discovery which is critical for accelerating therapeutic development. Despite re-\ncent progresses in molecular dynamics (MD) simulations, such as advanced polarizable\nforce fields and enhanced-sampling techniques, estimating absolute binding free ener-\ngies (ABFE) remains computationally challenging. To overcome these difficulties, we\nintroduce a highly efficient, hybrid methodology that couples the Lambda-Adaptive\nBiasing Force (Lambda-ABF) scheme with On-the-fly Probability Enhanced Sampling\n(OPES). This approach achieves up to a nine-fold improvement in sampling efficiency\nand computational speed compared to the original Lambda-ABF when used in conjunc-\ntion with the AMOEBA polarizable force field, yielding converged results at a fraction\nof the cost of standard techniques."}, {"group": "Structural Biology", "id": 111, "label": "Large deformation and collapse analysis of re-entrant auxetic and hexagonal honeycomb lattice structures subjected to tension and compression", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2022\u003cbr\u003eAbstract: Additively manufactured auxetic structures offer desirable qualities like lightweight, good energy absorption, ex-\ncellent indentation resistance, high shear stiffness and fracture toughness among others. A wide range of materials\nfrom polymers to metals can be used to fabricate these structures. In contrast to conventional materials, auxetic struc-\ntures exhibit negative Poisson\u2019s ratios. Hence, unique mechanical properties can be achieved by specific design. In\nthis work, two types of structures, namely re-entrant auxetic and non-auxetic hexagonal honeycomb, are investigated.\nLarge deformation analyses in both 2D plane strain and 3D are conducted using linear triangular and tetrahedral\nmulti-field displacement-pressure elements. Hyperelastic with rate-independent plasticity constitutive models are uti-\nlized and calibrated with experimental uni-axial tensile test results. The structures are subjected to compression and\ntension at both transversal and longitudinal directions. The contact domain method is employed to capture both self-\ncontact and the interaction between the structure and loading plates. The obtained results show consistency with the\nexperimental data. The outcomes of the analyses regarding the re-entrant auxetic structure agree with the expected\nbehavior, showing a negative value of Poisson\u2019s ratio and greater efficiency of energy absorption than the hexagonal\nhoneycomb. By understanding the influence of the loading direction on the structural behavior, equivalent Poisson\u2019s\nratio and energy absorption a reliable theoretical framework for prospective designs of the lattice materials can be\nestablished.\nKeywords:\nAdditive manufacturing, Auxetic structure, Honeycomb, Re-entrant, FEM, Hyperelasticity\n1."}, {"group": "Natural Language Processing", "id": 112, "label": "Large Language Model Agent: A Survey on Methodology, Applications and Challenges", "shape": "dot", "size": 10, "title": "Authors: Junyu Luo, Weizhi Zhang, Ye Yuan, Yusheng Zhao, Junwei Yang, Yiyang Gu, Bohan Wu, Binqi Chen, Ziyue Qiao, Qingqing Long, Rongcheng Tu, Xiao Luo, Wei Ju, Zhiping Xiao, Yifan Wang, Meng Xiao, Chenwu Liu, Jingyang Yuan, Shichang Zhang, Yiqiao Jin, Fan Zhang, Xian Wu, Hanqing Zhao, Dacheng Tao, Philip S. Yu, Ming Zhang\u003cbr\u003eYear: 2018\u003cbr\u003eAbstract: \u2014The era of intelligent agents is upon us, driven by revolutionary advancements in large language models. Large Language\nModel (LLM) agents, with goal-driven behaviors and dynamic adaptation capabilities, potentially represent a critical pathway toward\nartificial general intelligence. This survey systematically deconstructs LLM agent systems through a methodology-centered taxonomy,\nlinking architectural foundations, collaboration mechanisms, and evolutionary pathways. We unify fragmented research threads by\nrevealing fundamental connections between agent design principles and their emergent behaviors in complex environments. Our work\nprovides a unified architectural perspective, examining how agents are constructed, how they collaborate, and how they evolve over time,\nwhile also addressing evaluation methodologies, tool applications, practical challenges, and diverse application domains. By surveying\nthe latest developments in this rapidly evolving field, we offer researchers a structured taxonomy for understanding LLM agents and\nidentify promising directions for future research. The collection is available at https://github.com/luo-junyu/Awesome-Agent-Papers.\nIndex Terms\u2014Large language model, LLM agent, AI agent, intelligent agent, multi-agent system, LLM, literature survey\n\u2726"}, {"group": "Natural Language Processing", "id": 113, "label": "Template for Electronic Submission to ACS Journals", "shape": "dot", "size": 10, "title": "Authors: Yuta Yoshimoto, Naoki Matsumura, Yuto Iwasaki, Hiroshi Nakao, Yasufumi Sakai\u003cbr\u003eYear: 2010\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Structural Biology", "id": 114, "label": "Layer- and Timestep-Adaptive Differentiable Token Compression Ratios for Efficient Diffusion Transformers", "shape": "dot", "size": 10, "title": "Authors: Haoran You, Connelly Barnes, Yuqian Zhou, Yan Kang, Zhenbang Du, Wei Zhou, Lingzhi Zhang, Yotam Nitzan, Xiaoyang Liu, Zhe Lin, Eli Shechtman, Sohrab Amirghodsi, Yingyan (Celine) Lin\u003cbr\u003eYear: 2016\u003cbr\u003eAbstract: Diffusion Transformers (DiTs) have achieved state-of-the-\nart (SOTA) image generation quality but suffer from high\nlatency and memory inefficiency, making them difficult to\ndeploy on resource-constrained devices. One major effi-\nciency bottleneck is that existing DiTs apply equal computa-\ntion across all regions of an image. However, not all image\ntokens are equally important, and certain localized areas\nrequire more computation, such as objects. To address this,\nwe propose DiffCR, a dynamic DiT inference framework\nwith differentiable compression ratios, which automatically\nlearns to dynamically route computation across layers and\ntimesteps for each image token, resulting in efficient DiTs.\nSpecifically, DiffCR integrates three features: (1) A token-\nlevel routing scheme where each DiT layer includes a router\nthat is fine-tuned jointly with model weights to predict token\nimportance scores. In this way, unimportant tokens bypass\nthe entire layer\u2019s computation; (2) A layer-wise differen-\ntiable ratio mechanism where different DiT layers automat-\nically learn varying compression ratios from a zero initial-\nization, resulting in large compression ratios in redundant\nlayers while others remain less compressed or even uncom-\npressed; (3) A timestep-wise differentiable ratio mechanism\nwhere each denoising timestep learns its own compression\nratio. The resulting pattern shows higher ratios for noisier\ntimesteps and lower ratios as the image becomes clearer.\nExtensive experiments on text-to-image and inpainting tasks\nshow that DiffCR effectively captures dynamism across to-\nken, layer, and timestep axes, achieving superior trade-\noffs between generation quality and efficiency compared to\nprior works. The project website is available here.\n1."}, {"group": "Theoretical Physics", "id": 115, "label": "Lean Formalization of Generalization Error Bound by Rademacher Complexity", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2022\u003cbr\u003eAbstract: We formalize the generalization error bound using Rademacher complexity in the Lean 4 theorem\nprover.\nGeneralization error quantifies the gap between a learning machine\u2019s performance on given\ntraining data versus unseen test data, and Rademacher complexity serves as an estimate of this error\nbased on the complexity of learning machines, or hypothesis class. Unlike traditional methods such as\nPAC learning and VC dimension, Rademacher complexity is applicable across diverse machine learning\nscenarios including deep learning and kernel methods. We formalize key concepts and theorems, including\nthe empirical and population Rademacher complexities, and establish generalization error bounds through\nformal proofs of McDiarmid\u2019s inequality, Hoeffding\u2019s lemma, and symmetrization arguments. We make\nour code available on GitHub.1"}, {"group": "Theoretical Physics", "id": 116, "label": "Learning extremal graphical structuresin high dimensions", "shape": "dot", "size": 10, "title": "Authors: MICHA\u00cbL LALANCETTE, STANISLAV VOLGUSHEV, Keef, Engelke, Zhou, Engelke, Ivanovs, Gissibl, Kl\u00fcppelberg, Kl\u00fcppelberg, Lauritzen, Am\u00e9ndola, Papastathopoulos, Strokorb, Rootz\u00e9n, Tajvidi, Rootz\u00e9n, Engelke, Hitz, Engelke, Hitz, Markov, Segers, Asenova, Asenova, Segers, Caseyand Papastathopoulos, Lauritzen, Liu, Meinshausen, B\u00fchlmann, Yuanand, Lin, Friedman, Engelke, Volgushev, Engelke, Volgushev, Hu, Asenova, R\u00f6ttger\u003cbr\u003eYear: 2012\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Theoretical Physics", "id": 117, "label": "Learning multi-modal representations by watching hundreds of surgical video lectures", "shape": "dot", "size": 10, "title": "Authors: Kun Yuana, Vinkle Srivastava, b, Tong Yua, Jo\u00a8el L. Lavanchyb, Jacques Marescauxf, Pietro Mascagnib, e, Nassir Navabc, Nicolas Padoya, Ward, Mascagni, Madani, Yuan, Blum, Padoy, Twinanda, Dergachyova, Nwoye, Allan, Wang, Pfeiffer, Nicolas Padoy, Eisenmann, Miech, Jia, Seenivasan, Xu, Grauman, Chen, Mehrish, Rouviere\u003cbr\u003eYear: 2018\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Natural Language Processing", "id": 118, "label": "Leveraging Language Models for Analyzing Longitudinal Experiential Data in Education", "shape": "dot", "size": 10, "title": "Authors: Mohammad Rashedul Hasan\u003cbr\u003eYear: 2022\u003cbr\u003eAbstract: \u2014We propose a novel approach to leveraging pre-\ntrained language models (LMs) for early forecasting of academic\ntrajectories in STEM students using high-dimensional longitudinal\nexperiential data. This data, which captures students\u2019 study-\nrelated activities, behaviors, and psychological states, offers\nvaluable insights for forecasting-based interventions. Key chal-\nlenges in handling such data include high rates of missing\nvalues, limited dataset size due to costly data collection, and\ncomplex temporal variability across modalities. Our approach\naddresses these issues through a comprehensive data enrichment\nprocess, integrating strategies for managing missing values,\naugmenting data, and embedding task-specific instructions and\ncontextual cues to enhance the models\u2019 capacity for learning\ntemporal patterns. Through extensive experiments on a curated\nstudent learning dataset, we evaluate both encoder-decoder\nand decoder-only LMs. While our findings show that LMs\neffectively integrate data across modalities and exhibit resilience to\nmissing data, they primarily rely on high-level statistical patterns\nrather than demonstrating a deeper understanding of temporal\ndynamics. Furthermore, their ability to interpret explicit temporal\ninformation remains limited. This work advances educational data\nscience by highlighting both the potential and limitations of LMs\nin modeling student trajectories for early intervention based on\nlongitudinal experiential data.\nIndex Terms\u2014Language Model, Time-series Data, Experiential\nData, Missing Data, Data Augmentation, STEM Education\nI."}, {"group": "Structural Biology", "id": 119, "label": "Leveraging Sequence Purification for Accurate Prediction of Multiple Conformational States with Enming Xinga, Junjie Zhanga, Shen Wanga, Xiaolin Cheng a,b*", "shape": "dot", "size": 10, "title": "Authors: Enming Xinga, Junjie Zhanga, Shen Wanga\u003cbr\u003eYear: 2019\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Structural Biology", "id": 120, "label": "LeX-Art: Rethinking Text Generation via Scalable High-Quality Data Synthesis", "shape": "dot", "size": 10, "title": "Authors: Xinyue Li\u2217\u003cbr\u003eYear: 2018\u003cbr\u003eAbstract: We introduce LeX-Art, a comprehensive suite for high-\nquality text-image synthesis that systematically bridges the\ngap between prompt expressiveness and text rendering fi-\ndelity.\nOur approach follows a data-centric paradigm,\nconstructing a high-quality data synthesis pipeline based\non Deepseek-R1 to curate LeX-10K, a dataset of 10K\nhigh-resolution, aesthetically refined 1024\u00d71024 images.\nBeyond dataset construction, we develop LeX-Enhancer,\n\u2217Equal Contribution\n\u2020 Corresponding authors\na robust prompt enrichment model, and train two text-\nto-image models, LeX-FLUX and LeX-Lumina, achieving\nstate-of-the-art text rendering performance. To systemat-\nically evaluate visual text generation, we introduce LeX-\nBench, a benchmark that assesses fidelity, aesthetics, and\nalignment, complemented by Pairwise Normalized Edit Dis-\ntance (PNED), a novel metric for robust text accuracy\nevaluation. Experiments demonstrate significant improve-\nments, with LeX-Lumina achieving a 79.81% PNED gain\non CreateBench, and LeX-FLUX outperforming baselines\nin color (+3.18%), positional (+4.45%), and font accuracy\n1\narXiv:2503.21749v1  [cs.CV]  27 Mar 2025\n(+3.81%). Our codes, models, datasets, and demo are pub-\nlicly available.\n1."}, {"group": "Natural Language Processing", "id": 121, "label": "LLaVA-CMoE: Towards Continual Mixture of Experts for Large Vision-Language Models", "shape": "dot", "size": 10, "title": "Authors: Hengyuan Zhao, Ziqin Wang, Qixin Sun, Kaiyou Song, Yilin Li, Xiaolin Hu\u2020, Qingpei Guo\u2020, Si Liu\u2020\u003cbr\u003eYear: 2013\u003cbr\u003eAbstract: Although applying Mixture of Experts to large language\nmodels for learning new tasks is widely regarded as an\neffective strategy for continuous learning, there still re-\nmain two major challenges: (1) As the number of tasks\ngrows, simple parameter expansion strategies can lead to\nexcessively large models. (2) Modifying the parameters of\nthe existing router results in the erosion of previously ac-\nquired knowledge.\nIn this paper, we present an innova-\ntive framework named LLaVA-CMoE, which is a contin-\nuous Mixture of Experts (MoE) architecture without any re-\nplay data. Specifically, we have developed a method called\nProbe-Guided Knowledge Extension (PGKE), which em-\nploys probe experts to assess whether additional knowledge\nis required for a specific layer. This approach enables the\nmodel to adaptively expand its network parameters based\non task distribution, thereby significantly improving the ef-\nficiency of parameter expansion. Additionally, we introduce\na hierarchical routing algorithm called Probabilistic Task\nLocator (PTL), where high-level routing captures inter-task\ninformation and low-level routing focuses on intra-task de-\ntails, ensuring that new task experts do not interfere with\nexisting ones. Our experiments shows that our efficient ar-\nchitecture has substantially improved model performance\non the CoIN benchmark while maintaining a reasonable pa-\nrameter count.\n1."}, {"group": "Data Science", "id": 122, "label": "LOCORE: Image Re-ranking with Long-Context Sequence Modeling", "shape": "dot", "size": 10, "title": "Authors: Zilin Xiao, Pavel Suma, Ayush Sachdeva, Hao-Jen Wang, Giorgos Kordopatis-Zilos, Giorgos Tolias, Vicente Ordonez\u003cbr\u003eYear: 2022\u003cbr\u003eAbstract: We introduce LOCORE, Long-Context Re-ranker, a model\nthat takes as input local descriptors corresponding to an\nimage query and a list of gallery images and outputs similar-\nity scores between the query and each gallery image. This\nmodel is used for image retrieval, where typically a first\nranking is performed with an efficient similarity measure,\nand then a shortlist of top-ranked images is re-ranked based\non a more fine-grained similarity model. Compared to ex-\nisting methods that perform pair-wise similarity estimation\nwith local descriptors or list-wise re-ranking with global\ndescriptors, LOCORE is the first method to perform list-\nwise re-ranking with local descriptors. To achieve this, we\nleverage efficient long-context sequence models to effectively\ncapture the dependencies between query and gallery images\nat the local-descriptor level. During testing, we process long\nshortlists with a sliding window strategy that is tailored to\novercome the context size limitations of sequence models.\nOur approach achieves superior performance compared with\nother re-rankers on established image retrieval benchmarks\nof landmarks (ROxf and RPar), products (SOP), fashion\nitems (In-Shop), and bird species (CUB-200) while hav-\ning comparable latency to the pair-wise local descriptor\nre-rankers.\n1."}, {"group": "Structural Biology", "id": 123, "label": "LC-PLM: Long-context Protein Language Modeling Using Bidi- rectional Mamba with Shared Projection Layers", "shape": "dot", "size": 10, "title": "Authors: Yingheng Wang\u2217, Zichen Wang\u2020, Gil Sadeh, Luca Zancato, Alessandro Achille, George Karypis\u003cbr\u003eYear: 2020\u003cbr\u003eAbstract: Self-supervised training of language models (LMs) has seen great success for protein sequences\nin learning meaningful representations and for generative drug design. Most protein LMs\nare based on the Transformer architecture trained on individual proteins with short context\nlengths. Such protein LMs cannot extrapolate to longer proteins and protein complexes well.\nThey also fail to account for the underlying biological mechanisms carried out by biomolecular\ninteractions and dynamics i.e., proteins often interact with other proteins, molecules, and\npathways in complex biological systems. In this work, we propose LC-PLM based on an\nalternative protein LM architecture, BiMamba-S, built upon selective structured state-space\nmodels, to learn high-quality universal protein representations at the amino acid token level\nusing masked language modeling. We also introduce its graph-contextual variant, LC-PLM-G,\nwhich contextualizes protein-protein interaction (PPI) graphs for a second stage of training.\nLC-PLM demonstrates favorable neural scaling laws, better length extrapolation capability,\nand a 7% to 34% improvement on protein downstream tasks than Transformer-based ESM-2.\nLC-PLM-G further trained within the context of PPI graphs shows promising results on protein\nstructure and function prediction tasks. Our study demonstrates the benefit of increasing\nthe context size with computationally efficient LM architecture (e.g., structured state space\nmodels) in learning universal protein representations and incorporating molecular interaction\ncontexts contained in biological graphs.\n\u2217This work was completed while the author was an intern at Amazon.\n\u2020Corresponding author.\n\u2021Huzefa Rangwala is on LOA as a Professor of Computer Science at George Mason University. This paper describes work\nperformed at Amazon.\n1\narXiv:"}, {"group": "Natural Language Processing", "id": 124, "label": "Low-Resource Transliteration for Roman-Urdu and Urdu Using Transformer-Based Models", "shape": "dot", "size": 10, "title": "Authors: Umer Butt, Stalin Veranasi, G\u00fcnter Neumann\u003cbr\u003eYear: 2015\u003cbr\u003eAbstract: As the Information Retrieval (IR) field increas-\ningly recognizes the importance of inclusivity,\naddressing the needs of low-resource languages\nremains a significant challenge. Transliteration\nbetween Urdu and its Romanized form, Ro-\nman Urdu, remains underexplored despite the\nwidespread use of both scripts in South Asia.\nPrior work using RNNs on the Roman-Urdu-\nParl dataset showed promising results but suf-\nfered from poor domain adaptability and lim-\nited evaluation.\nWe propose a transformer-based approach us-\ning the m2m100 multilingual translation model,\nenhanced with masked language modeling\n(MLM) pretraining and fine-tuning on both\nRoman-Urdu-Parl and the domain-diverse Dak-\nshina dataset. To address previous evaluation\nflaws, we introduce rigorous dataset splits and\nassess performance using BLEU, character-\nlevel BLEU, and CHRF.\nOur model achieves strong transliteration per-\nformance, with Char-BLEU scores of 96.37\nfor Urdu\u2192Roman-Urdu and 97.44 for Roman-\nUrdu\u2192Urdu. These results outperform both\nRNN baselines and GPT-4o Mini and demon-\nstrate the effectiveness of multilingual transfer\nlearning for low-resource transliteration tasks."}, {"group": "Speech Processing", "id": 125, "label": "Magnitude-Phase Dual-Path Speech Enhancement Network based on Self-Supervised Embedding and", "shape": "dot", "size": 10, "title": "Authors: Liejun Wang\u2020, Yinfeng Yu\u2020, Chunyang Ma\u003cbr\u003eYear: 2014\u003cbr\u003eAbstract: \u2014Speech self-supervised learning (SSL) has made\ngreat progress in various speech processing tasks, but there is still\nroom for improvement in speech enhancement (SE). This paper\npresents BSP-MPNet, a dual-path framework that combines\nself-supervised features with magnitude-phase information for\nSE. The approach starts by applying the perceptual contrast\nstretching (PCS) algorithm to enhance the magnitude-phase\nspectrum. A magnitude-phase 2D coarse (MP-2DC) encoder then\nextracts coarse features from the enhanced spectrum. Next,\na feature-separating self-supervised learning (FS-SSL) model\ngenerates self-supervised embeddings for the magnitude and\nphase components separately. These embeddings are fused to\ncreate cross-domain feature representations. Finally, two parallel\nRNN-enhanced multi-attention (REMA) mask decoders refine the\nfeatures, apply them to the mask, and reconstruct the speech\nsignal.We evaluate BSP-MPNet on the VoiceBank+DEMAND and\nWHAMR! datasets. Experimental results show that BSP-MPNet\noutperforms existing methods under various noise conditions,\nproviding new directions for self-supervised speech enhancement\nresearch. The implementation of the BSP-MPNet code is available\nonline2\nIndex Terms\u2014Self-supervised learning, feature separation,\nmagnitude-phase, multi-attention, denoising-reverberation.\nI."}, {"group": "Theoretical Physics", "id": 126, "label": "Maximum a posteriori testing in statistical inverse problems", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2012\u003cbr\u003eAbstract: This paper is concerned with a Bayesian approach to testing hypotheses in statistical\ninverse problems. Based on the posterior distribution \u03a0 (\u00b7|\ud835\udc4c= \ud835\udc66), we want to infer whether a\nfeature \u27e8\ud835\udf11,\ud835\udc62\u2020\u27e9of the unknown quantity of interest \ud835\udc62\u2020 is positive. This can be done by the so-called\nmaximum a posteriori test. We provide a frequentistic analysis of this test\u2019s properties such as\nlevel and power, and prove that it is a regularized test in the sense of Kretschmann et al. (2024).\nFurthermore we provide lower bounds for its power under classical spectral source conditions\nin case of Gaussian priors. Numerical simulations illustrate its superior performance both in\nmoderately and severely ill-posed situations."}, {"group": "Science and Technology", "id": 127, "label": "Mechanism of Electricacupuncture Treating Detrusor\u2013Bladder Ne ck Dyscoordination After Suprasacral Spinal Cord Injury by Proteo", "shape": "dot", "size": 10, "title": "Authors: Li-Ya Tang\u2020, Qi-Rui Qu\u2020, Yi-Ying Long, Xia Wu, Jin-Can Liu, Ming Xu, Hong, Zhang, Lu Zhou, Qiong Liu, Kun Ai, Kun Ai, Qiong Liu\u003cbr\u003eYear: 2019\u003cbr\u003eAbstract: Objectives This study aimed to elucidate the potential mechanisms of electroacupuncture (EA) in\nrestoring detrusor-bladder neck dyssynergesia (DBND) following suprasacral spinal cord injury.\nMethods A total of 52 adult female Sprague-Dawley rats were randomly assigned to either a sham\ngroup (n=12) or a spinal cord injury model group (n=40). In the model group, DBND was induced\nin 40 rats through Hassan Shaker spinal cord transection, with 24 rats surviving spinal shock and\nsubsequently randomized into two groups: a model-only group (DBND, n=12) and an EA\nintervention group (DBND+EA, n=12). DBND+EA was administered at Ciliao (BL32), Zhongji\n(RN3), and Sanyinjiao (SP6) acupoints, for 20 minutes per session, once daily for 10 consecutive\ndays. On day 29 post-injury, all rats underwent urodynamic assessments, followed by hematoxylin\nand eosin (HE) staining, tandem mass tag (TMT) proteomics, and Western blot (WB) analysis of\nthe detrusor and bladder neck tissues.\nResults Urodynamic evaluation demonstrated that EA intervention enhanced bladder function in\nDBND rats. HE staining indicated reduced fibroplasia in the detrusor muscle and alleviated\ninflammation in the bladder neck following EA. TMT proteomic analysis revealed 30\ndifferentially expressed proteins (DEPs) in the detrusor and 59 DEPs in the bladder neck post-EA\ntreatment. WB results corroborated these TMT findings.\nConclusion EA effectively promotes synergy between the detrusor muscle and bladder neck in\nDBND, likely by enhancing detrusor contractility and facilitating bladder neck relaxation during\nurination. This study provides mechanistic insights into the therapeutic role of EA in managing\nDBND.\nKEYWORDS: electricacupuncture, suprasacral spinal cord injury, detrusor bladder neck\ndyssynergesia, detrusor, bladder neck, proteomics analysis, differentially expressed proteins.\n1."}, {"group": "Theoretical Physics", "id": 128, "label": "Minimax Rate-Optimal Inference for Individualized Quantile Treatment Effects", "shape": "dot", "size": 10, "title": "Authors: Jiachen Sun, Yin Xia\u003cbr\u003eYear: 2015\u003cbr\u003eAbstract: The quantification of treatment effects plays an important role in a wide range\nof applications, including policy making and bio-pharmaceutical research. In this\narticle, we study the quantile treatment effect (QTE) while addressing two specific\ntypes of heterogeneities: (a) personalized heterogeneity, which captures the varying\ntreatment effects for different individuals, and (b) quantile heterogeneity, which\naccounts for how the impact of covariates varies across different quantile levels. A\nwell-designed debiased estimator for the individualized quantile treatment effect\n(IQTE) is proposed to capture such heterogeneities effectively. We show that this\nestimator converges weakly to a Gaussian process as a function of the quantile\nlevels and propose valid statistical inference methods, including the construction\nof confidence intervals and the development of hypothesis testing decision rules.\nIn addition, the minimax optimality frameworks for these inference procedures are\nestablished.\nSpecifically, we derive the minimax optimal rates for the expected\nlength of confidence intervals and the magnitude of the detection boundary for\nhypothesis testing procedures, illustrating the superiority of the proposed estimator.\nThe effectiveness of our methods is demonstrated through extensive simulations and\nan analysis of the National Health and Nutrition Examination Survey (NHANES)\ndatasets.\nKeywords: Debiased estimator; Minimax detection boundary; Minimax expected length;\nQuantile regression; Weak convergence.\n1\narXiv:2503.18523v1  [math.ST]  24 Mar 2025"}, {"group": "Structural Biology", "id": 129, "label": "Microservices: a Reusable RESTification Approach", "shape": "dot", "size": 10, "title": "Authors: Barry\u003cbr\u003eYear: 2012\u003cbr\u003eAbstract: \u2014The microservices architectural style has become\nthe de facto standard for large-scale cloud applications, offering\nnumerous benefits in scalability, maintainability, and deploy-\nment flexibility. Many organizations are pursuing the migration\nof legacy monolithic systems to a microservices architecture.\nHowever, this process is challenging, risky, time-intensive, and\nprone-to-failure while several organizations lack necessary fi-\nnancial resources, time, or expertise to set up this migration\nprocess. So, rather than trying to migrate a legacy system where\nmigration is risky or not feasible, we suggest exposing it as\na microservice application without without having to migrate\nit. In this paper, we present a reusable, automated, two-phase\napproach that combines evolutionary algorithms with machine\nlearning techniques. In the first phase, we identify microservices\nat the method level using a multi-objective genetic algorithm that\nconsiders both structural and semantic dependencies between\nmethods. In the second phase, we generate REST APIs for each\nidentified microservice using a classification algorithm to assign\nHTTP methods and endpoints. We evaluated our approach with\na case study on the Spring PetClinic application, which has\nboth monolithic and microservices implementations that serve\nas ground truth for comparison. Results demonstrate that our\napproach successfully aligns identified microservices with those\nin the reference microservices implementation, highlighting its\neffectiveness in service identification and API generation.\nIndex Terms\u2014Microservices Identification, Architecture Mi-\ngration, REST API, Machine Learning, Software Architecture,\nMulti-Objective Optimization.\nI."}, {"group": "Structural Biology", "id": 130, "label": "MRNA FOLDING ALGORITHMS FOR STRUCTURE AND CODON School of Physics, Mathematics, and Computing", "shape": "dot", "size": 10, "title": "Authors: Mary Richardson, Mihir Metkar\u2020\u003cbr\u003eYear: 2021\u003cbr\u003eAbstract: mRNA technology has revolutionized vaccine development, protein replacement therapies, and cancer\nimmunotherapies, offering rapid production and precise control over sequence and efficacy. However,\nthe inherent instability of mRNA poses significant challenges for drug storage and distribution,\nparticularly in resource-limited regions. Co-optimizing RNA structure and codon choice has emerged\nas a promising strategy to enhance mRNA stability while preserving efficacy. Given the vast sequence\nand structure design space, specialized algorithms are essential to achieve these qualities. Recently,\nseveral effective algorithms have been developed to tackle this challenge that all use similar underlying\nprinciples. We call these specialized algorithms mRNA folding algorithms as they generalize classical\nRNA folding algorithms. A comprehensive analysis of their underlying principles, performance, and\nlimitations is lacking. This review aims to provide an in-depth understanding of these algorithms,\nidentify opportunities for improvement, and benchmark existing software implementations in terms\nof scalability, correctness, and feature support."}, {"group": "Game Theory", "id": 131, "label": "Multi-Hypothesis Prediction for Portfolio Optimization: A Structured Ensemble Learning Approach to Risk Diversification", "shape": "dot", "size": 10, "title": "Authors: Alejandro Rodriguez Domingueza, Muhammad Shahzada, Xia Honga\u003cbr\u003eYear: 2011\u003cbr\u003eAbstract: A framework for portfolio allocation based on multiple hypotheses predic-\ntion using structured ensemble models is presented. Portfolio optimization\nis formulated as an ensemble learning problem, where each predictor focuses\non a specific asset or hypothesis. The portfolio weights are determined by\noptimizing the ensemble\u2019s parameters, using an equal-weighted portfolio as\nthe target, serving as a canonical basis for the hypotheses.\nDiversity in\nlearning among predictors is parametrically controlled, and their predictions\nform a structured input for the ensemble optimization model. The proposed\nmethodology establishes a link between this source of learning diversity and\nportfolio risk diversification, enabling parametric control of portfolio diver-\nsification prior to the decision-making process.\nMoreover, the methodol-\nogy demonstrates that the diversity in asset or hypothesis selection, based\non predictions of future returns, before and independently of the ensemble\nlearning stage, also contributes to the out-of-sample portfolio diversification.\nThe sets of assets with more diverse but lower average return predictions\nare preferred over less diverse selections. The methodology enables para-\nmetric control of diversity in both the asset selection and learning stages,\nproviding users with significant control over out-of-sample portfolio diversifi-\ncation prior to decision-making. Experiments validate the hypotheses across\none-step and multi-step decisions for all parameter configurations and the\nstructured model variants using equity portfolios.\nKeywords:\ndiversity, ensemble learning, multiple hypotheses prediction,\nportfolio optimization, predict-then-optimize, structured models\nPreprint submitted to Expert Systems with Applications\nJanuary 24, 2025\narXiv:"}, {"group": "Natural Language Processing", "id": 132, "label": "Multi-View and Multi-Scale Alignment for Contrastive Language-Image Pre-training in", "shape": "dot", "size": 10, "title": "Authors: Nicha C. Dvornek\u003cbr\u003eYear: 2018\u003cbr\u003eAbstract: . Contrastive Language-Image Pre-training (CLIP) demon-\nstrates strong potential in medical image analysis but requires substantial\ndata and computational resources. Due to these restrictions, existing CLIP\napplications in medical imaging focus mainly on modalities like chest\nX-rays that have abundant image-report data available, leaving many\nother important modalities under-explored. Here, we propose one of the\nfirst adaptations of the full CLIP model to mammography, which presents\nsignificant challenges due to labeled data scarcity, high-resolution images\nwith small regions of interest, and class-wise imbalance. We first develop\na specialized supervision framework for mammography that leverages its\nmulti-view nature. Furthermore, we design a symmetric local alignment\nmodule to better focus on detailed features in high-resolution images.\nLastly, we incorporate a parameter-efficient fine-tuning approach for large\nlanguage models pre-trained with medical knowledge to address data\nlimitations. Our multi-view and multi-scale alignment (MaMA) method\noutperforms state-of-the-art baselines for three different tasks on two\nlarge real-world mammography datasets, EMBED and RSNA-Mammo,\nwith only 52% model size compared with the largest baseline. 1"}, {"group": "Game Theory", "id": 133, "label": "Multimodal Deep Reinforcement Learning for Portfolio Optimization", "shape": "dot", "size": 10, "title": "Authors: Sumit Nawathe, Panguluri, Venkatesh, snawathe, rpangulu, jzhang\u003cbr\u003eYear: 2016\u003cbr\u003eAbstract: We propose a reinforcement learning (RL) framework that leverages multimodal\ndata\u2014including historical stock prices, sentiment analysis, and topic embeddings\nfrom news articles\u2014to optimize trading strategies for S\u0026P100 stocks. Building\nupon recent advancements in financial reinforcement learning, we aim to enhance\nthe state space representation by integrating financial sentiment data from SEC\nfilings and news headlines and refining the reward function to better align with\nportfolio performance metrics. Our methodology includes deep reinforcement\nlearning with state tensors comprising price data, sentiment scores, and news\nembeddings, processed through advanced feature extraction models like CNNs\nand RNNs. By benchmarking against traditional portfolio optimization techniques\nand advanced strategies, we demonstrate the efficacy of our approach in delivering\nsuperior portfolio performance. Empirical results showcase the potential of our\nagent to outperform standard benchmarks, especially when utilizing combined data\nsources under profit-based reward functions.\nPreprint. Under review.\narXiv:2412.17293v1  [q-fin.PM]  23 Dec 2024"}, {"group": "Game Theory", "id": 134, "label": "Navigating Uncertainty in ESG Investing \u2217", "shape": "dot", "size": 10, "title": "Authors: Jiayue Zhang\u2020, Ken Seng Tan\u2021, Lysa Porth\u003cbr\u003eYear: 2011\u003cbr\u003eAbstract: The widespread confusion among investors regarding Environmental, Social, and Gov-\nernance (ESG) rankings assigned by rating agencies has underscored a critical issue in\nsustainable investing. To address this uncertainty, our research has devised methods\nthat not only recognize this ambiguity but also offer tailored investment strategies for\ndifferent investor profiles. By developing ESG ensemble strategies and integrating ESG\nscores into a Reinforcement Learning (RL) model, we aim to optimize portfolios that\ncater to both financial returns and ESG-focused outcomes. Additionally, by propos-\ning the Double-Mean-Variance model, we classify three types of investors based on\ntheir risk preferences. We also introduce ESG-adjusted Capital Asset Pricing Models\n(CAPMs) to assess the performance of these optimized portfolios. Ultimately, our com-\nprehensive approach provides investors with tools to navigate the inherent ambiguities\nof ESG ratings, facilitating more informed investment decisions.\nKeywords: Sustainable Investment, ESG, Reinforcement Learning, Mean-Variance,\nESG-Adjusted CAPM.\n\u2217*We thank the organizers and the participants at Fields - Institute\u2019s Mathematics for Climate Change\n(MfCC) Network \u0026 Waterloo Institute for Complexity and Innovation (WICI): Math for Complex Climate\nChallenges Workshop at the University of Waterloo, Waterloo, May 1 - 4, 2023, the 26th International\nCongress on Insurance: Mathematics and Economics at the Department of Actuarial Mathematics and\nStatistics at Heriot-Watt University, Edinburgh from July 4 - 7, 2023, and the 58th Actuarial Research\nConference (ARC) at Drake University in Des Moines, Iowa, July 30 - August 2, 2023.\n\u2020Department of Statistics \u0026 Actuarial Science, University of Waterloo (j857zhan@uwaterloo.ca)\n\u2021Division of Banking and Finance, Nanyang Technological University (kenseng.tan@ntu.edu.sg)\n\u00a7Department of Statistics \u0026 Actuarial Science, University of Waterloo (twirjanto@uwaterloo.ca)\n\u00b6School of Accounting \u0026 Finance, University of Waterloo (twirjanto@uwaterloo.ca)\n\u2016Gordon S. Lang School of Business and Economics, University of Guelph (lporth@uoguelph.ca)\n1\narXiv:2310.02163v2  [q-fin.PM]  4 Jan 2025"}, {"group": "Structural Biology", "id": 135, "label": "Nearest Neighbour Equilibrium Clustering School of Mathematical Sciences, Lancaster University, UK", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2016\u003cbr\u003eAbstract: A novel and intuitive nearest neighbours based\nclustering algorithm is introduced, in which a cluster\nis defined in terms of an equilibrium condition which\nbalances its size and cohesiveness. The formulation of\nthe equilibrium condition allows for a quantification\nof the strength of alignment of each point to a cluster,\nwith these cluster alignment strengths leading natu-\nrally to a model selection criterion which renders the\nproposed approach fully automatable. The algorithm\nis simple to implement and computationally efficient,\nand produces clustering solutions of extremely high\nquality in comparison with relevant benchmarks from\nthe literature. R code to implement the approach\nis available from https://github.com/DavidHofmeyr/\nNNEC.\nIndex Terms\nEquilibrium clustering; graph clustering; auto-\nmatic clustering; self-tuning; non-parametric; flexible\nclustering; nearest neighbour clustering\nI."}, {"group": "Structural Biology", "id": 136, "label": "Noise-strength-adapted approximate quantum codes inspired by machine learning We demonstrate that machine learning provides a powerful tool for discovering new approximate", "shape": "dot", "size": 10, "title": "Authors: Shuwei Liu, Jinmin Yi\u003cbr\u003eYear: 2013\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Theoretical Physics", "id": 137, "label": "Non-Bayesian Learning in Misspecified Models* Sebastian Bervoets\u2020 \u0026 Mathieu Faure\u2021 \u0026 Ludovic Renou\u00a7", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2012\u003cbr\u003eAbstract: Deviations from Bayesian updating are traditionally categorized as biases, errors,\nor fallacies, thus implying their inherent \u201csub-optimality.\u201d We offer a more nuanced\nview. We demonstrate that, in learning problems with misspecified models, non-\nBayesian updating can outperform Bayesian updating.\nKEYWORDS: learning, Bayesian, consistency.\nJEL CLASSIFICATION: C73, D82.\n*We are grateful to Michel Benaim and Peter Gr\u00a8unwald for their invaluable help and to Aislinn Bohren,\nDaniel Hauser, Jan Knoepfle, Pietro Ortoleva, Mallesh Pai, Maher Said, Ran Spiegler, Philipp Strack, and\nseminar audiences for insightful discussions. LR thanks the generous hospitality of AMSE, where this\nproject started.\n\u2020AMSE, sebastian.bervoets(at)univ-amu.fr\n\u2021AMSE, mathieu.faure(at)univ-amu.fr\n\u00a7QMUL and CEPR, lrenou.econ(at)gmail.com\n1\narXiv:2503.18024v1  [econ.TH]  23 Mar 2025"}, {"group": "Structural Biology", "id": 138, "label": "NON-CANONICAL CROSSLINKS CONFOUND EVOLUTIONARY PROTEIN STRUCTURE MODELS", "shape": "dot", "size": 10, "title": "Authors: Romain Lacombe\u003cbr\u003eYear: 2010\u003cbr\u003eAbstract: Evolution-based protein structure prediction models have achieved breakthrough\nsuccess in recent years. However, they struggle to generalize beyond evolutionary\npriors and on sequences lacking rich homologous data. Here we present a novel,\nout-of-domain benchmark based on sactipeptides, a rare class of ribosomally syn-\nthesized and post-translationally modified peptides (RiPPs) characterized by sul-\nfur to \u03b1-carbon thioether bridges creating cross-links between cysteine residues\nand backbone. We evaluate recent models on predicting conformations compati-\nble with these cross-links bridges for the 10 known sactipeptides with elucidated\npost-translational modifications. Crucially, the structures of 5 of them have not\nyet been experimentally resolved. This makes the task a challenging problem\nfor evolution-based models, which we find exhibit limited performance (0.0% to\n19.2% GDT-TS on sulfur to \u03b1-carbon distance). Our results point at the need for\nphysics-informed models to sustain progress in biomolecular structure prediction."}, {"group": "Theoretical Physics", "id": 139, "label": "Nonparametric MLE for Gaussian Location Mixtures: Certi\ufb01ed Computation and Generic Behavior", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2017\u003cbr\u003eAbstract: We study the nonparametric maximum likelihood estimator b\u03c0 for Gaussian location mixtures in one\ndimension. It has been known since [Lin83a] that given an n-point dataset, this estimator always returns a\nmixture with at most n components, and more recently [PW20] gave a sharp O(log n) bound for subgaus-\nsian data. In this work we study computational aspects of b\u03c0. We provide an algorithm which for small\nenough \u03b5 \u003e 0 computes an \u03b5-approximation of b\u03c0 in Wasserstein distance in time K+Cnk2 log log(1/\u03b5).\nHere K is data-dependent but independent of \u03b5, while C is an absolute constant and k = |supp(b\u03c0)| \u2264n\nis the number of atoms in b\u03c0. We also certi\ufb01ably compute the exact value of |supp(b\u03c0)| in \ufb01nite time.\nThese guarantees hold almost surely whenever the dataset (x1, . . . , xn) \u2208[\u2212cn1/4, cn1/4] consists of\nindependent points from a probability distribution with a density (relative to Lebesgue measure). We\nalso show the distribution of b\u03c0 conditioned to be k-atomic admits a density on the associated 2k \u22121\ndimensional parameter space for all k \u2264\u221an/3, and almost sure locally linear convergence of the EM\nalgorithm. One key tool is a classical Fourier analytic estimate for non-degenerate curves."}, {"group": "Robotics", "id": 140, "label": "OminiAdapt: Learning Cross-Task Invariance for Robust and Environment-Aware Robotic Manipulation", "shape": "dot", "size": 10, "title": "Authors: Yongxu Wang\u2217, Weiyun Yi\u2217, Xinhao Kong\u2217, Wanting Li\u2020\u003cbr\u003eYear: 2020\u003cbr\u003eAbstract: \u2014 With the rapid development of embodied in-\ntelligence, leveraging large-scale human data for high-level\nimitation learning on humanoid robots has become a focal point\nof interest in both academia and industry. However, applying\nhumanoid robots to precision operation domains remains chal-\nlenging due to the complexities they face in perception and\ncontrol processes, the long-standing physical differences in mor-\nphology and actuation mechanisms between humanoid robots\nand humans, and the lack of task-relevant features obtained\nfrom egocentric vision. To address the issue of covariate shift\nin imitation learning, this paper proposes an imitation learning\nalgorithm tailored for humanoid robots. By focusing on the\nprimary task objectives, filtering out background information,\nand incorporating channel feature fusion with spatial attention\nmechanisms, the proposed algorithm suppresses environmental\ndisturbances and utilizes a dynamic weight update strategy to\nsignificantly improve the success rate of humanoid robots in\naccomplishing target tasks. Experimental results demonstrate\nthat the proposed method exhibits robustness and scalability\nacross various typical task scenarios, providing new ideas and\napproaches for autonomous learning and control in humanoid\nrobots. The project will be open-sourced on GitHub.\n1University of Science and Technology of China, Hefei, China.\n2Beijing Institute of Technology, Beijing, China.\n3Beijing Institute of Technology, Beijing, China.\n\u2020Institute of Automation Chinese Academy of Sciences, Beijing, China.\n\u2217Work was done during the internship at the Institute of Automation\nChinese Academy of Sciences.\nI."}, {"group": "Natural Language Processing", "id": 141, "label": "OmniBench: Towards The Future of Universal Omni-Language Models", "shape": "dot", "size": 10, "title": "Authors: Yizhi Li, Ge Zhang, Yinghao Ma, Ruibin Yuan, Kang Zhu, Hangyu Guo, Yiming Liang, Jiaheng Liu, Zekun Wang, Jian Yang, Siwei Wu, Xingwei Qu, Jinjie Shi, Xinyue Zhang, Zhenzhu Yang, Xiangzhou Wang, Zhaoxiang Zhang, Zachary Liu, Emmanouil Benetos, Wenhao Huang, Chenghua Lin\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Recent advancements in multimodal large lan-\nguage models (MLLMs) have focused on inte-\ngrating multiple modalities, yet their ability to si-\nmultaneously process and reason across different\ninputs remains underexplored. We introduce Om-\nniBench, a novel benchmark designed to evaluate\nmodels\u2019 ability to recognize, interpret, and reason\nacross visual, acoustic, and textual inputs simul-\ntaneously. We define language models capable of\nsuch tri-modal processing as omni-language mod-\nels (OLMs). OmniBench features high-quality\nhuman annotations that require integrated under-\nstanding across all modalities. Our evaluation re-\nveals that: i) open-source OLMs show significant\nlimitations in instruction-following and reasoning\nin tri-modal contexts; and ii) most baseline mod-\nels perform poorly (around 50% accuracy) even\nwith textual alternatives to image/audio inputs.\nTo address these limitations, we develop OmniIn-\nstruct, an 96K-sample instruction tuning dataset\nfor training OLMs. We advocate for developing\nmore robust tri-modal integration techniques and\ntraining strategies to enhance OLM performance.\nCodes and data could be found at our repo.\n1."}, {"group": "Natural Language Processing", "id": 142, "label": "OmniVox: Zero-Shot Emotion Recognition with Omni-LLMs", "shape": "dot", "size": 10, "title": "Authors: John Murzaku, Owen Rambow\u003cbr\u003eYear: 2010\u003cbr\u003eAbstract: The use of omni-LLMs (large language models that accept any modality as\ninput), particularly for multimodal cognitive state tasks involving speech,\nis understudied. We present OmniVox, the first systematic evaluation of\nfour omni-LLMs on the zero-shot emotion recognition task. We evaluate\non two widely used multimodal emotion benchmarks: IEMOCAP and\nMELD, and find zero-shot omni-LLMs outperform or are competitive with\nfine-tuned audio models. Alongside our audio-only evaluation, we also\nevaluate omni-LLMs on text only and text and audio. We present acoustic\nprompting, an audio-specific prompting strategy for omni-LLMs which\nfocuses on acoustic feature analysis, conversation context analysis, and\nstep-by-step reasoning. We compare our acoustic prompting to minimal\nprompting and full chain-of-thought prompting techniques. We perform\na context window analysis on IEMOCAP and MELD, and find that using\ncontext helps, especially on IEMOCAP. We conclude with an error analysis\non the generated acoustic reasoning outputs from the omni-LLMs."}, {"group": "Theoretical Physics", "id": 143, "label": "ON THE GLIVENKO-CANTELLI THEOREM FOR REAL-VALUED EMPIRICAL FUNCTIONS OF STATIONARY \u03b1-MIXING AND \u03b2-MIXING SEQUENCES", "shape": "dot", "size": 10, "title": "Authors: HAROUNA SANGAR\u003cbr\u003eYear: 2019\u003cbr\u003eAbstract: . In this paper we extend the classical Glivenko-Cantelli theorem to real-valued\nempirical functions under dependence structures characterised by \u03b1-mixing and \u03b2-mixing\nconditions. We investigate su\ufb03cient conditions ensuring that families of real-valued func-\ntions exhibit the Glivenko-Cantelli (GC) property in these dependence settings. Our analysis\nfocuses on function classes satisfying uniform entropy conditions and establishes deviation\nbounds under mixing coe\ufb03cients that decay at appropriate rates. Our results re\ufb01ne the\nexisting literature by relaxing the independence assumptions and highlighting the role of\ndependence in empirical process convergence.\n1 Msc in Probabilties and Statistics\nUniversit\u00b4e des Sciences, des Techniques et des Technologies de Bamako (USTT-B), Mali\nPersonal email : ocouwi@gmail.com\n2 DER MI, Facult\u00b4e des Sciences et Techniques (FST), USTT-B, Mali\nLERSTAD, Gaston Berger University, Saint-Louis, S\u00b4en\u00b4egal.\nResearcher at IMHO [https://imhotepsciences.org]\nImhotep International Mathematical Center (imh-imc), https://imhotepsciences.org\nInstitutional emails : harouna.sangare@usttb.edu.ml, harouna.sangare@mesrs.ml,\nsangare.harouna@ugb.edu.sn\nPersonal email : harounasangareusttb@gmail.com\nKeywords. \u03b1-mixing, \u03b2-mixing, Empirical process, Stationarity, Entropy number, Law of\nlarge numbers, Uniform convergence, Glivenko-Cantelli class\nAMS 2020 Mathematics Subject Classi\ufb01cation: 62G20; 62G30; 60F99; 60G10\n1."}, {"group": "Theoretical Physics", "id": 144, "label": "On the Robustness of Kernel Ridge Regression Using the Cauchy Loss Function", "shape": "dot", "size": 10, "title": "Authors: Hongwei Wen, Annika Betken, Wouter Koolen\u003cbr\u003eYear: 2013\u003cbr\u003eAbstract: Robust regression aims to develop methods for estimating an unknown regression\nfunction in the presence of outliers, heavy-tailed distributions, or contaminated data,\nwhich can severely impact performance. Most existing theoretical results in robust\nregression assume that the noise has a finite absolute mean, an assumption violated by\ncertain distributions, such as Cauchy and some Pareto noise. In this paper, we introduce\na generalized Cauchy noise framework that accommodates all noise distributions with\nfinite moments of any order, even when the absolute mean is infinite. Within this\nframework, we study the kernel Cauchy ridge regressor (KCRR), which minimizes a\nregularized empirical Cauchy risk to achieve robustness. To derive the L2-risk bound\nfor KCRR, we establish a connection between the excess Cauchy risk and L2-risk for\nsufficiently large scale parameters of the Cauchy loss, which reveals that these two\nrisks are equivalent. Furthermore, under the assumption that the regression function\nsatisfies H\u00a8older smoothness, we derive excess Cauchy risk bounds for KCRR, showing\nimproved performance as the scale parameter decreases. By considering the twofold\neffect of the scale parameter on the excess Cauchy risk and its equivalence with the\nL2-risk, we establish the almost minimax-optimal convergence rate for KCRR in terms\nof L2-risk, highlighting the robustness of the Cauchy loss in handling various types of\nnoise. Finally, we validate the effectiveness of KCRR through experiments on both\nsynthetic and real-world datasets under diverse noise corruption scenarios.\nKeywords: Robust regression, generalized Cauchy noise, robust loss function, Cauchy\nloss function, kernel ridge regression, minimax-optimal convergence rates, learning theory"}, {"group": "Structural Biology", "id": 145, "label": "On the Viability of Semi-Supervised Segmentation Methods for Statistical Shape Modeling", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2019\u003cbr\u003eAbstract: Statistical Shape Models (SSMs) excel at identifying population level anatomical vari-\nations, which is at the core of various clinical and biomedical applications, including\nmorphology-based diagnostics and surgical planning. However, the effectiveness of SSM\nis often constrained by the necessity for expert-driven manual segmentation, a process\nthat is both time-intensive and expensive, thereby restricting their broader application and\nutility. Recent deep learning approaches enable the direct estimation of Statistical Shape\nModels (SSMs) from unsegmented images. While these models can predict SSMs without\nsegmentation during deployment, they do not address the challenge of acquiring the manual\nannotations needed for training, particularly in resource-limited settings. Semi-supervised\nmodels for anatomy segmentation can mitigate the annotation burden. Yet, despite the\nabundance of available approaches, there are no established guidelines to inform end-users\non their effectiveness for the downstream task of constructing SSMs. In this study, we\nsystematically evaluate the potential of semi-supervised methods as viable alternatives to\nmanual segmentations for building SSMs.\nWe establish a new performance benchmark\nby employing various semi-supervised methods for anatomy segmentation under low an-\nnotation settings, utilizing the predicted segmentation\u2019s for the task of SSM. Our results\nindicate that some methods produce noisy segmentation, which is very unfavorable for SSM\ntasks, while others can capture the correct modes of variations in the population cohort\nwith 60-80% reduction in required manual annotation.\nKeywords: Statistical Shape Modeling, Semi Supervised Segmentation Study\n1."}, {"group": "Robotics", "id": 146, "label": "Online POMDP Planning with Anytime Deterministic Optimality Guarantees", "shape": "dot", "size": 10, "title": "Authors: Vadim Indelman\u003cbr\u003eYear: 2018\u003cbr\u003eAbstract: Decision-making under uncertainty is a critical aspect of many practical\nautonomous systems due to incomplete information. Partially Observable\nMarkov Decision Processes (POMDPs) offer a mathematically principled\nframework for formulating decision-making problems under such conditions.\nHowever, finding an optimal solution for a POMDP is generally intractable.\nIn recent years, there has been a significant progress of scaling approximate\nsolvers from small to moderately sized problems, using online tree search\nsolvers.\nOften, such approximate solvers are limited to probabilistic\nor asymptotic guarantees towards the optimal solution. In this paper,\nwe derive a deterministic relationship for discrete POMDPs between an\napproximated and the optimal solution. We show that at any time, we can\nderive bounds that relate between the existing solution and the optimal one.\nWe show that our derivations provide an avenue for a new set of algorithms\nand can be attached to existing algorithms that have a certain structure to\nprovide them with deterministic guarantees with marginal computational\noverhead. In return, not only do we certify the solution quality, but we\ndemonstrate that making a decision based on the deterministic guarantee\nmay result in superior performance compared to the original algorithm\nwithout the deterministic certification."}, {"group": "Natural Language Processing", "id": 147, "label": "OpenHuEval: Evaluating Large Language Model on Hungarian Specifics", "shape": "dot", "size": 10, "title": "Authors: Xingjian Wei, Jiang Wu*\u2020, No\u00e9mi Ligeti-Nagy, Jiaxing Sun, Yinfan Wang, Zijian Gy\u02ddoz\u02ddo Yang, Junyuan Gao, Jingchao Wang, Bowen Jiang, Shasha Wang, Nanjun Yu, Zihao Zhang, Shixin Hong, Hongwei Liu, Wei Li, Songyang Zhang, Dahua Lin, Lijun Wu, G\u00e1bor Pr\u00f3sz\u00e9ky, Conghui He\u2021\u003cbr\u003eYear: 2010\u003cbr\u003eAbstract: We introduce OpenHuEval, the first benchmark\nfor LLMs focusing on the Hungarian language\nand specifics. OpenHuEval is constructed from\na vast collection of Hungarian-specific mate-\nrials sourced from multiple origins.\nIn the\nconstruction, we incorporated the latest design\nprinciples for evaluating LLMs, such as using\nreal user queries from the internet, emphasiz-\ning the assessment of LLMs\u2019 generative capa-\nbilities, and employing LLM-as-judge to en-\nhance the multidimensionality and accuracy of\nevaluations. Ultimately, OpenHuEval encom-\npasses eight Hungarian-specific dimensions,\nfeaturing five tasks and 3953 questions. Con-\nsequently, OpenHuEval provides the compre-\nhensive, in-depth, and scientifically accurate\nassessment of LLM performance in the con-\ntext of the Hungarian language and its specifics.\nWe evaluated current mainstream LLMs, in-\ncluding both traditional LLMs and recently de-\nveloped Large Reasoning Models. The results\ndemonstrate the significant necessity for eval-\nuation and model optimization tailored to the\nHungarian language and specifics. We also\nestablished the framework for analyzing the\nthinking processes of LRMs with OpenHuEval,\nrevealing intrinsic patterns and mechanisms of\nthese models in non-English languages, with\nHungarian serving as a representative exam-\nple. We will release OpenHuEval at https:\n//github.com/opendatalab/OpenHuEval ."}, {"group": "Structural Biology", "id": 148, "label": "Optical Spiking Neurons Enable High-Speed and Energy-Efficient Optical Neural Networks", "shape": "dot", "size": 10, "title": "Authors: Zefeng Huang\u2020, Yuetong Fang, Xin Wang, Bojun Cheng, Shaoliang Yu, Zhongrui Wang, Renjing Xu\u003cbr\u003eYear: 2016\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Theoretical Physics", "id": 149, "label": "OPTIMAL DATA SPLITTING FOR HOLDOUT CROSS-VALIDATION IN LARGE COVARIANCE MATRIX ESTIMATION", "shape": "dot", "size": 10, "title": "Authors: Lamia Lamrani, Christian Bongiorno\u003cbr\u003eYear: 2019\u003cbr\u003eAbstract: Cross-validation is a statistical tool that can be used to improve large covariance matrix estimation.\nAlthough its efficiency is observed in practical applications, the theoretical reasons behind it remain\nlargely intuitive, with formal proofs currently lacking. To carry on analytical analysis, we focus on\nthe holdout method, a single iteration of cross-validation, rather than the traditional k-fold approach.\nWe derive a closed-form expression for the estimation error when the population matrix follows a\nwhite inverse Wishart distribution, and we observe the optimal train-test split scales as the square root\nof the matrix dimension. For general population matrices, we connected the error to the variance of\neigenvalues distribution, but approximations are necessary. Interestingly, in the high-dimensional\nasymptotic regime, both the holdout and k-fold cross-validation methods converge to the optimal\nestimator when the train-test ratio scales with the square root of the matrix dimension."}, {"group": "Structural Biology", "id": 150, "label": "Optimal Stepsize for Diffusion Sampling", "shape": "dot", "size": 10, "title": "Authors: Jianning Pei, Han Hu, Shuyang Gu\u2020\u003cbr\u003eYear: 2012\u003cbr\u003eAbstract: Diffusion models achieve remarkable generation quality but\nsuffer from computational intensive sampling due to sub-\noptimal step discretization. While existing works focus on\noptimizing denoising directions, we address the principled\ndesign of stepsize schedules.\nThis paper proposes Opti-\nmal Stepsize Distillation, a dynamic programming frame-\nwork that extracts theoretically optimal schedules by dis-\ntilling knowledge from reference trajectories. By reformu-\nlating stepsize optimization as recursive error minimiza-\ntion, our method guarantees global discretization bounds\nthrough optimal substructure exploitation. Crucially, the\ndistilled schedules demonstrate strong robustness across ar-\nchitectures, ODE solvers, and noise schedules. Experiments\nshow 10\u00d7 accelerated text-to-image generation while pre-\nserving 99.4% performance on GenEval.\nOur code is\navailable at https://github.com/bebebe666/\nOptimalSteps.\n1."}, {"group": "Natural Language Processing", "id": 151, "label": "Optimization through Iterative LLM Prompting for Nuclear Engineering Design Problems", "shape": "dot", "size": 10, "title": "Authors: Anirudh Tunga, Amandeep Bakshi, Michael J. Mueterthies, J. Thomas Gruenwald, Jonathan Nistor\u003cbr\u003eYear: 2011\u003cbr\u003eAbstract: The optimization of nuclear engineering designs, such as nuclear fuel assembly configurations,\ninvolves managing competing objectives like reactivity control and power distribution. This study\nexplores the use of Optimization by Prompting, an iterative approach utilizing large language models\n(LLMs), to address these challenges. The method is straightforward to implement, requiring no\nhyperparameter tuning or complex mathematical formulations. Optimization problems can be\ndescribed in plain English, with only an evaluator and parsing script needed for execution. The\nin-context learning capabilities of LLMs enable them to understand problem nuances, therefore they\nhave the potential to surpass traditional metaheuristic optimization methods. This study demonstrates\nthe application of LLMs as optimizers to Boiling Water Reactor (BWR) fuel lattice design, showing\nthe capability of commercial LLMs to achieve superior optimization results compared to traditional\nmethods.\nKeywords Optimization \u00b7 In-Context Learning \u00b7 Large Language Models \u00b7 Nuclear Engineering\nIterative Optimization Framework Using LLM and Nuclear Simulation\narXiv:2503.19620v1  [cs.LG]  25 Mar 2025\nOptimization through Iterative LLM Prompting for Nuclear Engineering Design Problems"}, {"group": "Game Theory", "id": 152, "label": "Optimizing Portfolio Performance through Clustering and Sharpe Ratio-Based Optimization: A Comparative Backtesting Approach", "shape": "dot", "size": 10, "title": "Authors: Keon Vin Parka, Keon Vin Park, Keon Vin Parka, \u2217\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Game Theory", "id": 153, "label": "Optimizing Portfolios with Pakistan-Exposed ETFs: Risk and Performance Insight", "shape": "dot", "size": 10, "title": "Authors: Ali Jaffri, Abootaleb Shirvani, Ayush Jha, Svetlozar T. Rachev, Frank J. Fabozzi\u003cbr\u003eYear: 2011\u003cbr\u003eAbstract: This study examines the investment landscape of Pakistan as an emerging and\nfrontier market, focusing on implications for international investors, particularly\nthose in the United States, through exchange-traded funds (ETFs) with exposure to\nPakistan. The analysis encompasses 30 ETFs with varying degrees of exposure to\nPakistan, covering the period from January 1, 2016, to February 2024. This research\nhighlights the potential benefits and risks associated with investing in these ETFs,\nemphasizing the importance of thorough risk assessments and portfolio performance\ncomparisons. By providing descriptive statistics and performance metrics based on\nhistorical optimization, this paper aims to equip investors with the necessary insights\nto make informed decisions when optimizing their portfolios with Pakistan-exposed\nETFs. The second part of the paper introduces and assesses dynamic optimization\nmethodologies. This section is designed to explore the adaptability and performance\nmetrics of dynamic optimization techniques in comparison with conventional histori-\ncal optimization methods. By integrating dynamic optimization into the investigation,\nthis research aims to offer insights into the efficacy of these contrasting methodologies\nin the context of Pakistan-exposed ETFs. The findings underscore the significance of\nPakistan\u2019s market dynamics within the broader context of emerging markets, offering\na pathway for diversification and potential growth in investment strategies.\n1\narXiv:"}, {"group": "Natural Language Processing", "id": 154, "label": "OVO-Bench: How Far is Your Video-LLMs from Real-World Online Video", "shape": "dot", "size": 10, "title": "Authors: Yifei Li\u2217, \u2020, Junbo Niu\u2217, \u2020, Ziyang Miao, Chunjiang Ge, Yuanhang Zhou, Qihao He, Xiaoyi Dong, B, Haodong Duan, Shuangrui Ding, \u2020, Rui Qian, \u2020, Pan Zhang, Yuhang Zang, Yuhang Cao, Conghui He, Jiaqi Wang, B\u003cbr\u003eYear: 2014\u003cbr\u003eAbstract: Temporal Awareness\u2014the ability to reason dynamically\nbased on the timestamp when a question is raised\u2014is the\nkey distinction between offline and online video LLMs. Un-\nlike offline models, which rely on complete videos for static,\npost hoc analysis, online models process video streams in-\ncrementally and dynamically adapt their responses based\non the timestamp at which the question is posed. Despite its\n* indicates equal contribution
