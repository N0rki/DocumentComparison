              function drawGraph() {

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"group": "Philosophy of Science", "id": 0, "label": "Article", "shape": "dot", "size": 10, "title": "Authors: Charlie Keruszan, Aymerick Bazin, Amaury Badon\u2217, Nyquist\u003cbr\u003eYear: 2011\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Structural Biology", "id": 1, "label": "A LOCAL PERSPECTIVE-BASED MODEL FOR OVERLAPPING", "shape": "dot", "size": 10, "title": "Authors: Rui-Feng Wang, *, \u2020, Kangning Cui\u003cbr\u003eYear: 2022\u003cbr\u003eAbstract: Community detection, which identifies densely connected node clusters with sparse\nbetween-group links, is vital for analyzing network structure and function in real-\nworld systems. Most existing community detection methods based on GCNs pri-\nmarily focus on node-level information while overlooking community-level fea-\ntures, leading to performance limitations on large-scale networks. To address this\nissue, we propose LQ-GCN, an overlapping community detection model from a lo-\ncal community perspective. LQ-GCN employs a Bernoulli-Poisson model to con-\nstruct a community affiliation matrix and form an end-to-end detection framework.\nBy adopting local modularity as the objective function, the model incorporates lo-\ncal community information to enhance the quality and accuracy of clustering re-\nsults. Additionally, the conventional GCNs\u2019 architecture is optimized to improve\nthe model\u2019s capability in identifying overlapping communities in large-scale net-\nworks. Experimental results demonstrate that LQ-GCN achieves up to a 33% im-\nprovement in Normalized Mutual Information (NMI) and a 26.3% improvement in\nRecall compared to baseline models across multiple real-world benchmark datasets."}, {"group": "Game Theory", "id": 2, "label": "A Simple Strategy to Deal with Toxic Flow \u00c1lvaro Cartea and Leandro S\u00e1nchez-Betancourt", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2018\u003cbr\u003eAbstract: We model the trading activity between a broker and her clients (informed and uninformed traders) as\nan infinite-horizon stochastic control problem. We derive the broker\u2019s optimal dealing strategy in closed\nform and use this to introduce an algorithm that bypasses the need to calibrate individual parameters,\nso the dealing strategy can be executed in real-world trading environments. Finally, we characterise\nthe discount in the price of liquidity a broker offers clients. The discount strikes the optimal balance\nbetween maximising the order flow from the broker\u2019s clients and minimising adverse selection losses to\nthe informed traders."}, {"group": "Logic", "id": 3, "label": "A Theoretical Framework for Prompt Engineering: Approximating Smooth Functions with Transformer Prompts", "shape": "dot", "size": 10, "title": "Authors: Ryumei Nakada, Wenlong Ji, Tianxi Cai, James Zou, Linjun Zhang\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Prompt engineering has emerged as a powerful technique for guiding large language\nmodels (LLMs) toward desired responses, significantly enhancing their performance\nacross diverse tasks.\nBeyond their role as static predictors, LLMs increasingly\nfunction as intelligent agents, capable of reasoning, decision-making, and adapting\ndynamically to complex environments. However, the theoretical underpinnings of\nprompt engineering remain largely unexplored. In this paper, we introduce a formal\nframework demonstrating that transformer models, when provided with carefully\ndesigned prompts, can act as a configurable computational system by emulating\na \u201cvirtual\u201d neural network during inference. Specifically, input prompts effectively\ntranslate into the corresponding network configuration, enabling LLMs to adjust their\ninternal computations dynamically. Building on this construction, we establish an\napproximation theory for \u03b2-times differentiable functions, proving that transformers\ncan approximate such functions with arbitrary precision when guided by appropriately\nstructured prompts. Moreover, our framework provides theoretical justification for\nseveral empirically successful prompt engineering techniques, including the use of longer,\nstructured prompts, filtering irrelevant information, enhancing prompt token diversity,\nand leveraging multi-agent interactions. By framing LLMs as adaptable agents rather\nthan static models, our findings underscore their potential for autonomous reasoning\nand problem-solving, paving the way for more robust and theoretically grounded\nadvancements in prompt engineering and AI agent design."}, {"group": "Game Theory", "id": 4, "label": "AGENT-BASED MODELS FOR TWO STOCKS WITH SUPERHEDGING D. CRISCI, S.E.FERRANDO, AND K.GAJEWSKI", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2016\u003cbr\u003eAbstract: . An agent-based modelling methodology for the joint price evolution of two\nstocks is put forward. The method models future multidimensional price trajectories re-\nflecting how a class of agents rebalance their portfolios in an operational way by reacting\nto how stocks\u2019 charts unfold. Prices are expressed in units of a third stock that acts as nu-\nmeraire. The methodology is robust, in particular, it does not depend on any prior prob-\nability or analytical assumptions and it is based on constructing scenarios/trajectories.\nA main ingredient is a superhedging interpretation that provides relative superhedging\nprices between the two modelled stocks. The operational nature of the methodology gives\nobjective conditions for the validity of the model and so implies realistic risk-rewards\nprofiles for the agent\u2019s operations. Superhedging computations are performed with a dy-\nnamic programming algorithm deployed on a graph data structure. Null subsets of the\ntrajectory space are directly related to arbitrage opportunities (i.e. there is no need for\nprobabilistic considerations) that may emerge during the trajectory set construction. It\nfollows that the superhedging algorithm handles null sets in a rigorous and intuitive way.\nSuperhedging and underhedging bounds are kept relevant to the investor by means of a\nworst case pruning method and, as an alternative, a theory supported pruning that relies\non a new notion of small arbitrage.\n1."}, {"group": "Philosophy of Science", "id": 5, "label": "AlignDiff: Learning Physically-Grounded Camera Alignment via Diffusion", "shape": "dot", "size": 10, "title": "Authors: Liuyue Xie, Jiancong Guo, Ozan Cakmakci, Andre Araujo\u003cbr\u003eYear: 2018\u003cbr\u003eAbstract: Accurate camera calibration is a fundamental task for 3D\nperception, especially when dealing with real-world, in-the-\nwild environments where complex optical distortions are\ncommon. Existing methods often rely on pre-rectified im-\nages or calibration patterns, which limits their applicabil-\nity and flexibility. In this work, we introduce a novel frame-\nwork that addresses these challenges by jointly modeling\ncamera intrinsic and extrinsic parameters using a generic\nray camera model. Unlike previous approaches, AlignDiff\nshifts focus from semantic to geometric features, enabling\nmore accurate modeling of local distortions. We propose\nAlignDiff, a diffusion model conditioned on geometric pri-\nors, enabling the simultaneous estimation of camera distor-\ntions and scene geometry. To enhance distortion prediction,\nwe incorporate edge-aware attention, focusing the model\non geometric features around image edges, rather than se-\nmantic content. Furthermore, to enhance generalizability\nto real-world captures, we incorporate a large database of\nray-traced lenses containing over three thousand samples.\nThis database characterizes the distortion inherent in a di-\nverse variety of lens forms. Our experiments demonstrate\nthat the proposed method significantly reduces the angu-\nlar error of estimated ray bundles by \u223c8.2\u25e6and overall\ncalibration accuracy, outperforming existing approaches on\nchallenging, real-world datasets.\n1."}, {"group": "Philosophy of Science", "id": 6, "label": "Amplifying solid-state high harmonic generations with momentum k-gaps in band structure engineering", "shape": "dot", "size": 10, "title": "Authors: Yiming Pan, Danni Chen, Xiaoxi Xu, Zhaopin Chen, Huaiqiang Wang\u003cbr\u003eYear: 2011\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Philosophy of Science", "id": 7, "label": "Asymptotically uniformly most powerful tests for di\ufb00usion processes with nonsynchronous observations", "shape": "dot", "size": 10, "title": "Authors: Teppei Ogihara\u2217and, Futo Ueno\u2217\u003cbr\u003eYear: 2018\u003cbr\u003eAbstract: . This paper introduces a quasi-likelihood ratio testing procedure for di\ufb00usion processes observed\nunder nonsynchronous sampling schemes. High-frequency data, particularly in \ufb01nancial econometrics, are often\nrecorded at irregular time points, challenging conventional synchronous methods for parameter estimation and\nhypothesis testing. To address these challenges, we develop a quasi-likelihood framework that accommodates\nirregular sampling while integrating adaptive estimation techniques for both drift and di\ufb00usion coe\ufb03cients,\nthereby enhancing optimization stability and reducing computational burden. We rigorously derive the asymp-\ntotic properties of the proposed test statistic, showing that it converges to a chi-squared distribution under the\nnull hypothesis and exhibits consistency under alternatives. Moreover, we establish that the resulting tests are\nasymptotically uniformly most powerful. Extensive numerical experiments corroborate the theoretical \ufb01ndings\nand demonstrate that our method outperforms existing nonparametric approaches.\nKeywords.\nasymptotically uniformly most powerful tests, di\ufb00usion processes, local asymptotic normality,\nnonsynchronous observations, quasi-likelihood ratio tests"}, {"group": "Philosophy of Science", "id": 8, "label": "AutoBayes: A Compositional Framework for Generalized Variational Inference", "shape": "dot", "size": 10, "title": "Authors: Marco Perin\u003cbr\u003eYear: 2011\u003cbr\u003eAbstract: We introduce a new compositional framework for generalized variational inference, clarify-\ning the di\ufb00erent parts of a model, how they interact, and how they compose. We explain\nthat both exact Bayesian inference and the loss functions typical of variational inference\n(such as variational free energy and its generalizations) satisfy chain rules akin to that of\nreverse-mode automatic di\ufb00erentiation, and we advocate for exploiting this to build and\noptimize models accordingly. To this end, we construct a series of compositional tools: for\nbuilding models; for constructing their inversions; for attaching local loss functions; and\nfor exposing parameters. Finally, we explain how the resulting parameterized statistical\ngames may be optimized locally, too. We illustrate our framework with a number of classic\nexamples, pointing to new areas of extensibility that are revealed.\n1."}, {"group": "Game Theory", "id": 9, "label": "Bayesian Optimization for CVaR-based portfolio optimization", "shape": "dot", "size": 10, "title": "Authors: Robert Millar\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Optimal portfolio allocation is often formulated as a constrained\nrisk problem, where one aims to minimize a risk measure sub-\nject to some performance constraints. This paper presents new\nBayesian Optimization algorithms for such constrained minimiza-\ntion problems, seeking to minimize the conditional value-at-risk\n(a computationally intensive risk measure) under a minimum ex-\npected return constraint. The proposed algorithms utilize a new\nacquisition function, which drives sampling towards the optimal re-\ngion. Additionally, a new two-stage procedure is developed, which\nsignificantly reduces the number of evaluations of the expensive-to-\nevaluate objective function. The proposed algorithm\u2019s competitive\nperformance is demonstrated through practical examples.\nKEYWORDS\nOptimal portfolio allocation, Bayesian optimization\nACM Reference Format:\nRobert Millar and Jinglai Li. 2025. Bayesian Optimization for CVaR-based\nportfolio optimization. In Proceedings of Make sure to enter the correct con-\nference title from your rights confirmation email (Conference acronym \u2019XX).\nACM, New York, NY, USA, 11 pages. https://doi.org/XXXXXXX.XXXXXXX"}, {"group": "Philosophy of Science", "id": 10, "label": "Benign landscapes for synchronization on spheres via normalized Laplacian matrices", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2015\u003cbr\u003eAbstract: We study the nonconvex optimization landscapes of synchronization problems on spheres.\nFirst, we present new results for the statistical problem of synchronization over the two-element\ngroup Z2. We consider the nonconvex least-squares problem with Z2 = {\u00b11} relaxed to the\nunit sphere in Rr for r \u22652; for several popular models, including graph clustering under\nthe binary stochastic block model, we show that, for any r \u22652, every second-order critical\npoint recovers the ground truth in the asymptotic regimes where exact recovery is information-\ntheoretically possible. Such statistical optimality via spherical relaxations had previously only\nbeen shown for (potentially arbitrarily) larger relaxation dimension r. Second, we consider the\nglobal synchronization of networks of coupled oscillators under the (homogeneous) Kuramoto\nmodel.\nWe prove new and optimal asymptotic results for random signed networks on an\nErd\u02ddos\u2013R\u00b4enyi graph, and we give new and simple proofs for several existing state-of-the-art\nresults.\nOur key tool is a deterministic landscape condition that extends a recent result\nof Rakoto Endor and Waldspurger.\nThis result says that, if a certain problem-dependent\nLaplacian matrix has small enough condition number, the nonconvex landscape is benign. Our\nextension allows the condition number to include an arbitrary diagonal preconditioner, which\ngives tighter results for many problems. We show that, for the synchronization of Kuramoto\noscillator networks on nearest-neighbor circulant graphs as studied by Wiley, Strogatz, and\nGirvan, this condition is optimal. We also prove a natural complex extension that may be of\ninterest for synchronization on the special orthogonal group SO(2)."}, {"group": "Evolutionary Biology", "id": 11, "label": "Bounds for survival probabilities in supercritical Galton-Watson processes and", "shape": "dot", "size": 10, "title": "Authors: Reinhard B\u00fcrger, Haldane\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Population genetic processes, such as the adaptation of a quantitative trait to\ndirectional selection, may occur on longer time scales than the sweep of a single\nadvantageous mutation. To study such processes in \ufb01nite populations, approximations\nfor the time course of the distribution of a bene\ufb01cial mutation were derived previously\nby branching process methods. The application to the evolution of a quantitative\ntrait requires bounds for the probability of survival S(n) up to generation n of a\nsingle bene\ufb01cial mutation. Here, we present a method to obtain a simple, analytically\nexplicit, either upper or lower, bound for S(n) in a supercritical Galton-Watson process.\nWe prove the existence of an upper bound for o\ufb00spring distributions including Poisson\nand binomial. They are constructed by bounding the given generating function, \u03d5,\nby a fractional linear one that has the same survival probability S\u221eand yields the\nsame rate of convergence of S(n) to S\u221eas \u03d5. For distributions with at most three\no\ufb00spring, we characterize when this method yields an upper bound, a lower bound,\nor only an approximation.\nBecause for many distributions it is di\ufb03cult to get a\nhandle on S\u221e, we derive an approximation by series expansion in s, where s is the\nselective advantage of the mutant. We brie\ufb02y review well-known asymptotic results\nthat generalize Haldane\u2019s approximation 2s for S\u221e, as well as less well-known results\non sharp bounds for S\u221e.\nWe apply them to explore when bounds for S(n) exist\nfor a family of generalized Poisson distributions. Numerical results demonstrate the\naccuracy of our and of previously derived bounds for S\u221eand S(n). Finally, we treat\nan application of these results to determine the response of a quantitative trait to\nprolonged directional selection."}, {"group": "Logic", "id": 12, "label": "CLAIMCHECK: How Grounded are LLM Critiques of Scientific Papers? Jiefu Ou\u2217, William Walden\u2217,", "shape": "dot", "size": 10, "title": "Authors: Jiefu Ou\u2217, William Walden\u2217, Kate Sanders, Zhengping Jiang, Kaiser Sun, Jeffrey Cheng, William Jurayj, Miriam Wanner, Shaobo Liang, Candice Morgan, Seunghoon Han, Weiqi Wang, Chandler May, Hannah Recknor, Daniel Khashabi, Benjamin Van Durme\u003cbr\u003eYear: 2017\u003cbr\u003eAbstract: A core part of scientific peer review involves\nproviding expert critiques that directly assess\nthe scientific claims a paper makes. While\nit is now possible to automatically generate\nplausible (if generic) reviews, ensuring that\nthese reviews are sound and grounded in the pa-\npers\u2019 claims remains challenging. To facilitate\nLLM benchmarking on these challenges, we\nintroduce CLAIMCHECK, an annotated dataset\nof NeurIPS 2023 and 2024 submissions and\nreviews mined from OpenReview.\nCLAIM-\nCHECK is richly annotated by ML experts for\nweakness statements in the reviews and the pa-\nper claims that they dispute, as well as fine-\ngrained labels of the validity, objectivity, and\ntype of the identified weaknesses. We bench-\nmark several LLMs on three claim-centric tasks\nsupported by CLAIMCHECK, requiring mod-\nels to (1) associate weaknesses with the claims\nthey dispute, (2) predict fine-grained labels for\nweaknesses and rewrite the weaknesses to en-\nhance their specificity, and (3) verify a paper\u2019s\nclaims with grounded reasoning. Our exper-\niments reveal that cutting-edge LLMs, while\ncapable of predicting weakness labels in (2),\ncontinue to underperform relative to human ex-\nperts on all other tasks.1"}, {"group": "Philosophy of Science", "id": 13, "label": "Cluster Synthetic Control", "shape": "dot", "size": 10, "title": "Authors: Saeyoung Rho, Andrew Tang, Noah Bergam, Rachel Cummings, Vishal MisraColumbia\u003cbr\u003eYear: 2017\u003cbr\u003eAbstract: In causal inference with observational studies, synthetic control (SC) has emerged as a prominent tool.\nSC has traditionally been applied to aggregate-level datasets, but more recent work has extended its\nuse to individual-level data. As they contain a greater number of observed units, this shift introduces\nthe curse of dimensionality to SC. To address this, we propose Cluster Synthetic Control (ClusterSC),\nbased on the idea that groups of individuals may exist where behavior aligns internally but diverges\nbetween groups. ClusterSC incorporates a clustering step to select only the relevant donors for the\ntarget. We provide theoretical guarantees on the improvements induced by ClusterSC, supported by\nempirical demonstrations on synthetic and real-world datasets. The results indicate that ClusterSC\nconsistently outperforms classical SC approaches."}, {"group": "Logic", "id": 14, "label": "CMADiff: Cross-Modal Aligned Diffusion for Controllable Protein Generation", "shape": "dot", "size": 10, "title": "Authors: Changjian Zhou, \u2020, Yuexi Qiu, \u2020, Tongtong Ling, \u2020, Jiafeng Li, Shuanghe Liu, Xiangjing Wang, Jia Song, Wensheng Xiang\u003cbr\u003eYear: 2016\u003cbr\u003eAbstract: \u2014AI-assisted protein design has emerged as a critical\ntool for advancing biotechnology, as deep generative models have\ndemonstrated their reliability in this domain. However, most\nexisting models primarily utilize protein sequence or structural\ndata for training, neglecting the physicochemical properties of\nproteins. Moreover, they are deficient to control the generation\nof proteins in intuitive conditions. To address these limitations,\nwe propose CMADiff here, a novel framework that enables\ncontrollable protein generation by aligning the physicochemical\nproperties of protein sequences with text-based descriptions\nthrough a latent diffusion process. Specifically, CMADiff em-\nploys a Conditional Variational Autoencoder (CVAE) to inte-\ngrate physicochemical features as conditional input, forming\na robust latent space that captures biological traits. In this\nlatent space, we apply a conditional diffusion process, which\nis guided by BioAligner, a contrastive learning-based module\nthat aligns text descriptions with protein features, enabling text-\ndriven control over protein sequence generation. Validated by\na series of evaluations including AlphaFold3, the experimental\nresults indicate that CMADiff outperforms protein sequence\ngeneration benchmarks and holds strong potential for future\napplications. The implementation and code are available at https:\n//github.com/HPC-NEAU/PhysChemDiff\nIndex Terms\u2014cross-modal, diffusion model, conditional vari-\national autoencoder, physicochemical property, Protein design,\nprotein generation,\nI."}, {"group": "Philosophy of Science", "id": 15, "label": "Confidence set for mixture order A fundamental challenge in the application of finite mixture models is selecting", "shape": "dot", "size": 10, "title": "Authors: Alessandro Casa, Davide Ferrari\u003cbr\u003eYear: 2017\u003cbr\u003eAbstract: A fundamental challenge in the application of finite mixture models is selecting\nthe number of mixture components, also known as order. Traditional approaches\nrely on selecting a single best model using information criteria. However, in the\npresence of noisy data, and when models with different orders yield similar fits,\nmodel selection uncertainty can be substantial, making it challenging to confidently\nidentify the true number of components. In this paper, we introduce the Model\nSelection Confidence Set (MSCS) for order selection \u2013 a set-valued estimator that,\nwith a predefined confidence level, includes the true mixture order across repeated\nsamples. Rather than selecting a single model, our MSCS identifies all plausible\norders by determining whether each candidate model is at least as plausible as\nthe best-selected one, using a screening test based on a penalized likelihood ratio\nstatistic.\nWe provide theoretical guarantees for the asymptotic coverage of our\nconfidence set and demonstrate its practical advantages through simulations and\nreal data analysis.\nKeywords: Finite mixture models, order selection, penalized likelihood ratio test, model\nselection confidence sets, model selection uncertainty.\n1\narXiv:2503.18790v1  [stat.ME]  24 Mar 2025"}, {"group": "Philosophy of Science", "id": 16, "label": "CONSISTENT MULTIGROUP LOW-RANK APPROXIMATION", "shape": "dot", "size": 10, "title": "Authors: Antonis Matakos, Martino Ciaperoni, Heikki Mannila\u003cbr\u003eYear: 2018\u003cbr\u003eAbstract: We consider the problem of consistent low-rank approximation for multigroup data: we ask for\na sequence of k basis vectors such that projecting the data onto their spanned subspace treats all\ngroups as equally as possible, by minimizing the maximum error among the groups. Additionally,\nwe require that the sequence of basis vectors satisfies the natural consistency property: when looking\nfor the best k vectors, the first d \u003c k vectors are the best possible solution to the problem of finding\nd basis vectors. Thus, this multigroup low-rank approximation method naturally generalizes SVD\nand reduces to SVD for data with a single group. We give an iterative algorithm for this task that\nsequentially adds to the basis the vector that gives the best rank\u22121 projection according to the\nmin-max criterion, and then projects the data onto the orthogonal complement of that vector. For\nfinding the best rank\u22121 projection, we use primal-dual approaches or semidefinite programming. We\nanalyze the theoretical properties of the algorithms and demonstrate empirically that the proposed\nmethods compare favorably to existing methods for multigroup (or fair) PCA."}, {"group": "Philosophy of Science", "id": 17, "label": "Data-driven Seasonal Climate Predictions via Variational Inference Llu\u00b4\u0131s Palma,a,b Alejandro Peraza,a David Civantos,c Amanda Duarte,a Stefano Materia, a", "shape": "dot", "size": 10, "title": "Authors: Alejandro Peraza, David Civantos, Amanda Duarte, Materia, Angel G. Mu\u02dcnoz, Laia Romero, Albert Soreta, Markus G. Donata, Llu\u00b4\u0131s Palma\u003cbr\u003eYear: 2015\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Logic", "id": 18, "label": "DEMENTIA-PLAN: AN AGENT-BASED FRAMEWORK FOR MULTI-KNOWLEDGE GRAPH RETRIEVAL-AUGMENTED", "shape": "dot", "size": 10, "title": "Authors: Chenhan Lyu, Pengfei Zhang, Sabine Brunswicker, Nikil Dutt, Amir Rahmani\u003cbr\u003eYear: 2014\u003cbr\u003eAbstract: Mild-stage dementia patients primarily experience two critical symptoms: severe memory loss and\nemotional instability. To address these challenges, we propose DEMENTIA-PLAN, an innovative\nretrieval-augmented generation framework that leverages large language models to enhance conver-\nsational support. Our model employs a multiple knowledge graph architecture, integrating various\ndimensional knowledge representations including daily routine graphs and life memory graphs.\nThrough this multi-graph architecture, DEMENTIA-PLAN comprehensively addresses both imme-\ndiate care needs and facilitates deeper emotional resonance through personal memories, helping\nstabilize patient mood while providing reliable memory support. Our notable innovation is the\nself-reflection planning agent, which systematically coordinates knowledge retrieval and semantic\nintegration across multiple knowledge graphs, while scoring retrieved content from daily routine and\nlife memory graphs to dynamically adjust their retrieval weights for optimized response generation.\nDEMENTIA-PLAN represents a significant advancement in the clinical application of large language\nmodels for dementia care, bridging the gap between AI tools and caregivers interventions."}, {"group": "Remote Sensing", "id": 19, "label": "Dual-Task Learning for Dead Tree Detection and Segmentation with Hybrid Self-Attention U-Nets in Aerial Imagery", "shape": "dot", "size": 10, "title": "Authors: Anis Ur Rahman\u003cbr\u003eYear: 2016\u003cbr\u003eAbstract: Mapping standing dead trees is critical for assessing for-\nest health, monitoring biodiversity, and mitigating wildfire\nrisks, for which aerial imagery has proven useful. How-\never, dense canopy structures, spectral overlaps between\nliving and dead vegetation, and over-segmentation errors\nlimit the reliability of existing methods. This study intro-\nduces a hybrid postprocessing framework that refines deep\nlearning-based tree segmentation by integrating watershed\nalgorithms with adaptive filtering, enhancing boundary de-\nlineation, and reducing false positives in complex forest en-\nvironments. Tested on high-resolution aerial imagery from\nboreal forests, the framework improved instance-level seg-\nmentation accuracy by"}, {"group": "Fluid Dynamics", "id": 20, "label": "Effect of convective transport in edge/SOL plasmas of ADITYA-U tokamak", "shape": "dot", "size": 10, "title": "Authors: Joydeep Ghosh, Tanmay M. Macwan, Kaushlender Singh, M. B. Chowdhuri, H. Raj, R. L. Tanna, Deepti Sharma, T. D. Rognlien\u003cbr\u003eYear: 2010\u003cbr\u003eAbstract: The 2-D edge plasma fluid transport code, UEDGE has been used to simulate the edge region of\ncircular limiter plasmas of ADITYA-U for modelling the measured electron density profile. The\nlimiter geometry of ADITYA-U has been introduced in the UEDGE code, which is primarily\ndeveloped and used for divertor configuration. The computational mesh defining the limiter geometry\nis generated by a routine developed in-house, and has successfully been integrated with the UEDGE\ncode to simulate the edge plasma parameters of ADITYA-U. The radial profiles of edge and scrape-\noff layer (SOL) electron density, ne and temperature are obtained from the simulations and used to\nmodel the measured ne profile using Langmuir probe array. It has been found that a convective\nvelocity, vconv. is definitely needed in addition to the constant perpendicular diffusion coefficient, D\uf05e\nthroughout the edge and SOL regions to model the edge ne profile. The obtained vconv. is inward and\nradially constant with a value of"}, {"group": "Philosophy of Science", "id": 21, "label": "ELEMENTWISE LAYER NORMALIZATION A recent paper proposed Dynamic Tanh (DyT) as a drop-in replacement for Layer Normalization.", "shape": "dot", "size": 10, "title": "Authors: Felix Stollenwerk\u003cbr\u003eYear: 2018\u003cbr\u003eAbstract: A recent paper proposed Dynamic Tanh (DyT) as a drop-in replacement for Layer Normalization.\nAlthough the method is empirically well-motivated and appealing from a practical point of view,\nit lacks a theoretical foundation. In this work, we derive DyT mathematically and show that a\nwell-defined approximation is needed to do so. By dropping said approximation, an alternative\nelement-wise transformation is obtained, which we call Elementwise Layer Normalization (ELN).\nWe demonstrate that ELN resembles Layer Normalization more accurately than DyT does."}, {"group": "Logic", "id": 22, "label": "Embodied-Reasoner: Synergizing Visual Search, Reasoning, and Action for Embodied Interactive Tasks", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2014\u003cbr\u003eAbstract: Recent advances in deep thinking models have demon-\nstrated remarkable reasoning capabilities on mathematical\nand coding tasks. However, their effectiveness in embod-\nied domains which require continuous interaction with en-\nvironments through image action interleaved trajectories\nremains largely -unexplored. We present Embodied Rea-\nsoner, a model that extends o1 style reasoning to interac-\ntive embodied search tasks. Unlike mathematical reason-\ning that relies primarily on logical deduction, embodied\nscenarios demand spatial understanding, temporal reason-\ning, and ongoing self-reflection based on interaction his-\ntory. To address these challenges, we synthesize 9.3k co-\nherent Observation-Thought-Action trajectories containing\n64k interactive images and 90k diverse thinking processes\n(analysis, spatial reasoning, reflection, planning, and verifi-\ncation). We develop a three stage training pipeline that pro-\ngressively enhances the model\u2019s capabilities through imita-\ntion learning, self exploration via rejection sampling, and\nself-correction through reflection tuning.\nThe evaluation\nshows that our model significantly outperforms those ad-\nvanced visual reasoning models, e.g., it exceeds OpenAI o1,\no3-mini, and Claude-3.7 by +9%, 24%, and +13%. Analy-\nsis reveals our model exhibits fewer repeated searches and\nlogical inconsistencies, with particular advantages in com-\nplex long horizon tasks. Real-world environments also show\nour superiority while exhibiting fewer repeated searches\nand logical inconsistency cases.\n*The first two authors have equal contributions.\n\u2020Corresponding author.\nObs1\nThought1\nAction1\nTask\nQ: Could you find \nthe keychain and \nthen put it beside \nthe desk lamp?\n\u003cSelf-Reflection\u003e The above places were \nnot found. I need to reflect on my search \nplan. I may overlooked some potential \nlocations. Perhaps it is in the drawer \u2026\n\u003cVerification\u003e\u2026\u003cTask Planning\u003e Where \nis the drawer? I need ..\n\u003cAction\u003e Observe \nEmbodied-Reasoner\n\u003cAction\u003e\nNavigate to sidetable\nNavigate to desk\n\u2026.\nObsn\nThoughtn\nActionn\n\u2026.\n\u003cSituation Analysis\u003e Let me \nobserve the room and analyze \u2026\n\u003cSpatial Reasoning\u003e According to \nthe objects and layout of the room ... \n\u003cTask Planning\u003e I will search for \nthe keychain, which may be on the \nbedside table, desk, or left on the sofa. \nThen, I need to find the desk lamp\u2026\n\u2022\nInteractive Scenario\n\u2022\nLong-horizon Search Task\n\u2022\nImage-text Interleaved Trajectory\n\u2022\nSpontaneous Reasoning with \nCoherent and Diverse Thoughts\n#0 Init\n#1 Navigate to sidetable\n#2 Navigate to desk\n#0 Init\n#1 Nav to Countertop\n#4 Nav to Countertop\n#6 Nav to Cabinet\n#7 Open Cabinet\n#10 Put in microwave\n\u2026.\nReal-world Experiment:  Can you help me find the coffee and heat it up?\n#8 Pickup\u2026\nTried searching multiple areas but didn\u0027t find coffee.\nAfter reflection, realize that it may be hidden in cabinet\n\u2026.\n\u2026.\n#1\n#2\n#3\n#4\nFigure 1.\nWe design an embodied interactive task: searching\nfor objects in an unknown room. Then we propose Embodied-\nReasoner, which presents spontaneous reasoning and interac-\ntion ability.\nBefore each action, it generates diverse thoughts,\ne.g., self-reflection or spatial reasoning, forming an image-text in-\nterleaved trajectory. It shows consistent reasoning and efficient\nsearch behaviors, whereas OpenAI o3-mini often exhibits repeti-\ntive searches and logical inconsistencies with higher failure rates.\n1."}, {"group": "Philosophy of Science", "id": 23, "label": "Equilibrium with non-convex preferences: some", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: We study the existence of equilibrium when agents\u2019 preferences may not be\nconvex. For some specific utility functions, we provide a necessary and sufficient\ncondition under which there exists an equilibrium. The standard approach can-\nnot be directly applied to our examples because the demand correspondence of\nsome agents is neither single-valued nor convex-valued.\nJEL Classifications: D11, D51\nKeywords: Non-convex preferences, general equilibrium.\n\u2217The authors do not have any conflict of interest to declare.\n\u2020The authors would like to thank two Referees for their helpful comments and suggestions. Their\npoints have helped us to substantially improve our previous version.\n\u2021Paris School of Economics, TIMAS, CASED. Email: levan@univ-paris1.fr. Address: CES-Centre\nd\u2019Economie de la Sorbonne, 106-112 boulevard de l\u2019H\u02c6opital, 75647 Paris Cedex 13, France.\n\u00a7EM Normandie Business School, M\u00b4etis Lab. Email: npham@em-normandie.fr. Address: EM\nNormandie, 9 Rue Claude Bloch, 14000 Caen, France.\n1\narXiv:2503.16890v1  [q-fin.CP]  21 Mar 2025"}, {"group": "Fluid Dynamics", "id": 24, "label": "Experimental and Numerical Study of Acoustic Streaming in Mid-Air Phased Arrays Experimental and Numerical Study of Acoustic Streaming in Mid-Air", "shape": "dot", "size": 10, "title": "Authors: Christopher Stone, Yusuke Koroyasu, Yoichi Ochiai, Akiko Kaneko, Bruce W. Drinkwater, TatsukiFushimi, Hasegawa, Langevin, Marzo\u003cbr\u003eYear: 2022\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Philosophy of Science", "id": 25, "label": "An Example Article", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2022\u003cbr\u003eAbstract: .\nWe explore extensions and applications of the regret minimization framework in-\ntroduced by [1] for solving optimal experimental design problems. Specifically, we incorporate the\nentropy regularizer into this framework, leading to a novel sample selection objective and a provable\nsample complexity bound that guarantees a (1 + \u03f5)-near optimal solution. We further extend the\nmethod to handle regularized optimal design settings. As an application, we use our algorithm to\nselect a small set of representative samples from image classification datasets without relying on label\ninformation. To evaluate the quality of the selected samples, we train a logistic regression model and\ncompare performance against several baseline sampling strategies. Experimental results on MNIST,\nCIFAR-10, and a 50-class subset of ImageNet show that our approach consistently outperforms\ncompeting methods in most cases.\nKey words. optimal design, online optimization, logistic regression\nMSC codes. 62J12, 62L05, 68W27, 68W40, 68T05\n1."}, {"group": "Philosophy of Science", "id": 26, "label": "Extracting Coupling-Mode Spectral Densities with Two-Dimensional Electronic", "shape": "dot", "size": 10, "title": "Authors: Jonathan Keeling, Brendon W. Lovett, Alex W. Chin\u003cbr\u003eYear: 2018\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Agricultural Science", "id": 27, "label": "Fungicides vs mycoinsecticides in the management of corn leafhopper: physicochemical, in vitro and in vivo compatibilities, and degradation kinetics in", "shape": "dot", "size": 10, "title": "Authors: Matheus Rakes, Ma\u00edra Chagas Morais, Maria Eduarda Sperotto, Odimar Zanuzo Zanardi, GabrielRodrigues Palma, Luana Floriano, Renato Zanella, Osmar Damian Prestes, Daniel Bernardi, Anderson Dionei Gr\u00fctzmacher, Leandro do Prado Ribeiro\u003cbr\u003eYear: 2019\u003cbr\u003eAbstract: The present study investigates the compatibility of mycoinsecticides based on isolates IBCB66 and Simbi \nBB15 of Beauveria bassiana and Esalq-1296 of Cordyceps javanica, which are registered for the \nmanagement of Dalbulus maidis in Brazil, with synthetic fungicides. Irrespective of the fungicide, a total \ninhibition in the number of colony-forming units (CFUs), vegetative growth, conidiogenesis, and conidial \nviability of the three tested isolates was observed, with their incompatibility being indicated in the in vitro \nbioassays. However, the use of formulated mycoinsecticides mitigated the impact of these xenobiotics on \nthe number of CFUs, with the commercial mycoinsecticide FlyControl\u00ae (B. bassiana isolate Simbi BB15) \nbeing the least sensitive to the fungicides propiconazole + difenoconazole, bixafem + prothioconazole + \ntrifloxystrobin and trifloxystrobin + tebuconazole. Nevertheless, an increase in exposure time (from"}, {"group": "Logic", "id": 28, "label": "GateLens: A Reasoning-Enhanced LLM Agent for Automotive Software Release Analytics", "shape": "dot", "size": 10, "title": "Authors: Arsham Gholamzadeh, Shuai Wang, Yinan Yu, Robert Feldt\u003cbr\u003eYear: 2010\u003cbr\u003eAbstract: Ensuring the reliability and effectiveness of software release de-\ncisions is critical, particularly in safety-critical domains like auto-\nmotive systems. Precise analysis of release validation data, often\npresented in tabular form, plays a pivotal role in this process. How-\never, traditional methods that rely on manual analysis of extensive\ntest datasets and validation metrics are prone to delays and high\ncosts. Large Language Models (LLMs) offer a promising alternative\nbut face challenges in analytical reasoning, contextual understand-\ning, handling out-of-scope queries, and processing structured test\ndata consistently; limitations that hinder their direct application in\nsafety-critical scenarios.\nThis paper introduces GateLens, an LLM-based tool for analyzing\ntabular data in the automotive domain. GateLens translates natural\nlanguage queries into Relational Algebra (RA) expressions and\nthen generates optimized Python code. It outperforms the baseline\nsystem on benchmarking datasets, achieving higher F1 scores and\nhandling complex and ambiguous queries with greater robustness.\nAblation studies confirm the critical role of the RA module, with\nperformance dropping sharply when omitted.\nIndustrial evaluations reveal that GateLens reduces analysis time\nby over 80% while maintaining high accuracy and reliability. As\ndemonstrated by presented results, GateLens achieved high perfor-\nmance without relying on few-shot examples, showcasing strong\ngeneralization across various query types from diverse company\nroles. Insights from deploying GateLens with a partner automotive\ncompany offer practical guidance for integrating AI into critical\nworkflows such as release validation. Results show that by automat-\ning test result analysis, GateLens enables faster, more informed,\nand dependable release decisions, and can thus advance software\nscalability and reliability in automotive systems.\nKeywords\nLarge Language Models, Tabular Question Answering, Software\nRelease Analytics, Automotive Software Testing, Test Result Inter-\npretation, Interpretable Reasoning"}, {"group": "Structural Biology", "id": 29, "label": "GyralNet Subnetwork Partitioning via Differentiable Spectral Modularity Optimization", "shape": "dot", "size": 10, "title": "Authors: Yan Zhuang, Minheng Chen, Chao Cao, Tong Chen, Jing Zhang, Xiaowei, Yu, Yanjun Lyu, Lu Zhang, Tianming Liu, Dajiang Zhu\u003cbr\u003eYear: 2014\u003cbr\u003eAbstract: . Understanding the structural and functional organization of\nthe human brain requires a detailed examination of cortical folding pat-\nterns, among which the three-hinge gyrus (3HG) has been identified as\na key structural landmark. GyralNet, a network representation of corti-\ncal folding, models 3HGs as nodes and gyral crests as edges, highlight-\ning their role as critical hubs in cortico-cortical connectivity. However,\nexisting methods for analyzing 3HGs face significant challenges, includ-\ning the sub-voxel scale of 3HGs at typical neuroimaging resolutions, the\ncomputational complexity of establishing cross-subject correspondences,\nand the oversimplification of treating 3HGs as independent nodes with-\nout considering their community-level relationships. To address these\nlimitations, we propose a fully differentiable subnetwork partitioning\nframework that employs a spectral modularity maximization optimiza-\ntion strategy to modularize the organization of 3HGs within GyralNet.\nBy incorporating topological structural similarity and DTI-derived con-\nnectivity patterns as attribute features, our approach provides a bio-\nlogically meaningful representation of cortical organization. Extensive\nexperiments on the Human Connectome Project (HCP) dataset demon-\nstrate that our method effectively partitions GyralNet at the individual\nlevel while preserving the community-level consistency of 3HGs across\nsubjects, offering a robust foundation for understanding brain connec-\ntivity.\nKeywords: Subnetwork partitioning \u00b7 3HG \u00b7 Differentiable optimiza-\ntion \u00b7 Cortical folding pattern."}, {"group": "Philosophy of Science", "id": 30, "label": "Integrated Utilization of Equations and Small Dataset in the Koopman Operator: Applications to Forward and Inverse Problems", "shape": "dot", "size": 10, "title": "Authors: Ichiro Ohta, Shota Koyanagi, Kayo Kinjo, Jun Ohkubo\u003cbr\u003eYear: 2010\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Philosophy of Science", "id": 31, "label": "Chi2LSTMDraft_2", "shape": "dot", "size": 10, "title": "Authors: Erfan Abedi, Minyang Wang, Hao Zhang, Abhimanyu Borthakur, Justin Baker, Sergio Carbajo\u003cbr\u003eYear: 2020\u003cbr\u003eAbstract: Modeling second-order (\u03c7(2)) nonlinear optical processes remains computationally expensive due \nto the need to resolve fast field oscillations and simulate wave propagation using methods like the \nsplit-step Fourier method (SSFM). This can become a bottleneck in real-time applications, such as \nhigh-repetition-rate laser systems requiring rapid feedback and control. We present an \nLSTM-based surrogate model trained on SSFM simulations generated from a start-to-end model of \nthe photocathode drive laser at SLAC National Accelerator Laboratory\u2019s Linac Coherent Light \nSource II. The model achieves over 250\u00d7 speedup while maintaining high fidelity, enabling future \nreal-time optimization and laying the foundation for data-integrated modeling frameworks. \n \nI."}, {"group": "Philosophy of Science", "id": 32, "label": "Neural Learning Rules from Associative Networks Theory", "shape": "dot", "size": 10, "title": "Authors: Lotito\u003cbr\u003eYear: 2019\u003cbr\u003eAbstract: Associative networks theory is increasingly providing tools to interpret update\nrules of artificial neural networks. At the same time, deriving neural learning rules\nfrom a solid theory remains a fundamental challenge.\nWe make some steps in this direction by considering general energy-based asso-\nciative networks of continuous neurons and synapses that evolve in multiple time\nscales. We use the separation of these timescales to recover a limit in which the\nactivation of the neurons, the energy of the system and the neural dynamics can\nall be recovered from a generating function. By allowing the generating function\nto depend on memories, we recover the conventional Hebbian modeling choice\nfor the interaction strength between neurons. Finally, we propose and discuss a\ndynamics of memories that enables us to include learning in this framework."}, {"group": "Philosophy of Science", "id": 33, "label": "Nonlinear Multiple Response Regression and Learning of Latent Spaces Identifying low-dimensional latent structures within high-dimensional data has long", "shape": "dot", "size": 10, "title": "Authors: Sanyou Wu\u003cbr\u003eYear: 2012\u003cbr\u003eAbstract: .\nIdentifying low-dimensional latent structures within high-dimensional data has long\nbeen a central topic in the machine learning community, driven by the need for data compression,\nstorage, transmission, and deeper data understanding.\nTraditional methods, such as principal\ncomponent analysis (PCA) and autoencoders (AE), operate in an unsupervised manner, ignoring\nlabel information even when it is available. In this work, we introduce a unified method capable of\nlearning latent spaces in both unsupervised and supervised settings. We formulate the problem\nas a nonlinear multiple-response regression within an index model context.\nBy applying the\ngeneralized Stein\u2019s lemma, the latent space can be estimated without knowing the nonlinear link\nfunctions.\nOur method can be viewed as a nonlinear generalization of PCA. Moreover, unlike\nAE and other neural network methods that operate as \u201cblack boxes\u201d, our approach not only offers\nbetter interpretability but also reduces computational complexity while providing strong theoretical\nguarantees. Comprehensive numerical experiments and real data analyses demonstrate the superior\nperformance of our method.\nKey words and phrases.\nPCA, autoencoder, index model, latent space, Stein\u2019s Lemma, SVD.\n1School of Computing and Data Science, The University of Hong Kong, Pokfulam Road, HKSAR, China\nE-mail: ty0518@hku.hk\n.\n2School of Computing and Data Science, The University of Hong Kong, Pokfulam Road, HKSAR, China\nE-mail: sanyouwsy@gmail.com\n.\n3School of Computing and Data Science, The University of Hong Kong, Pokfulam Road, HKSAR, China\nE-mail: lfeng@hku.hk\n.\narXiv:2503.21608v1  [stat.ML]  27 Mar 2025"}, {"group": "Logic", "id": 34, "label": "OmniVox: Zero-Shot Emotion Recognition with Omni-LLMs", "shape": "dot", "size": 10, "title": "Authors: John Murzaku, Owen Rambow\u003cbr\u003eYear: 2022\u003cbr\u003eAbstract: The use of omni-LLMs (large language models that accept any modality as\ninput), particularly for multimodal cognitive state tasks involving speech,\nis understudied. We present OmniVox, the first systematic evaluation of\nfour omni-LLMs on the zero-shot emotion recognition task. We evaluate\non two widely used multimodal emotion benchmarks: IEMOCAP and\nMELD, and find zero-shot omni-LLMs outperform or are competitive with\nfine-tuned audio models. Alongside our audio-only evaluation, we also\nevaluate omni-LLMs on text only and text and audio. We present acoustic\nprompting, an audio-specific prompting strategy for omni-LLMs which\nfocuses on acoustic feature analysis, conversation context analysis, and\nstep-by-step reasoning. We compare our acoustic prompting to minimal\nprompting and full chain-of-thought prompting techniques. We perform\na context window analysis on IEMOCAP and MELD, and find that using\ncontext helps, especially on IEMOCAP. We conclude with an error analysis\non the generated acoustic reasoning outputs from the omni-LLMs."}, {"group": "Logic", "id": 35, "label": "Progressive Rendering Distillation: Adapting Stable Diffusion for", "shape": "dot", "size": 10, "title": "Authors: Xinyue Liang\u003cbr\u003eYear: 2016\u003cbr\u003eAbstract: It is highly desirable to obtain a model that can gener-\nate high-quality 3D meshes from text prompts in just sec-\nonds. While recent attempts have adapted pre-trained text-\nto-image diffusion models, such as Stable Diffusion (SD),\ninto generators of 3D representations (e.g., Triplane), they\noften suffer from poor quality due to the lack of sufficient\nhigh-quality 3D training data. Aiming at overcoming the\ndata shortage, we propose a novel training scheme, termed\nas Progressive Rendering Distillation (PRD), eliminating\nthe need for 3D ground-truths by distilling multi-view dif-\nfusion models and adapting SD into a native 3D gener-\nator.\nIn each iteration of training, PRD uses the U-Net\nto progressively denoise the latent from random noise for\na few steps, and in each step it decodes the denoised la-\ntent into 3D output. Multi-view diffusion models, includ-\ning MVDream and RichDreamer, are used in joint with SD\n*Corresponding authors.\nto distill text-consistent textures and geometries into the\n3D outputs through score distillation. Since PRD supports\ntraining without 3D ground-truths, we can easily scale up\nthe training data and improve generation quality for chal-\nlenging text prompts with creative concepts. Meanwhile,\nPRD can accelerate the inference speed of the generation\nmodel in just a few steps.\nWith PRD, we train a Tri-\nplane generator, namely TriplaneTurbo, which adds only\n2.5% trainable parameters to adapt SD for Triplane gener-\nation. TriplaneTurbo outperforms previous text-to-3D gen-\nerators in both efficiency and quality. Specifically, it can\nproduce high-quality 3D meshes in"}, {"group": "Philosophy of Science", "id": 36, "label": "Quantifying Changes to Healthcare Utilization After a Reduction in Cost-sharing Among Deductible Plan Enrollees", "shape": "dot", "size": 10, "title": "Authors: Kris Wain, Debra P. Ritzwoller, Marcelo Coca Perraillon, Kris Wain\u003cbr\u003eYear: 2012\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Philosophy of Science", "id": 37, "label": "Reaction Dynamics of the H + HeH+ \u2192He + Meenu Upadhyay,\u2020 Silvan K\u00a8aser,\u2020,\u00b6 Jayakrushna Sahoo,\u2021 Yohann Scribano,\u2021 and", "shape": "dot", "size": 10, "title": "Authors: Meenu Upadhyay, \u2020, Silvan K\u00a8aser, \u2020, \u00b6, Jayakrushna Sahoo, \u2021, Yohann Scribano, \u2021, Markus Meuwly\u2217, \u2020\u003cbr\u003eYear: 2012\u003cbr\u003eAbstract: The reaction dynamics for the H + HeH+ \u2192He + H+\n2 reaction in its electronic\nground state is investigated using two different representations of the potential energy\nsurface (PES). The first uses a combined kernel and neural network representation\nof UCCSD(T) reference data whereas the second is a corrected PES (cR-PES) that\neliminates an artificial barrier in the entrance channel appearing in its initial expansion\nbased on full configuration interaction reference data. Despite the differences between\nthe two PESs, both yield kv=0,j=0 \u22482 \u00d7 10\u22129 cm3/molecule/s at T = 10 K which is\nconsistent with a T\u2212independent Langevin rate kL = 2.1 \u00d7 10\u22129 cm3/molecule/s but\nconsiderably larger than the only experimentally reported value kICR = (9.1\u00b12.5)\u00d710\u221210\ncm3/molecule/s from ion cyclotron resonance experiments. Similarly, branching ratios\nfor the reaction outcomes are comparable for the two PESs. However, when analysing\nless averaged properties such as initial state-selected T\u2212dependent rate coefficients and\nfinal vibrational states of the H+\n2 product for low temperatures, the differences in the\ntwo PESs manifest themselves in the observables. Thus, depending on the property\nanalyzed, accurate and globally valid representations of the PES are required, whereas\nmore approximate and empirical construction schemes can be followed for state-averaged\nobservables."}, {"group": "Logic", "id": 38, "label": "ReaRAG: Knowledge-guided Reasoning Enhances Factuality of Large Reasoning Models with Iterative Retrieval Augmented Generation", "shape": "dot", "size": 10, "title": "Authors: Zhicheng Lee, Shulin Cao, Jinxin Liu, Jiajie Zhang, Weichuan Liu, Xiaoyin Che, Lei Hou, Juanzi Li\u003cbr\u003eYear: 2010\u003cbr\u003eAbstract: Large Reasoning Models (LRMs) exhibit re-\nmarkable reasoning abilities but rely primarily\non parametric knowledge, limiting factual accu-\nracy. While recent works equip reinforcement\nlearning (RL)-based LRMs with retrieval capa-\nbilities, they suffer from overthinking and lack\nrobustness in reasoning, reducing their effec-\ntiveness in question answering (QA) tasks. To\naddress this, we propose ReaRAG, a factuality-\nenhanced reasoning model that explores diverse\nqueries without excessive iterations. Our solu-\ntion includes a novel data construction frame-\nwork with an upper bound on the reasoning\nchain length. Specifically, we first leverage an\nLRM to generate deliberate thinking, then se-\nlect an action from a predefined action space\n(Search and Finish). For Search action, a\nquery is executed against the RAG engine,\nwhere the result is returned as observation to\nguide reasoning steps later. This process iter-\nates until a Finish action is chosen. Benefit-\ning from ReaRAG\u2019s strong reasoning capabil-\nities, our approach outperforms existing base-\nlines on multi-hop QA. Further analysis high-\nlights its strong reflective ability to recognize\nerrors and refine its reasoning trajectory. Our\nstudy enhances LRMs\u2019 factuality while effec-\ntively integrating robust reasoning for Retrieval-\nAugmented Generation (RAG)."}, {"group": "Logic", "id": 39, "label": "Rethinking Graph Structure Learning in the Era of LLMs", "shape": "dot", "size": 10, "title": "Authors: Zhihan Zhang, Xunkai Li, Guang Zeng, Hongchao Qin, Ronghua Li, Guoren Wang\u003cbr\u003eYear: 2010\u003cbr\u003eAbstract: Recently, the emergence of large language models\n(LLMs) has prompted researchers to explore the\nintegration of language descriptions into graphs,\naiming to enhance model encoding capabilities\nfrom a data-centric perspective. This graph repre-\nsentation is called text-attributed graphs (TAGs).\nA review of prior advancements highlights that\ngraph structure learning (GSL) is a pivotal tech-\nnique for improving data utility, making it highly\nrelevant to efficient TAG learning. However, most\nGSL methods are tailored for traditional graphs\nwithout textual information, underscoring the ne-\ncessity of developing a new GSL paradigm.\nDespite clear motivations, it remains challenging:\n(1) How can we define a reasonable optimization\nobjective for GSL in the era of LLMs, consid-\nering the massive parameters in LLM? (2) How\ncan we design an efficient model architecture that\nenables seamless integration of LLM for this op-\ntimization objective? For Question 1, we refor-\nmulate existing GSL optimization objectives as\na tree optimization framework, shifting the focus\nfrom obtaining a well-trained edge predictor to\na language-aware tree sampler. For Question 2,\nwe propose decoupled and training-free model de-\nsign principles for LLM integration, shifting the\nfocus from computation-intensive fine-tuning to\nmore efficient inference. Based on this, we pro-\npose Large Language and Tree Assistant (LLaTA),\nwhich leverages tree-based LLM in-context learn-\ning to enhance the understanding of topology and\ntext, enabling reliable inference and generating\nimproved graph structure. Extensive experiments\non 10 TAG datasets demonstrate that LLaTA en-\njoys flexibility - incorporated with any backbone;\nscalability - outperforms other LLM-based GSL\nmethods in terms of running efficiency; effective-\nness - achieves SOTA performance.\n*Equal\ncontribution\n1Beijing\nInstitute\nof\nTechnol-\nogy\n2Ant\nGroup.\nCorrespondence\nto:\nRonghua\nLi\n\u003clironghuabit@126.com\u003e.\n1."}, {"group": "Evolutionary Biology", "id": 40, "label": "arXiv:2503.18259v1  [math.PR]  24 Mar 2025", "shape": "dot", "size": 10, "title": "Authors: Yingli Wang\u003cbr\u003eYear: 2021\u003cbr\u003eAbstract: This paper establishes a novel link between nearly unstable heavy-tailed integer-\nvalued autoregressive (INAR) processes and the rough Heston model via discrete scaling\nlimits. We prove that a sequence of bivariate cumulative INAR(\u221e) processes converge\nin law to the rough Heston model under appropriate scaling conditions, providing a\nrigorous mathematical foundation for understanding how microstructural order \ufb02ow\ndrives rough volatility dynamics. Our theoretical framework extends the scaling limit\ntechniques from Hawkes processes to the INAR(\u221e) setting. Thus we can carry out\nMonte Carlo simulation of the rough Heston model through simulating the correspond-\ning approximating INAR(\u221e) processes. Extensive numerical experiments illustrate the\nimproved accuracy and e\ufb03ciency of the proposed simulation method as compared to\nthe literature, in the pricing of not only European options, but also path-dependent\noptions such as arithmetic Asian options, lookback options and barrier options."}, {"group": "Philosophy of Science", "id": 41, "label": "SIMULATION-INFORMED DEEP LEARNING FOR ENHANCED SWOT OBSERVATIONS OF FINE-SCALE OCEAN DYNAMICS", "shape": "dot", "size": 10, "title": "Authors: C. Granero-Belinchon, J. Wang, R. Fablet\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Oceanic processes at fine scales are crucial yet difficult to observe accurately due to limitations in\nsatellite and in-situ measurements. The Surface Water and Ocean Topography (SWOT) mission\nprovides high-resolution Sea Surface Height (SSH) data, though noise patterns often obscure fine-\nscale structures. Current methods struggle with noisy data or require extensive supervised training,\nlimiting their effectiveness on real-world observations.\nWe introduce SIMPGEN (Simulation-Informed Metric and Prior for Generative Ensemble Networks),\nan unsupervised adversarial learning framework combining real SWOT observations with simulated\nreference data. SIMPGEN leverages wavelet-informed neural metrics to distinguish noisy from clean\nfields, guiding realistic SSH reconstructions. Applied to SWOT data, SIMPGEN effectively removes\nnoise, preserving fine-scale features better than existing neural methods. This robust, unsupervised\napproach not only improves SWOT SSH data interpretation but also demonstrates strong potential for\nbroader oceanographic applications, including data assimilation and super-resolution.\nKeywords Satellite altimetry \u00b7 Deep learning \u00b7 SWOT \u00b7 KaRIn noise \u00b7 Submesoscale ocean dynamics"}, {"group": "Philosophy of Science", "id": 42, "label": "Stable-SCore: A Stable Registration-based Framework \u2020corresponding author", "shape": "dot", "size": 10, "title": "Authors: Xiaohang Zhan\u2217, Zizheng Yan, \u2217, Zhongjin Luo, Yuxin Wen, Xiaoguang Han, \u2020\u003cbr\u003eYear: 2013\u003cbr\u003eAbstract: Establishing character shape correspondence is a critical\nand fundamental task in computer vision and graphics, with\ndiverse applications including re-topology, attribute trans-\nfer, and shape interpolation. Current dominant functional\nmap methods, while effective in controlled scenarios, strug-\ngle in real situations with more complex challenges such\nas non-isometric shape discrepancies. In response, we re-\nvisit registration-for-correspondence methods and tap their\npotential for more stable shape correspondence estima-\ntion. To overcome their common issues including unstable\ndeformations and the necessity for careful pre-alignment\nor high-quality initial 3D correspondences, we introduce\nStable-SCore: A Stable Registration-based Framework for\n3D Shape Correspondence. We first re-purpose a founda-\ntion model for 2D character correspondence that ensures\nreliable and stable 2D mappings. Crucially, we propose\na novel Semantic Flow Guided Registration approach that\nleverages 2D correspondence to guide mesh deformations.\nOur framework significantly surpasses existing methods in\nchallenging scenarios, and brings possibilities for a wide\narray of real applications, as demonstrated in our results.\n1."}, {"group": "Philosophy of Science", "id": 43, "label": "Structural bias in three-dimensional autoregressive generative machine learning of", "shape": "dot", "size": 10, "title": "Authors: Zsuzsanna Koczor-Benda, \u2020, Joe Gilkes, \u2020, \u2021, Francesco Bartucca, \u2020, AbdullaAl-Fekaiki, \u2020, Reinhard J. Maurer\u2217, \u2020, \u00b6\u003cbr\u003eYear: 2021\u003cbr\u003eAbstract: A diverse range of generative machine learn-\ning models for the design of novel molecules\nand materials have been proposed in recent\nyears. Models that are able to generate three-\ndimensional structures are particularly suitable\nfor quantum chemistry workflows, enabling di-\nrect property prediction. The performance of\ngenerative models is typically assessed based\non their ability to produce high rates of novel,\nvalid, and unique molecules. However, equally\nimportant is the ability of generative models\nto learn the prevalence of functional groups\nand certain chemical moieties in the underly-\ning training data, that is, to faithfully repro-\nduce the chemical space spanned by the training\ndata. Here we investigate the ability of the au-\ntoregressive generative machine learning model\nG-SchNet to reproduce the chemical space and\nproperty distributions of training datasets com-\nposed of large, functional organic molecules.\nWe assess the elemental composition, size- and\nbond-length distributions, as well as the func-\ntional group and chemical space distribution of\ntraining and generated molecules.\nBy princi-\npal component analysis of the chemical space,\nwe find that the model leads to a biased gen-\neration that is largely unaffected by the choice\nof hyperparameters or the training dataset dis-\ntribution, producing molecules that are, on\naverage, more unsaturated and contain more\nheteroatoms.\nPurely aliphatic molecules are\nmostly absent in the generation. We further in-\nvestigate generation with functional group con-\nstraints and based on composite datasets, which\ncan help partially remedy the model generation\nbias.\nDecision tree models can recognize the\ngeneration bias in the models and discriminate\nbetween training and generated data, revealing\nkey chemical differences between the two sets.\nThe chemical differences we find affect the dis-\ntributions of electronic properties such as the\nHOMO-LUMO gap, which is a common target\nfor functional molecule design."}, {"group": "Logic", "id": 44, "label": "SWI: Speaking with Intent in Large Language Models SWI: Speaking with Intent in Large Language Models", "shape": "dot", "size": 10, "title": "Authors: EunJeong Hwang\u003cbr\u003eYear: 2014\u003cbr\u003eAbstract: Intent, typically clearly formulated and planned, functions as a cognitive\nframework for reasoning and problem-solving. This paper introduces the\nconcept of Speaking with Intent (SWI) in large language models (LLMs),\nwhere the explicitly generated intent encapsulates the model\u2019s underlying\nintention and provides high-level planning to guide subsequent analysis\nand communication. By emulating deliberate and purposeful thoughts in\nthe human mind, SWI is hypothesized to enhance the reasoning capabilities\nand generation quality of LLMs. Extensive experiments on mathematical\nreasoning benchmarks consistently demonstrate the superiority of Speaking\nwith Intent over Baseline (i.e., generation without explicit intent). Moreover,\nSWI outperforms answer-trigger prompting methods Chain-of-Thought\nand Plan-and-Solve and maintains competitive performance with the strong\nmethod ARR (Analyzing, Retrieving, and Reasoning). Additionally, the ef-\nfectiveness and generalizability of SWI are solidified on reasoning-intensive\nquestion answering (QA) and text summarization benchmarks, where SWI\nbrings consistent improvement to the Baseline generation. In text summa-\nrization, SWI-generated summaries exhibit greater accuracy, conciseness,\nand factual correctness, with fewer hallucinations. Furthermore, human\nevaluations verify the coherence, effectiveness, and interpretability of the\nintent produced by SWI. This proof-of-concept study creates a novel avenue\nfor enhancing LLMs\u2019 reasoning abilities with cognitive notions.1"}, {"group": "Philosophy of Science", "id": 45, "label": "The Entropy and Crossentropy of Generalized Department of Statistics", "shape": "dot", "size": 10, "title": "Authors: Marina Meil\u02d8a\u003cbr\u003eYear: 2012\u003cbr\u003eAbstract: The Generalized Mallows Model (GMM) is a well known family of\nmodels for ranking data. A GMM is a distribution over Sn, the set of\npermutations of n objects, characterized by a location parameter \u03c3 \u2208Sn,\nknown as central permutation and a set of dispersion parameters \u03b81:n\u22121 \u2208\n(0, 1]. The GMM shares many properties, such as having su\ufb03cient statis-\ntics, with exponential models, thus it can be seen as an exponential family\nwith a discrete parameter \u03c3. This paper shows that computing entropy,\ncross-entropy and Kullback-Leibler divergence in the the class of GMM\nis tractable, paving the way for a better understaning of this exponential\nfamily."}, {"group": "Philosophy of Science", "id": 46, "label": "The evolving boundary of green technology", "shape": "dot", "size": 10, "title": "Authors: Kerstin H\u00a8otte, Peter Persoon\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Green patents are a key indicator to track technological efforts aimed at fighting\nclimate change. Using an original dataset that merges different Patstat releases, we\nidentify three mechanisms that may bias green patent statistics, potentially leading to\ncontradictory findings. First, patent reclassifications due to updates in (green) classifi-\ncation codes result in an 9.2% increase in the number of green patents when using the\nmost recent classification structure. Second, delays in the adoption of the Cooperative\nPatent Classification (CPC) system introduce regional biases, as approximately 10%\nof green patents from late-adopting countries remain undetected in less recent versions\nof the database. Third, we provide evidence that quality thresholds used to identify\nhigh-value inventions significantly shape observed trends in green patenting. Analyzing\nthese mechanisms, our paper reveals that in many studies a substantial number of green\npatents is systematically overlooked, with the strongest effects observed for recent years\nand patents originating from Asian patent offices. These findings lead to relevant policy\nimplications. Our results indicate not only that the global rate of green innovation has\naccelerated, but also that its epicenter has shifted, with an increasing share of green\npatents originating from emerging technological leaders, particularly in Asia.\nJEL codes: O3, Q55, Q58\nKeywords: Climate change, patents, technology, classification, mitigation, adaptation,\ntaxonomy\n\u2217Corresponding author: Nicol`o Barbieri, Department of Economics and Management (University of Fer-\nrara), Via Voltapaletto 11, 44121, Ferrara, Italy.\n1\narXiv:2503.21310v1  [econ.GN]  27 Mar 2025"}, {"group": "Philosophy of Science", "id": 47, "label": "Two-Sample Tests for Optimal Lifts, Manifold Stability and Reverse Labeling Reflection Shape", "shape": "dot", "size": 10, "title": "Authors: Susovan Pal\u2020, Benjamin Eltzner\u2021, Stephan F. Huckemann\u00a7\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: We consider a quotient of a complete Riemannian manifold modulo an isometrically and\nproperly acting Lie group and lifts of the quotient to the manifolds in optimal position to\na reference point on the manifold. With respect to the pushed forward Riemannian volume\nonto the quotient we derive continuity and uniqueness a.e. and smoothness to large extents\nalso with respect to the reference point. In consequence we derive a general manifold stability\ntheorem: the Fr\u00b4echet mean lies in the highest dimensional stratum assumed with positive\nprobability, and a strong law for optimal lifts. This allows to define new two-sample tests\nutilizing individual optimal lifts which outperform existing two-sample tests on simulated\ndata.\nThey also outperform existing tests on a newly derived reverse labeling reflection\nshape space, that is used to model filament data of microtubules within cells in a biological\napplication."}, {"group": "Philosophy of Science", "id": 48, "label": "Ultrafast Charge-Transfer and Auger Decay from Core-Level Spectroscopy", "shape": "dot", "size": 10, "title": "Authors: Denis C\u00b4eolin, \u2020, \u22a5Tsveta, R\u00b4emi Dupuy, \u2021, Yuttakarn Rattanachai, \u00b6, Gunnar \u00a8Ohrwall, \u00a7, Ralph P\u00a8uttner\u2225, \u22a5\u003cbr\u003eYear: 2018\u003cbr\u003eAbstract: Understanding the interaction between metal ions and their aqueous environment\nis fundamental in many areas of chemistry, biology, and environmental science. In this\nstudy, we investigate the electronic structure of hydrated calcium ions, focusing on\n1\narXiv:2503.21517v1  [physics.chem-ph]  27 Mar 2025\nhow water molecules influence the metal ion\u2019s behavior. We employed advanced X-\nray techniques, including X-ray absorption, photoelectron, and Auger spectroscopies,\ncombined with high-level quantum chemical calculations. Our analysis reveals that,\nalongside normal Auger decay, distinct ultrafast charge transfer processes occur be-\ntween the calcium ion and surrounding water molecules, underscoring the complex\nnature of metal-solvent interactions. Two primary mechanisms were identified. The\nfirst one involves electron transfer from water to the calcium ion. The second mech-\nanism depends on the photon energy and is tentatively attributed to the decay of\nphotoelectron satellites, the capture of free solvated electrons or electrons from a Cl\u2212\nion in the second solvation shell. Additionally, we observed significant shifts in electron\nenergies due to post-collision interactions and interpreted the Ca 1s\u22121 photoelectron\nsatellites mainly as originating from inelastic photoelectron scattering (IPES). These\nfindings provide deeper insights into the electronic properties of hydrated metal ions,\nwith potential implications for fields such as catalysis and biochemistry, where metal\nions play a crucial role."}, {"group": "Philosophy of Science", "id": 49, "label": "Unlocking the Potential of Past Research: Using Generative AI to Reconstruct Healthcare Simulation Models", "shape": "dot", "size": 10, "title": "Authors: Thomas Monks, Alison Harper, Amy Heather\u003cbr\u003eYear: 2018\u003cbr\u003eAbstract: Discrete-event simulation (DES) is widely used in healthcare Operations Research, but the mod-\nels themselves are rarely shared. This limits their potential for reuse and long-term impact in the\nmodelling and healthcare communities. This study explores the feasibility of using generative\nartificial intelligence (AI) to recreate published models using Free and Open Source Software\n(FOSS), based on the descriptions provided in an academic journal. Using a structured method-\nology, we successfully generated, tested and internally reproduced two DES models, including\nuser interfaces. The reported results were replicated for one model, but not the other, likely\ndue to missing information on distributions. These models are substantially more complex than\nAI-generated DES models published to date. Given the challenges we faced in prompt engi-\nneering, code generation, and model testing, we conclude that our iterative approach to model\ndevelopment, systematic comparison and testing, and the expertise of our team were necessary\nto the success of our recreated simulation models.\nKeywords: generative AI, discrete-event simulation, healthcare, model replication, model reuse"}, {"group": "Logic", "id": 50, "label": "systematically explore the R1 paradigm for eliciting video reasoning within multi-", "shape": "dot", "size": 10, "title": "Authors: Kaituo Feng, Kaixiong Gong, Bohao Li, Zonghao Guo, Yibing Wang, Tianshuo Peng, Benyou Wang, Xiangyu Yue\u2217\u003cbr\u003eYear: 2021\u003cbr\u003eAbstract: Inspired by DeepSeek-R1\u2019s success in eliciting reasoning abilities through rule-\nbased reinforcement learning (RL), we introduce Video-R1 as the first attempt to\nsystematically explore the R1 paradigm for eliciting video reasoning within multi-\nmodal large language models (MLLMs). However, directly applying RL training\nwith the GRPO algorithm to video reasoning presents two primary challenges: (i) a\nlack of temporal modeling for video reasoning, and (ii) the scarcity of high-quality\nvideo-reasoning data. To address these issues, we first propose the T-GRPO al-\ngorithm, which encourages models to utilize temporal information in videos for\nreasoning. Additionally, instead of relying solely on video data, we incorporate\nhigh-quality image-reasoning data into the training process. We have constructed\ntwo datasets: Video-R1-COT-165k for SFT cold start and Video-R1-260k for RL\ntraining, both comprising image and video data. Experimental results demonstrate\nthat Video-R1 achieves significant improvements on video reasoning benchmarks\nsuch as VideoMMMU and VSI-Bench, as well as on general video benchmarks\nincluding MVBench and TempCompass, etc. Notably, Video-R1-7B attains a\n35.8% accuracy on video spatial reasoning benchmark VSI-bench, surpassing the\ncommercial proprietary model GPT-4o. All codes, models, data are released."}, {"group": "Philosophy of Science", "id": 51, "label": "Wasserstein Distributionally Robust Bayesian Optimization with Continuous Context", "shape": "dot", "size": 10, "title": "Authors: Francesco Micheli, Anastasios Tsiamis, John Lygeros\u003cbr\u003eYear: 2012\u003cbr\u003eAbstract: We address the challenge of sequential data-\ndriven decision-making under context distri-\nbutional uncertainty.\nThis problem arises\nin numerous real-world scenarios where the\nlearner optimizes black-box objective func-\ntions in the presence of uncontrollable con-\ntextual variables.\nWe consider the setting\nwhere the context distribution is uncertain\nbut known to lie within an ambiguity set de-\nfined as a ball in the Wasserstein distance.\nWe propose a novel algorithm for Wasserstein\nDistributionally Robust Bayesian Optimiza-\ntion that can handle continuous context dis-\ntributions while maintaining computational\ntractability.\nOur theoretical analysis com-\nbines recent results in self-normalized concen-\ntration in Hilbert spaces and finite-sample\nbounds for distributionally robust optimiza-\ntion to establish sublinear regret bounds that\nmatch state-of-the-art results. Through ex-\ntensive comparisons with existing approaches\non both synthetic and real-world problems,\nwe demonstrate the simplicity, effectiveness,\nand practical applicability of our proposed\nmethod."}, {"group": "Logic", "id": 52, "label": "World Model Agents with Change-Based Intrinsic Motivation Sparse reward environments pose a significant chal-", "shape": "dot", "size": 10, "title": "Authors: Jeremias Ferrao, Rafael Fernandes Cunha\u003cbr\u003eYear: 2017\u003cbr\u003eAbstract: Sparse reward environments pose a significant chal-\nlenge for reinforcement learning due to the scarcity of\nfeedback. Intrinsic motivation and transfer learning\nhave emerged as promising strategies to address this\nissue. Change Based Exploration Transfer (CBET),\na technique that combines these two approaches for\nmodel-free algorithms, has shown potential in ad-\ndressing sparse feedback but its effectiveness with\nmodern algorithms remains understudied. This pa-\nper provides an adaptation of CBET for world model\nalgorithms like DreamerV3 and compares the per-\nformance of DreamerV3 and IMPALA agents, both\nwith and without CBET, in the sparse reward envi-\nronments of Crafter and Minigrid. Our tabula rasa\nresults highlight the possibility of CBET improving\nDreamerV3\u2019s returns in Crafter but the algorithm\nattains a suboptimal policy in Minigrid with CBET\nfurther reducing returns.\nIn the same vein, our\ntransfer learning experiments show that pre-training\nDreamerV3 with intrinsic rewards does not imme-\ndiately lead to a policy that maximizes extrinsic\nrewards in Minigrid. Overall, our results suggest\nthat CBET provides a positive impact on Dream-\nerV3 in more complex environments like Crafter\nbut may be detrimental in environments like Mini-\ngrid. In the latter case, the behaviours promoted by\nCBET in DreamerV3 may not align with the task\nobjectives of the environment, leading to reduced\nreturns and suboptimal policies."}]);
