ween the genders of the raters. Alarmingly, many AI-generated\ncounter-stereotypes were perceived as offensive and/or implausible. Our analysis and the collected dataset offer\nfoundational insight into counter-stereotype generation, guiding future efforts to develop strategies that effectively\nchallenge gender stereotypes in online interactions.\nKeywords: Gender Stereotypes, Counter-Stereotypes, Social Influence, Online Conversations\n1."}, {"group": "Political Science", "id": 110, "label": "Taking sides: Public Opinion over the Israel-Palestine Con\ufb02ict in 2021", "shape": "dot", "size": 10, "title": "Authors: Arsal Imtiaz, Danish Khan, Hanjia Lyu, Jiebo Luo, aimtiaz, dkhan\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: The Israel-Palestine Con\ufb02ict, one of the most enduring con-\n\ufb02icts in history, dates back to the start of 20th century, with\nthe establishment of the British Mandate in Palestine and has\ndeeply rooted complex issues in politics, demography, reli-\ngion, and other aspects, making it harder to attain resolve. To\nunderstand the con\ufb02ict in 2021, we devise an observational\nstudy to aggregate stance held by English-speaking countries.\nWe collect Twitter data using popular hashtags around and\nspeci\ufb01c to the con\ufb02ict portraying opinions neutral or partial to\nthe two parties. We use different tools and methods to classify\ntweets into pro-Palestinian, pro-Israel, or neutral. This paper\nfurther describes the implementation of data mining method-\nologies to obtain insights and reason the stance held by citi-\nzens around the con\ufb02ict."}, {"group": "Natural Language Processing", "id": 42, "label": "Language-Based Augmentation to Address Shortcut Learning in Object-Goal Navigation", "shape": "dot", "size": 10, "title": "Authors: Dennis Hoftijzer, Gertjan Burghouts, Luuk Spreeuwers\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: \u2014Deep Reinforcement Learning (DRL) has shown\ngreat potential in enabling robots to find certain objects (e.g.,\n\u2018find a fridge\u2019) in environments like homes or schools. This task\nis known as Object-Goal Navigation (ObjectNav). DRL methods\nare predominantly trained and evaluated using environment\nsimulators. Although DRL has shown impressive results, the\nsimulators may be biased or limited. This creates a risk of\nshortcut learning, i.e., learning a policy tailored to specific\nvisual details of training environments. We aim to deepen our\nunderstanding of shortcut learning in ObjectNav, its implications\nand propose a solution. We design an experiment for inserting\na shortcut bias in the appearance of training environments.\nAs a proof-of-concept, we associate room types to specific wall\ncolors (e.g., bedrooms with green walls), and observe poor\ngeneralization of a state-of-the-art (SOTA) ObjectNav method\nto environments where this is not the case (e.g., bedrooms with\nblue walls). We find that shortcut learning is the root cause: the\nagent learns to navigate to target objects, by simply searching\nfor the associated wall color of the target object\u2019s room. To\nsolve this, we propose Language-Based (L-B) augmentation. Our\nkey insight is that we can leverage the multimodal feature\nspace of a Vision-Language Model (VLM) to augment visual\nrepresentations directly at the feature-level, requiring no changes\nto the simulator, and only an addition of one layer to the model.\nWhere the SOTA ObjectNav method\u2019s success rate drops 69%,\nour proposal has only a drop of 23%. Code is available at\nhttps://github.com/Dennishoftijzer/L-B Augmentation\nIndex Terms\u2014Vision-based Navigation, Deep Reinforcement\nLearning, Vision-Language\nI."}, {"group": "Natural Language Processing", "id": 84, "label": "Do Visual-Language Maps Capture Latent Semantics?", "shape": "dot", "size": 10, "title": "Authors: Matti Pekkanen, Tsvetomila Mihaylova, Francesco Verdoja, Ville Kyrki\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: \u2014 Visual-language models (VLMs) have recently\nbeen introduced in robotic mapping by using the latent rep-\nresentations, i.e., embeddings, of the VLMs to represent the\nnatural language semantics in the map. The main benefit is\nmoving beyond a small set of human-created labels toward\nopen-vocabulary scene understanding. While there is anecdotal\nevidence that maps built this way support downstream tasks,\nsuch as navigation, rigorous analysis of the quality of the\nmaps using these embeddings is lacking. We investigate two\ncritical properties of map quality: queryability and consistency.\nThe evaluation of queryability addresses the ability to retrieve\ninformation from the embeddings. We investigate two aspects of\nconsistency: intra-map consistency and inter-map consistency.\nIntra-map consistency captures the ability of the embeddings to\nrepresent abstract semantic classes, and inter-map consistency\ncaptures the generalization properties of the representation.\nIn this paper, we propose a way to analyze the quality of\nmaps created using VLMs, which forms an open-source bench-\nmark to be used when proposing new open-vocabulary map\nrepresentations. We demonstrate the benchmark by evaluating\nthe maps created by two state-of-the-art methods, VLMaps\nand OpenScene, using two encoders, LSeg and OpenSeg, using\nreal-world data from the Matterport3D data set. We find that\nOpenScene outperforms VLMaps with both encoders, and LSeg\noutperforms OpenSeg with both methods.\nI."}, {"group": "Political Science", "id": 45, "label": "Gun Culture in Fringe Social Media", "shape": "dot", "size": 10, "title": "Authors: Fatemeh Tahmasbi, Aakarsha Chug, Barry Bradlyn, Jeremy Blackburn\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: The increasing frequency of mass shootings in the United\nStates has, unfortunately, become a norm. While the issue of\ngun control in the US involves complex legal concerns, there\nare also societal issues at play. One such social issue is so-\ncalled \u201cgun culture,\u201d i.e., a general set of beliefs and actions\nrelated to gun ownership. However relatively little is known\nabout gun culture, and even less is known when it comes to\nfringe online communities. This is especially worrying con-\nsidering the aforementioned rise in mass shootings and nu-\nmerous instances of shooters being radicalized online.\nTo address this gap, we explore gun culture on /k/, 4chan\u2019s\nweapons board. More specifically, using a variety of quanti-\ntative techniques, we examine over 4M posts on /k/ and posi-\ntion their discussion within the larger body of theoretical un-\nderstanding of gun culture. Among other things, our findings\nsuggest that gun culture on /k/ covers a relatively diverse set\nof topics (with a particular focus on legal discussion), some\nof which are signals of fetishism."}, {"group": "Political Science", "id": 103, "label": "An Intelligent System for Multi-topic Social Spam", "shape": "dot", "size": 10, "title": "Authors: Bilal Abu, Dana Al Qudah, Malak Al-Hassan, Seyed Mohssen Ghafari, Tomayess Issa, Ibrahim Aljarah, Amin Beheshti, Sulaiman Alqahtani\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: : The communication revolution has perpetually reshaped the means through which people send and \nreceive information. Social media is an important pillar of this revolution and has brought profound changes to \nvarious aspects of our lives. However, the open environment and popularity of these platforms inaugurate \nwindows of opportunities for various cyber threats, thus social networks have become a fertile venue for \nspammers and other illegitimate users to execute their malicious activities. These activities include phishing hot \nand trendy topics and posting a wide range of contents in many topics. Hence, it is crucial to continuously \nintroduce new techniques and approaches to detect and stop this category of users. This paper proposes a \nnovel and effective approach to detect social spammers. An investigation into several attributes to measure \ntopic-dependent and topic-independent users\u2019 behaviours on Twitter is carried out. The experiments of this \nstudy are undertaken on various machine learning classifiers. The performance of these classifiers are compared \nand their effectiveness is measured via a number of robust evaluation measures. Further, the proposed approach \nis benchmarked against state-of-the-art social spam and anomalous detection techniques. These experiments \nreport the effectiveness and utility of the proposed approach and embedded modules. \nKeywords: Social Spammers, Online Social Networks, Machine Learning, Social Credibility, Semantic Analysis, \nCyber Threats. \n1."}, {"group": "Political Science", "id": 114, "label": "Toxic Synergy Between Hate Speech and Fake News Exposure", "shape": "dot", "size": 10, "title": "Authors: Filippo Menczer\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Hate speech on social media is a pressing concern. Under-\nstanding the factors associated with hate speech may help\nmitigate it. Here we explore the association between hate\nspeech and exposure to fake news by studying the correla-\ntion between exposure to news from low-credibility sources\nthrough following connections and the use of hate speech on\nTwitter. Using news source credibility labels and a dataset\nof posts with hate speech targeting various populations, we\nfind that hate speakers are exposed to lower percentages of\nposts linking to credible news sources. When taking the tar-\nget population into account, we find that this association is\nmainly driven by anti-semitic and anti-Muslim content. We\nalso observe that hate speakers are more likely to be exposed\nto low-credibility news with low popularity. Finally, while\nhate speech is associated with low-credibility news from par-\ntisan sources, we find that those sources tend to skew to the\npolitical left for antisemitic content and to the political right\nfor hate speech targeting Muslim and Latino populations. Our\nresults suggest that mitigating fake news and hate speech may\nhave synergistic effects."}, {"group": "Structural Biology", "id": 49, "label": "Efficient Fault Tolerance for Pipelined Query Engines via Write-ahead Lineage", "shape": "dot", "size": 10, "title": "Authors: Ziheng Wang, Alex Aiken\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: \u2014Modern distributed pipelined query engines either\ndo not support intra-query fault tolerance or employ high-\noverhead approaches such as persisting intermediate outputs or\ncheckpointing state. In this work, we present write-ahead lineage,\na novel fault recovery technique that combines Spark\u2019s lineage-\nbased replay and write-ahead logging. Unlike Spark, where\nthe lineage is determined before query execution, write-ahead\nlineage persistently logs lineage at runtime to support dynamic\ntask dependencies in pipelined query engines. Since only KB-\nsized lineages are persisted instead of MB-sized intermediate\noutputs, the normal execution overhead is minimal compared\nto spooling or checkpointing based approaches. To ensure fast\nfault recovery times, tasks only consume intermediate outputs\nwith persisted lineage, preventing global rollbacks upon failure.\nIn addition, lost tasks from different stages can be recovered in\na pipelined parallel manner. We implement write-ahead lineage\nin a distributed pipelined query engine called Quokka. We show\nthat Quokka is around 2x faster than SparkSQL on the TPC-H\nbenchmark with similar fault recovery performance.\nI."}, {"group": "Structural Biology", "id": 50, "label": "arXiv:2403.08375v1  [cs.DB]  13 Mar 2024", "shape": "dot", "size": 10, "title": "Authors: Salwa Alamir, Xiaomo Liu\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Migrations of systems from on-site premises to the cloud has been\na fundamental endeavor by many industrial institutions. A crucial\ncomponent of such cloud migrations is the transition of databases\nto be hosted online. In this work, we consider the di\ufb03culties of this\nmigration for SQL databases. While SQL is one of the prominent\nmethods for storing database procedures, there are a plethora of\ndi\ufb00erent SQL dialects (e.g., MySQL, Postgres, etc.) which can com-\nplicate migrations when the on-premise SQL dialect di\ufb00ers to the\ndialect hosted on the cloud. Tools exist by common cloud provides\nsuch as AWS and Azure to aid in translating between dialects in\norder to mitigate the majority of the di\ufb03culties. However, these\ntools do not successfully translate 100% of the code. Consequently,\nsoftware engineers must manually convert the remainder of the\nuntranslated database. For large organizations, this task quickly\nbecomes intractable and so more innovative solutions are required.\nWe consider this challenge a novel yet vital industrial research\nproblem for any large corporation that is considering cloud mi-\ngrations. Furthermore, we introduce potential avenues of research\nto tackle this challenge that have yielded promising preliminary\nresults.\nCCS CONCEPTS\n\u2022 Theory of computation \u2192Database query processing and opti-\nmization (theory); \u2022 Information systems \u2192Cloud based storage;\n\u2022 Computing methodologies \u2192Machine translation.\nKEYWORDS\nCloud Migration, SQL, Code Translation\nACM Reference Format:\nRan Zmigrod, Salwa Alamir, and Xiaomo Liu. 2024. Translating between\nSQL Dialects for Cloud Migration. In 46th International Conference on Soft-\nware Engineering: Software Engineering in Practice (ICSE-SEIP \u201924), April 14\u2013\n20, 2024, Lisbon, Portugal. ACM, New York, NY, USA, 3 pages. https://doi.org/10.1145/3639477.3639727"}, {"group": "Political Science", "id": 66, "label": "NRBdMF: Recommendation Algorithm for Drug Effects Prediction Considering Directionality", "shape": "dot", "size": 10, "title": "Authors: Iori Azuma, Tadahaya Mizuno, Hiroyuki Kusuhara, Tadahaya Mizuno\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Political Science", "id": 96, "label": "Format guide for AIRCC", "shape": "dot", "size": 10, "title": "Authors: David C. Wyld, Emmanuel Etuh, Francis S. Bakpo, Eneh Agozie H\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: We live in a virtual world where actual lifestyles are replicated.  The growing reliance on the \nuse of social media networks worldwide has resulted in great concern for information security. \nOne of the factors popularizing the social media platforms is how they connect people \nworldwide to interact, share content, and engage in mutual interactions of common interest that \ncut across geographical boundaries. Behind all these incredible gains are digital crime \nequivalence that threatens the physical socialization. Criminal minded elements and hackers \nare exploiting Social Media Platforms (SMP) for many nefarious activities to harm others. As \ndetection tools are developed to control these crimes, hackers\u2019 tactics and techniques are \nconstantly evolving. Hackers are constantly developing new attacking tools and hacking \nstrategies to gain malicious access to systems and attack social media network thereby making \nit difficult for security administrators and organizations to develop and implement the proper \npolicies and procedures necessary to prevent the hackers\u2019 attacks. The increase in cyber-attacks \non the social media platforms calls for urgent and more intelligent security measures to \nenhance the effectiveness of social media platforms. This paper explores the mode and tactics of \nhackers\u2019 mode of attacks on social media and ways of preventing their activities against users to \nensure secure social cyberspace and enhance virtual socialization. Social media platforms are \nbriefly categorized, the various types of attacks are also highlighted with current state-of-the-art  \npreventive mechanisms to overcome the attacks as proposed in research works, finally, social \nmedia intrusion detection mechanism is suggested as a second line of defence to combat \ncybercrime on social media networks \n \nKEYWORDS \n \nIntrusion Detection System, Data Warehouse, Machine Learning, Hackers, Social Media \nPlatform, Online Social Network Intrusion. \n \n1."}, {"group": "Political Science", "id": 112, "label": "FacebookConfounding_v1.docx", "shape": "dot", "size": 10, "title": "Authors: Alexander Ruch, Yujia Zhang, Michael Macy\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Lifestyle politics emerge when activities that have no substantive relevance to ideology\nbecome politically aligned and polarized. Homophily and social influence are able\ngenerate these fault lines on their own; however, social identities from demographics may\nserve as coordinating mechanisms through which lifestyle politics are mobilized are\nspread. Using a dataset of 137,661,886 observations from 299,327 Facebook interests\naggregated across users of different racial/ethnic, education, age, gender, and income\ndemographics, we find that the most extreme instances of lifestyle politics are those\nwhich are highly confounded by demographics such as race/ethnicity (e.g., Black artists\nand performers). After adjusting political alignment for demographic effects, lifestyle\npolitics decreased by 27.36% toward the political \u201ccenter\u201d and demographically\nconfounded interests were no longer among the most polarized interests. Instead, after\ndemographic deconfounding, we found that the most liberal interests included electric\ncars, Planned Parenthood, and liberal satire while the most conservative interests included\nthe Republican Party and conservative commentators. We validate our measures of\npolitical alignment and lifestyle politics using the General Social Survey and find similar\ndemographic entanglements with lifestyle politics existed before social media such as\nFacebook were ubiquitous, giving us strong confidence that our results are not due to\necho chambers or filter bubbles. Likewise, since demographic characteristics exist prior\nto ideological values, we argue that the demographic confounding we observe is causally\nresponsible for the extreme instances of lifestyle politics that we find among the\naggregated interests. We conclude our paper by relating our results to Simpson\u2019s paradox,\ncultural omnivorousness, and network autocorrelation.\nKeywords: social networks, social media, polarization, lifestyle politics, demographics."}, {"group": "Political Science", "id": 93, "label": "On the Persistence of Higher-Order Interactions in Real-World Hypergraphs", "shape": "dot", "size": 10, "title": "Authors: Hyunj Choo\u2217, Kijung Sh\u2020\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: A hypergraph, which generalizes an ordinary graph, naturally represents group interactions as hyperedges\n(i.e., arbitrary-sized subsets of nodes). Such group interactions are ubiquitous: the sender and receivers of an\nemail, the co-authors of a publication, and the items co-purchased by a customer, to name a few. A higher-\norder interaction (HOI) in a hypergraph is de\ufb01ned as the co-appearance of a set of nodes in any hyperedge.\nOur focus is the persistence of HOIs repeated over time, which is naturally interpreted as the strength of\ngroup relationships, aiming at answering three questions: (a) How do HOIs in real-world hypergraphs persist\nover time? (b) What are the key factors governing the persistence? (c) How accurately can we predict the\npersistence?\nIn order to answer the questions above, we investigate the persistence of HOIs in 13 real-world hypergraphs\nfrom six domains. First, we de\ufb01ne how to measure the persistence of HOIs. Then, we examine global patterns\nand anomalies in the persistence, revealing a power-law relationship. After that, we study the relations between\nthe persistence and 16 structural features of HOIs, some of which are closely related to the persistence. Lastly,\nbased on the 16 structural features, we assess the predictability of the persistence under various settings and\n\ufb01nd strong predictors. Note that predicting the persistence of HOIs has many potential applications, such as\nrecommending items to be purchased together and predicting missing recipients of emails.\nKeywords: Temporal Hypergraph, Higher-Order Interaction, Persistence, Predictability"}, {"group": "Political Science", "id": 124, "label": "Community detection and anomaly prediction in dynamic networks", "shape": "dot", "size": 10, "title": "Authors: Catera De Bacco\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Anomaly detection is an essential task in the analysis of dynamic networks, as it can provide early warning of\npotential threats or abnormal behavior. We present a principled approach to detect anomalies in dynamic networks\nthat integrates community structure as a foundational model for regular behavior. Our model identifies anomalies as\nirregular edges while capturing structural changes. Leveraging a Markovian approach for temporal transitions and\nincorporating structural information via latent variables for communities and anomaly detection, our model infers these\nhidden parameters to pinpoint abnormal interactions within the network. Our approach is evaluated on both synthetic\nand real-world datasets. Real-world network analysis shows strong anomaly detection across diverse scenarios. In a\nmore specific study of transfers of professional male football players, we observe various types of unexpected patterns\nand investigate how the country and wealth of clubs influence interactions. Additionally, we identify anomalies between\nclubs with incompatible community memberships, but also instances of anomalous transactions between clubs with\nsimilar memberships. The latter is due in particular to the dynamic nature of the transactions, as we find that the\nfrequency of transfers results in anomalous behaviors that are otherwise expected to interact as they belong to similar\ncommunities.\nI."}, {"group": "Political Science", "id": 95, "label": "Noname manuscript No. (will be inserted by the editor)", "shape": "dot", "size": 10, "title": "Authors: Wei Chen, Weiqing Wang, Hongzhi Yin, Lei Zhao(B, Xiaofang Zhou\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Sources of complementary information are\nconnected when we link user accounts belonging to the\nsame user across di\ufb00erent platforms or devices. The\nexpanded information promotes the development of a\nwide range of applications, such as cross-platform pre-\ndiction, cross-platform recommendation, and advertise-\nment. Due to the signi\ufb01cance of user account linkage\nand the widespread popularization of GPS-enabled mo-\nbile devices, there are increasing research studies on\nlinking user account with spatio-temporal data across\nlocation-aware social networks. Being di\ufb00erent from most\nexisting studies in this domain that only focus on the\ne\ufb00ectiveness, we propose a novel framework entitled\nHFUL (A Hybrid Framework for User Account Linkage\nacross Location-Aware Social Networks), where e\ufb03ciency,\ne\ufb00ectiveness, scalability, robustness, and application of\nuser account linkage are considered. Speci\ufb01cally, to im-\nprove the e\ufb03ciency, we develop a comprehensive in-\ndex structure from the spatio-temporal perspective, and\ndesign novel pruning strategies to reduce the search\nWei Chen\nrobertchen@suda.edu.cn\nWeiqing Wang\nteresa.wang@monash.edu\nHongzhi Yin\ny.yin1@uq.edu.au\nLei Zhao\nzhaol@suda.edu.cn\nXiaofang Zhou\nzxf@cse.ust.hk\n1Institute of Arti\ufb01cial Intelligence, School of Computer Sci-\nence and Technology, Soochow University, China\n2Faculty of Information Technology, Monash University, Mel-\nbourne, Australia\n3School of ITEE, The University of Queensland, Bribane,\nAustralia\n4The Hong Kong University of Science and Technology, Hong\nKong, China\nspace. To improve the e\ufb00ectiveness, a kernel density\nestimation-based method has been proposed to alle-\nviate the data sparsity problem in measuring users\u2019\nsimilarities. Additionally, we investigate the application\nof HFUL in terms of user prediction, time prediction,\nand location prediction. The extensive experiments con-\nducted on three real-world datasets demonstrate the su-\nperiority of HFUL in terms of e\ufb00ectiveness, e\ufb03ciency,\nscalability, robustness, and application compared with\nthe state-of-the-art methods.\nKeywords User Account Linkage \u00b7 Social Networks \u00b7\nLocation Data"}, {"group": "Structural Biology", "id": 123, "label": "INTELLIGENT INFORMATION PROCESSING LABORATORY, SCHOOL OF EIE, BEIJING JIAOTONG UNIVERSITY", "shape": "dot", "size": 10, "title": "Authors: Mingze Sun\u2217, Yiqing Wang\u2020, Zhenyi Zhao\u2021\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: \u2014A novel crowd stampede detection and prediction\nalgorithm based on Deformable DETR is proposed to address the\nchallenges of detecting a large number of small targets and target\nocclusion in crowded airport and train station environments.\nIn terms of model design, the algorithm incorporates a multi-\nscale feature fusion module to enlarge the receptive field and en-\nhance the detection capability of small targets. Furthermore, the\ndeformable attention mechanism is improved to reduce missed\ndetections and false alarms for critical targets [1]. Additionally,\na new algorithm is innovatively introduced for stampede event\nprediction and visualization. Experimental evaluations on the\nPKX-LHR dataset demonstrate that the enhanced algorithm\nachieves an 34% performance in small target detection accuracy\nwhile maintaining the original detection speed.\nIndex Terms\u2014Multi Scale Deformable Attention; small target\ndetection; stampede event prediction; multi-scale feature fusion\nmodule.\nI."}, {"group": "Structural Biology", "id": 82, "label": "HeR-DRL:Heterogeneous Relational Deep Reinforcement Learning for Decentralized Multi-Robot Crowd Navigation", "shape": "dot", "size": 10, "title": "Authors: Songhao Piao\u2217, Wenzheng Chi, Liguo Chen, Wei Li\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: \u2014Crowd navigation has received significant research\nattention in recent years, especially DRL-based methods. While\nsingle-robot crowd scenarios have dominated research, they\noffer limited applicability to real-world complexities. The het-\nerogeneity of interaction among multiple agent categories, like\nin decentralized multi-robot pedestrian scenarios, are frequently\ndisregarded. This \u201dinteraction blind spot\u201d hinders generaliz-\nability and restricts progress towards robust navigation algo-\nrithms. In this paper, we propose a heterogeneous relational\ndeep reinforcement learning(HeR-DRL), based on customised\nheterogeneous GNN, in order to improve navigation strategies in\ndecentralized multi-robot crowd navigation. Firstly, we devised a\nmethod for constructing robot-crowd heterogenous relation graph\nthat effectively simulates the heterogeneous pair-wise interaction\nrelationships. We proposed a new heterogeneous graph neural\nnetwork for transferring and aggregating the heterogeneous state\ninformation. Finally, we incorporate the encoded information into\ndeep reinforcement learning to explore the optimal policy. HeR-\nDRL are rigorously evaluated through comparing it to state-\nof-the-art algorithms in both single-robot and multi-robot circle\ncrowssing scenario. The experimental results demonstrate that\nHeR-DRL surpasses the state-of-the-art approaches in overall\nperformance, particularly excelling in safety and comfort metrics.\nThis underscores the significance of interaction heterogeneity for\ncrowd navigation. The source code will be publicly released in\nhttps://github.com/Zhouxy-Debugging-Den/HeR-DRL.\nI."}, {"group": "Structural Biology", "id": 88, "label": "Online Concurrent Multi-Robot Coverage Path Planning", "shape": "dot", "size": 10, "title": "Authors: Indranil Saha\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: \u2014 Recently,\ncentralized\nreceding\nhorizon\nonline\nmulti-robot coverage path planning algorithms have shown\nremarkable scalability in thoroughly exploring large, complex,\nunknown workspaces with many robots. In a horizon, the path\nplanning and the path execution interleave, meaning when the\npath planning occurs for robots with no paths, the robots\nwith outstanding paths do not execute, and subsequently, when\nthe robots with new or outstanding paths execute to reach\nrespective goals, path planning does not occur for those robots\nyet to get new paths, leading to wastage of both the robotic\nand the computation resources. As a remedy, we propose a\ncentralized algorithm that is not horizon-based. It plans paths\nat any time for a subset of robots with no paths, i.e., who\nhave reached their previously assigned goals, while the rest\nexecute their outstanding paths, thereby enabling concurrent\nplanning and execution. We formally prove that the proposed\nalgorithm ensures complete coverage of an unknown workspace\nand analyze its time complexity. To demonstrate scalability, we\nevaluate our algorithm to cover eight large 2D grid bench-\nmark workspaces with up to 512 aerial and ground robots,\nrespectively. A comparison with a state-of-the-art horizon-based\nalgorithm shows its superiority in completing the coverage with\nup to 1.6\u00d7 speedup. For validation, we perform ROS + Gazebo\nsimulations in six 2D grid benchmark workspaces with 10\nQuadcopters and TurtleBots, respectively. We also successfully\nconducted one outdoor experiment with three quadcopters and\none indoor with two TurtleBots.\nI."}, {"group": "Structural Biology", "id": 43, "label": "MetroGNN: Metro Network Expansion with Reinforcement Learning", "shape": "dot", "size": 10, "title": "Authors: Yu Zheng, Jingtao Ding, Depeng Jin, Yong Li\u2217\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Selecting urban regions for metro network expansion to meet maxi-\nmal transportation demands is crucial for urban development, while\ncomputationally challenging to solve. The expansion process re-\nlies not only on complicated features like urban demographics\nand origin-destination (OD) flow but is also constrained by the\nexisting metro network and urban geography. In this paper, we\nintroduce a reinforcement learning framework to address a Markov\ndecision process within an urban heterogeneous multi-graph. Our\napproach employs an attentive policy network that intelligently\nselects nodes based on information captured by a graph neural net-\nwork. Experiments on real-world urban data demonstrate that our\nproposed methodology substantially improve the satisfied trans-\nportation demands by over 30% when compared with state-of-the-\nart methods. Codes are published at https://github.com/tsinghua-\nfib-lab/MetroGNN.\nCCS CONCEPTS\n\u2022 Computing methodologies \u2192Planning and scheduling;\nReinforcement learning.\nKEYWORDS\nmetro network, reinforcement learning, graph neural networks\nACM Reference Format:\nHongyuan Su, Yu Zheng, Jingtao Ding, Depeng Jin, and Yong Li. 2024.\nMetroGNN: Metro Network Expansion with Reinforcement Learning. In\nCompanion Proceedings of the ACM Web Conference 2024 (WWW \u201924 Com-\npanion), May 13\u201317, 2024, Singapore, Singapore. ACM, New York, NY, USA,\n4 pages. https://doi.org/10.1145/3589335.3651536\n\u2217Corresponding author (liyong07@tsinghua.edu.cn).\nPermission to make digital or hard copies of part or all of this work for personal or\nclassroom use is granted without fee provided that copies are not made or distributed\nfor profit or commercial advantage and that copies bear this notice and the full citation\non the first page. Copyrights for third-party components of this work must be honored.\nFor all other uses, contact the owner/author(s).\nWWW \u201924 Companion, May 13\u201317, 2024, Singapore, Singapore\n\u00a9 2024 Copyright held by the owner/author(s).\nACM ISBN 979-8-4007-0172-6/24/05.\nhttps://doi.org/10.1145/3589335.3651536"}, {"group": "Structural Biology", "id": 59, "label": "Stochastic failure of cell infection post viral entry: Implications for infection outcomes and antiviral therapy", "shape": "dot", "size": 10, "title": "Authors: Christian Quirouette, Daniel Cresta, Jizhou Li, Kathleen P. Wilkie, Haozhao Liang,\u00a4, Catherine A.A. Beauchemin,,\u2217\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Structural Biology", "id": 80, "label": "epl draft", "shape": "dot", "size": 10, "title": "Authors: Senador Salgado Filho\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: \u2013 We investigate a cyclic game system where organisms face an epidemic beyond being\nthreatened by natural enemies.\nAs a survival strategy, individuals of one out of the species\nusually safeguard themselves by approaching the enemies of their enemies and performing social\ndistancing to escape contamination when an outbreak a\ufb00ects the neighbourhood. We simulate\nhow the survival movement strategy to local epidemic surges must adapt if a pathogen mutation\nmakes the disease deadlier. We study the spatial distribution of local outbreaks and observe the\nin\ufb02uence of disease mortality on individuals\u2019 spatial organisation. We show that adapting the\nsurvival movement strategy for a high mortality disease demands an altruistic behaviour of the\norganisms since their death risk increases. Despite weakening the disease transmission chain, which\nbene\ufb01ts the species, abandoning refuges provided by safeguarding social interaction increases the\nvulnerability to being eliminated in the cyclic game. Considering that not all individuals exhibit\naltruism, we \ufb01nd the relative growth in the species density as a function of the proportion of\nindividuals behaving altruistically. Our results may be helpful for biologists and data scientists to\nunderstand how adaptive altruistic processes can a\ufb00ect population dynamics in complex systems."}, {"group": "Political Science", "id": 115, "label": "Interest Maximization in Social Networks", "shape": "dot", "size": 10, "title": "Authors: Rahul Kumar Gautam, Anjeneya Swami Kare, S. Durga Bhavani\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: . Nowadays, organizations use viral marketing strategies to promote their products\nthrough social networks. It is expensive to directly send the product promotional information\nto all the users in the network. In this context, Kempe et al. [10] introduced the Influence\nMaximization (IM) problem, which identifies k most influential nodes (spreader nodes), such\nthat the maximum number of people in the network adopts the promotional message.\nMany variants of the IM problem have been studied in the literature, namely, Perfect Evan-\ngelising Set (PES), Perfect Awareness Problem (PAP), etc. In this work, we propose a maxi-\nmization version of PAP called the Interest Maximization problem. Different people have\ndifferent levels of interest in a particular product. This is modeled by assigning an interest\nvalue to each node in the network. Then, the problem is to select k initial spreaders such\nthat the sum of the interest values of the people (nodes) who become aware of the message\nis maximized.\nWe study the Interest Maximization problem under two popular diffusion models: the\nLinear Threshold Model (LTM) and the Independent Cascade Model (ICM). We show that\nthe Interest Maximization problem is NP-Hard under LTM. We give linear programming\nformulation for the problem under LTM. We propose four heuristic algorithms for the In-\nterest Maximization problem: Level Based Greedy Heuristic (LBGH), Maximum Degree\nFirst Heuristic (MDFH), Profit Based Greedy Heuristic (PBGH), and Maximum Profit Based\nGreedy Heuristic (MPBGH). Extensive experimentation has been carried out on many real-\nworld benchmark data sets for both the diffusion models. The results show that among the\nproposed heuristics, MPBGH performs better in maximizing the interest value."}, {"group": "Structural Biology", "id": 129, "label": "Effective Individual Fairest Community Search over Heterogeneous Information Networks", "shape": "dot", "size": 10, "title": "Authors: Ningning Cui, Wei Luo\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Community search over heterogeneous information networks has\nbeen applied to wide domains, such as activity organization and\nteam formation. From these scenarios, the members of a group\nwith the same treatment often have different levels of activity and\nworkloads, which causes unfairness in the treatment between ac-\ntive members and inactive members (called individual unfairness).\nHowever, existing works do not pay attention to individual fairness\nand do not sufficiently consider the rich semantics of HINs (e.g.,\nhigh-order structure), which disables complex queries. To fill the\ngap, we formally define the issue of individual fairest community\nsearch over HINs (denoted as IFCS), which aims to find a set of\nvertices from the HIN that own the same type, close relationships,\nand small difference of activity level and has been demonstrated to\nbe NP-hard. To do this, we first develop an exploration-based filter\nthat reduces the search space of the community effectively. Further,\nto avoid repeating computation and prune unfair communities in\nadvance, we propose a message-based scheme and a lower bound-\nbased scheme. At last, we conduct extensive experiments on four\nreal-world datasets to demonstrate the effectiveness and efficiency\nof our proposed algorithms, which achieve at least \u00d73 times faster\nthan the baseline solution.\nCCS CONCEPTS\n\u2022 Do Not Use This Code \u2192Generate the Correct Terms for\nYour Paper; Generate the Correct Terms for Your Paper; Generate\nthe Correct Terms for Your Paper; Generate the Correct Terms for\nYour Paper.\nACM Reference Format:\nTaige Zhao, Jianxin Li, Ningning Cui, and Wei Luo. 2018. Effective Individual\nFairest Community Search over Heterogeneous Information Networks. In\n\u2217Both authors contributed equally to this research.\nPermission to make digital or hard copies of all or part of this work for personal or\nclassroom use is granted without fee provided that copies are not made or distributed\nfor profit or commercial advantage and that copies bear this notice and the full citation\non the first page. Copyrights for components of this work owned by others than the\nauthor(s) must be honored. Abstracting with credit is permitted. To copy otherwise, or\nrepublish, to post on servers or to redistribute to lists, requires prior specific permission\nand/or a fee. Request permissions from permissions@acm.org.\nConference acronym \u2019XX, June 03\u201305, 2018, Woodstock, NY\n\u00a9 2018 Copyright held by the owner/author(s). Publication rights licensed to ACM.\nACM ISBN 978-1-4503-XXXX-X/18/06\nhttps://doi.org/XXXXXXX.XXXXXXX\nProceedings of Make sure to enter the correct conference title from your rights\nconfirmation emai (Conference acronym \u2019XX). ACM, New York, NY, USA,\n13 pages. https://doi.org/XXXXXXX.XXXXXXX"}, {"group": "Structural Biology", "id": 132, "label": "The resonant acoustic signatures of lithic debitage", "shape": "dot", "size": 10, "title": "Authors: Margaret A. Morris a, Petr Krysl b, Isabel C. Rivera-Collazo\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Acoustic methods to search for submerged archaeological sites have shown that concentrations of knapped flint \nproduce a visible acoustic response in chirp sonar profiles in a variety of geographical settings. Field tests and \nsimulations have suggested that the submerged lithic signal is due to acoustic resonances of the flaked stone. We \nmodel and measure the resonant acoustic signatures of chert, obsidian, metavolcanic, and granitic lithic debit\u00ad\nage. Struck lithics produce multiple resonant peaks under 30 kHz, with high quality factors that decrease with \nmaterial coarseness. We use a combination of the finite element and boundary element methods to model the \nnatural vibrations of lithic debitage in both air and water. Direct measurement of lithic material density and \nadjustment of the Young\u2019s modulus and Poisson\u2019s ratio provide excellent correspondence between measured and \nmodeled resonances. Using a coupled finite element and boundary integral method, we model the acoustic \nscattering return of individual lithics in water as a function of frequency and incidence angle. We find the \nstrongest resonant signal between 8 and 16 kHz for a collection of lithic debitage. Results indicate that the lithic \nresonance signal is highly directional, with target strength up to \u221220 dB when excited at optimal angles. For a \nflat-laying lithic, target strength at normal incidence is, on average, 10 dB lower than the strongest signal, \ntypically found 55\u25e6\u00b1 18\u25e6from normal incidence. We suggest that the best way to detect submerged lithics may \nnot be through standard mono-static sub-bottom profiling with a direct downward pulse, but with a chirp pulse \nsent and received at an angle with respect to the sea bottom.   \n1."}, {"group": "Structural Biology", "id": 138, "label": "On Stress Driven Diffusion in Bone - An Experimental Study", "shape": "dot", "size": 10, "title": "Authors: Gustav Ldbergaand, Per St\u00e5hleb\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: The transport of nutrients or signal constituents that stimulate growth of bone\ntissue is supposed to be a\ufb00ected by a static mechanical load. It follows from\nbasic thermodynamical principles that constituents causing volumetric change\nare dragged along the gradients of hydrostatic stress. The present preliminary\nstudy examines the behaviour of iodine present in the medullary cavity of a\nbovine long bone exposed to mechanical load.\nA section of the bone is x-\nray scanned with the static load present, with and without the iodine. The\nresulting distribution in a selected 2D plane is numerically evaluated using a\ndiscrete Radon\u2019s inverse transform. The result suggests that iodine is a useful\nconstituent with a good attenuation e\ufb00ect on the x-ray beam and clearly reveals\nthe temporal distribution of its transport through the bone. It further result\nshows some indication that stress does a\ufb00ect the iodine distribution. .\nKeywords:\nStress-driven di\ufb00usion, tomography, bone, experimental, Radon\u2019s\nintegral\n1."}, {"group": "Structural Biology", "id": 100, "label": "Generating Connected, Simple, and Realistic Cyber Graphs for Smart Grids", "shape": "dot", "size": 10, "title": "Authors: Katherine Davis\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: \u2014Smart grids integrate communication systems with\npower networks to enable power grids operation and command\nthrough real-time data collection and control signals. Designing,\nanalyzing, and simulating smart grid infrastructures as well\nas predicting the impact of power network failures strongly\ndepend on the topologies of the underlying power network\nand communication system. Despite the substantial impact that\nthe communication systems bring to smart grid operation, the\ntopology of communication systems employed in smart grids\nwas less studied. The power community lacks realistic generative\ncommunication system models that can be calibrated to match\nreal-world data. To address this issue, this paper proposes a\nframework to generate the underlying topological graphs for\nthe communication systems deployed in smart grids by mim-\nicking the topology of real-world smart grids. In this regard,\nwe have updated the Chung-Lu algorithm to guarantee the\ncommunication network connectivity and to match the degree\ndistribution of a real-world smart grid rather than following\nan expected degree distribution. In addition, key characteristics\nof communication systems such as diameter, average shortest\npaths, clustering coef\ufb01cients, assortativity, and spectral gap were\ntaken into consideration to generate the most similar real-world\ncommunication network for smart grid studies. We believe that\nthe proposed algorithm to generate realistic cyber graphs for\nsmart grid studies will bene\ufb01t the power community.\nNOMENCLATURE\nG, V, E\nGraph, set of nodes, set of edges\nn, m P Z\n|V|, |E|\nu.d P R\nDegree of a node u\nS P Zn\nDegree sequence\nd P Z\nMax. degree\nx\np\u00a8q\nNormalization operation s.t. \u0159n\n1 x\np\u00a8q \u201c 1\nD P Zd\nDegree vector D \u201c r1, . . . , ds\npK P Rd\nNormalized frequency vector\nG.g P t0, 1u G is graphical (no self loops and parallel edges)\nG.c P t0, 1u G is connected\n\u03c1 P R\nDensity as m{n\nI P R\nDiameter as the longest shortest path\nrsp P R\nAverage shortest path\ncc P R\nClustering coef\ufb01cient\na P R\nAssortativity as the Pearson correlation coef\ufb01-\ncient of degrees between pairs of linked nodes\n\u03bb P R\nSpectral gap as the minimum non-zero eigen-\nvalue of the normalized Laplacian\nThis work was supported by NSF under Award Number 1808064.\nI."}, {"group": "Structural Biology", "id": 72, "label": "Genome-wide Nucleotide-resolution Model of Single-strand Break Site Reveals Species Evolutionary Hierarchy", "shape": "dot", "size": 10, "title": "Authors: Sheng Xu, Junkang Wei, Yu Li\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Single-strand breaks (SSBs) are the major DNA damage in the genome arising spontaneously as\nthe outcome of genotoxins and intermediates of DNA transactions. SSBs play a crucial role in\nvarious biological processes and show a non-random distribution in the genome. Several SSB\ndetection approaches such as S1 END-seq and SSiNGLe-ILM emerged to characterize the genomic\nlandscape of SSB with nucleotide resolution. However, these sequencing-based methods are costly\nand unfeasible for large-scale analysis of diverse species. Thus, we proposed the \ufb01rst computational\napproach, SSBlazer, which is an explainable and scalable deep learning framework for genome-wide\nnucleotide-resolution SSB site prediction. We demonstrated that SSBlazer can accurately predict\nSSB sites and suf\ufb01ciently alleviate false positives by constructing an imbalanced dataset to simulate\nthe realistic SSB distribution. The model interpretation analysis reveals that SSBlazer captures\nthe pattern of individual CpG in genomic context and the motif of TGCC in the center region as\ncritical features. Besides, SSBlazer is a lightweight model with robust cross-species generalization\nability in the cross-species evaluation, which enables the large-scale genome-wide application in\ndiverse species. Strikingly, the putative SSB genomic landscapes of 216 vertebrates reveal a negative\ncorrelation between SSB frequency and evolutionary hierarchy, suggesting that the genome tends to\nbe integrity during evolution."}, {"group": "Structural Biology", "id": 74, "label": "Predicting microsatellite instability and key biomarkers in colorectal cancer", "shape": "dot", "size": 10, "title": "Authors: Xgyu Li, Jitendra Jonnagaddala, Hong Zhang, Xu Steven Xu, Jitendra Jonnagaddala, Hong Zhang, Xu Steven Xu\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Structural Biology", "id": 77, "label": "Prognostic Significance of Tumor-Infiltrating Lymphocytes Determined Using Deep Learning on Colorectal Cancer Pathology Images", "shape": "dot", "size": 10, "title": "Authors: Anran Liu, Xingyu Li, Hgyi Wu, Bangwei Guo, Jitendra Jnagaddala, Hg Zhang, Xu Steven Xu\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Structural Biology", "id": 79, "label": "Microsoft Word - Paper-Zahra-InfiltrationArxiv.docx", "shape": "dot", "size": 10, "title": "Authors: Drew Parker,, Hamed Akbari,, Spyridon Bakas,,, Ronald L. Wolf, Steven, Brem, Ragini Verma,, Zahra Riahi Samani\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: In malignant primary brain tumors, cancer cells infiltrate into the peritumoral brain structures which \nresults in inevitable recurrence. Quantitative assessment of infiltrative heterogeneity in the peritumoral \nregion, the area where biopsy or resection can be hazardous, is important for clinical decision making. \nPrevious work on characterizing the infiltrative heterogeneity in the peritumoral region used various \nimaging modalities, but information of extracellular free water movement restriction has been limitedly \nexplored. Here, we derive a unique set of Artificial Intelligence (AI)-based markers capturing the \nheterogeneity of tumor infiltration, by characterizing free water movement restriction in the peritumoral \nregion using Diffusion Tensor Imaging (DTI)-based free water volume fraction maps. A novel voxel-wise \ndeep learning-based peritumoral microenvironment index (PMI) is first extracted by leveraging the widely \ndifferent water diffusivity properties of glioblastomas and brain metastases as regions with and without \ninfiltrations in the peritumoral tissue. Descriptive characteristics of locoregional hubs of uniformly high \nPMI values are extracted as AI-based markers to capture distinct aspects of infiltrative heterogeneity. The \nproposed markers are applied to two clinical use cases on an independent population of 275 adult-type \ndiffuse gliomas (CNS WHO grade 4), analyzing the duration of survival among Isocitrate-Dehydrogenase \n1 (IDH1)-wildtypes and the differences with IDH1-mutants. Our findings provide a panel of markers as \nsurrogates of infiltration that captures unique insight about underlying biology of peritumoral \nmicrostructural heterogeneity, establishing them as biomarkers of prognosis pertaining to survival and \nmolecular stratification, with potential applicability in clinical decision making."}, {"group": "Structural Biology", "id": 136, "label": "Deep Learning models for benign and malign Ocular Tumor Growth Estimation", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Relatively abundant availability of medical imaging data has provided significant support in the \ndevelopment and testing of Neural Network based image processing methods. Clinicians often face issues \nin selecting suitable image processing algorithm for medical imaging data. A strategy for the selection of a \nproper model is presented here. The training data set comprises optical coherence tomography (OCT) and \nangiography (OCT-A) images of 50 mice eyes with more than 100 days follow-up. The data contains \nimages from treated and untreated mouse eyes. \nFour deep learning variants are tested for automatic (a) differentiation of tumor region with healthy retinal \nlayer and (b) segmentation of 3D ocular tumor volumes. Exhaustive sensitivity analysis of deep learning \nmodels is performed with respect to the number of training and testing images using 8 eight performance \nindices to study accuracy, reliability/reproducibility, and speed. U-net with UVgg16 is best for malign \ntumor data set with treatment (having considerable variation) and U-net with Inception backbone for benign \ntumor data (with minor variation). Loss value and root mean square error (R.M.S.E.) are found most and \nleast sensitive performance indices, respectively. The performance (via indices) is found to be exponentially \nimproving regarding a number of training images. The segmented OCT-Angiography data shows that \nneovascularization drives the tumor volume. Image analysis shows that photodynamic imaging-assisted \ntumor treatment protocol is transforming an aggressively growing tumor into a cyst. \nAn empirical expression is obtained to help medical professionals to choose a particular model given the \nnumber of images and types of characteristics.  \nWe recommend that the presented exercise should be taken as standard practice before employing a \nparticular deep learning model for biomedical image analysis. \n \nKeywords: Deep CNN, OCT Imaging, OCT \nAngiography, Image Segmentation, Cancer \ngrowth. \n1."}, {"group": "Structural Biology", "id": 83, "label": "Autonomous Monitoring of Pharmaceutical R\u0026D Laboratories with 6 Axis Arm Equipped Quadruped Robot and Generative AI: A Preliminary Study", "shape": "dot", "size": 10, "title": "Authors: Shunichi Hato, Nozomi Ogawa\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: \u2014This paper presents a proof-of-concept study that\nexamines the utilization of generative AI and mobile robotics for\nautonomous laboratory monitoring in the pharmaceutical R\u0026D\nlaboratory. The study investigates the potential advantages of\nanomaly detection and automated reporting by multi-modal model\nand Vision Foundation Model (VFM), which have the potential\nto enhance compliance and safety in laboratory environments.\nAdditionally, the paper discusses the current limitations of the\ngenerative AI approach and proposes future directions for its\napplication in lab monitoring.\nIndex Terms\u2014Quadruped, Mobile Robotics, Autonomous In-\nspection, Laboratory Automation\nI."}, {"group": "Structural Biology", "id": 89, "label": "Stimulate the Potential of Robots via Competition", "shape": "dot", "size": 10, "title": "Authors: Kangyao Huang, Di Guo, Xinyu Zhang, Xiangyang Ji, Huaping Liu\u2020\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: \u2014 It is common for us to feel pressure in a competi-\ntion environment, which arises from the desire to obtain success\ncomparing with other individuals or opponents. Although we\nmight get anxious under the pressure, it could also be a drive\nfor us to stimulate our potentials to the best in order to keep\nup with others. Inspired by this, we propose a competitive\nlearning framework which is able to help individual robot to\nacquire knowledge from the competition, fully stimulating its\ndynamics potential in the race. Specifically, the competition\ninformation among competitors is introduced as the additional\nauxiliary signal to learn advantaged actions. We further build\na Multiagent-Race environment, and extensive experiments are\nconducted, demonstrating that robots trained in competitive\nenvironments outperform ones that are trained with SoTA\nalgorithms in single robot environment.\nI."}, {"group": "Structural Biology", "id": 141, "label": "Water penetrating radar (WPR) in archaeology: A crannog case study", "shape": "dot", "size": 10, "title": "Authors: lastair Ruffell\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: WPR has had limited use in freshwater archaeology and can provide superb 2D data over sites with appropriate \nwater type and depth, such as exists in this case study at Castlewellan Lake, Northern Ireland. Here, a submerged \ncrannog (Prehistoric, usually Bronze Age to Medieval human structure in water) is only shown on one historic \nmap, yet is not presently visible nor on other historic/recent maps. This work used a desktop study, sonar and \nWPR to characterise the submerged structure as a crannog. The asymmetry, bathymetric position, upper surface \n(rock slabs) and general topography of the crannog are determined, yet the variable makeup of its interior and \nsides allow numerous theories and possibilities for further, probably non-invasive investigation. The limits, \nproblems, data processing and uses of WPR for archaeology in this environment are described, some of which \nmay be useful in other studies of freshwater archaeology, including crannogs, flooded dwellings, walkways/ \npiers/jetties and military archaeology.   \n1."}, {"group": "Structural Biology", "id": 142, "label": "Who\u2019s eating pork? Investigating pig breeding and consumption in Byzantine, Islamic and Norman/Aragonese Sicily (7th-14th c. AD)", "shape": "dot", "size": 10, "title": "Authors: Veronica Aniceti, Umberto Albarella\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: This paper investigates the culture of pork consumption in Sicily by examining a number of archaeological faunal \nassemblages dated to chronological phases spanning from the Byzantine to the Norman/Aragonese period (7th- \n14th c. AD). Zooarchaeological analyses reveal substantial diachronic changes in the use of the main domesti\u00ad\ncates, particularly concerning pig frequencies. In the Islamic period (9th-11th c. AD), pig is poorly represented at \nurban sites; this is likely to reflect a socio-cultural acceptance of the Islamic religious precepts forbidding pork \nconsumption. By contrast, and in continuity with the Roman and Byzantine periods, pigs are well-represented in \nrural settlements, thus indicating a more resilient attitude of these communities toward newly imported religious \ntraditions. In the later Norman/Aragonese period, the frequency of pig increases at some urban sites, reflecting \nthe fact that that pork prohibition had been lifted and that new food production and consumption practices were \ndeveloped. Pig continues, however, to be almost absent at a number of urban sites and castles/fortified villages; \nthis may suggest the persistence of Islamised communities in Sicily after the end of Islamic rule.   \n1."}, {"group": "Structural Biology", "id": 131, "label": "The morphological variability of Maltese \u2018cart ruts\u2019 and its implications", "shape": "dot", "size": 10, "title": "Authors: Huw S. Groucutt\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Hundreds of \u2018cart ruts\u2019 \u2013 pairs of incised parallel grooves in the bedrock \u2013 are found across the Maltese Archi\u00ad\npelago in the central Mediterranean. The age, functional association, formation processes, and taphonomic \nalteration of these ruts, which occur here with a globally unrivalled frequency, has been much debated. \nGenerally seen as being created by erosion from vehicles such as wheeled carts, or alternatively being cut into the \nrock to facilitate movement of such vehicles, specific models range from the use of carts to move soil in the \nNeolithic to them reflecting classical era stone quarrying, and many other possibilities. One interesting aspect \nconcerns the morphological variability of the cart ruts, such as the notion that they have a standard gauge (width \nbetween ruts), and that this gauge is very similar to that of modern railway tracks. Evaluating the morphological \nvariability of the cart ruts contributes to an understanding of the phenomenon, as, for instance, we might expect \nthat if they date to different periods, with different functions, and/or were extensively modified by geomor\u00ad\nphological processes this will be reflected in the character of their morphological variability. The analysis sug\u00ad\ngests that cart ruts are fairly standardised in terms of basic measurements such as widths and depth, perhaps \nsuggesting that they are of a consistent age and function. This study identified a need for definitional clarity as \nthe commonly cited gauge measurements are not taken in the same way as gauge is defined for railway tracks. \nThere are hints of rut shape changes reflecting extensive use and or processes such as limestone dissolution, \nwhich give insights into their formation histories.   \n1."}, {"group": "Structural Biology", "id": 133, "label": "The search for a needle in a haystack \u2013 New studies on plant use during the Mesolithic in southwest Central Europe", "shape": "dot", "size": 10, "title": "Authors: Stefnie Jcomet, Ptrici Vndorpe\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: The existence of Mesolithic agriculture is a subject of debate in the archaeobotanist community. So far, reliable \nand AMS-dated on-site evidence of cereal macro remains are lacking to support the hypothesis. Archaeobotanical \nanalysis of two rock shelters with Mesolithic occupation layers in NE-France and SW-Switzerland, namely Lutter, \nAbri St. Joseph (FR) and Arconciel, La Souche (CH), revealed the presence of cereal remains within the Meso\u00ad\nlithic deposits. They gave rise to a possible answer to the question, however direct dating of the individual cereal \ngrains revealed their intrusive nature in the older deposits. The main aim of this paper is to place the newly \nacquired data from both sites in the broader framework of archaeobotanical research on Mesolithic sites in \nCentral Europe with a special focus on methodological and taphonomic issues often encountered at such sites.   \n1."}, {"group": "Structural Biology", "id": 134, "label": "Three-colored Sancai glazed ceramics excavated from Bohai sites in Primorye (Russia)", "shape": "dot", "size": 10, "title": "Authors: Buravlev, E.G. Lapo, V.A. Pimenov, A.V. Martynenko,  (Balhae) , \u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: This paper presents the analytical results of polychrome and monochrome lead-glazed ceramic classified as \nSancai that was excavated from the Bohai sites of Kraskino and Gorbatka walled towns, and the Chernyatino-2 \nsettlement (Bohai layer) (Primorye, Russia). Thirty ceramic fragments were analyzed using non-destructive X-ray \nfluorescence analysis (pXRF), optical microscopy, and scanning electron microscopy (SEM) with energy- \ndispersive x-ray spectroscopy (EDS). This work presents new data on the elemental composition of lead glazes \nand discusses some aspects of their technology, including assumptions about the medieval potters\u2019 skill level and \ntechnological awareness. Data pertaining to the sample\u2019s elemental composition indicates their origin from \nvarious workshops practicing different approaches to pottery production. These ceramics have no slip layer with \nthe glaze coating having been applied directly onto the surface of the ceramic vessels. The intensity of the lead \ncomponent in the glaze composition varies significantly, in the range of concentration between 36 and 79 wt%. \nSurface features of filling and shine, as well as the nature of glaze defects demonstrates a low probability of the \npeak firing approach that was applied in the technological process. The results presented in this paper contribute \nto expanding our understanding of the Bohai (CE 698\u2013926) and Tang (CE 618\u2013907) periods for Sancai ceramics.   \n1."}, {"group": "Structural Biology", "id": 139, "label": "Uniform in diversity: Typological and technological analysis of Bronze Age fine ware from Kakucs-Turj\u00e1n", "shape": "dot", "size": 10, "title": "Authors: Attila Kreiter c, Gabriella Kulcs\u00b4ar d\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: The ceramic variability of fine ware pottery in Early and Middle Bronze Age Carpathian Basin (2600/ \n2500\u20131500/1450 BCE) has been used as an argument for the existence of distinct, large-scale communities. The \nrecent technological studies of coarse ware ceramics have shown that different stylistic groups are characterized \nby uniform technological traits, suggesting that current narratives result from an a priori classification of material \nculture. To verify whether fine ware ceramics were characterized by similar traits, a sample of 33 vessels from a \nmulti-layered, fortified settlement of Kakucs-Turj\u00b4an (Hungary) was analyzed in terms of vessel forms and un\u00ad\nderlying production processes. The analyses compared the classical local and non-local provenance objects to \ndetermine whether the impressionistic categorization of vessels is supported by discrete parameters. The results \nindicate that similarly to coarse ware, Early and Middle Bronze Age ceramics in the Carpathian Basin was \ncharacterized by uniform production processes suggesting the impact of multi-directional and persisting inter\u00ad\naction across the Carpathian Basin.   \n1."}, {"group": "Structural Biology", "id": 140, "label": "Velika Pe\u0107ina: Zooarchaeology, taphonomy and technology of a LGM Upper Paleolithic site in the central Balkans (Serbia)", "shape": "dot", "size": 10, "title": "Authors:  Pe\u00b4c, Mry C. Ster, Vesn Dimitrijevi\u00b4c b, Dusn Mihilovi\u00b4c b, Steven L. Kuhn\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: The Last Glacial Maximum (MIS 2) was a period of rapid and extreme environmental change, prompting \nremarkable human adaptive responses across the world. While large parts of the temperate zone were unin\u00ad\nhabitable during this interval, other areas served as refugia for plant, animal and human populations. The \nBalkans region is identified as a biotic refugium zone for many species during high glacial intervals, but until \nrecently there has been little archaeological evidence that it was also a refugium for Paleolithic human pop\u00ad\nulations. This paper reports archaeological findings from the cave site of Velika Pe\u00b4cina (\u02c7Zagubica, Serbia), which \npreserves evidence for multiple episodes of human presence between 24,000 and 20,500 cal BP. Species com\u00ad\nbinations within the macro- and microfaunas attest to a mosaic environment with high habitat and species di\u00ad\nversity over relatively small areas in the periods leading into, during, and following the LGM. Humans hunted a \nwide spectrum of large mammals, birds, and small carnivores while occupying Velika Pe\u00b4cina. Other mammalian \nand avian carnivores used the cave when humans were not present. Lithic and osseous artifact assemblages \nindicate that a range of manufacturing activities took place in the cave, despite the relatively low density of \noccupational debris. The late Upper Paleolithic groups used the cave as a residential base during a series of brief, \nprobably seasonal visits. Human populations were small in the study area, but their presence was not diminished \nduring episodes of extreme variation in global climate.   \n1."}, {"group": "Structural Biology", "id": 135, "label": "IMAGING DYNAMICS BENEATH TURBID MEDIA VIA PARALLELIZED SINGLE-PHOTON DETECTION", "shape": "dot", "size": 10, "title": "Authors: Shiqi Xu, Xi Yang, Wenhui Liu,, Joakim Jonsson, Ruobing Qian, Pavan Chandra Konda, Kevin C. Zhou, Lucas, Kreiss, Qionghai Dai, Haoqian Wang, Edouard Berrocal, Roarke Horstmeyer,,\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Noninvasive optical imaging through dynamic scattering media has numerous important biomedical\napplications but still remains a challenging task. While standard diffuse imaging methods measure\noptical absorption or \ufb02uorescent emission, it is also well-established that the temporal correlation of\nscattered coherent light diffuses through tissue much like optical intensity. Few works to date, however,\nhave aimed to experimentally measure and process such temporal correlation data to demonstrate\ndeep-tissue video reconstruction of decorrelation dynamics. In this work, we utilize a single-photon\navalanche diode (SPAD) array camera to simultaneously monitor the temporal dynamics of speckle\n\ufb02uctuations at the single-photon level from 12 different phantom tissue surface locations delivered\nvia a customized \ufb01ber bundle array. We then apply a deep neural network to convert the acquired\nsingle-photon measurements into video of scattering dynamics beneath rapidly decorrelating tissue\nphantoms. We demonstrate the ability to reconstruct images of transient (0.1-0.4s) dynamic events\noccurring up to 8 mm beneath a decorrelating tissue phantom with millimeter-scale resolution, and\nhighlight how our model can \ufb02exibly extend to monitor \ufb02ow speed within buried phantom vessels."}, {"group": "Structural Biology", "id": 65, "label": "Causality in Cardiorespiratory Signals in Pediatric Cardiac Patients", "shape": "dot", "size": 10, "title": "Authors: Granger\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: \u2014 Four different Granger causality-based methods -\none linear and three nonlinear (Granger Causality, Kernel \nGranger Causality, large-scale Nonlinear Granger Causality, \nand Neural Network Granger Causality) were used for \nassessment and causal-based quantification of the respiratory \nsinus arrythmia (RSA) in the group of pediatric cardiac patients, \nbased on the single-lead ECG and impedance pneumography \nsignals (the latter as the tidal volume curve equivalent). Each \nmethod was able to detect the dependency (in terms of causal \ninference) between respiratory and cardiac signals. The \ncorrelations between quantified RSA and the demographic \nparameters were also studied, but the results differ for each \nmethod. \n \nClinical relevance\u2014 The presented methods (among which \nNNGC seems to be the most valid) allow for quantification of \nRSA and study of dependency between tidal volume and RR \nintervals, which may help to better understand association \nbetween respiratory and cardiovascular systems in different \npopulations.  \nI."}, {"group": "Structural Biology", "id": 69, "label": "Bridging the gap between target-based and cell-based drug", "shape": "dot", "size": 10, "title": "Authors: Fan Hu, Dongqi Wang, Huazhen Huang, Yishen Hu, Peng Yin\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Structural Biology", "id": 75, "label": "Revised calculation of the coefficient of parentage in plant breeding", "shape": "dot", "size": 10, "title": "Authors: Carlos Hernandez-Suareza,\u2217\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: The Coe\ufb03cient of Parentage (COP) between two individuals is the expected\ninbreeding of their o\ufb00spring. Originally exploited by animal breeders, is now a\nroutine calculation among plant breeders as part of crop improvement programs.\nHere we show that the COP between strains requires a di\ufb00erent calculation than\nthe used to calculate the COP between individuals. Failure to do so may result\nin an overestimation of the amount of inbreeding. Here we provide a simple\nmethodology to calculate the correct coe\ufb03cient of parentage between strains.\nKeywords:\nCoe\ufb03cient of parentage, Coe\ufb03cient of inbreeding, Coe\ufb03cient of\nkinship, Coe\ufb03cient of coancestry, COP\n1."}]);
