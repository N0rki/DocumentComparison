              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"group": "Natural Language Processing", "id": 0, "label": "HDReason: Algorithm-Hardware Codesign for Hyperdimensional Knowledge Graph Reasoning", "shape": "dot", "size": 10, "title": "Authors: Hanning Chen, Yang Ni, Ali Zakeri, Zhuowen Zou, Sanggeon Yun, Fei Wen, Khaleghi, Narayan Srinivasa, Hugo Latapie, Mohsen Imani\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: In recent times, a plethora of hardware accelerators have\nbeen put forth for graph learning applications such as vertex\nclassification and graph classification. However, previous\nworks have paid little attention to Knowledge Graph Com-\npletion (KGC), a task that is well-known for its significantly\nhigher algorithm complexity. The state-of-the-art KGC so-\nlutions based on graph convolution neural network (GCN)\ninvolve extensive vertex/relation embedding updates and\ncomplicated score functions, which are inherently cumber-\nsome for acceleration. As a result, existing accelerator de-\nsigns are no longer optimal, and a novel algorithm-hardware\nco-design for KG reasoning is needed.\nRecently, brain-inspired HyperDimensional Computing\n(HDC) has been introduced as a promising solution for light-\nweight machine learning, particularly for graph learning\napplications. In this paper, we leverage HDC for an intrin-\nsically more efficient and acceleration-friendly KGC algo-\nrithm. We also co-design an acceleration framework named\nHDReason targeting FPGA platforms. On the algorithm level,\nHDReason achieves a balance between high reasoning ac-\ncuracy, strong model interpretability, and less computation\ncomplexity. In terms of architecture, HDReason offers re-\nconfigurability, high training throughput, and low energy\nconsumption. When compared with NVIDIA RTX 4090 GPU,\nthe proposed accelerator achieves an average 10.6\u00d7 speedup\nand 65\u00d7 energy efficiency improvement. When conducting\ncross-models and cross-platforms comparison, HDReason\nyields an average 4.2\u00d7 higher performance and 3.4\u00d7 better\nenergy efficiency with similar accuracy versus the state-of-\nthe-art FPGA-based GCN training platform."}, {"group": "Natural Language Processing", "id": 14, "label": "Missed Connections: Lateral Thinking Puzzles for Large Language Models", "shape": "dot", "size": 10, "title": "Authors: Graham Todd, Tim Merino, Sam Earle, Julian Togelius\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: \u2014The Connections puzzle published each day by the\nNew York Times tasks players with dividing a bank of sixteen\nwords into four groups of four words that each relate to\na common theme. Solving the puzzle requires both common\nlinguistic knowledge (i.e. definitions and typical usage) as well as,\nin many cases, lateral or abstract thinking. This is because the\nfour categories ascend in complexity, with the most challenging\ncategory often requiring thinking about words in uncommon\nways or as parts of larger phrases. We investigate the capacity for\nautomated AI systems to play Connections and explore the game\u2019s\npotential as an automated benchmark for abstract reasoning\nand a way to measure the semantic information encoded by\ndata-driven linguistic systems. In particular, we study both a\nsentence-embedding baseline and modern large language models\n(LLMs). We report their accuracy on the task, measure the\nimpacts of chain-of-thought prompting, and discuss their failure\nmodes. Overall, we find that the Connections task is challenging\nyet feasible, and a strong test-bed for future work.\nIndex Terms\u2014Language models, reasoning, AI, evaluation\nI."}, {"group": "Natural Language Processing", "id": 22, "label": "P-NAL: an Effective and Interpretable Entity Alignment Method", "shape": "dot", "size": 10, "title": "Authors: Jingwei Cheng, Zhg\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Entity alignment (EA) aims to find equivalent entities between two\nKnowledge Graphs. Existing embedding-based EA methods usually\nencode entities as embeddings, triples as embeddings\u2019 constraint\nand learn to align the embeddings. The structural and side informa-\ntion are usually utilized via embedding propagation, aggregation\nor interaction. However, the details of the underlying logical in-\nference steps among the alignment process are usually omitted,\nresulting in inadequate inference process. In this paper, we intro-\nduce P-NAL, an entity alignment method that captures two types\nof logical inference paths with Non-Axiomatic Logic (NAL). Type I\nis the bridge-like inference path between to-be-aligned entity pairs,\nconsisting of two relation/attribute triples and a similarity sentence\nbetween the other two entities. Type II links the entity pair by\ntheir embeddings. P-NAL iteratively aligns entities and relations\nby integrating the conclusions of the inference paths. Moreover,\nour method is logically interpretable and extensible due to the ex-\npressiveness of NAL. Our proposed method is suitable for various\nEA settings. Experimental results show that our method outper-\nforms state-of-the-art methods in terms of Hits@1, achieving 0.98+\non all three datasets of \ud835\udc37\ud835\udc35\ud835\udc4315\ud835\udc3ewith both supervised and unsu-\npervised settings. To our knowledge, we present the first in-depth\nanalysis of entity alignment\u2019s basic principles from a unified logical\nperspective."}, {"group": "Natural Language Processing", "id": 25, "label": "Variational Multi-Modal Hypergraph Attention Network for Multi-Modal Relation Extraction", "shape": "dot", "size": 10, "title": "Authors: Jianxin Li\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Multi-modal relation extraction (MMRE) is a challenging task that\naims to identify relations between entities in text leveraging im-\nage information. Existing methods are limited by their neglect of\nthe multiple entity pairs in one sentence sharing very similar con-\ntextual information (i.e., the same text and image), resulting in\nincreased difficulty in the MMRE task. To address this limitation,\nwe propose the Variational Multi-Modal Hypergraph Attention Net-\nwork (VM-HAN) for multi-modal relation extraction. Specifically,\nwe first construct a multi-modal hypergraph for each sentence\nwith the corresponding image, to establish different high-order\nintra-/inter-modal correlations for different entity pairs in each\nsentence. We further design the Variational Hypergraph Attention\nNetworks (V-HAN) to obtain representational diversity among dif-\nferent entity pairs using Gaussian distribution and learn a better\nhypergraph structure via variational attention. VM-HAN achieves\nstate-of-the-art performance on the MMRE task, outperforming\nexisting methods in terms of accuracy and efficiency.\nCCS CONCEPTS\n\u2022 Computing methodologies \u2192Information extraction.\nKEYWORDS\nMulti-modal relation extraction, hypergraph attention network.\n\u2217Corresponding author\nPermission to make digital or hard copies of all or part of this work for personal or\nclassroom use is granted without fee provided that copies are not made or distributed\nfor profit or commercial advantage and that copies bear this notice and the full citation\non the first page. Copyrights for components of this work owned by others than the\nauthor(s) must be honored. Abstracting with credit is permitted. To copy otherwise, or\nrepublish, to post on servers or to redistribute to lists, requires prior specific permission\nand/or a fee. Request permissions from permissions@acm.org.\nACM MM, 2024, Melbourne, Australia\n\u00a9 2024 Copyright held by the owner/author(s). Publication rights licensed to ACM.\nACM ISBN 978-x-xxxx-xxxx-x/YY/MM\nhttps://doi.org/10.1145/nnnnnnn.nnnnnnn"}, {"group": "Natural Language Processing", "id": 46, "label": "FeatAug: Automatic Feature Augmentation From One-to-Many Relationship Tables", "shape": "dot", "size": 10, "title": "Authors: Danrui Qi, Weiling Zheng, Jiannan Wang\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: \u2014Feature augmentation from one-to-many relation-\nship tables is a critical but challenging problem in ML model\ndevelopment. To augment good features, data scientists need to\ncome up with SQL queries manually, which is time-consuming.\nFeaturetools [1] is a widely used tool by the data science commu-\nnity to automatically augment the training data by extracting\nnew features from relevant tables. It represents each feature\nas a group-by aggregation SQL query on relevant tables and\ncan automatically generate these SQL queries. However, it does\nnot include predicates in these queries, which significantly limits\nits application in many real-world scenarios. To overcome this\nlimitation, we propose FEATAUG, a new feature augmentation\nframework that automatically extracts predicate-aware SQL\nqueries from one-to-many relationship tables. This extension\nis not trivial because considering predicates will exponentially\nincrease the number of candidate queries. As a result, the original\nFeaturetools framework, which materializes all candidate queries,\nwill not work and needs to be redesigned. We formally define the\nproblem and model it as a hyperparameter optimization problem.\nWe discuss how the Bayesian Optimization can be applied here\nand propose a novel warm-up strategy to optimize it. To make our\nalgorithm more practical, we also study how to identify promising\nattribute combinations for predicates. We show that how the\nbeam search idea can partially solve the problem and propose\nseveral techniques to further optimize it. Our experiments on\nfour real-world datasets demonstrate that FeatAug extracts more\neffective features compared to Featuretools and other baselines.\nThe code is open-sourced at https://github.com/sfu-db/FeatAug.\nIndex Terms\u2014automatic feature augmentation, automatic fea-\nture engineering, data preparation, one-to-many relational tables\nI."}, {"group": "Natural Language Processing", "id": 48, "label": "LIST: Learning to Index Spatio-Textual Data for Embedding based Spatial Keyword Queries", "shape": "dot", "size": 10, "title": "Authors: Ziqi Yin\u2020, Shanshan Feng\u2021, Shang Liu\u2020, Gao Cong\u2020, Yew Soon Ong\u2020\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: \u2014With the proliferation of spatio-textual data, Top-\nk KNN spatial keyword queries (TkQs), which return a list of\nobjects based on a ranking function that evaluates both spatial\nand textual relevance, have found many real-life applications.\nExisting geo-textual indexes for TkQs use traditional retrieval\nmodels like BM25 to compute text relevance and usually exploit\na simple linear function to compute spatial relevance, but its\neffectiveness is limited. To improve effectiveness, several deep\nlearning models have recently been proposed, but they suffer\nsevere efficiency issues. To the best of our knowledge, there are\nno efficient indexes specifically designed to accelerate the top-k\nsearch process for these deep learning models.\nTo tackle these issues, we propose a novel technique, which\nLearns to Index the Spatio-Textual data for answering em-\nbedding based spatial keyword queries (called LIST). LIST\nis featured with two novel components. Firstly, we propose a\nlightweight and effective relevance model that is capable of learn-\ning both textual and spatial relevance. Secondly, we introduce a\nnovel machine learning based Approximate Nearest Neighbor\nSearch (ANNS) index, which utilizes a new learning-to-cluster\ntechnique to group relevant queries and objects together while\nseparating irrelevant queries and objects. Two key challenges\nin building an effective and efficient index are the absence of\nhigh-quality labels and unbalanced clustering results. We develop\na novel pseudo-label generation technique to address the two\nchallenges. Experimental results show that LIST significantly\noutperforms state-of-the-art methods on effectiveness, with im-\nprovements up to 19.21% and 12.79% in terms of NDCG@1\nand Recall@10, and is three orders of magnitude faster than the\nmost effective baseline.\nI."}, {"group": "Natural Language Processing", "id": 51, "label": "Query Rewriting via Large Language Models", "shape": "dot", "size": 10, "title": "Authors: Jie Liu, Barzan Mozafari\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Query rewriting is one of the most effective techniques for coping\nwith poorly written queries before passing them down to the query\noptimizer. Manual rewriting is not scalable, as it is error-prone\nand requires deep expertise. Similarly, traditional query rewriting\nalgorithms can only handle a small subset of queries: rule-based\ntechniques do not generalize to new query patterns and synthesis-\nbased techniques cannot handle complex queries. Fortunately, the\nrise of Large Language Models (LLMs), equipped with broad general\nknowledge and advanced reasoning capabilities, has created hopes\nfor solving some of these previously open problems.\nIn this paper, we present GenRewrite, the first holistic system\nthat leverages LLMs for query rewriting. We introduce the notion of\nNatural Language Rewrite Rules (NLR2s), and use them as hints to\nthe LLM but also a means for transferring knowledge from rewrit-\ning one query to another, and thus becoming smarter and more\neffective over time. We present a novel counterexample-guided\ntechnique that iteratively corrects the syntactic and semantic errors\nin the rewritten query, significantly reducing the LLM costs and the\nmanual effort required for verification. GenRewrite speeds up 22\nout of 99 TPC queries (the most complex public benchmark) by more\nthan 2x, which is 2.5x\u20133.2x higher coverage than state-of-the-art\ntraditional query rewriting and 2.1x higher than the out-of-the-box\nLLM baseline.\nPVLDB Reference Format:\nJie Liu and Barzan Mozafari. Query Rewriting via Large Language Models.\nPVLDB, 14(1): XXX-XXX, 2020.\ndoi:XX.XX/XXX.XX\nPVLDB Artifact Availability:\nThe source code, data, and/or other artifacts have been made available at\nURL_TO_YOUR_ARTIFACTS."}, {"group": "Natural Language Processing", "id": 53, "label": "Schema-Aware Multi-Task Learning for Complex Text-to-SQL", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Conventional text-to-SQL parsers are not good\nat synthesizing complex SQL queries that in-\nvolve multiple tables or columns, due to the\nchallenges inherent in identifying the correct\nschema items and performing accurate align-\nment between question and schema items. To\naddress the above issue, we present a schema-\naware multi-task learning framework (named\nMTSQL) for complicated SQL queries. Specif-\nically, we design a schema linking discrimina-\ntor module to distinguish the valid question-\nschema linkings, which explicitly instructs\nthe encoder by distinctive linking relations to\nenhance the alignment quality.\nOn the de-\ncoder side, we define 6-type relationships to\ndescribe the connections between tables and\ncolumns (e.g., WHERE_TC), and introduce\nan operator-centric triple extractor to recognize\nthose associated schema items with the prede-\nfined relationship. Also, we establish a rule set\nof grammar constraints via the predicted triples\nto filter the proper SQL operators and schema\nitems during the SQL generation. On Spider, a\ncross-domain challenging text-to-SQL bench-\nmark, experimental results indicate that MT-\nSQL is more effective than baselines, especially\nin extremely hard scenarios. Moreover, fur-\nther analyses verify that our approach leads to\npromising improvements for complicated SQL\nqueries."}, {"group": "Structural Biology", "id": 54, "label": "Accelerating Regular Path Queries over Graph Database with Processing-in-Memory", "shape": "dot", "size": 10, "title": "Authors: Ruoyan Ma, Shengan Zheng, Guifeng Wang, Jin Pu, Yifan Hua, Wentao Wang, Linpeng Huang, Jiao Tong University\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Regular path queries (RPQs) in graph databases are bottlenecked\nby the memory wall. Emerging processing-in-memory (PIM) tech-\nnologies offer a promising solution to dispatch and execute path\nmatching tasks in parallel within PIM modules. We present Mocto-\npus, a PIM-based data management system for graph databases that\nsupports efficient batch RPQs and graph updates. Moctopus em-\nploys a PIM-friendly dynamic graph partitioning algorithm, which\ntackles graph skewness and preserves graph locality with low over-\nhead for RPQ processing. Moctopus enables efficient graph update\nby amortizing the host CPU\u2019s update overhead to PIM modules.\nEvaluation of Moctopus demonstrates superiority over the state-of-\nthe-art traditional graph database.\nKEYWORDS\nRegular Path Query, Processing-in-Memory, path matching, graph\npartition, load balance"}, {"group": "Natural Language Processing", "id": 57, "label": "VDTuner: Automated Performance Tuning for Vector Data Management Systems", "shape": "dot", "size": 10, "title": "Authors: Tiannuo Yang, Wen Hu, Wangqi Peng, Yusen Li, Jianguo Li, Gang Wang, Xiaoguang Liu, yangtn, liyusen\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: \u2014Vector data management systems (VDMSs) have\nbecome an indispensable cornerstone in large-scale information\nretrieval and machine learning systems like large language\nmodels. To enhance the efficiency and flexibility of similarity\nsearch, VDMS exposes many tunable index parameters and\nsystem parameters for users to specify. However, due to the\ninherent characteristics of VDMS, automatic performance tuning\nfor VDMS faces several critical challenges, which cannot be well\naddressed by the existing auto-tuning methods.\nIn this paper, we introduce VDTuner, a learning-based au-\ntomatic performance tuning framework for VDMS, leveraging\nmulti-objective Bayesian optimization. VDTuner overcomes the\nchallenges associated with VDMS by efficiently exploring a\ncomplex multi-dimensional parameter space without requiring\nany prior knowledge. Moreover, it is able to achieve a good\nbalance between search speed and recall rate, delivering an\noptimal configuration. Extensive evaluations demonstrate that\nVDTuner can markedly improve VDMS performance (14.12%\nin search speed and 186.38% in recall rate) compared with\ndefault setting, and is more efficient compared with state-of-the-\nart baselines (up to 3.57\u00d7 faster in terms of tuning time). In\naddition, VDTuner is scalable to specific user preference and\ncost-aware optimization objective. VDTuner is available online\nat https://github.com/tiannuo-yang/VDTuner.\nIndex\nTerms\u2014vector\ndatabase,\nparameter\ntuning,\nsearch\nspeed, recall rate, machine learning\nI."}, {"group": "Structural Biology", "id": 62, "label": "AI-driven Hypergraph Network of Organic Chemistry:  Network Statistics and Applications in Reaction Classification", "shape": "dot", "size": 10, "title": "Authors: Venkat Venkatasubramanian\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Rapid discovery of new reactions and molecules\nin recent years has been facilitated by the ad-\nvances in high throughput screening, accessibility\nto a highly complex chemical design space, and\nthe development of accurate molecular model-\ning frameworks. A holistic study of the grow-\ning chemistry literature is, therefore, required\nthat focuses on understanding the recent trends\nin organic chemistry and extrapolating them to\ninfer possible future trajectories. To this end, sev-\neral network theory-based studies have been re-\nported that use a directed graph representation\nof chemical reactions. Here, we perform a study\nbased on representing chemical reactions as hy-\npergraphs where the nodes represent the partici-\npating molecules and hyperedges represent reac-\ntions between nodes. We use a standard reactions\ndataset to construct a hypergraph network of or-\nganic chemistry and report its statistics such as\ndegree distribution, average path length, assorta-\ntivity or degree correlations, PageRank centrality,\nand graph-based clusters (or communities). We\nalso compute each statistic for an equivalent di-\nrected graph representation of reactions to draw\nparallels and highlight differences between the\ntwo. To demonstrate the AI applicability of hyper-\ngraph reaction representation, we generate dense\nhypergraph embeddings and use them in the reac-\ntion classi\ufb01cation problem. We conclude that the\nhypergraph representation is \ufb02exible, preserves re-\naction context, and uncovers hidden insights that\nare otherwise not apparent in a traditional directed\ngraph representation of chemical reactions.\n1Department of Chemical Engineering, Columbia University,\nNew York, USA. Correspondence to: Venkat Venkatasubramanian\n\u003cvenkat@columbia.edu\u003e.\n1."}, {"group": "Political Science", "id": 94, "label": "Neighbor2vec: an ef\ufb01cient and effective method for Graph Embedding", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Graph embedding techniques have led to signi\ufb01-\ncant progress in recent years.\nHowever, present\ntechniques are not effective enough to capture the\npatterns of networks. This paper propose neigh-\nbor2vec, a neighbor-based sampling strategy used\nalgorithm to learn the neighborhood representa-\ntions of node, a framework to gather the struc-\nture information by feature propagation between\nthe node and its neighbors. We claim that neigh-\nbor2vec is a simple and effective approach to en-\nhancing the scalability as well as equality of graph\nembedding, and it breaks the limits of the exist-\ning state-of-the-art unsupervised techniques.\nWe\nconduct experiments on several node classi\ufb01ca-\ntion and link prediction tasks for networks such\nas ogbn-arxiv, ogbn-products, ogbn-proteins, ogbl-\nppa,ogbl-collab and ogbl-citation2.\nThe result\nshows that Neighbor2vec\u2019s representations pro-\nvide an average accuracy scores up to 6.8 percent\nhigher than competing methods in node classi\ufb01ca-\ntion tasks and 3.0 percent higher in link prediction\ntasks. The neighbor2vec\u2019s representations are able\nto outperform all baseline methods and two classi-\ncal GNN models in all six experiments."}, {"group": "Political Science", "id": 97, "label": "Differentially Describing Groups of Graphs", "shape": "dot", "size": 10, "title": "Authors: Sebastian Dalleiger,*, Jilles Vreeken\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: How does neural connectivity in autistic children differ from\nneural connectivity in healthy children or autistic youths?\nWhat patterns in global trade networks are shared across\nclasses of goods, and how do these patterns change over time?\nAnswering questions like these requires us to differentially\ndescribe groups of graphs: Given a set of graphs and a parti-\ntion of these graphs into groups, discover what graphs in one\ngroup have in common, how they systematically differ from\ngraphs in other groups, and how multiple groups of graphs are\nrelated. We refer to this task as graph group analysis, which\nseeks to describe similarities and differences between graph\ngroups by means of statistically signi\ufb01cant subgraphs. To per-\nform graph group analysis, we introduce GRAGRA, which\nuses maximum entropy modeling to identify a non-redundant\nset of subgraphs with statistically signi\ufb01cant associations to\none or more graph groups. Through an extensive set of ex-\nperiments on a wide range of synthetic and real-world graph\ngroups, we con\ufb01rm that GRAGRA works well in practice."}, {"group": "Political Science", "id": 98, "label": "VGAER: Graph Neural Network Reconstruction based Community Detection", "shape": "dot", "size": 10, "title": "Authors: Chenyang Qiu, Zhaoci Huang, Wenzhe Xu, Huijia Li, cyqiu\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Community detection is a fundamental and important issue\nin network science, but there are only a few community de-\ntection algorithms based on graph neural networks, among\nwhich unsupervised algorithms are almost blank. By fus-\ning the high-order modularity information with network fea-\ntures, this paper proposes a Variational Graph AutoEncoder\nReconstruction based community detection VGAER for the\n\ufb01rst time, and gives its non-probabilistic version. They do\nnot need any prior information. We have carefully designed\ncorresponding input features, decoder, and downstream tasks\nbased on the community detection task and these designs\nare concise, natural, and perform well (NMI values under\nour design are improved by 59.1% - 565.9%). Based on\na series of experiments with wide range of datasets and\nadvanced methods, VGAER has achieved superior perfor-\nmance and shows strong competitiveness and potential with\na simpler design. Finally, we report the results of algo-\nrithm convergence analysis and t-SNE visualization, which\nclearly depicted the stable performance and powerful net-\nwork modularity ability of VGAER. Our codes are available\nat https://github.com/qcydm/VGAER."}, {"group": "Natural Language Processing", "id": 102, "label": "A simple article template", "shape": "dot", "size": 10, "title": "Authors: Ran Ziv, Ilan Gronau, Michael Fire\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Entity Matching is an essential part of all real-world systems that take in structured and un-\nstructured data coming from di\ufb00erent sources. Typically no common key is available for connecting\nrecords. Massive data cleaning and integration processes require completion before any data ana-\nlytics, or further processing can be performed. Although record linkage is frequently regarded as a\nsomewhat tedious but necessary step, it reveals valuable insights, supports data visualization, and\nguides further analytic approaches to the data. Here, we focus on organization entity matching. We\nintroduce CompanyName2Vec, a novel algorithm to solve company entity matching (CEM) using a\nneural network model to learn company name semantics from a job ad corpus, without relying on\nany information on the matched company besides its name. Based on a real-world data, we show\nthat CompanyName2Vec outperforms other evaluated methods and solves the CEM challenge with\nan average success rate of 89.3%.\nKeywords: Entity Matching, Organization Name Matching, LSTM, CompanyName2Vec"}, {"group": "Natural Language Processing", "id": 107, "label": "Predicting Research Trends in Arti\ufb01cial Intelligence with Gradient Boosting Decision Trees and Time-aware Graph Neural Networks", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: \u2014The Science4cast 2021 competition focuses on pre-\ndicting future edges in an evolving semantic network, where each\nvertex represents an arti\ufb01cial intelligence concept, and an edge\nbetween a pair of vertices denotes that the two concepts have\nbeen investigated together in a scienti\ufb01c paper. In this paper,\nwe describe our solution to this competition. We present two\ndistinct approaches: a tree-based gradient boosting approach and\na deep learning approach, and demonstrate that both approaches\nachieve competitive performance. Our \ufb01nal solution, which is\nbased on a blend of the two approaches, achieved the 1st place\namong all the participating teams. The source code for this paper\nis available at https://github.com/YichaoLu/Science4cast2021.\nIndex Terms\u2014semantic network, link prediction, network\nanalysis, feature engineering, graph neural network\nI."}, {"group": "Political Science", "id": 109, "label": "Understanding Political Polarization via Jointly Modeling Users, Connections and Multimodal Contents on Heterogeneous Graphs", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Understanding political polarization on social platforms is\nimportant as public opinions may become increasingly ex-\ntreme when they are circulated in homogeneous communi-\nties, thus potentially causing damage in the real world. Au-\ntomatically detecting the political ideology of social media\nusers can help better understand political polarization. How-\never, it is challenging due to the scarcity of ideology la-\nbels, complexity of multimodal contents, and cost of time-\nconsuming data collection process. Most previous frame-\nworks either focus on unimodal content or do not scale up\nwell. In this study, we adopt a heterogeneous graph neu-\nral network to jointly model user characteristics, multimodal\npost contents as well as user-item relations in a bipartite graph\nto learn a comprehensive and effective user embedding with-\nout requiring ideology labels. We apply our framework to on-\nline discussions about economy and public health topics. The\nlearned embeddings are then used to detect political ideology\nand understand political polarization. Our framework outper-\nforms the unimodal, early/late fusion baselines, and homoge-\nneous GNN frameworks by a margin of at least 9% absolute\ngain in the area under the receiver operating characteristic on\ntwo social media datasets. More importantly, our work does\nnot require a time-consuming data collection process, which\nallows faster detection and in turn allows the policy makers\nto conduct analysis and design policies in time to respond\nto crises. We also show that our framework learns mean-\ningful user embeddings and can help better understand po-\nlitical polarization. Notable differences in user descriptions,\ntopics, images, and levels of retweet/quote activities are ob-\nserved. Our framework for decoding user-content interaction\nshows wide applicability in understanding political polariza-\ntion. Furthermore, it can be extended to user-item bipartite\ninformation networks for other applications such as content\nand product recommendation."}, {"group": "Political Science", "id": 111, "label": "SigGAN : Adversarial Model for Learning Signed Relationships in Networks", "shape": "dot", "size": 10, "title": "Authors: Roshni Chakraborty, Joydeep Chandra\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Signed link prediction in graphs is an important problem that\nhas applications in diverse domains. It is a binary classi\ufb01cation\nproblem that predicts whether an edge between a pair of nodes\nis positive or negative. Existing approaches for link prediction\nin unsigned networks cannot be directly applied for signed link\nprediction due to their inherent di\ufb00erences. Further, additional\nstructural constraints, like, the structural balance property of the\nsigned networks must be considered for signed link prediction.\nRecent signed link prediction approaches generate node repre-\nsentations using either generative models or discriminative mod-\nels. Inspired by the recent success of Generative Adversarial Net-\nwork (GAN) based models which comprises of a discriminator\nand generator in several applications, we propose a Generative\nAdversarial Network (GAN) based model for signed networks,\nSigGAN. It considers the requirements of signed networks, such\nas, integration of information from negative edges, high imbal-\nance in number of positive and negative edges and structural\nbalance theory. Comparing the performance with state of the\nart techniques on several real-world datasets validates the e\ufb00ec-\ntiveness of SigGAN.\nKEYWORDS\nSigned Networks, Generative Adversarial Networks, Link Pre-\ndiction, Structural Awareness, Structural Balance"}, {"group": "Structural Biology", "id": 116, "label": "Efficient GPU Implementation of Static and Incrementally Expanding DF-P PageRank for Dynamic Graphs", "shape": "dot", "size": 10, "title": "Authors: Subhajit Sahu\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: PageRank is a widely used centrality measure that \"ranks\" vertices\nin a graph by considering the connections and their importance.\nIn this report, we first introduce one of the most efficient GPU\nimplementations of Static PageRank, which recomputes PageRank\nscores from scratch. It uses a synchronous pull-based atomics-free\nPageRank computation, with the low and high in-degree vertices\nbeing partitioned and processed by two separate kernels. Next,\nwe present our GPU implementation of incrementally expanding\n(and contracting) Dynamic Frontier with Pruning (DF-P) PageRank,\nwhich processes only a subset of vertices likely to change ranks.\nIt is based on Static PageRank, and uses an additional partitioning\nbetween low and high out-degree vertices for incremental expan-\nsion of the set of affected vertices with two additional kernels. On\na server with an NVIDIA A100 GPU, our Static PageRank outper-\nforms Hornet and Gunrock\u2019s PageRank implementations by 31\u00d7\nand 5.9\u00d7 respectively. On top of the above, DF-P PageRank outper-\nforms Static PageRank by 2.1\u00d7 on real-world dynamic graphs, and\nby 3.1\u00d7 on large static graphs with random batch updates.\nKEYWORDS\nParallel GPU-based PageRank, Dynamic Frontier approach"}, {"group": "Natural Language Processing", "id": 117, "label": "BOND: Bootstrapping From-Scratch Name Disambiguation with Multi-task Promoting", "shape": "dot", "size": 10, "title": "Authors: Yuqing Cheng\u2217\u2020, Fanjin Zhang\u2217\u2021, Jie Tang\u2021\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: From-scratch name disambiguation is an essential task for estab-\nlishing a reliable foundation for academic platforms. It involves\npartitioning documents authored by identically named individu-\nals into groups representing distinct real-life experts. Canonically,\nthe process is divided into two decoupled tasks: locally estimat-\ning the pairwise similarities between documents followed by glob-\nally grouping these documents into appropriate clusters. However,\nsuch a decoupled approach often inhibits optimal information ex-\nchange between these intertwined tasks. Therefore, we present\nBOND, which bootstraps the local and global informative signals\nto promote each other in an end-to-end regime. Specifically, BOND\nharnesses local pairwise similarities to drive global clustering, sub-\nsequently generating pseudo-clustering labels. These global signals\nfurther refine local pairwise characterizations. The experimental re-\nsults establish BOND\u2019s superiority, outperforming other advanced\nbaselines by a substantial margin. Moreover, an enhanced version,\nBOND+, incorporating ensemble and post-match techniques, rivals\nthe top methods in the WhoIsWho competition1.\nCCS CONCEPTS\n\u2022 Information systems \u2192Data extraction and integration; Entity\nresolution.\nKEYWORDS\nname disambiguation, multi-task learning\n\u2217Equal contribution.\n\u2020Work was done when Yuqing interned at Zhipu AI.\n\u2021Fanjin Zhang and Jie Tang are the corresponding authors.\n1http://whoiswho.biendata.xyz/\nPermission to make digital or hard copies of all or part of this work for personal or\nclassroom use is granted without fee provided that copies are not made or distributed\nfor profit or commercial advantage and that copies bear this notice and the full citation\non the first page. Copyrights for components of this work owned by others than the\nauthor(s) must be honored. Abstracting with credit is permitted. To copy otherwise, or\nrepublish, to post on servers or to redistribute to lists, requires prior specific permission\nand/or a fee. Request permissions from permissions@acm.org.\nWWW \u201924, May 13\u201317, 2024, Singapore, Singapore\n\u00a9 2024 Copyright held by the owner/author(s). Publication rights licensed to ACM.\nACM ISBN 979-8-4007-0171-9/24/05...$15.00\nhttps://doi.org/10.1145/3589334.3645580\nACM Reference Format:\nYuqing Cheng, Bo Chen, Fanjin Zhang, and Jie Tang. 2024. BOND: Boot-\nstrapping From-Scratch Name Disambiguation with Multi-task Promot-\ning. In Proceedings of the ACM Web Conference 2024 (WWW \u201924), May\n13\u201317, 2024, Singapore, Singapore. ACM, New York, NY, USA, 11 pages.\nhttps://doi.org/10.1145/3589334.3645580"}, {"group": "Natural Language Processing", "id": 125, "label": "CORE: Data Augmentation for Link Prediction via Information Bottleneck", "shape": "dot", "size": 10, "title": "Authors: Nitesh V. Chawla\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Link prediction (LP) is a fundamental task in graph representation\nlearning, with numerous applications in diverse domains. However,\nthe generalizability of LP models is often compromised due to the\npresence of noisy or spurious information in graphs and the inher-\nent incompleteness of graph data. To address these challenges, we\ndraw inspiration from the Information Bottleneck principle and\npropose a novel data augmentation method, COmplete and REduce\n(CORE) to learn compact and predictive augmentations for LP mod-\nels. In particular, CORE aims to recover missing edges in graphs\nwhile simultaneously removing noise from the graph structures,\nthereby enhancing the model\u2019s robustness and performance. Exten-\nsive experiments on multiple benchmark datasets demonstrate the\napplicability and superiority of CORE over state-of-the-art meth-\nods, showcasing its potential as a leading approach for robust LP\nin graph representation learning.\nCCS CONCEPTS\n\u2022 Information systems \u2192Data mining; \u2022 Computing method-\nologies \u2192Regularization.\nKEYWORDS\nlink prediction, data augmentation, information bottleneck, graph\nneural networks\nACM Reference Format:\nKaiwen Dong, Zhichun Guo, and Nitesh V. Chawla. 2024. CORE: Data\nAugmentation for Link Prediction via Information Bottleneck. In . ACM,\nNew York, NY, USA, 17 pages. https://doi.org/10.1145/nnnnnnn.nnnnnnn"}, {"group": "Structural Biology", "id": 127, "label": "A Fast Maximum Clique Algorithm Based on Network Decomposition for Large Sparse Networks", "shape": "dot", "size": 10, "title": "Authors: Tianlg Fan, Wenjun Jiang, Yi-Cheng Zhang, Linyuan L\u00fc,\u2020\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Finding maximum cliques in large networks is a challenging combinatorial problem with many real-world applications. \nWe present a fast algorithm to achieve the exact solution for the maximum clique problem in large sparse networks based \non efficient graph decomposition. A bunch of effective techniques is being used to greatly prune the graph and a novel \nconcept called Complete-Upper-Bound-Induced Subgraph (CUBIS) is proposed to ensure that the structures with the \npotential to form the maximum clique are retained in the process of graph decomposition. Our algorithm first pre-prunes \nperipheral nodes, subsequently, one or two small-scale CUBISs are constructed guided by the core number and current \nmaximum clique size. Bron-Kerbosch search is performed on each CUBIS to find the maximum clique. Experiments on \n50 empirical networks with a scale of up to 20 million show the CUBIS scales are largely independent of the original \nnetwork scale. This enables an approximately linear runtime, making our algorithm amenable for large networks. Our \nwork provides a new framework for effectively solving maximum clique problems on massive sparse graphs, which not \nonly makes the graph scale no longer the bottleneck but also shows some light on solving other clique-related problems. \nKeywords \nGraph mining, Complex network, Maximum clique problem, Graph decomposition"}, {"group": "Natural Language Processing", "id": 128, "label": "Multi-view Graph Structural Representation Learning via Graph Coarsening", "shape": "dot", "size": 10, "title": "Authors: Xiaorui Qi, Qijie Bai, Yanlong Wen\u2217, Haiwei Zhang, Xiaojie Yuan, qixiaorui, wenyl, zhhaiwei\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Graph Transformers (GTs) have made remarkable\nachievements in graph-level tasks. However, most\nexisting works regard graph structures as a form\nof guidance or bias for enhancing node represen-\ntations, which focuses on node-central perspec-\ntives and lacks explicit representations of edges and\nstructures. One natural question is, can we treat\ngraph structures node-like as a whole to learn high-\nlevel features? Through experimental analysis, we\nexplore the feasibility of this assumption. Based\non our findings, we propose a novel multi-view\ngraph structural representation learning model via\ngraph coarsening (MSLgo) on GT architecture for\ngraph classification.\nSpecifically, we build three\nunique views, original, coarsening, and conversion,\nto learn a thorough structural representation. We\ncompress loops and cliques via hierarchical heuris-\ntic graph coarsening and restrict them with well-\ndesigned constraints, which builds the coarsening\nview to learn high-level interactions between struc-\ntures. We also introduce line graphs for edge em-\nbeddings and switch to edge-central perspective to\nconstruct the conversion view. Experiments on six\nreal-world datasets demonstrate the improvements\nof MSLgo over 14 baselines from various architec-\ntures."}, {"group": "Structural Biology", "id": 1, "label": "Reconfigurable Intelligent Surfaces for THz: Hardware Design and Signal Processing Challenges", "shape": "dot", "size": 10, "title": "Authors: George C. Alexropoulos, Antonio Clemente, S\u00b4ergio Matos, Ryan Husbs, Sean Ahearne, Qi Luo, Ver\u00b4onica Lain-Rubio, Thomas K\u00a8urner, Lu\u00b4\u0131s M. Pessoa\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: \u2014Wireless communications in the THz frequency\nband is an envisioned revolutionary technology for sixth Gener-\nation (6G) networks. However, such frequencies impose certain\ncoverage and device design challenges that need to be efficiently\novercome. To this end, the development of cost- and energy-\nefficient approaches for scaling these networks to realistic sce-\nnarios constitute a necessity. Among the recent research trends\ncontributing to these objectives belongs the technology of Recon-\nfigurable Intelligent Surfaces (RISs). In fact, several high-level\ndescriptions of THz systems based on RISs have been populating\nthe literature. Nevertheless, hardware implementations of those\nsystems are still very scarce, and not at the scale intended for most\nenvisioned THz scenarios. In this paper, we overview some of the\nmost significant hardware design and signal processing challenges\nwith THz RISs, and present a preliminary analysis of their impact\non the overall link budget and system performance, conducted\nin the framework of the ongoing TERRAMETA project.\nIndex Terms\u2014Reconfigurable intelligent surface, 6G, THz,\nbeamforming, beam squint, link budget, use cases.\nI."}, {"group": "Structural Biology", "id": 3, "label": "Wet TinyML: Chemical Neural Network Using Gene Regulation and Cell Plasticity", "shape": "dot", "size": 10, "title": "Authors: Samitha Somathilaka, Adrian Ratwatte, Sasitharan Balasubramaniam, Mehmet Can, Witawas Srisa\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: In our earlier work, we introduced the concept of Gene Regulatory\nNeural Network (GRNN), which utilizes natural neural network-\nlike structures inherent in biological cells to perform computing\ntasks using chemical inputs. We define this form of chemical-based\nneural network as Wet TinyML. The GRNN structures are based\non the gene regulatory network and have weights associated with\neach link based on the estimated interactions between the genes.\nThe GRNNs can be used for conventional computing by employing\nan application-based search process similar to the Network Archi-\ntecture Search. This study advances this concept by incorporating\ncell plasticity, to further exploit natural cell\u2019s adaptability, in order\nto diversify the GRNN search that can match larger spectrum as\nwell as dynamic computing tasks. As an example application, we\nshow that through the directed cell plasticity, we can extract the\nmathematical regression evolution enabling it to match to dynamic\nsystem applications. We also conduct energy analysis by comparing\nthe chemical energy of the GRNN to its silicon counterpart, where\nthis analysis includes both artificial neural network algorithms\nexecuted on von Neumann architecture as well as neuromorphic\nprocessors. The concept of Wet TinyML can pave the way for the\nnew emergence of chemical-based, energy-efficient and miniature\nBiological AI.\nKEYWORDS\nBiological AI, Cell Plasticity, Biocomputing, Neuromorphic.\nACM Reference Format:\nSamitha Somathilaka, Adrian Ratwatte, Sasitharan Balasubramaniam, Mehmet\nCan Vuran, Witawas Srisa-an, and Pietro Li\u00f2. 2024. Wet TinyML: Chemical\nNeural Network Using Gene Regulation and Cell Plasticity. In Proceedings\nof tinyML Research Symposium (tinyML Research Symposium\u201924). ACM, San\nFrancisco, USA, 7 pages.\nPermission to make digital or hard copies of part or all of this work for personal or\nclassroom use is granted without fee provided that copies are not made or distributed\nfor profit or commercial advantage and that copies bear this notice and the full citation\non the first page. Copyrights for third-party components of this work must be honored.\nFor all other uses, contact the owner/author(s).\ntinyML Research Symposium\u201924, April 2024, San Francisco, CA\n\u00a9 2024 Copyright held by the owner/author(s)."}, {"group": "Structural Biology", "id": 4, "label": "Architectural Implications of Neural Network Inference for High Data-Rate, Low-Latency Scientific Applications", "shape": "dot", "size": 10, "title": "Authors: Olivia Weng, Alexander Redding, Javier Mauricio Duarte, Ryan Kastner\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: \u2014With more scientific fields relying on neural networks (NNs)\nto process data incoming at extreme throughputs and latencies, it is\ncrucial to develop NNs with all their parameters stored on-chip. In\nmany of these applications, there is not enough time to go off-chip and\nretrieve weights. Even more so, off-chip memory such as DRAM does\nnot have the bandwidth required to process these NNs as fast as the data\nis being produced (e.g., every 25 ns). As such, these extreme latency and\nbandwidth requirements have architectural implications for the hardware\nintended to run these NNs: 1) all NN parameters must fit on-chip, and 2)\ncodesigning custom/reconfigurable logic is often required to meet these\nlatency and bandwidth constraints. In our work, we show that many\nscientific NN applications must run fully on chip, in the extreme case\nrequiring a custom chip to meet such stringent constraints.\nI."}, {"group": "Structural Biology", "id": 56, "label": "LightningSimV2: Faster and Scalable Simulation for High-Level Synthesis via Graph Compilation and Optimization", "shape": "dot", "size": 10, "title": "Authors: Rishov Sarkar, Rachel Paul, rishov.sarkar, rachel.paul\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: \u2014High-Level Synthesis (HLS) enables rapid prototyp-\ning of complex hardware designs by translating C or C++ code to\nlow-level RTL code. However, the testing and evaluation of HLS\ndesigns still typically rely on slow RTL-level simulators that can\ntake hours to provide feedback, especially for complex designs.\nA recent work, LightningSim, helps to solve this problem by\nproviding a simulation workflow one to two orders of magnitude\nfaster than RTL simulation. However, it still exhibits inefficiencies\ndue to several types of redundant computation, making it slow for\nlarge design simulation and design space exploration. Addressing\nthese inefficiencies, we introduce LightningSimV2, a much faster\nand scalable simulation tool. LightningSimV2 features three\nmain innovations. First, we perform compile-time static analysis,\nexploiting the repetitive structures in HLS designs, e.g., loops,\nto reduce the simulation workload. Second, we propose a novel\ngraph-based simulation approach, with decoupled simulation\ngraph construction step and graph traversal step, significantly\nreducing repeated computation. Third, benefiting from the decou-\npled approach, LightningSimV2 can perform incremental stall\nanalysis extremely fast, enabling highly efficient design space\nexploration of large numbers of complex hardware parameters,\ne.g., optimal FIFO depths. Moreover, the DSE is well-suited\nfor parallel computing, further improving the DSE efficiency.\nCompared with LightningSim, LightningSimV2 achieves up to\n3.5\u00d7 speedup in full simulation and up to 577\u00d7 speed up\nfor incremental DSE. Our code is open-source on GitHub at\nhttps://github.com/sharc-lab/LightningSim/tree/v0.2.0.\nI."}, {"group": "Structural Biology", "id": 85, "label": "Ultra-Wideband (UWB) Positioning System Based on ESP32 and DWM3000 Modules", "shape": "dot", "size": 10, "title": "Authors: Sebastian Krebs, Tom Herter\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: \u2014 In this paper, an Ultra-Wideband (UWB) position-\ning system is introduced, that leverages six identical custom-\ndesigned boards, each featuring an ESP32 microcontroller and\na DWM3000 module from Quorvo.\nThe system is capable of achieving localization with an accuracy\nof up to 10 cm, by utilizing Two-Way-Ranging (TWR) measure-\nments between one designated \u201dtag\u201d and five \u201danchor\u201d devices.\nThe gathered distance measurements are subsequently processed\nby an Extended Kalman Filter (EKF) running locally on the tag\nboard, enabling it to determine its own position, relying on fixed,\na priori known positions of the anchor boards.\nThis paper presents a comprehensive overview of the system\u2019s\narchitecture, the key components, and the capabilities it offers\nfor indoor positioning and tracking applications.\nI."}, {"group": "Structural Biology", "id": 119, "label": "Beam Management in Low Earth Orbit Satellite Networks with Random Traffic Arrival and Time-varying Topology", "shape": "dot", "size": 10, "title": "Authors: Jianfeng Zhu, Yaohua Sun, Mugen Peng\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: \u2014Low earth orbit (LEO) satellite communication net-\nworks have been considered as promising solutions to providing\nhigh data rate and seamless coverage, where satellite beam\nmanagement plays a key role. However, due to the limitation of\nbeam resource, dynamic network topology, beam spectrum reuse,\ntime-varying traffic arrival and service continuity requirement,\nit is challenging to effectively allocate time-frequency resource\nof satellite beams to multiple cells. In this paper, aiming at\nreducing time-averaged beam revisit time and mitigate inter-\nsatellite handover, a beam management problem is formulated for\ndynamic LEO satellite communication networks, under inter-cell\ninterference and network stability constraints. Particularly, inter-\ncell interference constraints are further simplified into off-axis\nangle based constraints, which provide tractable rules for spec-\ntrum sharing between two beam cells. To deal with the long-term\nperformance optimization, the primal problem is transformed\ninto a series of single epoch problems by adopting Lyapunov\noptimization framework. Since the transformed problem is NP-\nhard, it is further divided into three subproblems, including\nserving beam allocation, beam service time allocation and serving\nsatellite allocation. With the help of conflict graphs built with\noff-axis angle based constraints, serving beam allocation and\nbeam service time allocation algorithms are developed to reduce\nbeam revisit time and cell packet queue length. Then, we further\ndevelop a satellite-cell service relationship optimization algorithm\nto better adapt to dynamic network topology. Compared with\nbaselines, numerical results show that our proposal can reduce\naverage beam revisit time by 20.8% and keep strong network\nstability with similar inter-satellite handover frequency.\nIndex Terms\u2014Low earth orbit satellite communication, beam\nmanagement, beam revisit time, inter-satellite handover, interfer-\nence mitigation.\nI."}, {"group": "Structural Biology", "id": 120, "label": "IEEE TRANSACTIONS ON VEHICULAR TECHNOLOGY, VOL. 73, NO. 3, MARCH 2024", "shape": "dot", "size": 10, "title": "Authors: Jianfeng Zhu, Yaohua Sun, Mugen Peng\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: \u2014Low earth orbit (LEO) satellite communication\nbased on 3GPP standard is seen as a promising solution to\nrolling out communication services in areas without terrestrial\nbase stations. However, due to the fast movement of satellites\nand large beam footprint size, the existing 5G timing advance\n(TA) estimation mechanism cannot be directly applied when\nglobal navigation satellite system is unavailable. In this article, an\nenhanced TA estimation approach is proposed for LEO satellite\ncommunication networks. Specifically, a user-side time-frequency\npre-compensation method is introduced at first, which leverages\nfrequency offset measurement on synchronization signal blocks\nbroadcasted by satellites in initial cell search phase. For the\nrandom access phase, the upper bound of inter-preamble inter-\nference incurred by partial-period cross-correlation operations\nis derived for a preamble format advised by 3GPP, and it is\nshown that the interference level is closely related to the square\nof the number of such operations. Inspired by this result, a cyclic\nprefix free preamble format is further designed, which features\nextended guard time, differential power allocation and flexible\npreamble structure. Numerical results show that our proposal\ncan reduce the missed detection rate of preamble within a beam.\nParticularly, the missed detection rates of preamble under 32,\n48, and 64 users are lower than 1% when SNR = -6 dB, which\nis a significant improvement compared to baselines. In addition,\nour proposal can limit the TA estimation error of the detected\nusers to the time length of 25 time-domain sampling points when\nthe subcarrier spacing is 30 kHz and operation frequency is 27\nGHz.\nIndex Terms\u2014Low earth orbit satellite, random access, timing\nadvance estimation, preamble format design.\nI."}, {"group": "Structural Biology", "id": 121, "label": "Beam Management in Low Earth Orbit Satellite Communication With Handover Frequency Control and Satellite-Terrestrial Spectrum Sharing", "shape": "dot", "size": 10, "title": "Authors: Yaohua Sun, Jianfeng Zhu, Mugen Peng\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: \u2014To achieve ubiquitous wireless connectivity, low\nearth orbit (LEO) satellite networks have drawn much attention.\nHowever, effective beam management is challenging due to time-\nvarying cell load, high dynamic network topology, and complex\ninterference situations. In this paper, under inter-satellite han-\ndover frequency and satellite-terrestrial/inter-beam interference\nconstraints, we formulate a practical beam management problem,\naiming to maximize the long-term service satisfaction of cells.\nParticularly, Lyapunov framework is leveraged to equivalently\ntransform the primal problem into multiple single epoch op-\ntimization problems, where virtual queue stability constraints\nreplace inter-satellite handover frequency constraints. Since each\nsingle epoch problem is NP-hard, we further decompose it into\nthree subproblems, including inter-satellite handover decision,\nbeam hopping design and satellite-terrestrial spectrum sharing.\nFirst, a proactive inter-satellite handover mechanism is developed\nto balance handover frequency and satellite loads. Subsequently,\na beam hopping design algorithm is presented based on conflict\ngraphs to achieve interference mitigation among beams, and then\na flexible satellite-terrestrial spectrum sharing algorithm is de-\nsigned to satisfy the demands of beam cells and improve spectral\nefficiency. Simulation results show that our proposal significantly\nimproves service satisfaction compared with baselines, where the\naverage data queue length of beam cells is reduced by over 50%\nwith affordable handover frequency.\nIndex Terms\u2014Low earth orbit satellite, beam management,\ninter-satellite handover, interference mitigation, spectrum shar-\ning.\nI."}, {"group": "Structural Biology", "id": 2, "label": "MicroT: Low-Energy and Adaptive Models for MCUs", "shape": "dot", "size": 10, "title": "Authors: Yushan Huang, Ranya Aloufi, Yuchen Zhao, Payam Barnaghi, Hamed Haddadi\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: We propose MicroT, a low-energy, multi-task adaptive model\nframework for resource-constrained MCUs. We divide the\noriginal model into a feature extractor and a classifier. The\nfeature extractor is obtained through self-supervised knowl-\nedge distillation and further optimized into part and full mod-\nels through model splitting and joint training. These mod-\nels are then deployed on MCUs, with classifiers added and\ntrained on local tasks, ultimately performing stage-decision\nfor joint inference. In this process, the part model initially\nprocesses the sample, and if the confidence score falls below\nthe set threshold, the full model will resume and continue the\ninference. We evaluate MicroT on two models, three datasets,\nand two MCU boards. Our experimental evaluation shows\nthat MicroT effectively improves model performance and\nreduces energy consumption when dealing with multiple\nlocal tasks. Compared to the unoptimized feature extractor,\nMicroT can improve accuracy by up to 9.87%. On MCUs,\ncompared to the standard full model inference, MicroT can\nsave up to about 29.13% in energy consumption. MicroT also\nallows users to adaptively adjust the stage-decision ratio\nas needed, better balancing model performance and energy\nconsumption. Under the standard stage-decision ratio con-\nfiguration, MicroT can increase accuracy by 5.91% and save\nabout 14.47% of energy consumption.\nCCS Concepts\n\u2022 Computer systems organization \u2192Embedded sys-\ntems; \u2022 Computing methodologies \u2192Artificial intelli-\ngence; Machine learning.\nKeywords\nResource Constraints, Machine Learning, Low-Energy, MCUs"}, {"group": "Structural Biology", "id": 5, "label": "Hindawi Template version: Apr19", "shape": "dot", "size": 10, "title": "Authors: Andr\u00e9s-David Su\u00e1rez-G\u00f3mez,, ANDRES A. HERNANDEZ ORTEGA,,\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Natural Language Processing", "id": 16, "label": "REQUAL-LM: Reliability and Equity through Aggregation in Large Language Models*", "shape": "dot", "size": 10, "title": "Authors: Sana Ebrahimi, Nima Shahbazi, Abolfazl Asudeh\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: The extensive scope of large language models\n(LLMs) across various domains underscores\nthe critical importance of responsibility in their\napplication, beyond natural language process-\ning. In particular, the randomized nature of\nLLMs, coupled with inherent biases and his-\ntorical stereotypes in data, raises critical con-\ncerns regarding reliability and equity. Address-\ning these challenges are necessary before using\nLLMs for applications with societal impact.\nTowards addressing this gap, we introduce\nREQUAL-LM, a novel method for finding re-\nliable and equitable LLM outputs through ag-\ngregation. Specifically, we develop a Monte-\ncarlo method based on repeated sampling to\nfind a reliable output close to the mean of the\nunderlying distribution of possible outputs. We\nformally define the terms such as reliability and\nbias, and design an equity-aware aggregation to\nminimize harmful bias while finding a highly\nreliable output. REQUAL-LM does not require\nspecialized hardware, does not impose a signifi-\ncant computing load, and uses LLMs as a black-\nbox. This design choice enables seamless scala-\nbility alongside the rapid advancement of LLM\ntechnologies. Our system does not require re-\ntraining the LLMs, which makes it deployment-\nready and easy to adapt.\nOur comprehensive experiments using various\ntasks and datasets demonstrate that REQUAL-\nLM effectively mitigates bias and selects a more\nequitable response, specifically the outputs that\nproperly represents minority groups."}, {"group": "Natural Language Processing", "id": 26, "label": "Sequential Compositional Generalization in Multimodal Models", "shape": "dot", "size": 10, "title": "Authors: Semih Yagcioglu, Osman Batur, Aykut Erdem,, Erkut Erdem, Deniz Yuret,\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: The rise of large-scale multimodal models\nhas paved the pathway for groundbreaking ad-\nvances in generative modeling and reasoning,\nunlocking transformative applications in a va-\nriety of complex tasks. However, a pressing\nquestion that remains is their genuine capabil-\nity for stronger forms of generalization, which\nhas been largely underexplored in the multi-\nmodal setting. Our study aims to address this\nby examining sequential compositional gen-\neralization using COMPACT (Compositional\nActivities)1, a carefully constructed, perceptu-\nally grounded dataset set within a rich backdrop\nof egocentric kitchen activity videos. Each\ninstance in our dataset is represented with a\ncombination of raw video footage, naturally\noccurring sound, and crowd-sourced step-by-\nstep descriptions. More importantly, our setup\nensures that the individual concepts are consis-\ntently distributed across training and evaluation\nsets, while their compositions are novel in the\nevaluation set. We conduct a comprehensive as-\nsessment of several unimodal and multimodal\nmodels. Our findings reveal that bi-modal and\ntri-modal models exhibit a clear edge over their\ntext-only counterparts. This highlights the im-\nportance of multimodality while charting a tra-\njectory for future research in this domain."}, {"group": "Natural Language Processing", "id": 30, "label": "TIMIT Speaker Profiling: A Comparison of Multi-task learning and Single-task learning Approaches", "shape": "dot", "size": 10, "title": "Authors: Rong Wang, Kun Sun\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: This study employs deep learning techniques to ex-\nplore four speaker profiling tasks on the TIMIT\ndataset, namely gender classification, accent clas-\nsification, age estimation, and speaker identification,\nhighlighting the potential and challenges of multi-\ntask learning versus single-task models. The motiva-\ntion for this research is twofold: firstly, to empirically\nassess the advantages and drawbacks of multi-task\nlearning over single-task models in the context of\nspeaker profiling; secondly, to emphasize the undi-\nminished significance of skillful feature engineering\nfor speaker recognition tasks. The findings reveal\nchallenges in accent classification, and multi-task\nlearning is found advantageous for tasks of similar\ncomplexity. Non-sequential features are favored for\nspeaker recognition, but sequential ones can serve as\nstarting points for complex models. The study under-\nscores the necessity of meticulous experimentation\nand parameter tuning for deep learning models."}, {"group": "Structural Biology", "id": 44, "label": "An Extensive Comparison of Static Application Security Testing Tools", "shape": "dot", "size": 10, "title": "Authors: Matteo Esposito, Valentina Falaschi, Davide Falessi\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Context: Static Application Security Testing Tools (SASTTs) iden-\ntify software vulnerabilities to support the security and reliability of\nsoftware applications. Interestingly, several studies have suggested\nthat alternative solutions may be more effective than SASTTs due\nto their tendency to generate false alarms, commonly referred to as\nlow Precision. Aim: We aim to comprehensively evaluate SASTTs,\nsetting a reliable benchmark for assessing and finding gaps in vul-\nnerability identification mechanisms based on SASTTs or alterna-\ntives. Method: Our SASTTs evaluation is based on a controlled,\nthough synthetic, Java codebase. It involves an assessment of 1.5\nmillion test executions, and it features innovative methodological\nfeatures such as effort-aware accuracy metrics and method-level\nanalysis. Results: Our findings reveal that SASTTs detect a tiny\nrange of vulnerabilities. In contrast to prevailing wisdom, SASTTs\nexhibit high Precision while falling short in Recall. Conclusions:\nOur findings suggest that enhancing Recall, alongside expanding\nthe spectrum of detected vulnerability types, should be the primary\nfocus for improving SASTTs or alternative approaches, such as\nmachine learning-based vulnerability identification solutions.\nCCS CONCEPTS\n\u2022 Security and privacy \u2192Software security engineering; Domain-\nspecific security and privacy architectures; \u2022 Software and its engi-\nneering \u2192Software defect analysis; Empirical software valida-\ntion.\nKEYWORDS\nSecurity Assessment Tool, Static Application Security Testing, Com-\nmon Vulnerability Exposure, Common Weakness Enumeration\nACM Reference Format:\nMatteo Esposito, Valentina Falaschi, and Davide Falessi . 2024. An Extensive\nComparison of Static Application Security Testing Tools. In Proceedings of\nThe 28th International Conference on Evaluation and Assessment in Software\nEngineering (EASE 2024). ACM, New York, NY, USA, 10 pages. https://doi.or\ng/XXXXXXX.XXXXXXX"}, {"group": "Structural Biology", "id": 52, "label": "ITERATIVE FORGETTING: ONLINE DATA STREAM REGRESSION USING DATABASE-INSPIRED ADAPTIVE GRANULATION \u2217", "shape": "dot", "size": 10, "title": "Authors: Niket Kathiriya, Hossein Haeri, Cindy Chen, Kshitij Jerath\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Many modern systems, such as financial, transportation and telecommunications systems, are time-\nsensitive in the sense that they demand low-latency predictions for real-time decision-making. Such\nsystems often have to contend with continuous unbounded data streams as well as concept drift,\nwhich are challenging requirements that traditional regression techniques are unable to cater to. There\nexists a need to create novel data stream regression methods that can handle these scenarios. We\npresent a database-inspired datastream regression model that (a) uses inspiration from R*-trees to\ncreate granules from incoming datastreams such that relevant information is retained, (b) iteratively\nforgets granules whose information is deemed to be outdated, thus maintaining a list of only recent,\nrelevant granules, and (c) uses the recent data and granules to provide low-latency predictions.\nThe R*-tree-inspired approach also makes the algorithm amenable to integration with database\nsystems. Our experiments demonstrate that the ability of this method to discard data produces a\nsignificant order-of-magnitude improvement in latency and training time when evaluated against the\nmost accurate state-of-the-art algorithms, while the R*-tree-inspired granulation technique provides\ncompetitively accurate predictions.\nKeywords Data stream, forgetting, regression, granulation, aggregation, time-sensitive systems, low latency, concept\ndrift"}, {"group": "Structural Biology", "id": 55, "label": "Worst-Case Convergence Time of ML Algorithms via  Extreme Value Theory", "shape": "dot", "size": 10, "title": "Authors: Sriram Sankaranarayanan\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: This paper leverages the statistics of extreme values to predict\nthe worst-case convergence times of machine learning algorithms.\nTiming is a critical non-functional property of ML systems, and\nproviding the worst-case converge times is essential to guarantee\nthe availability of ML and its services. However, timing properties\nsuch as worst-case convergence times (WCCT) are difficult to verify\nsince (1) they are not encoded in the syntax or semantics of under-\nlying programming languages of AI, (2) their evaluations depend\non both algorithmic implementations and underlying systems, and\n(3) their measurements involve uncertainty and noise. Therefore,\nprevalent formal methods and statistical models fail to provide rich\ninformation on the amounts and likelihood of WCCT.\nOur key observation is that the timing information we seek rep-\nresents the extreme tail of execution times. Therefore, extreme\nvalue theory (EVT), a statistical discipline that focuses on under-\nstanding and predicting the distribution of extreme values in the\ntail of outcomes, provides an ideal framework to model and analyze\nWCCT in the training and inference phases of ML paradigm. Build-\ning upon the mathematical tools from EVT, we propose a practical\nframework to predict the worst-case timing properties of ML. Over\na set of linear ML training algorithms, we show that EVT achieves\na better accuracy for predicting WCCTs than relevant statistical\nmethods such as the Bayesian factor. On the set of larger machine\nlearning training algorithms and deep neural network inference,\nwe show the feasibility and usefulness of EVT models to accurately\npredict WCCTs, their expected return periods, and their likelihood.\nACM Reference Format:\nSaeid Tizpaz-Niari and Sriram Sankaranarayanan. 2024. Worst-Case Con-\nvergence Time of ML Algorithms via Extreme Value Theory. In Confer-\nence on AI Engineering - Software Engineering for AI (CAIN 2024), April\n14\u201315, 2024, Lisbon, Portugal. ACM, New York, NY, USA, 11 pages. https:\n//doi.org/10.1145/3644815.3644989"}, {"group": "Structural Biology", "id": 58, "label": "Weighted Scaling Approach for Metabolomics Data Analysis", "shape": "dot", "size": 10, "title": "Authors: Nishith Kumar, Aminul Hoque, Ashad Alam\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Structural Biology", "id": 60, "label": "SFILES 2.0", "shape": "dot", "size": 10, "title": "Authors: Gabriel Vogel, Lukas Schulze, Edwin Hirtreiter, Artur M. Schweidtmann\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: SFILES is a text-based notation for chemical process \ufb02owsheets. It was originally proposed by\nd\u2019Anterroches [1] who was inspired by the text-based SMILES notation for molecules. The text-\nbased format has several advantages compared to \ufb02owsheet images regarding the storage format,\ncomputational accessibility, and eventually for data analysis and processing. However, the original\nSFILES version cannot describe essential \ufb02owsheet con\ufb01gurations unambiguously, such as the\ndistinction between top and bottom products. Neither is it capable of describing the control structure\nrequired for the safe and reliable operation of chemical processes. Also, there is no publicly\navailable software for decoding or encoding chemical process topologies to SFILES. We propose\nthe SFILES 2.0 with a complete description of the extended notation and naming conventions.\nAdditionally, we provide open-source software for the automated conversion between \ufb02owsheet\ngraphs and SFILES 2.0 strings. This way, we hope to encourage researchers and engineers to publish\ntheir \ufb02owsheet topologies as SFILES 2.0 strings. The ultimate goal is to set the standards for creating\na FAIR database of chemical process \ufb02owsheets, which would be of great value for future data\nanalysis and processing.\nKeywords Flowsheet graph \u00b7 Process \ufb02ow diagram \u00b7 Arti\ufb01cial intelligence \u00b7 FAIR data \u00b7 STRING notation"}, {"group": "Structural Biology", "id": 63, "label": "An Optimal Likelihood Free Method for Biological Model Selection", "shape": "dot", "size": 10, "title": "Authors: Vincent D. Zaballa, Elliot E. Hui\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Systems biology seeks to create math models of\nbiological systems to reduce inherent biological\ncomplexity and provide predictions for applica-\ntions such as therapeutic development. However,\nit remains a challenge to determine which math\nmodel is correct and how to arrive optimally at the\nanswer. We present an algorithm for automated\nbiological model selection using mathematical\nmodels of systems biology and likelihood free in-\nference methods. Our algorithm shows improved\nperformance in arriving at correct models without\na priori information over conventional heuristics\nused in experimental biology and random search.\nThis method shows promise to accelerate biologi-\ncal basic science and drug discovery.\n1."}, {"group": "Structural Biology", "id": 122, "label": "Rethinking the Graph Polynomial Filter via Positive and Negative Coupling Analysis", "shape": "dot", "size": 10, "title": "Authors: Haodong Wen\u2217, Deyu Meng\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Natural Language Processing", "id": 70, "label": "Modeling Diverse Chemical Reactions for Single-step Retrosynthesis via Discrete Latent Variables", "shape": "dot", "size": 10, "title": "Authors: Jie Wang\u2217\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Single-step retrosynthesis is the cornerstone of retrosynthesis plan-\nning, which is a crucial task for computer-aided drug discovery.\nThe goal of single-step retrosynthesis is to identify the possible\nreactants that lead to the synthesis of the target product in one\nreaction. By representing organic molecules as canonical strings,\nexisting sequence-based retrosynthetic methods treat the product-\nto-reactant retrosynthesis as a sequence-to-sequence translation\nproblem. However, most of them struggle to identify diverse chemi-\ncal reactions for a desired product due to the deterministic inference,\nwhich contradicts the fact that many compounds can be synthesized\nthrough various reaction types with different sets of reactants.\nIn this work, we aim to increase reaction diversity and generate\nvarious reactants using discrete latent variables. We propose a novel\nsequence-based approach, namely RetroDCVAE, which incorpo-\nrates conditional variational autoencoders into single-step retrosyn-\nthesis and associates discrete latent variables with the generation\nprocess. Specifically, RetroDCVAE uses the Gumbel-Softmax distri-\nbution to approximate the categorical distribution over potential re-\nactions and generates multiple sets of reactants with the variational\ndecoder. Experiments demonstrate that RetroDCVAE outperforms\nstate-of-the-art baselines on both benchmark dataset and home-\nmade dataset. Both quantitative and qualitative results show that\nRetroDCVAE can model the multi-modal distribution over reaction\ntypes and produce diverse reactant candidates.\n\u2217Corresponding Author\nPermission to make digital or hard copies of all or part of this work for personal or\nclassroom use is granted without fee provided that copies are not made or distributed\nfor profit or commercial advantage and that copies bear this notice and the full citation\non the first page. Copyrights for components of this work owned by others than ACM\nmust be honored. Abstracting with credit is permitted. To copy otherwise, or republish,\nto post on servers or to redistribute to lists, requires prior specific permission and/or a\nfee. Request permissions from permissions@acm.org.\nCIKM \u201922, October 17\u201322, 2022, Atlanta, GA\n\u00a9 2022 Association for Computing Machinery.\nCCS CONCEPTS\n\u2022 Applied computing \u2192Computational biology; Chemistry; \u2022\nComputing methodologies \u2192Natural language processing; La-\ntent variable models.\nKEYWORDS\nRetrosynthesis, Variational Autoencoder, Transformer, Graph Neu-\nral Network, Discrete Latent Variable\nACM Reference Format:\nHuarui He, Jie Wang, Yunfei Liu, and Feng Wu. 2022. Modeling Diverse\nChemical Reactions for Single-step Retrosynthesis via Discrete Latent Vari-\nables. In Proceedings of Make sure to enter the correct conference title from your\nrights confirmation emai (CIKM \u201922). ACM, New York, NY, USA, 11 pages."}, {"group": "Structural Biology", "id": 71, "label": "Full Paper", "shape": "dot", "size": 10, "title": "Authors: Chengyu Liu, Wei Wang,, Wei Wang\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Developing models with high interpretability and even deriving formulas to quantify relationships\nbetween biological data is an emerging need. We propose here a framework for ab initio derivation of\nsequence motifs and linear formula using a new approach based on the interpretable neural network\nmodel called contextual regression model. We showed that this linear model could predict gene\nexpression levels using promoter sequences with a performance comparable to deep neural network\nmodels. We uncovered a list of 300 motifs with important regulatory roles on gene expression and showed\nthat they also had significant contributions to cell-type specific gene expression in 154 diverse cell types.\nThis work illustrates the possibility of deriving formulas to represent biology laws that may not be easily\nelucidated. (https://github.com/Wang-lab-UCSD/Motif_Finding_Contextual_Regression)"}, {"group": "Structural Biology", "id": 73, "label": "Springer Nature 2021 LATEX template", "shape": "dot", "size": 10, "title": "Authors: Yaosen Min\u2020, Ye Wei*\u2020, Peizhuo Wang\u2020, Xiaoting, Wang, Han Li, Nian Wu, Stefan Bauer, Shuxin Zheng, Yu, Shi, Yingheng Wang, Ji Wu, Dan Zhao, JianyangZeng,, wuji\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Natural Language Processing", "id": 91, "label": "Reconfigurable Robot Identification from Motion Data", "shape": "dot", "size": 10, "title": "Authors: Yuhang Hu, Yunzhe Wang, Ruibo Liu, Zhou Shen, Hod Lipson\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: \u2014 Integrating Large Language Models (LLMs) and\nVision-Language Models (VLMs) with robotic systems enables\nrobots to process and understand complex natural language\ninstructions and visual information. However, a fundamental\nchallenge remains: for robots to fully capitalize on these\nadvancements, they must have a deep understand
