ing of their\nphysical embodiment. The gap between AI models\u2019 cognitive\ncapabilities and the understanding of physical embodiment\nleads to the following question: Can a robot autonomously\nunderstand and adapt to its physical form and functionali-\nties through interaction with its environment? This question\nunderscores the transition towards developing self-modeling\nrobots without reliance on external sensory or pre-programmed\nknowledge about their structure. Here, we propose a meta-\nself-modeling that can deduce robot morphology through pro-\nprioception\u2014the robot\u2019s internal sense of its body\u2019s position\nand movement. Our study introduces a 12-DoF reconfigurable\nlegged robot, accompanied by a diverse dataset of 200k unique\nconfigurations, to systematically investigate the relationship\nbetween robotic motion and robot morphology. Utilizing a deep\nneural network model comprising a robot signature encoder\nand a configuration decoder, we demonstrate the capability\nof our system to accurately predict robot configurations from\nproprioceptive signals. This research contributes to the field of\nrobotic self-modeling, aiming to enhance robot\u2019s understanding\nof their physical embodiment and adaptability in real-world\nscenarios.\nI."}, {"group": "Structural Biology", "id": 76, "label": "Microsoft Word - _scientific_data__meg_masc-3.docx", "shape": "dot", "size": 10, "title": "Authors: Graham Flick, Alec Marantz, Liina Pylkka\u00a8, David, Poeppel, JeanRe\u00b4 mi King\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Natural Language Processing", "id": 9, "label": "Related Work and Citation Text Generation: A Survey", "shape": "dot", "size": 10, "title": "Authors: Jessica Ouyang\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: To convince readers of the novelty of their re-\nsearch paper, authors must perform a litera-\nture review and compose a coherent story that\nconnects and relates prior works to the cur-\nrent work. This challenging nature of literature\nreview writing makes automatic related work\ngeneration (RWG) academically and compu-\ntationally interesting, and also makes it an ex-\ncellent test bed for examining the capability of\nSOTA natural language processing (NLP) mod-\nels. Since the initial proposal of the RWG task,\nits popularity has waxed and waned, following\nthe capabilities of mainstream NLP approaches.\nIn this work, we survey the zoo of RWG his-\ntorical works, summarizing the key approaches\nand task definitions and discussing the ongoing\nchallenges of RWG."}, {"group": "Structural Biology", "id": 47, "label": "SFVInt: Simple, Fast and Generic Variable-Length Integer Decoding using Bit Manipulation Instructions", "shape": "dot", "size": 10, "title": "Authors: Gang Liao, Yonghua Ding, Le Cai, Jianjun Chen, ye.liu, yonghua.ding, le.cai\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: The ubiquity of variable-length integers in data storage and\ncommunication necessitates efficient decoding techniques. In\nthis paper, we present SFVInt, a simple and fast approach to\ndecode the prevalent Little Endian Base-128 (LEB128) varints.\nOur approach, distilled into a mere 500 lines of code, effec-\ntively utilizes the Bit Manipulation Instruction Set 2 (BMI2)\nin modern Intel and AMD processors, achieving significant\nperformance improvement while maintaining simplicity and\navoiding overengineering. SFVInt, with its generic design,\neffectively processes both 32-bit and 64-bit unsigned inte-\ngers using a unified code template, marking a significant\nleap forward in varint decoding efficiency. We thoroughly\nevaluate SFVInt\u2019s performance across various datasets and\nscenarios, demonstrating that it achieves up to a 2x increase\nin decoding speed when compared to varint decoding meth-\nods used in established frameworks like Facebook Folly and\nGoogle Protobuf."}, {"group": "Structural Biology", "id": 64, "label": "2 Non-Gaussian displacement distributions in models of 2 0 2", "shape": "dot", "size": 10, "title": "Authors: Igor M. Sokolov, Ralf Metzler\u2020,\u266f, Aleksei V. Chechk\u2020,\u2021,\u00a7\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: .\nWe study the e\ufb00ect of randomly distributed di\ufb00usivities and speeds in\ntwo models for active particle dynamics with active and passive \ufb02uctuations.\nWe\ndemonstrate how non-Gaussian displacement distributions emerge in these models in\nthe long time limit, including Cauchy-type and exponential (Laplace) shapes. Notably\nthe resulting shapes of the displacement distributions with distributed di\ufb00usivities for\nthe active models considered here are in striking contrast to passive di\ufb00usion models.\nFor the active motion models our discussion points out the di\ufb00erences between active-\nand passive-noise. Speci\ufb01cally, we demonstrate that the case with active-noise is in\nnice agreement with measured data for the displacement distribution of social amoeba.\n1."}, {"group": "Structural Biology", "id": 67, "label": "TripHLApan:  predicting  HLA  molecules  binding", "shape": "dot", "size": 10, "title": "Authors: Chuqi Lei, Jianxin Wang, Yaohang Li, Min Li\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Structural Biology", "id": 68, "label": " Clustering Optimisation Method for Highly Connected Biological Data ", "shape": "dot", "size": 10, "title": "Authors: Richard Tj\u00f6rnhammara\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Currently, data-driven discovery in biological sciences resides in \ufb01nding seg-\nmentation strategies in multivariate data that produce sensible descriptions of the\ndata. Clustering is but one of several approaches and sometimes falls short because\nof dif\ufb01culties in assessing reasonable cutoffs, the number of clusters that need to\nbe formed or that an approach fails to preserve topological properties of the orig-\ninal system in its clustered form. In this work, we show how a simple metric for\nconnectivity clustering evaluation leads to an optimised segmentation of biological\ndata.\nThe novelty of the work resides in the creation of a simple optimisation method\nfor clustering crowded data. The resulting clustering approach only relies on met-\nrics derived from the inherent properties of the clustering. The new method facili-\ntates knowledge for optimised clustering, which is easy to implement.\nWe discuss how the clustering optimisation strategy corresponds to the viable\ninformation content yielded by the \ufb01nal segmentation. We further elaborate on\nhow the clustering results, in the optimal solution, corresponds to prior knowledge\nof three different data sets.\nKeywords: Clustering, Connectivity, Unimodal Optimisation, Dimensionality\nReduction, Statistical Learning, Hierarchical Agglomerative Clustering\n1."}, {"group": "Structural Biology", "id": 78, "label": "Simulating how animals learn: a new modelling framework", "shape": "dot", "size": 10, "title": "Authors: Peter R. Thompson,\u2217M\u00b4elodie Kunegel-Lion\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Political Science", "id": 99, "label": "Understanding how people consume low quality and extreme news using web traf\ufb01c data", "shape": "dot", "size": 10, "title": "Authors: Zhouhan Chen, Juliana Freire, Jonathan Nagler, Joshua A. Tucker, Haohan Chen\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: To mitigate the spread of fake news, researchers need to un-\nderstand who visit fake new sites, what brings people to those\nsites, where visitors come from, and what content they pre-\nfer to consume. In this paper, we analyze web traf\ufb01c data\nfrom The Gateway Pundit (TGP), a popular far-right website\nthat is known for repeatedly sharing false information that\nhas made its web traf\ufb01c available to the general public. We\ncollect data on 68 million web traf\ufb01c visits to the site over\na month period and analyze how people consume news via\nmultiple features. Our traf\ufb01c analysis shows that search en-\ngines and social media platforms are main drivers of traf\ufb01c;\nour geo-location analysis reveals that TGP is more popular in\ncounties that voted for Trump in 2020; and our topic analy-\nsis shows that conspiratorial articles receive more visits than\nfactual articles.\nDue to the inability to observe direct website traf\ufb01c, exist-\ning research uses alternative data source such as engage-\nment signals from social media posts. To validate if social\nmedia engagement signals correlate with actual web visit\ncounts, we collect all Facebook and Twitter posts with URLs\nfrom TGP during the same time period. We show that all en-\ngagement signals positively correlate with web visit counts,\nbut with varying correlation strengths. Metrics based on Face-\nbook posts correlate better than metrics based on Twitter. Our\nunique web traf\ufb01c data set and insights can help researchers\nto better measure the impact of far-right and fake news URLs\non social media platforms."}, {"group": "Political Science", "id": 101, "label": "No Community Can Do Everything: Why People Participate in Similar Online Communities", "shape": "dot", "size": 10, "title": "Authors: NATHAN TEBLUNTHUIS, CHARLES KIENE, ISABELLA BROWN, LAURA (ALIA) LEVI, USANICOLE MCGINNIS, BENJAMIN MAKO HILL, Nathan TeBlunthuis, Charles Kiene, Isabella Brown, Laura (Alia) Levi, Nicole McGnis, Benjam Mako, Hill\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Political Science", "id": 104, "label": "This Must Be the Place: Predicting Engagement of Online Communities in a Large-scale Distributed Campaign", "shape": "dot", "size": 10, "title": "Authors: Abrhm Isreli, Alexnder Kreminsky, Oren Tsur\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Understanding collective decision making at a large-scale, and elu-\ncidating how community organization and community dynamics\nshape collective behavior are at the heart of social science research.\nIn this work we study the behavior of thousands of communities\nwith millions of active members. We define a novel task: predict-\ning which community will undertake an unexpected, large-scale,\ndistributed campaign. To this end, we develop a hybrid model, com-\nbining textual cues, community meta-data, and structural proper-\nties. We show how this multi-faceted model can accurately predict\nlarge-scale collective decision-making in a distributed environment.\nWe demonstrate the applicability of our model through Reddit\u2019s\nr/place \u2013 a large-scale online experiment in which millions of\nusers, self-organized in thousands of communities, clashed and\ncollaborated in an effort to realize their agenda.\nOur hybrid model achieves a high F1 prediction score of 0.826.\nWe find that coarse meta-features are as important for prediction\naccuracy as fine-grained textual cues, while explicit structural fea-\ntures play a smaller role. Interpreting our model, we provide and\nsupport various social insights about the unique characteristics of\nthe communities that participated in the r/place experiment.\nOur results and analysis shed light on the complex social dy-\nnamics that drive collective behavior, and on the factors that pro-\npel user coordination. The scale and the unique conditions of the\nr/place experiment suggest that our findings may apply in broader\ncontexts, such as online activism, (countering) the spread of hate\nspeech and reducing political polarization. The broader applica-\nbility of the model is demonstrated through an extensive analysis\nof the WallStreetBets community, their role in r/place and four\nyears later, in the GameStop short squeeze campaign of 2021.\nCCS CONCEPTS\n\u2022 Computing methodologies \u2192Neural networks; \u2022 Informa-\ntion systems \u2192Social networks; \u2022 Applied computing \u2192Ethnog-\nraphy; Sociology; \u2022 Social and professional topics \u2192Cultural\ncharacteristics;\nPermission to make digital or hard copies of all or part of this work for personal or\nclassroom use is granted without fee provided that copies are not made or distributed\nfor profit or commercial advantage and that copies bear this notice and the full citation\non the first page. Copyrights for components of this work owned by others than the\nauthor(s) must be honored. Abstracting with credit is permitted. To copy otherwise, or\nrepublish, to post on servers or to redistribute to lists, requires prior specific permission\nand/or a fee. Request permissions from permissions@acm.org.\nWWW \u201922, April 25\u201329, 2022, Virtual Event, Lyon, France\n\u00a9 2022 Copyright held by the owner/author(s). Publication rights licensed to ACM.\nACM ISBN 978-1-4503-9096-5/22/04...$15.00\nhttps://doi.org/10.1145/3485447.3512238\nKEYWORDS\nOnline Communities, Natural Language Processing, Social Net-\nworks, Computational Social Science, Reddit, rPlace, wallStreetBets,\nGameStop\nACM Reference Format:\nAbraham Israeli, Alexander Kremiansky, Oren Tsur. 2022. This Must Be\nthe Place: Predicting Engagement of Online Communities in a Large-scale\nDistributed Campaign. In Proceedings of the ACM Web Conference 2022\n(WWW \u201922), April 25\u201329, 2022, Virtual Event, Lyon, France. ACM, New York,\nNY, USA, 12 pages. https://doi.org/10.1145/3485447.3512238"}, {"group": "Political Science", "id": 105, "label": "NCPAM16_313", "shape": "dot", "size": 10, "title": "Authors: B Jaganathan, Pankaj Shukla\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: \u2014The purpose of the research is to find a centrality \nmeasure that can be used in place of PageRank and to find out \nthe conditions where we can use it in place of PageRank. After \nanalysis and comparison of graphs with a large number of nodes \nusing Spearman\u2019s Rank Coefficient Correlation, the conclusion is \nevident that Eigenvector can be safely used in place of PageRank \nin directed networks to improve the performance in terms of the \ntime complexity.\nKeywords\u2014 PageRank, Centrality, Eigenvector, Webgraph\nI."}, {"group": "Political Science", "id": 108, "label": "\u201cI Can\u2019t Keep It Up.\u201d A Dataset from the Defunct Voat.co News Aggregator", "shape": "dot", "size": 10, "title": "Authors: min Mekacher\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Voat.co was a news aggregator website that shut down on De-\ncember 25, 2020. The site had a troubled history and was\nknown for hosting various banned subreddits.\nThis paper\npresents a dataset with over 2.3M submissions and 16.2M\ncomments posted from 113K users in 7.1K subverses (the\nequivalent of subreddit for Voat).\nOur dataset covers the\nwhole lifetime of Voat, from its developing period starting\non November 8, 2013, the day it was founded, April 2014, up\nuntil the day it shut down (December 25, 2020).\nThis work presents the largest and most complete publicly\navailable Voat dataset, to the best of our knowledge. Along\nwith the release of this dataset, we present a preliminary anal-\nysis covering posting activity and daily user and subverse reg-\nistration on the platform so that researchers interested in our\ndataset can know what to expect.\nOur data may prove helpful to false news dissemination\nstudies as we analyze the links users share on the platform,\n\ufb01nding that many communities rely on alternative news press,\nlike Breitbart and GatewayPundit, for their daily discussions.\nIn addition, we perform network analysis on user interactions\n\ufb01nding that many users prefer not to interact with subverses\noutside their narrative interests, which could be helpful to re-\nsearchers focusing on polarization and echo chambers. Also,\nsince Voat was one of the platforms banned Reddit commu-\nnities migrated to, we are con\ufb01dent our dataset will motivate\nand assist researchers studying deplatforming. Finally, many\nhateful and conspiratorial communities were very popular on\nVoat, which makes our work valuable for researchers focus-\ning on toxicity, conspiracy theories, cross-platform studies of\nsocial networks, and natural language processing."}, {"group": "Political Science", "id": 126, "label": "X-posing Free Speech: Examining the Impact of Moderation Relaxation on Online Social Networks", "shape": "dot", "size": 10, "title": "Authors: Saurav Chhatani, Pnurangam Kumaraguru\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: We investigate the impact of free speech and\nthe relaxation of moderation on online social\nmedia platforms using Elon Musk\u2019s takeover\nof Twitter as a case study.\nBy curating a\ndataset of over 10 million tweets, our study\nemploys a novel framework combining content\nand network analysis. Our findings reveal a sig-\nnificant increase in the distribution of certain\nforms of hate content, particularly targeting the\nLGBTQ+ community and liberals. Network\nanalysis reveals the formation of cohesive hate\ncommunities facilitated by influential bridge\nusers, with substantial growth in interactions\nhinting at increased hate production and dif-\nfusion. By tracking the temporal evolution of\nPageRank, we identify key influencers, primar-\nily self-identified far-right supporters dissem-\ninating hate against liberals and woke culture.\nIronically, embracing free speech principles ap-\npears to have enabled hate speech against the\nvery concept of freedom of expression and free\nspeech itself. Our findings underscore the del-\nicate balance platforms must strike between\nopen expression and robust moderation to curb\nthe proliferation of hate online."}, {"group": "Structural Biology", "id": 137, "label": "Commentaries on the publication entitled", "shape": "dot", "size": 10, "title": "Authors: Hgyi Li, Hgyi Li, Ernest Starling, Guyt, Levick, Kihara, Catchpole, G. Hauck\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Nothing was found"}, {"group": "Natural Language Processing", "id": 6, "label": "2024 18th International Conference on Automatic Face and Gesture Recognition (FG)", "shape": "dot", "size": 10, "title": "Authors: Harry Walsh, Abolfazl Ravanshad, Mariam Rahmani, Richard Bowden\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: \u2014 Phonetic representations are used when record-\ning spoken languages, but no equivalent exists for recording\nsigned languages. As a result, linguists have proposed several\nannotation systems that operate on the gloss or sub-unit level;\nhowever, these resources are notably irregular and scarce.\nSign Language Production (SLP) aims to automatically\ntranslate spoken language sentences into continuous sequences\nof sign language. However, current state-of-the-art approaches\nrely on scarce linguistic resources to work. This has limited\nprogress in the field. This paper introduces an innovative solu-\ntion by transforming the continuous pose generation problem\ninto a discrete sequence generation problem. Thus, overcoming\nthe need for costly annotation. Although, if available, we\nleverage the additional information to enhance our approach.\nBy applying Vector Quantisation (VQ) to sign language\ndata, we first learn a codebook of short motions that can\nbe combined to create a natural sequence of sign. Where\neach token in the codebook can be thought of as the lexicon\nof our representation. Then using a transformer we perform\na translation from spoken language text to a sequence of\ncodebook tokens. Each token can be directly mapped to a\nsequence of poses allowing the translation to be performed\nby a single network. Furthermore, we present a sign stitching\nmethod to effectively join tokens together. We evaluate on\nthe RWTH-PHOENIX-Weather-2014T (PHOENIX14T) and the\nmore challenging meineDGST (mDGS) datasets. An extensive\nevaluation shows our approach outperforms previous methods,\nincreasing the BLEU-1 back translation score by up to 72%.\nI."}, {"group": "Natural Language Processing", "id": 8, "label": "Quantifying Multilingual Performance of Large Language Models Across Languages", "shape": "dot", "size": 10, "title": "Authors: Zihao Li\u2217, Yucheng Shi, Zirui Liu, Fan Yang, Ninghao Liu, Mengnan Du\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: The training process of Large Language Mod-\nels (LLMs) requires extensive text corpus.\nHowever, these data are often unevenly dis-\ntributed in different languages. As a result,\nLLMs perform well on common languages,\nsuch as English, German, and French, but per-\nform poorly on low-resource languages. How-\never, currently there is no work to quantita-\ntively measure the performance of LLMs in\nlow-resource languages. To fill this gap, we\nproposed the Language Ranker that aims to\nbenchmark and rank different languages ac-\ncording to the performance of LLMs on those\nlanguages. We employ the LLM\u2019s performance\non the English corpus as a baseline to compare\nthe performances of different languages and\nEnglish. We have the following three findings:\n1. The performance rankings of different LLMs\nin all languages are roughly the same. 2. LLMs\nwith different sizes have the same partial order\nof performance. 3. There is a strong correlation\nbetween LlaMa2\u2019s performance in different lan-\nguages and the proportion of the pre-training\ncorpus. These findings illustrate that the Lan-\nguage Ranker can be used as an indicator to\nmeasure the language performance of LLMs."}, {"group": "Natural Language Processing", "id": 10, "label": "ADVANCING SPEECH TRANSLATION: A CORPUS OF MANDARIN-ENGLISH CONVERSATIONAL TELEPHONE SPEECH", "shape": "dot", "size": 10, "title": "Authors: Shannon Wotherspoon, William Hartmann, Matthew Snover, william.hartmann\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: This paper introduces a set of English translations for a\n123-hour subset of the CallHome Mandarin Chinese data\nand the HKUST Mandarin Telephone Speech data for the\ntask of speech translation.\nPaired source-language speech\nand target-language text is essential for training end-to-end\nspeech translation systems and can provide substantial perfor-\nmance improvements for cascaded systems as well, relative to\ntraining on more widely available text data sets. We demon-\nstrate that \ufb01ne-tuning a general-purpose translation model to\nour Mandarin-English conversational telephone speech train-\ning set improves target-domain BLEU by more than 8 points,\nhighlighting the importance of matched training data.\nIndex Terms\u2014 speech translation, corpus, conversational\ntelephone speech\n1."}, {"group": "Natural Language Processing", "id": 11, "label": "MEMLLM: Finetuning LLMs to Use An Explicit Read-Write Memory", "shape": "dot", "size": 10, "title": "Authors: Abdullatif K\u00f6ksal,, Ayyoob Imani,, Mohsen Fayyaz\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: While current large language models (LLMs)\ndemonstrate some capabilities in knowledge-\nintensive tasks, they are limited by relying on\ntheir parameters as an implicit storage mecha-\nnism. As a result, they struggle with infrequent\nknowledge and temporal degradation. In addi-\ntion, the uninterpretable nature of parametric\nmemorization makes it challenging to under-\nstand and prevent hallucination. Parametric\nmemory pools and model editing are only par-\ntial solutions. Retrieval Augmented Generation\n(RAG) \u2013 though non-parametric \u2013 has its own\nlimitations: it lacks structure, complicates in-\nterpretability and makes it hard to effectively\nmanage stored knowledge. In this paper, we\nintroduce MEMLLM, a novel method of en-\nhancing LLMs by integrating a structured and\nexplicit read-and-write memory module. MEM-\nLLM tackles the aforementioned challenges by\nenabling dynamic interaction with the memory\nand improving the LLM\u2019s capabilities in using\nstored knowledge. Our experiments indicate\nthat MEMLLM enhances the LLM\u2019s perfor-\nmance and interpretability, in language model-\ning in general and knowledge-intensive tasks in\nparticular. We see MEMLLM as an important\nstep towards making LLMs more grounded and\nfactual through memory augmentation."}, {"group": "Natural Language Processing", "id": 20, "label": "SKIP: Skill-Localized Prompt Tuning for Inference Speed Boost-Up", "shape": "dot", "size": 10, "title": "Authors: Junseok Kim, Jiwon Moon, Yunah Jang, Kyomin Jung\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Prompt-tuning methods have shown compa-\nrable performance as parameter-efficient fine-\ntuning (PEFT) methods in various natural lan-\nguage understanding tasks. However, existing\nprompt tuning methods still utilize the entire\nmodel architecture; thus, they fail to accel-\nerate inference speed in the application. In\nthis paper, we propose a novel approach called\nSKIll-localized Prompt tuning (SKIP), which\nis extremely efficient in inference time. Our\nmethod significantly enhances inference effi-\nciency by investigating and utilizing a skill-\nlocalized subnetwork in a language model. Sur-\nprisingly, our method improves the inference\nspeed up to 160% times while pruning 52% of\nthe parameters. Furthermore, we demonstrate\nthat our method is applicable across various\ntransformer-based architectures, thereby con-\nfirming its practicality and scalability."}, {"group": "Natural Language Processing", "id": 21, "label": "CrossIn: An Efficient Instruction Tuning Approach for Cross-Lingual Knowledge Alignment", "shape": "dot", "size": 10, "title": "Authors: Bin Wang, Zhengyuan Liu, Nancy F. Chen\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Multilingual proficiency presents a significant\nchallenge for large language models (LLMs).\nEnglish-centric models are usually suboptimal\nin other languages, particularly those that are\nlinguistically distant from English. This per-\nformance discrepancy mainly stems from the\nimbalanced distribution of training data across\nlanguages during pre-training and instruction\ntuning stages. To address this problem, we pro-\npose a novel approach called CrossIn, which\nutilizes a mixed composition of cross-lingual\ninstruction tuning data.\nOur method lever-\nages the compressed representation shared by\nvarious languages to efficiently enhance the\nmodel\u2019s task-solving capabilities and multilin-\ngual proficiency within a single process. In\naddition, we introduce a multi-task and multi-\nfaceted benchmark to evaluate the effective-\nness of CrossIn. Experimental results demon-\nstrate that our method substantially improves\nperformance across tasks and languages, and\nwe provide extensive insights into the impact of\ncross-lingual data volume and the integration\nof translation data on enhancing multilingual\nconsistency and accuracy.1"}, {"group": "Natural Language Processing", "id": 23, "label": "Aligning Language Models to Explicitly Handle Ambiguity", "shape": "dot", "size": 10, "title": "Authors: Hyuhng Joon Kim, Youna Kim, Cheonbok Park, Junyeob Kim, Choonghyun Park, Kang Min Yoo, Sang-goo Lee, Taeuk Kim, juny\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: In spoken languages, utterances are often\nshaped to be incomplete or vague for efficiency.\nThis can lead to varying interpretations of the\nsame input, based on different assumptions\nabout the context.\nTo ensure reliable user-\nmodel interactions in such scenarios, it is cru-\ncial for models to adeptly handle the inherent\nambiguity in user queries. However, conversa-\ntional agents built upon even the most recent\nlarge language models (LLMs) face challenges\nin processing ambiguous inputs, primarily due\nto the following two hurdles: (1) LLMs are not\ndirectly trained to handle inputs that are too am-\nbiguous to be properly managed; (2) the degree\nof ambiguity in an input can vary according to\nthe intrinsic knowledge of the LLMs, which\nis difficult to investigate. To address these is-\nsues, this paper proposes a method to align\nLLMs to explicitly handle ambiguous inputs.\nSpecifically, we introduce a proxy task that\nguides LLMs to utilize their intrinsic knowl-\nedge to self-disambiguate a given input. We\nquantify the information gain from the disam-\nbiguation procedure as a measure of the extent\nto which the models perceive their inputs as\nambiguous. This measure serves as a cue for\nselecting samples deemed ambiguous from the\nmodels\u2019 perspectives, which are then utilized\nfor alignment. Experimental results from sev-\neral question-answering datasets demonstrate\nthat the LLMs fine-tuned with our approach are\ncapable of handling ambiguous inputs while\nstill performing competitively on clear ques-\ntions within the task."}, {"group": "Natural Language Processing", "id": 24, "label": "Token-level Direct Preference Optimization", "shape": "dot", "size": 10, "title": "Authors: Yongcheng Zeng, Guoqing Liu, Ning Yang, Haifeng Zhang, Jun Wang\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Fine-tuning pre-trained Large Language Models\n(LLMs) is essential to align them with human\nvalues and intentions.\nThis process often uti-\nlizes methods like pairwise comparisons and KL\ndivergence against a reference LLM, focusing\non the evaluation of full answers generated by\nthe models. However, the generation of these\nresponses occurs in a token level, following a\nsequential, auto-regressive fashion. In this pa-\nper, we introduce Token-level Direct Preference\nOptimization (TDPO), a novel approach to align\nLLMs with human preferences by optimizing pol-\nicy at the token level. Unlike previous methods,\nwhich face challenges in divergence efficiency,\nTDPO incorporates forward KL divergence con-\nstraints for each token, improving alignment and\ndiversity. Utilizing the Bradley-Terry model for\na token-based reward system, TDPO enhances\nthe regulation of KL divergence, while preserv-\ning simplicity without the need for explicit re-\nward modeling. Experimental results across vari-\nous text tasks demonstrate TDPO\u2019s superior per-\nformance in balancing alignment with genera-\ntion diversity. Notably, fine-tuning with TDPO\nstrikes a better balance than DPO in the controlled\nsentiment generation and single-turn dialogue\ndatasets, and significantly improves the quality of\ngenerated responses compared to both DPO and\nPPO-based RLHF methods. Our code is open-\nsourced at https://github.com/Vance0124/Token-\nlevel-Direct-Preference-Optimization.\n1."}, {"group": "Natural Language Processing", "id": 29, "label": "Constituents Correspond to Word Sequence Patterns among Sentences with Equivalent Predicate-Argument Structures: Unsupervised Constituency Parsing by Span Matching", "shape": "dot", "size": 10, "title": "Authors: Junjie Chen, Xiangheng He, Danushka Bollegala, Yusuke Miyao\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Unsupervised constituency parsing is about\nidentifying word sequences that form a syn-\ntactic unit (i.e., constituents) in a target sen-\ntence. Linguists identify the constituent by\nevaluating a set of Predicate-Argument Struc-\nture (PAS) equivalent sentences where we find\nthe constituent corresponds to frequent word\nsequences. However, such information is un-\navailable to previous parsing methods which\nidentify the constituent by observing sentences\nwith diverse PAS. In this study, we empirically\nverify that constituents correspond to word\nsequence patterns in the PAS-equivalent sen-\ntence set.\nWe propose a frequency-based\nmethod span-overlap, applying the word se-\nquence pattern to computational unsupervised\nparsing for the first time.\nParsing experi-\nments show that the span-overlap parser out-\nperforms state-of-the-art parsers in eight out\nof ten languages. Further discrimination analy-\nsis confirms that the span-overlap method can\nnon-trivially separate constituents from non-\nconstituents. This result highlights the util-\nity of the word sequence pattern. Addition-\nally, we discover a multilingual phenomenon:\nparticipant-denoting constituents are more\nfrequent than event-denoting constituents.\nThe phenomenon indicates a behavioral differ-\nence between the two constituent types, laying\nthe foundation for future labeled unsupervised\nparsing."}, {"group": "Natural Language Processing", "id": 35, "label": "EuSQuAD: Automatically Translated and Aligned SQuAD2.0 for Basque", "shape": "dot", "size": 10, "title": "Authors: Euskera, Aitor Garc\u00eda-Pablos,\u2217Naiara, Jaione Bengoetxea\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: : The widespread availability of Question Answering (QA) datasets in\nEnglish has greatly facilitated the advancement of the Natural Language Processing\n(NLP) field. However, the scarcity of such resources for minority languages, such\nas Basque, poses a substantial challenge for these communities. In this context, the\ntranslation and alignment of existing QA datasets plays a crucial role in narrowing\nthis technological gap. This work presents EuSQuAD, the first initiative dedicated\nto automatically translating and aligning SQuAD2.0 into Basque, resulting in more\nthan 142k QA examples.\nWe demonstrate EuSQuAD\u2019s value through extensive\nqualitative analysis and QA experiments supported with EuSQuAD as training data.\nThese experiments are evaluated with a new human-annotated dataset.\nKeywords: question answering, reading comprehension, Basque, SQuAD\nResumen: La amplia disponibilidad de conjuntos de datos de preguntas y respues-\ntas en ingl\u00e9s ha facilitado en gran medida el avance del campo de Procesamiento\nde Lenguaje Natural (PLN). Sin embargo, la escasez de tales recursos para idiomas\nminoritarios, como el euskera, plantea un desaf\u00edo sustancial para estas comunida-\ndes. En este contexto, la traducci\u00f3n y alineaci\u00f3n de conjuntos de datos desempe\u00f1a\nun papel crucial en la reducci\u00f3n de esta brecha tecnol\u00f3gica. Este trabajo presen-\nta EuSQuAD, la primera iniciativa dedicada a traducir y alinear autom\u00e1ticamente\nSQuAD2.0 al euskera. Demostramos el valor de EuSQuAD a trav\u00e9s de un extenso\nan\u00e1lisis cualitativo y experimentos de QA, para los cuales se ha creado adem\u00e1s un\nnuevo dataset anotado por humanos.\nPalabras clave: pregunta-respuesta, comprensi\u00f3n lectora, euskera, SQuAD"}, {"group": "Natural Language Processing", "id": 37, "label": "Advancing the Robustness of Large Language Models through Self-Denoised Smoothing", "shape": "dot", "size": 10, "title": "Authors: Bairu Hou\u2217, Zhen Zhang\u2217, Guanhua Zhang\u2217, Wenqi Fan, Qing Li, Gaowen Liu, Sijia Liu, Shiyu Chang\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Although large language models (LLMs) have\nachieved significant success, their vulnerabil-\nity to adversarial perturbations, including re-\ncent jailbreak attacks, has raised considerable\nconcerns.\nHowever, the increasing size of\nthese models and their limited access make\nimproving their robustness a challenging task.\nAmong various defense strategies, random-\nized smoothing has shown great potential for\nLLMs, as it does not require full access to the\nmodel\u2019s parameters or fine-tuning via adver-\nsarial training. However, randomized smooth-\ning involves adding noise to the input before\nmodel prediction, and the final model\u2019s ro-\nbustness largely depends on the model\u2019s per-\nformance on these noise corrupted data. Its\neffectiveness is often limited by the model\u2019s\nsub-optimal performance on noisy data. To\naddress this issue, we propose to leverage the\nmultitasking nature of LLMs to first denoise\nthe noisy inputs and then to make predictions\nbased on these denoised versions.\nWe call\nthis procedure self-denoised smoothing. Un-\nlike previous denoised smoothing techniques\nin computer vision, which require training a\nseparate model to enhance the robustness of\nLLMs, our method offers significantly better\nefficiency and flexibility. Our experimental\nresults indicate that our method surpasses ex-\nisting methods in both empirical and certified\nrobustness in defending against adversarial at-\ntacks for both downstream tasks and human\nalignments (i.e., jailbreak attacks). Our code\nis publicly available at https://github.\ncom/UCSB-NLP-Chang/SelfDenoise."}, {"group": "Natural Language Processing", "id": 38, "label": "Resilience through Scene Context in Visual Referring Expression Generation", "shape": "dot", "size": 10, "title": "Authors: Sa Zarrie\u00df\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Scene context is well known to facilitate hu-\nmans\u2019 perception of visible objects. In this pa-\nper, we investigate the role of context in Refer-\nring Expression Generation (REG) for objects\nin images, where existing research has often fo-\ncused on distractor contexts that exert pressure\non the generator. We take a new perspective\non scene context in REG and hypothesize that\ncontextual information can be conceived of as a\nresource that makes REG models more resilient\nand facilitates the generation of object descrip-\ntions, and object types in particular. We train\nand test Transformer-based REG models with\ntarget representations that have been artificially\nobscured with noise to varying degrees. We\nevaluate how properties of the models\u2019 visual\ncontext affect their processing and performance.\nOur results show that even simple scene con-\ntexts make models surprisingly resilient to per-\nturbations, to the extent that they can identify\nreferent types even when visual information\nabout the target is completely missing."}, {"group": "Natural Language Processing", "id": 39, "label": "Augmenting emotion features in irony detection with", "shape": "dot", "size": 10, "title": "Authors: Yucheng L, Yuhan Xia\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: . This study introduces a novel method for irony detection, applying \nLarge Language Models (LLMs) with prompt-based learning to facilitate \nemotion-centric text augmentation. Traditional irony detection techniques \ntypically fall short due to their reliance on static linguistic features and predefined \nknowledge bases, often overlooking the nuanced emotional dimensions integral \nto irony. In contrast, our methodology augments the detection process by \nintegrating subtle emotional cues, augmented through LLMs, into three \nbenchmark pre-trained NLP models\u2014BERT, T5, and GPT-2\u2014which are widely \nrecognized as foundational in irony detection. We assessed our method using the \nSemEval-2018 Task 3 dataset and observed substantial enhancements in irony \ndetection capabilities. \nKeywords: Irony Detection, Text Augmentation, Large Language Modeling"}, {"group": "Natural Language Processing", "id": 40, "label": "Simultaneous Interpretation Corpus Construction by Large Language Models in Distant Language Pair", "shape": "dot", "size": 10, "title": "Authors: Mana Makae\u2217, Hidetaka Kamigaito\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: In Simultaneous Machine Translation (SiMT)\nsystems, training with a simultaneous interpre-\ntation (SI) corpus is an effective method for\nachieving high-quality yet low-latency systems.\nHowever, it is very challenging to curate such\na corpus due to limitations in the abilities of\nannotators, and hence, existing SI corpora are\nlimited. Therefore, we propose a method to\nconvert existing speech translation corpora into\ninterpretation-style data, maintaining the origi-\nnal word order and preserving the entire source\ncontent using Large Language Models (LLM-\nSI-Corpus). We demonstrate that fine-tuning\nSiMT models in text-to-text and speech-to-text\nsettings with the LLM-SI-Corpus reduces laten-\ncies while maintaining the same level of qual-\nity as the models trained with offline datasets.\nThe LLM-SI-Corpus is available at https://\ngithub.com/yusuke1997/LLM-SI-Corpus."}, {"group": "Structural Biology", "id": 81, "label": "Towards Embedding Dynamic Personas in Interactive Robots: Masquerading Animated Social Kinematics (MASK)", "shape": "dot", "size": 10, "title": "Authors: Jeongeun Park, Taemoon Jeong, Hyeonseong Kim, Taehyun Byun, Seungyoon Sh, Keunjun Choi, Jaewoon Kwon, Taeyoon Lee, Matthew Pan, Sungjoon Choi\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: \u2014 This paper presents the design and development\nof an innovative interactive robotic system to enhance au-\ndience engagement using character-like personas. Built upon\nthe foundations of persona-driven dialog agents, this work\nextends the agent\u2019s application to the physical realm, employing\nrobots to provide a more immersive and interactive experience.\nThe proposed system, named the Masquerading Animated\nSocial Kinematics (MASK), leverages an anthropomorphic\nrobot which interacts with guests using non-verbal interactions,\nincluding facial expressions and gestures. A behavior generation\nsystem based upon a finite-state machine structure effectively\nconditions robotic behavior to convey distinct personas The\nMASK framework integrates a perception engine, a behav-\nior selection engine, and a comprehensive action library to\nenable real-time, dynamic interactions with minimal human\nintervention in behavior design. Throughout the user subject\nstudies, we examined whether the users could recognize the\nintended character in film-character-based persona conditions.\nWe conclude by discussing the role of personas in interactive\nagents and the factors to consider for creating an engaging user\nexperience.\nI."}, {"group": "Structural Biology", "id": 86, "label": "SculptDiff: Learning Robotic Clay Sculpting from Humans with Goal Conditioned Diffusion Policy", "shape": "dot", "size": 10, "title": "Authors: Alison Bartsch, Arvind Car, Charlotte Avra, Amir Barati Farimani\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: \u2014 Manipulating\ndeformable\nobjects\nremains\na\nchallenge within robotics due to the difficulties of state\nestimation, long-horizon planning, and predicting how the\nobject will deform given an interaction. These challenges\nare\nthe\nmost\npronounced\nwith\n3D\ndeformable\nobjects.\nWe propose SculptDiff, a goal-conditioned diffusion-based\nimitation learning framework that works with point cloud\nstate observations to directly learn clay sculpting policies for a\nvariety of target shapes. To the best of our knowledge this is the\nfirst real-world method that successfully learns manipulation\npolicies for 3D deformable objects. For sculpting videos and\naccess to our dataset and hardware CAD models, see the project\nwebsite:\nhttps://sites.google.com/andrew.cmu.edu/imitation-\nsculpting/home\nI."}, {"group": "Structural Biology", "id": 87, "label": "H-MaP: An Iterative and Hybrid Sequential Manipulation Planner", "shape": "dot", "size": 10, "title": "Authors: Cankut Bora Tuncer, Busenaz Kerimgil, Ozgur S. Oguz\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: \u2014 This study introduces the Hybrid Sequential Ma-\nnipulation Planner (H-MaP), a novel approach that iteratively\ndoes motion planning using contact points and waypoints for\ncomplex sequential manipulation tasks in robotics. Combining\noptimization-based methods for generalizability and sampling-\nbased methods for robustness, H-MaP enhances manipulation\nplanning through active contact mode switches and enables\ninteractions with auxiliary objects and tools. This framework,\nvalidated by a series of diverse physical manipulation tasks and\nreal-robot experiments, offers a scalable and adaptable solution\nfor complex real-world applications in robotic manipulation.\nhttps://sites.google.com/view/h-map/\nI."}, {"group": "Structural Biology", "id": 90, "label": "Lifelong LERF: Local 3D Semantic Inventory Monitoring Using FogROS2", "shape": "dot", "size": 10, "title": "Authors: Adam Rashid, Chung Min Kim, Justin Kerr, Letian Fu, Kush Hari, Ayah Ahmad, Kaiyuan Chen, Huang Huang, Marcus Gualtieri, Michael Wang, Christian Juette, Nan Tian, Liu Ren, Ken Goldberg\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: \u2014 Inventory monitoring in homes, factories, and\nretail stores relies on maintaining data despite objects being\nswapped, added, removed, or moved. We introduce Lifelong\nLERF, a method that allows a mobile robot with minimal\ncompute to jointly optimize a dense language and geometric\nrepresentation of its surroundings. Lifelong LERF maintains\nthis representation over time by detecting semantic changes\nand selectively updating these regions of the environment,\navoiding the need to exhaustively remap. Human users can\nquery inventory by providing natural language queries and\nreceiving a 3D heatmap of potential object locations. To\nmanage the computational load, we use Fog-ROS2, a cloud\nrobotics platform, to offload resource-intensive tasks. Lifelong\nLERF obtains poses from a monocular RGBD SLAM backend,\nand uses these poses to progressively optimize a Language\nEmbedded Radiance Field (LERF) for semantic monitoring.\nExperiments with 3-5 objects arranged on a tabletop and a\nTurtlebot with a RealSense camera suggest that Lifelong LERF\ncan persistently adapt to changes in objects with up to 91%\naccuracy.\nI."}, {"group": "Natural Language Processing", "id": 7, "label": "Evaluating Span Extraction in Generative Paradigm: A Reflection on Aspect-Based Sentiment Analysis", "shape": "dot", "size": 10, "title": "Authors: Soyoung Yang, W Ik Cho\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: In the era of rapid evolution of generative lan-\nguage models within the realm of natural lan-\nguage processing, there is an imperative call\nto revisit and reformulate evaluation method-\nologies, especially in the domain of aspect-\nbased sentiment analysis (ABSA). This paper\naddresses the emerging challenges introduced\nby the generative paradigm, which has moder-\nately blurred traditional boundaries between\nunderstanding and generation tasks.\nBuild-\ning upon prevailing practices in the field, we\nanalyze the advantages and shortcomings as-\nsociated with the prevalent ABSA evaluation\nparadigms.\nThrough an in-depth examina-\ntion, supplemented by illustrative examples, we\nhighlight the intricacies involved in aligning\ngenerative outputs with other evaluative met-\nrics, specifically those derived from other tasks,\nincluding question answering. While we steer\nclear of advocating for a singular and defini-\ntive metric, our contribution lies in paving the\npath for a comprehensive guideline tailored for\nABSA evaluations in this generative paradigm.\nIn this position paper, we aim to provide prac-\ntitioners with profound reflections, offering in-\nsights and directions that can aid in navigating\nthis evolving landscape, ensuring evaluations\nthat are both accurate and reflective of genera-\ntive capabilities."}, {"group": "Natural Language Processing", "id": 12, "label": "How often are errors in natural language reasoning due to paraphrastic variability?", "shape": "dot", "size": 10, "title": "Authors: Neha Srikanth, Mare Carpuat, Rachel Rudger\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Large language models have been shown\nto behave inconsistently in response to\nmeaning-preserving paraphrastic inputs. At\nthe same time, researchers evaluate the\nknowledge and reasoning abilities of these\nmodels with test evaluations that do not dis-\naggregate the effect of paraphrastic variabil-\nity on performance. We propose a metric,\nPC, for evaluating the paraphrastic consis-\ntency of natural language reasoning models\nbased on the probability of a model achiev-\ning the same correctness on two paraphrases\nof the same problem. We mathematically\nconnect this metric to the proportion of a\nmodel\u2019s variance in correctness attributable\nto paraphrasing. To estimate PC, we col-\nlect PARANLU, a dataset of 7,782 human-\nwritten and validated paraphrased reason-\ning problems constructed on top of exist-\ning benchmark datasets for defeasible and\nabductive natural language inference. Us-\ning PARANLU, we measure the paraphras-\ntic consistency of several model classes\nand show that consistency dramatically in-\ncreases with pretraining but not fine-tuning.\nAll models tested exhibited room for im-\nprovement in paraphrastic consistency."}, {"group": "Natural Language Processing", "id": 13, "label": "Investigating Gender Bias in Turkish Language Models", "shape": "dot", "size": 10, "title": "Authors: Orhun Caglidil, Malte Ostendorff\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Language models are trained mostly on Web\ndata, which often contains social stereotypes\nand biases that the models can inherit. This has\npotentially negative consequences, as models\ncan amplify these biases in downstream tasks\nor applications. However, prior research has\nprimarily focused on the English language, es-\npecially in the context of gender bias. In partic-\nular, grammatically gender-neutral languages\nsuch as Turkish are underexplored despite rep-\nresenting different linguistic properties to lan-\nguage models with possibly different effects on\nbiases. In this paper, we fill this research gap\nand investigate the significance of gender bias\nin Turkish language models. We build upon\nexisting bias evaluation frameworks and extend\nthem to the Turkish language by translating\nexisting English tests and creating new ones\ndesigned to measure gender bias in the con-\ntext of T\u00fcrkiye. Specifically, we also evaluate\nTurkish language models for their embedded\nethnic bias toward Kurdish people. Based on\nthe experimental results, we attribute possible\nbiases to different model characteristics such as\nthe model size, their multilingualism, and the\ntraining corpora. We make the Turkish gender\nbias dataset publicly available."}, {"group": "Natural Language Processing", "id": 17, "label": "Enhancing Argument Summarization: Prioritizing Exhaustiveness in Key Point Generation and Introducing an Automatic Coverage Evaluation Metric", "shape": "dot", "size": 10, "title": "Authors: Chenyg Hug\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: The proliferation of social media platforms has\ngiven rise to the amount of online debates and\narguments. Consequently, the need for auto-\nmatic summarization methods for such debates\nis imperative, however this area of summariza-\ntion is rather understudied.\nThe Key Point\nAnalysis (KPA) task formulates argument sum-\nmarization as representing the summary of a\nlarge collection of arguments in the form of\nconcise sentences in bullet-style format, called\nkey points. A sub-task of KPA, called Key\nPoint Generation (KPG), focuses on generating\nthese key points given the arguments. This pa-\nper introduces a novel extractive approach for\nkey point generation, that outperforms previ-\nous state-of-the-art methods for the task. Our\nmethod utilizes an extractive clustering based\napproach that offers concise, high quality gen-\nerated key points with higher coverage of refer-\nence summaries, and less redundant outputs. In\naddition, we show that the existing evaluation\nmetrics for summarization such as ROUGE are\nincapable of differentiating between generated\nkey points of different qualities. To this end, we\npropose a new evaluation metric for assessing\nthe generated key points by their coverage. Our\ncode can be accessed online.1"}, {"group": "Natural Language Processing", "id": 18, "label": "AdvisorQA: Towards Helpful and Harmless Advice-seeking Question Answering with Collective Intelligence", "shape": "dot", "size": 10, "title": "Authors: Hwaran Lee,, minbeomkim\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: As the integration of large language models\ninto daily life is on the rise, there is a clear\ngap in benchmarks for advising on subjective\nand personal dilemmas. To address this, we\nintroduce AdvisorQA, the first benchmark de-\nveloped to assess LLMs\u2019 capability in offering\nadvice for deeply personalized concerns, uti-\nlizing the LifeProTips subreddit forum. This\nforum features a dynamic interaction where\nusers post advice-seeking questions, receiving\nan average of 8.9 advice per query, with 164.2\nupvotes from hundreds of users, embodying a\ncollective intelligence framework. Therefore,\nwe\u2019ve completed a benchmark encompassing\ndaily life questions, diverse corresponding re-\nsponses, and majority vote ranking to train our\nhelpfulness metric. Baseline experiments val-\nidate the efficacy of AdvisorQA through our\nhelpfulness metric, GPT-4, and human evalua-\ntion, analyzing phenomena beyond the trade-off\nbetween helpfulness and harmlessness. Advi-\nsorQA marks a significant leap in enhancing\nQA systems for providing personalized, empa-\nthetic advice, showcasing LLMs\u2019 improved un-\nderstanding of human subjectivity."}, {"group": "Natural Language Processing", "id": 27, "label": "Enhance Robustness of Language Models Against Variation Attack through Graph Integration", "shape": "dot", "size": 10, "title": "Authors: Lizhi Qing, Yangyang Kang, Jiawei Liu, Hongsong Li, Changlong Sun, Xiaozhong Liu, Wei Lu, yangyang.kangyy\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: The widespread use of pre-trained language models (PLMs) in natural language processing (NLP) has greatly\nimproved performance outcomes. However, these models\u2019 vulnerability to adversarial attacks (e.g., camouflaged\nhints from drug dealers), particularly in the Chinese language with its rich character diversity/variation and complex\nstructures, hatches vital apprehension.\nIn this study, we propose a novel method, CHinese vAriatioN Graph\nEnhancement (CHANGE), to increase the robustness of PLMs against character variation attacks in Chinese\ncontent. CHANGE presents a novel approach for incorporating a Chinese character variation graph into the PLMs.\nThrough designing different supplementary tasks utilizing the graph structure, CHANGE essentially enhances PLMs\u2019\ninterpretation of adversarially manipulated text. Experiments conducted in a multitude of NLP tasks show that\nCHANGE outperforms current language models in combating against adversarial attacks and serves as a valuable\ncontribution to robust language model research. These findings contribute to the groundwork on robust language\nmodels and highlight the substantial potential of graph-guided pre-training strategies for real-world applications.\nKeywords: PLMs, Chinese adversarial attacks, variation graph\n1."}, {"group": "Political Science", "id": 28, "label": "Exploring Boundaries and Intensities in Offensive and Hate Speech: Unveiling the Complex Spectrum of Social Media Discourse", "shape": "dot", "size": 10, "title": "Authors: Abew Ali Ayele,, Esubalew Alemneh Jalew, Adem Chanie Ali, Seid Muhie Yimam, Chris Biemann\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: The prevalence of digital media and evolving sociopolitical dynamics have significantly amplified the dissemination\nof hateful content. Existing studies mainly focus on classifying texts into binary categories, often overlooking the\ncontinuous spectrum of offensiveness and hatefulness inherent in the text. In this research, we present an extensive\nbenchmark dataset for Amharic, comprising 8,258 tweets annotated for three distinct tasks: category classification,\nidentification of hate targets, and rating offensiveness and hatefulness intensities. Our study highlights that a\nconsiderable majority of tweets belong to the less offensive and less hate intensity levels, underscoring the need for\nearly interventions by stakeholders. The prevalence of ethnic and political hatred targets, with significant overlaps in\nour dataset, emphasizes the complex relationships within Ethiopia\u2019s sociopolitical landscape. We build classification\nand regression models and investigate the efficacy of models in handling these tasks. Our results reveal that hate and\noffensive speech can not be addressed by a simplistic binary classification, instead manifesting as variables across a\ncontinuous range of values. The Afro-XLMR-large model exhibits the best performances achieving F1-scores of\n75.30%, 70.59%, and 29.42% for the category, target, and regression tasks, respectively. The 80.22% correlation\ncoefficient of the Afro-XLMR-large model indicates strong alignments.\nKeywords: Intensity, Hatefulness, Offensiveness, Rating scale\n1."}, {"group": "Political Science", "id": 33, "label": "Stance Detection on Social Media with Fine-Tuned Large Language Models", "shape": "dot", "size": 10, "title": "Authors: Ilker G\u00fcl, EPFL, R\u00e9mi Lebret, Karl Aberer\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Stance detection, a key task in natural language\nprocessing, determines an author\u2019s viewpoint\nbased on textual analysis. This study evaluates\nthe evolution of stance detection methods,\ntransitioning from early machine learning\napproaches to the groundbreaking BERT model,\nand eventually to modern Large Language Mod-\nels (LLMs) such as ChatGPT, LLaMa-2, and\nMistral-7B. While ChatGPT\u2019s closed-source\nnature and associated costs present challenges,\nthe open-source models like LLaMa-2 and\nMistral-7B offers an encouraging alternative.\nInitially, our research focused on fine-tuning\nChatGPT, LLaMa-2, and Mistral-7B using sev-\neral publicly available datasets. Subsequently,\nto provide a comprehensive comparison, we\nassess the performance of these models in\nzero-shot and few-shot learning scenarios. The\nresults underscore the exceptional ability of\nLLMs in accurately detecting stance, with all\ntested models surpassing existing benchmarks.\nNotably, LLaMa-2 and Mistral-7B demonstrate\nremarkable efficiency and potential for stance\ndetection, despite their smaller sizes compared\nto ChatGPT. This study emphasizes the\npotential of LLMs in stance detection and calls\nfor more extensive research in this field."}, {"group": "Natural Language Processing", "id": 34, "label": "Claim Check-Worthiness Detection: How Well do LLMs Grasp Annotation Guidelines?", "shape": "dot", "size": 10, "title": "Authors: Laura Majer, Jan \u0160najder, laura.majer\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: The increasing threat of disinformation calls\nfor automating parts of the fact-checking\npipeline.\nIdentifying text segments requir-\ning fact-checking is known as claim detec-\ntion (CD) and claim check-worthiness detection\n(CW), the latter incorporating complex domain-\nspecific criteria of worthiness and often framed\nas a ranking task. Zero- and few-shot LLM\nprompting is an attractive option for both tasks,\nas it bypasses the need for labeled datasets and\nallows verbalized claim and worthiness criteria\nto be directly used for prompting. We evaluate\nthe LLMs\u2019 predictive and calibration accuracy\non five CD/CW datasets from diverse domains,\neach utilizing a different worthiness criterion.\nWe investigate two key aspects: (1) how best\nto distill factuality and worthiness criteria into\na prompt and (2) what amount of context to\nprovide for each claim. To this end, we experi-\nment with varying the level of prompt verbosity\nand the amount of contextual information pro-\nvided to the model. Our results show that op-\ntimal prompt verbosity is domain-dependent,\nadding context does not improve performance,\nand confidence scores can be directly used to\nproduce reliable check-worthiness rankings."}, {"group": "Natural Language Processing", "id": 36, "label": "Length Generalization of Causal Transformers without Position Encoding", "shape": "dot", "size": 10, "title": "Authors: Jie Wang, Tao Ji, Yuanbin Wu, Hang Yan, Tao Gui, Qi Zhang, Xuanjing Huang,, Xiaoling Wang\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Generalizing to longer sentences is important\nfor recent Transformer-based language mod-\nels. Besides algorithms manipulating explicit\nposition features, the success of Transform-\ners without position encodings (NoPE) pro-\nvides a new way to overcome the challenge.\nIn this paper, we study the length generaliza-\ntion property of NoPE. We find that although\nNoPE can extend to longer sequences than\nthe commonly used explicit position encod-\nings, it still has a limited context length. We\nidentify a connection between the failure of\nNoPE\u2019s generalization and the distraction of at-\ntention distributions. We propose a parameter-\nefficient tuning for searching attention heads\u2019\nbest temperature hyper-parameters, which sub-\nstantially expands NoPE\u2019s context size. Experi-\nments on long sequence language modeling, the\nsynthetic passkey retrieval task and real-world\nlong context tasks show that NoPE can achieve\ncompetitive performances with state-of-the-art\nlength generalization algorithms. The source\ncode is publicly accessible1."}, {"group": "Natural Language Processing", "id": 41, "label": "Reuse Your Rewards: Reward Model Transfer for Zero-Shot Cross-Lingual Alignment", "shape": "dot", "size": 10, "title": "Authors: Zhaofeng Wu\u00e3, Ananth Balashankar\u00e5, Jacob Eisenstein\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Aligning language models (LMs) based on\nhuman-annotated preference data is a crucial\nstep in obtaining practical and performant LM-\nbased systems. However, multilingual human\npreference data are difficult to obtain at scale,\nmaking it challenging to extend this frame-\nwork to diverse languages. In this work, we\nevaluate a simple approach for zero-shot cross-\nlingual alignment, where a reward model is\ntrained on preference data in one source lan-\nguage and directly applied to other target lan-\nguages. On summarization and open-ended\ndialog generation, we show that this method is\nconsistently successful under comprehensive\nevaluation settings, including human evalua-\ntion: cross-lingually aligned models are pre-\nferred by humans over unaligned models on up\nto \u003e70% of evaluation instances. We moreover\nfind that a different-language reward model\nsometimes yields better aligned models than\na same-language reward model. We also iden-\ntify best practices when there is no language-\nspecific data for even supervised finetuning,\nanother component in alignment."}, {"group": "Political Science", "id": 92, "label": "Semi-supervised Stance Detection of Tweets Via Distant Network Supervision", "shape": "dot", "size": 10, "title": "Authors: \u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Detecting and labeling stance in social media text is strongly moti-\nvated by hate speech detection, poll prediction, engagement fore-\ncasting, and concerted propaganda detection. Today\u2019s best neural\nstance detectors need large volumes of training data, which is dif-\nficult to curate given the fast-changing landscape of social media\ntext and issues on which users opine. Homophily properties over\nthe social network provide strong signal of coarse-grained user-\nlevel stance. But semi-supervised approaches for tweet-level stance\ndetection fail to properly leverage homophily. In light of this, We\npresent SANDS, a new semi-supervised stance detector. SANDS starts\nfrom very few labeled tweets. It builds multiple deep feature views\nof tweets. It also uses a distant supervision signal from the social net-\nwork to provide a surrogate loss signal to the component learners.\nWe prepare two new tweet datasets comprising over 236,000 politi-\ncally tinted tweets from two demographics (US and India) posted\nby over 87,000 users, their follower-followee graph, and over 8,000\ntweets annotated by linguists. SANDS achieves a macro-F1 score of\n0.55 (0.49) on US (India)-based datasets, outperforming 17 baselines\n(including variants of SANDS) substantially, particularly for minor-\nity stance labels and noisy text. Numerous ablation experiments on\nSANDS disentangle the dynamics of textual and network-propagated\nstance signals.\nACM Reference Format:\n1Subhabrata Dutta, 2Samiya Caur, 3Soumen Chakrabarti, 2Tanmoy Chakraborty.\n2022. Semi-supervised Stance Detection of Tweets Via Distant Network\nSupervision. In Proceedings of the Fifteenth ACM International Conference on\nWeb Search and Data Mining (WSDM \u201922), February 21\u201325, 2022, Tempe, AZ,\nUSA. ACM, New York, NY, USA, 11 pages. https://doi.org/10.1145/3488560.\n3498511"}, {"group": "Political Science", "id": 106, "label": "A Fine-Grained Analysis of Public Opinion toward Chinese Technology Companies on Reddit", "shape": "dot", "size": 10, "title": "Authors: Enting Zhou, Yurg Liu, Hanjia Lyu, Jiebo Luo\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: In the face of the growing global in\ufb02uence and prevalence\nof Chinese technology companies, governments worldwide\nhave expressed concern and mistrust toward these compa-\nnies. There is a scarcity of research that speci\ufb01cally exam-\nines the widespread public response to this phenomenon on a\nlarge scale. This study aims to \ufb01ll in the gap in understanding\npublic opinion toward Chinese technology companies using\nReddit data, a popular news-oriented social media platform.\nWe employ the state-of-the-art transformer model to build\na reliable sentiment classi\ufb01er. We then use LDA to extract\nthe topics associated with positive and negative comments.\nWe also conduct content analysis by studying the changes in\nthe semantic meaning of the companies\u2019 names over time.\nOur main \ufb01ndings include the following: 1) Notable differ-\nence exists in the proportions of positive comments (8.42%)\nand negative comments (14.12%); 2) Positive comments are\nmostly associated with the companies\u2019 consumer products,\nsuch as smartphones, laptops, and wearable electronics. Neg-\native comments have a more diverse topic distribution (no-\ntable topics include criticism toward the platform, dissatisfac-\ntion with the companies\u2019 smartphone products, companies\u2019\nties to the Chinese government, data security concerns, 5G\nconstruction, and general political discussions); and 3) Char-\nacterization of each technology company is usually centered\naround a particular predominant theme related to the com-\npany, while real-world political events may trigger drastic\nchanges in users\u2019 characterization."}, {"group": "Political Science", "id": 118, "label": "Targeted aspect-based emotion analysis to detect opportunities and precaution in financial Twitter messages", "shape": "dot", "size": 10, "title": "Authors: Silvia Garc\u00b4\u0131a-M\u00b4endeza,\u2217, Francisco de Arriba-P\u00b4ereza, Ana Barros-Vilaa, Francisco J. Gonz\u00b4alez-Casta\u02dcnoaaInformation\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Microblogging platforms, of which Twitter is a representative example, are valuable information sources for\nmarket screening and financial models. In them, users voluntarily provide relevant information, including\neducated knowledge on investments, reacting to the state of the stock markets in real-time and, often,\ninfluencing this state. We are interested in the user forecasts in financial, social media messages expressing\nopportunities and precautions about assets. We propose a novel Targeted Aspect-Based Emotion Analysis\n(tabea) system that can individually discern the financial emotions (positive and negative forecasts) on the\ndifferent stock market assets in the same tweet (instead of making an overall guess about that whole tweet).\nIt is based on Natural Language Processing (nlp) techniques and Machine Learning streaming algorithms.\nThe system comprises a constituency parsing module for parsing the tweets and splitting them into simpler\ndeclarative clauses; an offline data processing module to engineer textual, numerical and categorical features\nand analyse and select them based on their relevance; and a stream classification module to continuously\nprocess tweets on-the-fly. Experimental results on a labelled data set endorse our solution. It achieves over\n90% precision for the target emotions, financial opportunity, and precaution on Twitter. To the best of\nour knowledge, no prior work in the literature has addressed this problem despite its practical interest in\ndecision-making, and we are not aware of any previous nlp nor online Machine Learning approaches to\ntabea.\nKeywords:\nAspect-Based Emotion Analysis, Machine Learning, Natural Language Processing, Opinion\nMining, Personal Finance Management, Portfolio Optimisation\n1."}, {"group": "Political Science", "id": 130, "label": "Stance Detection on Social Media with Fine-Tuned Large Language Models", "shape": "dot", "size": 10, "title": "Authors: Ilker G\u00fcl, EPFL, R\u00e9mi Lebret, Karl Aberer\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Stance detection, a key task in natural language\nprocessing, determines an author\u2019s viewpoint\nbased on textual analysis. This study evaluates\nthe evolution of stance detection methods,\ntransitioning from early machine learning\napproaches to the groundbreaking BERT model,\nand eventually to modern Large Language Mod-\nels (LLMs) such as ChatGPT, LLaMa-2, and\nMistral-7B. While ChatGPT\u2019s closed-source\nnature and associated costs present challenges,\nthe open-source models like LLaMa-2 and\nMistral-7B offers an encouraging alternative.\nInitially, our research focused on fine-tuning\nChatGPT, LLaMa-2, and Mistral-7B using sev-\neral publicly available datasets. Subsequently,\nto provide a comprehensive comparison, we\nassess the performance of these models in\nzero-shot and few-shot learning scenarios. The\nresults underscore the exceptional ability of\nLLMs in accurately detecting stance, with all\ntested models surpassing existing benchmarks.\nNotably, LLaMa-2 and Mistral-7B demonstrate\nremarkable efficiency and potential for stance\ndetection, despite their smaller sizes compared\nto ChatGPT. This study emphasizes the\npotential of LLMs in stance detection and calls\nfor more extensive research in this field."}, {"group": "Natural Language Processing", "id": 32, "label": "FECTEK: ENHANCING TERM WEIGHT IN LEXICON-BASED RETRIEVAL WITH FEATURE CONTEXT AND TERM-LEVEL KNOWLEDGE", "shape": "dot", "size": 10, "title": "Authors: ShenZhen, ShenZhen, Shen, ShenZhen, Ye, ShenZhen\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Lexicon-based retrieval has gained siginificant popularity in text retrieval due to its efficient and\nrobust performance. To further enhance performance of lexicon-based retrieval, researchers have\nbeen diligently incorporating state-of-the-art methodologies like Neural retrieval and text-level\ncontrastive learning approaches. Nonetheless, despite the promising outcomes, current lexicon-based\nretrieval methods have received limited attention in exploring the potential benefits of feature context\nrepresentations and term-level knowledge guidance. In this paper, we introduce an innovative method\nby introducing FEature Context and TErm-level Knowledge modules(FecTek). To effectively enrich\nthe feature context representations of term weight, the Feature Context Module (FCM) is introduced,\nwhich leverages the power of BERT\u2019s representation to determine dynamic weights for each element\nin the embedding. Additionally, we develop a term-level knowledge guidance module (TKGM) for\neffectively utilizing term-level knowledge to intelligently guide the modeling process of term weight.\nEvaluation of the proposed method on MS Marco benchmark demonstrates its superiority over the\nprevious state-of-the-art approaches."}, {"group": "Political Science", "id": 15, "label": "Mapping Violence: Developing an Extensive Framework to Build a Bangla Sectarian Expression Dataset from Social Media Interactions Sujan Sen Gupta* University of Dhaka", "shape": "dot", "size": 10, "title": "Authors: Nzi Tsnim, Suj  Gupt, Istik Hossin Shihb, Ftih Islm Juee, Arunim Thsin, Prim Ghum, Kij Ftem, Mrshi Hque, Wsem Frz, Prionti Nsir, Ashique KhudBukhsh, Frig Sdeque\u2020, AIAsif Sushmit\u2020\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Communal violence in online forums has\nbecome extremely prevalent in South Asia,\nwhere many communities of different cultures\ncoexist and share resources. These societies\nexhibit a phenomenon characterized by strong\nbonds within their own groups and animos-\nity towards others, leading to con\ufb02icts that\nfrequently escalate into violent confrontations.\nTo address this issue, we have developed the\n\ufb01rst comprehensive framework for the auto-\nmatic detection of communal violence mark-\ners in online Bangla content accompanying the\nlargest collection (13K raw sentences) of so-\ncial media interactions that fall under the de\ufb01-\nnition of four major violence class and their 16\ncoarse expressions. Our work\ufb02ow introduces a\n7-step expert annotation process incorporating\ninsights from social scientists, linguists, and\npsychologists.\nBy\npresenting\ndata\nstatistics\nand\nbench-\nmarking performance using this dataset1, we\nhave determined that, aside from the cat-\negory of Non-communal violence, Religio-\ncommunal violence is particularly pervasive\nin Bangla text. Moreover, we have substanti-\nated the effectiveness of \ufb01ne-tuning language\nmodels in identifying violent comments by\nconducting preliminary benchmarking on the\nstate-of-the-art Bangla deep learning model."}, {"group": "Political Science", "id": 113, "label": "CHAPTER 4", "shape": "dot", "size": 10, "title": "Authors: Alexander Ruch, Ari Decter-Frain, Raghav Batra\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Polarization in America has reached a high point as markets are also becoming polarized. \nExisting research, however, focuses on specific market segments and products and has not \nevaluated this trend\u2019s full breadth. If such fault lines do spread into other segments that are \nnot explicitly political, it would indicate the presence of lifestyle politics \u2013 when ideas and \nbehaviors not inherently political become politically aligned through their connections with \nexplicitly political things. We study the pervasiveness of polarization and lifestyle politics \nover different product segments in a diverse market and test the extent to which consumer- \nand platform-level network effects and morality may explain lifestyle politics. Specifically, \nusing graph and language data from Amazon (82.5M reviews of 9.5M products and product \nand category metadata from 1996\u20132014), we sample 234.6 million relations among 21.8 \nmillion market entities to find product categories that are most politically relevant, aligned, \nand polarized. We then extract moral values present in reviews\u2019 text and use these data and \nother reviewer-, product-, and category-level data to test whether individual- and platform-\nlevel network factors explain lifestyle politics better than products\u2019 implicit morality. We \nfind pervasive lifestyle politics. Cultural products are 4 times more polarized than any other \nsegment, products\u2019 political attributes have up to 3.7 times larger associations with lifestyle \npolitics than author-level covariates, and morality has statistically significant but relatively \nsmall correlations with lifestyle politics. Examining lifestyle politics in these contexts helps \nus better understand the extent and root of partisan differences, why Americans may be so \npolarized, and how this polarization affects market systems. \n \nKeywords: markets, networks, polarization, lifestyle politics, morality."}, {"group": "Natural Language Processing", "id": 31, "label": "Enhancing Suicide Risk Assessment: A Speech-Based Automated Approach in Emergency Medicine", "shape": "dot", "size": 10, "title": "Authors: Maurice Gerczuk, Justa Lutz, Wolfgang Strube, lkomiet Hasan,, lexander Kathan, Bj\u00a8orn W. Schuller,,,,\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: \u2014 The delayed access to specialized psychiatric\nassessments and care for patients at risk of suicidal tendencies\nin emergency departments creates a notable gap in timely\nintervention, hindering the provision of adequate mental health\nsupport during critical situations. To address this, we present\na non-invasive, speech-based approach for automatic suicide\nrisk assessment. For our study, we have collected a novel\ndataset of speech recordings from 20 patients from which we\nextract three sets of features, including wav2vec, interpretable\nspeech and acoustic features, and deep learning-based spectral\nrepresentations. We proceed by conducting a binary classification\nto assess suicide risk in a leave-one-subject-out fashion. Our\nmost effective speech model achieves a balanced accuracy of\n66.2 %. Moreover, we show that integrating our speech model\nwith a series of patients\u2019 metadata, such as the history of suicide\nattempts or access to firearms, improves the overall result. The\nmetadata integration yields a balanced accuracy of 94.4 %,\nmarking an absolute improvement of 28.2 %, demonstrating the\nefficacy of our proposed approaches for automatic suicide risk\nassessment in emergency medicine.\nI."}, {"group": "Natural Language Processing", "id": 61, "label": "Amino Acid Classi\ufb01cation in 2D NMR Spectra via Acoustic Signal Embeddings", "shape": "dot", "size": 10, "title": "Authors: Jia Qi Yip\u00a7\u2020, Dianwen Ng\u00a7\u2020, B Ma\u00a7, Konstant Pervush\u2020, Eng Siong Chng\u2020\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: \u2014Nuclear Magnetic Resonance (NMR) is used in\nstructural biology to experimentally determine the structure of\nproteins, which is used in many areas of biology and is an\nimportant part of drug development. Unfortunately, NMR data\ncan cost thousands of dollars per sample to collect and it can take\na specialist weeks to assign the observed resonances to speci\ufb01c\nchemical groups. There has thus been growing interest in the\nNMR community to use deep learning to automate NMR data\nannotation. Due to similarities between NMR and audio data, we\npropose that methods used in acoustic signal processing can be\napplied to NMR as well. Using a simulated amino acid dataset,\nwe show that by swapping out \ufb01lter banks with a trainable\nconvolutional encoder, acoustic signal embeddings from speaker\nveri\ufb01cation models can be used for amino acid classi\ufb01cation\nin 2D NMR spectra by treating each amino acid as a unique\nspeaker. On an NMR dataset comparable in size with of 46 hours\nof audio, we achieve a classi\ufb01cation performance of 97.7% on a\n20-class problem. We also achieve a 23% relative improvement\nby using an acoustic embedding model compared to an existing\nNMR-based model.\nI."}, {"group": "Political Science", "id": 19, "label": "Challenging Negative Gender Stereotypes: A Study on the Effectiveness of Automated Counter-Stereotypes", "shape": "dot", "size": 10, "title": "Authors: Isar Nejadgholi,, Kathleen C. Fraser,, nna Kerkh, Svetlana Kiritchenko, isar.nejadgholi, kathleen.fraser\u003cbr\u003eYear: 2023\u003cbr\u003eAbstract: Content Warning: This paper presents examples of gender stereotypes that may be offensive or upsetting.\nGender stereotypes are pervasive beliefs about individuals based on their gender that play a significant\nrole in shaping societal attitudes, behaviours, and even opportunities. Recognizing the negative implications of\ngender stereotypes, particularly in online communications, this study investigates eleven strategies to automatically\ncounteract and challenge these views. We present AI-generated gender-based counter-stereotypes to (self-identified)\nmale and female study participants and ask them to assess their offensiveness, plausibility, and potential effectiveness.\nThe strategies of counter-facts and broadening universals (i.e., stating that anyone can have a trait regardless of\ngroup membership) emerged as the most robust approaches, while humour, perspective-taking, counter-examples,\nand empathy for the speaker were perceived as less effective. Also, the differences in ratings were more pronounced\nfor stereotypes about the different targets than bet
